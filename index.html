function handleBranchRoomBulkUpdateFile(file){
  if(typeof XLSX === 'undefined'){ showAlert('엑셀 라이브러리를 불러오지 못했습니다. 네트워크 연결을 확인해주세요.'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
      const get = (row, key)=> String(row[key]==null ? '' : row[key]).trim();
      const sheetRows = (name)=>{
        const sheet = wb.Sheets[name];
        return sheet ? XLSX.utils.sheet_to_json(sheet, { defval:'' }) : [];
      };

      const result = { branchesCreated:0, branchesUpdated:0, roomsCreated:0, roomsUpdated:0, pricesUpdated:0 };
      const newBranches = [];
      const newRooms = [];
      const pendingBranchUpdates = [];
      const pendingRoomUpdates = [];
      const pendingTypePrices = new Map(); // branchId -> { branch, patch:{type:price} }
      const roomTypesToRegister = new Map(); // branchId -> { branch, types:Set }
      const touchedBranches = new Set();
      const touchedRooms = new Set();
      const invalidRows = [];
      const unmatchedBranchRows = [];

      function trackRoomType(branch, type){
        if(!branch || !type) return;
        if(!roomTypesToRegister.has(branch.id)) roomTypesToRegister.set(branch.id, { branch, types: new Set() });
        roomTypesToRegister.get(branch.id).types.add(type);
      }

      function findBranch(nameRaw){
        const resolvedName = BRANCH_NAME_ALIASES[nameRaw] || nameRaw;
        return DB.branches.find(b=> cleanKeyLoose(b.name).toLowerCase()===resolvedName.toLowerCase())
          || newBranches.find(b=> cleanKeyLoose(b.name).toLowerCase()===resolvedName.toLowerCase());
      }

      // ---- 1) 지점정보: 지점당 1행 ----
      sheetRows('지점정보').forEach((row, idx)=>{
        const branchRaw = cleanKeyLoose(get(row,'지점명'));
        const shortNameRaw = get(row,'지점단축명');
        if(!branchRaw && !shortNameRaw) return; // 완전히 빈 행

        const missing = [];
        if(!branchRaw) missing.push('지점명');
        if(!shortNameRaw) missing.push('지점단축명');
        if(missing.length){
          invalidRows.push(`[지점정보 ${idx+2}행] 필수 항목 누락(${missing.join('/')})으로 제외`);
          return;
        }

        const resolvedName = BRANCH_NAME_ALIASES[branchRaw] || branchRaw;
        let branch = findBranch(branchRaw);
        const isNewBranch = !branch;
        if(!branch){
          branch = { id: uid('b'), name: resolvedName, shortName: shortNameRaw, address:'', elevator:'', heatingType:'', hairDryer:'',
            cleaningFee:0, doubleOccupancyFee:'', sharedKitchenLocation:'', trashBagLocation:'', parkingCapacity:0, parkingFee:'', doorPasscode:'', memo:'', typePrices:{}, roomTypes:[...ROOM_TYPE_LIST], externalParking:[] };
          newBranches.push(branch);
          result.branchesCreated++;
        } else {
          if(!touchedBranches.has(branch.id)) result.branchesUpdated++;
          pendingBranchUpdates.push({ branch, field:'shortName', value: shortNameRaw });
        }
        touchedBranches.add(branch.id);

        const setBranchField = (field, key, isNum)=>{
          const v = get(row,key);
          if(v==='') return;
          const value = isNum ? (Number(v)||0) : v;
          if(isNewBranch) branch[field] = value;
          else pendingBranchUpdates.push({ branch, field, value });
        };
        setBranchField('address','주소'); setBranchField('elevator','엘리베이터');
        setBranchField('heatingType','난방방식'); setBranchField('hairDryer','헤어드라이기');
        setBranchField('cleaningFee','청소비', true); setBranchField('doubleOccupancyFee','1인추가금');
        setBranchField('sharedKitchenLocation','공용주방위치'); setBranchField('trashBagLocation','종량제봉투보관위치');
        setBranchField('parkingCapacity','주차가능대수', true); setBranchField('parkingFee','주차비용');
        setBranchField('doorPasscode','출입문비번'); setBranchField('memo','지점특이사항');
      });

      // ---- 2) 타입별가격: 지점당 1행, 타입별 열 ----
      sheetRows('타입별가격').forEach((row, idx)=>{
        const branchRaw = cleanKeyLoose(get(row,'지점명'));
        if(!branchRaw) return;
        const branch = findBranch(branchRaw);
        if(!branch){
          unmatchedBranchRows.push(`[타입별가격 ${idx+2}행] ${branchRaw} (지점 못 찾음)`);
          return;
        }
        if(!pendingTypePrices.has(branch.id)) pendingTypePrices.set(branch.id, { branch, patch:{} });
        const entry = pendingTypePrices.get(branch.id);
        // 타입은 고정 열이 아니라 지점마다 자유롭게 추가할 수 있으므로, "지점명"을 제외한
        // 모든 열을 타입명으로 보고 그대로 반영한다(엑셀에서 열을 추가/삭제해도 그대로 동작).
        Object.keys(row).forEach(t=>{
          if(t==='지점명') return;
          const v = get(row, t);
          if(v==='') return;
          entry.patch[t] = Number(v)||0;
          result.pricesUpdated++;
          trackRoomType(branch, t);
        });
      });

      // ---- 3) 호실정보: 호실당 1행 ----
      sheetRows('호실정보').forEach((row, idx)=>{
        const branchRaw = cleanKeyLoose(get(row,'지점명'));
        const roomRaw = cleanKeyLoose(get(row,'호실번호')).replace(/호$/,'');
        const typeRaw = get(row,'타입');
        const occRaw = cleanKeyLoose(get(row,'인실구분'));
        if(!branchRaw && !roomRaw && !typeRaw && !occRaw) return; // 완전히 빈 행

        const missing = [];
        if(!branchRaw) missing.push('지점명');
        if(!roomRaw) missing.push('호실번호');
        if(!typeRaw) missing.push('타입');
        if(!occRaw) missing.push('인실구분');
        if(missing.length){
          invalidRows.push(`[호실정보 ${idx+2}행] 필수 항목 누락(${missing.join('/')})으로 제외`);
          return;
        }
        const branch = findBranch(branchRaw);
        if(!branch){
          unmatchedBranchRows.push(`[호실정보 ${idx+2}행] ${branchRaw} ${roomRaw}호 (지점 못 찾음)`);
          return;
        }
        const occValue = (occRaw==='2' || occRaw==='2인실') ? '2인실' : '1인실';
        trackRoomType(branch, typeRaw);

        let room = DB.rooms.find(r=> r.branchId===branch.id && normalizeRoomNo(r.number)===normalizeRoomNo(roomRaw))
          || newRooms.find(r=> r.branchId===branch.id && normalizeRoomNo(r.number)===normalizeRoomNo(roomRaw));
        const isNewRoom = !room;
        if(!room){
          room = { id: uid('r'), branchId: branch.id, number: roomRaw, type: typeRaw, occupancy: occValue, saleStatus:'공실',
            needsCleaning:false, needsRetouch:false, needsExtraCleaning:false, note:'', reserved:false };
          newRooms.push(room);
          result.roomsCreated++;
        } else {
          if(!touchedRooms.has(room.id)) result.roomsUpdated++;
          pendingRoomUpdates.push({ room, field:'type', value: typeRaw });
          pendingRoomUpdates.push({ room, field:'occupancy', value: occValue });
        }
        touchedRooms.add(room.id);

        const setRoomField = (field, key)=>{
          const v = get(row,key);
          if(v==='') return;
          if(isNewRoom) room[field] = v;
          else pendingRoomUpdates.push({ room, field, value: v });
        };
        // 판매중은 판매 상태 값이 아니라 플래그(forSale)다 — 엑셀의 "판매중"은 플래그로, 공실·판매보류는 판매 상태로 넣는다.
        const saleRaw = get(row,'판매상태');
        if(saleRaw !== ''){
          const putRoom = (field, value)=>{ if(isNewRoom) room[field] = value; else pendingRoomUpdates.push({ room, field, value }); };
          putRoom('forSale', saleRaw === '판매중');
          if(saleRaw !== '판매중') putRoom('saleStatus', saleRaw);
        }
        setRoomField('note','호실특이사항');
      });

      if(newBranches.length===0 && newRooms.length===0 && pendingBranchUpdates.length===0
        && pendingRoomUpdates.length===0 && pendingTypePrices.size===0){
        showAlert(`반영할 내용이 없습니다.`
          + (invalidRows.length ? `\n\n${invalidRows.slice(0,20).join('\n')}` : '')
          + (unmatchedBranchRows.length ? `\n\n${unmatchedBranchRows.slice(0,20).join('\n')}` : ''));
        return;
      }

      showConfirm(
        `엑셀 분석 결과\n`+
        `- 새로 생성될 지점: ${result.branchesCreated}개\n`+
        `- 정보가 업데이트될 기존 지점: ${result.branchesUpdated}개\n`+
        `- 새로 생성될 호실: ${result.roomsCreated}개\n`+
        `- 정보가 업데이트될 기존 호실: ${result.roomsUpdated}개\n`+
        `- 타입별 가격 업데이트: ${result.pricesUpdated}건\n`+
        (invalidRows.length ? `- 필수 항목 누락으로 제외된 행: ${invalidRows.length}건\n` : '') +
        (unmatchedBranchRows.length ? `- 지점을 찾지 못해 제외된 행: ${unmatchedBranchRows.length}건\n` : '') +
        `\n위 내용을 반영할까요?`,
        ()=>{
          DB.branches.push(...newBranches);
          DB.rooms.push(...newRooms);
          pendingBranchUpdates.forEach(u=> u.branch[u.field] = u.value);
          pendingRoomUpdates.forEach(u=> u.room[u.field] = u.value);
          // 새로 등장한 타입은 지점의 타입 목록에 먼저 등록해둔다(가격이 없으면 0원으로).
          // 그 다음 "타입별가격" 시트에 실제 값이 있었다면 그 값으로 덮어쓴다.
          roomTypesToRegister.forEach(({branch, types})=> types.forEach(t=> registerRoomType(branch, t)));
          pendingTypePrices.forEach(({branch, patch})=>{
            branch.typePrices = Object.assign({}, branch.typePrices, patch);
          });
          logChange(`지점/호실 엑셀 일괄 업데이트: 지점 생성 ${result.branchesCreated}개·수정 ${result.branchesUpdated}개, 호실 생성 ${result.roomsCreated}개·수정 ${result.roomsUpdated}개, 타입별 가격 ${result.pricesUpdated}건`);
          scheduleSave();
          render();
          const noteLines = [];
          if(invalidRows.length) noteLines.push(`필수 항목 누락으로 제외된 행:\n` + invalidRows.slice(0,30).join('\n') + (invalidRows.length>30 ? `\n...외 ${invalidRows.length-30}건` : ''));
          if(unmatchedBranchRows.length) noteLines.push(`지점을 찾지 못해 제외된 행:\n` + unmatchedBranchRows.slice(0,30).join('\n') + (unmatchedBranchRows.length>30 ? `\n...외 ${unmatchedBranchRows.length-30}건` : ''));
          showAlert('지점/호실 정보가 업데이트되었습니다.' + (noteLines.length ? '\n\n' + noteLines.join('\n\n') : ''));
        }
      );
    }catch(err){
      console.error(err);
      showAlert('엑셀 처리 중 오류가 발생했습니다: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

  const uploadBtn = document.createElement('button');

  uploadBtn.textContent = '⬆ 엑셀 업로드';

  // 이 기능 전에 방이동한 입실자의 이전 방 계약을 지금 방으로 옮긴다(planPastRoomMoveContracts).

  box.appendChild(btnRow);
  box.appendChild(el('div', null, `현재 저장된 계약 이력: ${DB.contracts.length}건`, 'font-size:11.5px;color:var(--ink-soft);margin-top:8px;'));
  return box;
}

`;

// 이미지를 지정한 한 변 최대 길이로 축소해 base64 PNG로 돌려준다. 직인 이미지는 작게 써도
// 되니 원본을 그대로 저장하면(특히 휴대폰으로 찍은 사진) Firestore 문서 용량을 불필요하게
// 많이 차지한다.
function resizeImageFileToDataURL(file, maxDim){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(reader.error || new Error('파일을 읽지 못했습니다.'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('이미지 파일을 읽지 못했습니다.'));
      img.onload = ()=>{
        let { width, height } = img;
        const scale = Math.min(1, maxDim / Math.max(width, height));
        width = Math.max(1, Math.round(width * scale));
        height = Math.max(1, Math.round(height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/png'));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// 지점 직인 이미지 맵. 계약서 발급 패널을 열 때 한 번만 불러온다(메인 상태 문서와 무관).
let BRANCH_SEALS = null;
async function loadBranchSeals(){
  if(BRANCH_SEALS) return BRANCH_SEALS;
  try{
    const snap = await BRANCH_SEALS_DOC.get();
    BRANCH_SEALS = snap.exists ? (snap.data() || {}) : {};
  }catch(e){
    console.error('직인 이미지 불러오기 실패:', e);
    BRANCH_SEALS = {};
  }
  return BRANCH_SEALS;
}
async function saveBranchSeal(branchId, dataUrl){
  BRANCH_SEALS = BRANCH_SEALS || {};
  BRANCH_SEALS[branchId] = dataUrl;
  await BRANCH_SEALS_DOC.set({ [branchId]: dataUrl }, { merge:true });
}

  const seals = await loadBranchSeals();

  const data = {

    period: range ? `${range.start} ~ ${range.end}` : ((contract && contract.contractPeriod) || ''),
    rent: contract && contract.rent ? formatWon(contract.rent) : '',
    branchName: branch.name || '',
    branchPhone: branch.phone || '',
    branchAddress: branch.address || '',
    roomNumber: room ? room.number : '',
    specialTerms: (contract && contract.contractContent) || '',
    signedDate: new Date().toLocaleString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }),
    sealDataUrl: seals[branch.id] || ''
  };
  win.document.open();
  win.document.write(buildContractDocumentHTML(data));
  win.document.close();
  logChange(`"${branch.name}" ${data.roomNumber||''}호 입실계약서 발급${contract ? '' : ' (직접 입력)'}`);

// 중복 계약 정리. 예전에는 기준별 버튼이 셋이었다(완전 동일 / 계약일만 정정 / 계약기간만 정정).
// 담당자 요청으로 하나로 합쳤다. 세 기준은 다음과 같다.
//  1) 완전 동일: contractSignature가 같은 계약 — 먼저 등록된 1건만 남긴다.
//  2) 계약일 정정: 계약기간·계약자·입실자·연락처·결제금액은 같고 계약일만 다름 — 계약현황에서
//     취소선으로 표시하는 것과 같은 기준(findSupersedingDateEditContract). 계약일이 가장 늦은 건을 남긴다.
//  3) 계약기간 정정: 계약일·계약자·입실자·연락처·결제금액은 같고 계약기간만 다름 — 어드민에서
//     입실자 날짜를 바꾸면 기존 계약 자체가 수정되는 방식이라 재붙여넣기 때마다 쌓인다
//     (findSupersedingPeriodEditContract, 가산독산 409호 등). 나중에 등록된 건을 남긴다.
// 세 기준을 따로 판정해 합치면 서로를 근거로 한 묶음을 통째로 지울 수 있다(예: 완전히 같은
// A·A′ 사이에 계약기간만 고친 C가 끼어 등록되면 A는 C 때문에, C는 A′ 때문에, A′는 A 때문에 지워진다).
// 그래서 차례로 적용하되, 앞 단계에서 지울 계약은 빼고(pool) 다음 단계를 판정한다.
function planContractDedupe(contracts){
  const removed = new Set();
  const exact = [];
  const seen = new Set();
  contracts.forEach(c=>{
    const sig = contractSignature(c);
    if(seen.has(sig)){ exact.push(c); removed.add(c.id); return; }
    seen.add(sig);
  });
  const pool1 = contracts.filter(c=> !removed.has(c.id));
  const dateEdit = pool1.filter(c=> !!findSupersedingDateEditContract(c, pool1));
  dateEdit.forEach(c=> removed.add(c.id));
  const pool2 = contracts.filter(c=> !removed.has(c.id));
  const periodEdit = pool2.filter(c=> !!findSupersedingPeriodEditContract(c, pool2));
  periodEdit.forEach(c=> removed.add(c.id));
  return { exact, dateEdit, periodEdit, removedIds: removed };
}

function dedupeAllContracts(){
  const plan = planContractDedupe(DB.contracts);
  const total = plan.removedIds.size;
  if(total === 0){
    showAlert('정리할 중복 계약이 없습니다.');
    return;
  }
  const msg = [
    `중복 계약 이력 ${total}건을 찾았습니다.`,
    '',
    `· 완전히 같은 계약: ${plan.exact.length}건`,
    `· 계약일만 다르게 다시 등록된 계약: ${plan.dateEdit.length}건 (계약일이 가장 늦은 건만 남김)`,
    `· 계약기간만 다르게 다시 등록된 계약: ${plan.periodEdit.length}건 (나중에 등록된 건만 남김)`,
    '',
    '각각 최신 1건만 남기고 나머지를 삭제할까요? 삭제한 계약 이력은 되돌릴 수 없습니다.'
  ].join('\n');
  showConfirm(msg, ()=>{
    const ids = [...plan.removedIds];
    DB.contracts = DB.contracts.filter(c=> !plan.removedIds.has(c.id));
    batchDeleteDocs(CONTRACTS_COL, ids).catch(e=> console.error('중복 계약 삭제 실패:', e));
    refreshContractsCache();
    logChange(`중복 계약 정리: ${total}건 삭제 (완전 동일 ${plan.exact.length} · 계약일 정정 ${plan.dateEdit.length} · 계약기간 정정 ${plan.periodEdit.length})`);
    scheduleSave(); render();
    showAlert(`중복 계약 이력 ${total}건을 삭제했습니다.`);
  });
}

function parseAndImportContracts(text, onImported){
  // 원본 관리시스템의 계약일 셀 안에는 "26.08.27" 다음 줄에 "▸ 추가결제 1건"(그 계약에 추가
  // 결제 내역이 몇 건 있다는 안내) 또는 그 추가결제 자신을 가리키는 "추가결제"(▸나 건수 없이
  // 단독으로) 같은 표시가 함께 붙어 있는 경우가 있다. 이 안내 자체는 저장할 데이터가 없는데,
  // 복사할 때 이 줄 뒤에 있어야 할 탭 문자가 함께 사라져서 바로 다음 줄(원래 계약기간 값)까지
  // 계약일 칸에 통째로 밀려 들어가고, 그 여파로 계약일은 빈 값이 되며 이후 모든 칸이 한 칸씩
  // 밀린다(연신내 207호 윤가온 등에서 보고됨). 계약일 뒤에 이 안내가 줄바꿈으로 끼어 있고
  // 그 다음이 계약기간(날짜~날짜) 형태면, 안내 문구를 통째로 들어내고 원래 있었어야 할 탭으로
  // 복원한다 — 나머지 파싱(ROW_START 등)은 그대로 정상 행과 동일하게 처리되게 된다.
  text = text.replace(/(\d{2}\.\d{2}\.\d{2})\n(?:▸\s*)?추가결제(?:\s*\d+\s*건)?\n(\d{2}\.\d{2}\.\d{2}\s*~\s*\d{2}\.\d{2}\.\d{2})/g, '$1\t$2');
  // 결제금액 셀도 같은 방식으로 깨질 수 있다 — 주차비처럼 "추가결제로 받는" 항목은 입실료를
  // 0원/미표기로 두는 대신 결제금액 칸에 "15만원" 다음 줄로 "주차비 · 자동차"처럼 이 결제가
  // 무엇에 대한 것인지 설명이 붙는다. 이 설명은 버리면 안 되는 정보라서(운영팀이 결제금액만
  // 보고는 무슨 돈인지 알 수 없음) 지우지 않고 금액 옆에 괄호로 그대로 남긴다. 원래 있어야 할
  // 탭(빈 칸으로 시작해 줄바꿈되는 것과, 설명 뒤에 다음 칸으로 이어지는 것) 두 곳 모두 복원한다.
  text = text.replace(/\t\n(\d[\d,]*만?원)\n([^\n\t]+)\n/g, '\t$1 ($2)\t');
  const lines = text.replace(/\r/g,'').split('\n').filter(l=> l.trim()!=='');
  if(lines.length < 2){
    showAlert('헤더 행과 데이터 행이 포함된 표를 붙여넣어주세요.');
    return;
  }
  const headerCells = lines[0].split('\t');
  // 계약 관리 화면의 "▸ 추가결제 N건"처럼 한 셀 안에 줄바꿈이 들어있는 항목을 그대로
  // 복사하면, 그 셀 내부 줄바꿈이 실제 행 구분자(\n)와 구분되지 않아 계약 한 건이
  // 여러 줄로 쪼개져 붙여넣기되고, 그 결과 열이 하나씩 밀려 계약일/계약기간 등이
  // 엉뚱한 값으로 들어가거나 지점/호실 매칭에 실패한다(도어락 붙여넣기 파서가 이미
  // 겪었던 것과 같은 종류의 문제). 계약일(YY.MM.DD)로 시작하는 줄만 "새 계약 행의
  // 시작"으로 보고, 그렇지 않은 줄은 모두 바로 위 행에 줄바꿈으로 이어붙여 원래
  // 한 셀 안의 값으로 복원한다 — 도어락 파서의 시리얼 넘버 앵커 방식과 같은 원리.
  const ROW_START = /^\d{2}\.\d{2}\.\d{2}(\t|$)/;
  const dataLines = [];
  for(let i=1;i<lines.length;i++){
    const line = lines[i];
    if(dataLines.length===0 || ROW_START.test(line)){
      dataLines.push(line);
    } else {
      dataLines[dataLines.length-1] += '\n' + line;
    }
  }
  const dataRows = dataLines.map(l=> l.split('\t'));
  importContractGrid(headerCells, dataRows, onImported);
}

function handleContractExcelFile(file, onImported){
  if(typeof XLSX === 'undefined'){ showAlert('엑셀 라이브러리를 불러오지 못했습니다. 네트워크 연결을 확인해주세요.'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    let grid;
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      grid = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'' });
    }catch(err){
      showAlert('엑셀 파일을 읽는 중 오류가 발생했습니다: ' + err.message);
      return;
    }
    if(!grid || grid.length < 2){
      showAlert('헤더 행과 데이터 행이 포함된 엑셀 파일을 업로드해주세요.');
      return;
    }
    const headerCells = grid[0].map(v=> v==null ? '' : String(v));
    const dataRows = grid.slice(1).map(row=> row.map(v=> v==null ? '' : v));
    importContractGrid(headerCells, dataRows, onImported);
  };
  reader.readAsArrayBuffer(file);
}

function normalizeAmountStr(s){
  const digits = String(s||'').replace(/[^0-9]/g,'');
  return digits ? String(parseInt(digits,10)) : '';
}
function contractSignature(c){
  // 계약현황 팝업에 실제로 노출되는 항목(계약일/계약기간/계약자/입실료/결제금액/계약구분)만으로
  // 중복 여부를 판단한다. 나머지 항목(입실자/계약상태/보증금 등)까지 모두 같아야 한다고 보면
  // 스프레드시트 원본의 사소한 차이 때문에 눈에 보이는 완전 중복도 못 잡는 경우가 있었다.
  // 날짜는 "2026-01-15"와 "26.01.15"처럼 표기 형식만 다를 뿐 같은 날짜인 경우가 있어서,
  // 문자열을 그대로 비교하지 않고 정규화한 값으로 비교해야 진짜 중복을 놓치지 않는다.
  // 입실료/결제금액도 원본 스프레드시트의 천단위 콤마·통화기호 유무가 붙여넣을 때마다 달라질 수
  // 있고(예: "450000" vs "450,000"), 계약자명 등 텍스트 항목에는 복사 과정에서 눈에 안 보이는
  // 폭 없는 공백(zero-width space)이 섞여 들어오는 경우가 있어, 그대로 비교하면 완전히 같은
  // 계약을 다른 계약으로 오인해 재붙여넣기할 때마다 중복 등록되는 문제가 있었다.
  const normDate = normalizeFlexDate(c.contractDate) || (c.contractDate || '').trim();
  const range = parseContractPeriodRange(c.contractPeriod);
  const normPeriod = range ? `${range.start}~${range.end}` : (c.contractPeriod || '').trim();
  const normContractor = cleanKeyLoose(c.contractor);
  const normCategory = cleanKeyLoose(c.contractCategory);
  const normRent = normalizeAmountStr(c.rent);
  const normPayment = normalizeAmountStr(c.paymentAmount);
  return [c.roomId, normDate, normPeriod, normContractor, normRent, normPayment, normCategory].join('|');
}
function importContractGrid(headerCells, dataRows, onImported){
  const idx = {};
  headerCells.forEach((h, i)=>{
    const key = CONTRACT_FIELD_BY_HEADER[cleanKeyLoose(h).replace(/\s+/g,'')];
    if(key) idx[key] = i;
  });
  if(idx.branchName==null || idx.roomName==null){
    showAlert('헤더 행에서 "고시원 명"과 "방이름" 열을 찾을 수 없습니다. 첫 줄이 헤더인지 확인해주세요.');
    return;
  }

  const existingSigs = new Set(DB.contracts.map(contractSignature));

  const newContracts = [];
  const updatedContracts = []; // 새로 만들지 않고 기존 계약을 덮어쓴 것들(문서 id 그대로, Firestore에도 set으로 갱신)
  const unmatched = [];
  let duplicateCount = 0;
  let editedInPlaceCount = 0;
  let routedCount = 0;
  dataRows.forEach((cells, i)=>{
    // "계약내용"처럼 버튼/아이콘만 있고 텍스트가 없는 첫 열은, 표에서 복사할 때 해당 칸의
    // 탭 문자까지 함께 누락되는 경우가 있다. 그러면 데이터 행의 칸 수가 헤더보다 모자라면서
    // 뒤 열들이 통째로 한 칸씩 앞으로 밀려 엉뚱한 값이 매칭된다. 모자란 칸 수만큼 뒤에서부터
    // 맞춰(오른쪽 정렬) 실제 값이 원래 있어야 할 헤더 열에 들어가도록 보정한다.
    const shortBy = Math.max(0, headerCells.length - cells.length);
    const get = (key)=>{
      if(idx[key]==null) return '';
      const pos = idx[key] - shortBy;
      return pos>=0 && cells[pos]!=null ? String(cells[pos]).trim() : '';
    };
    const branchRaw = cleanKeyLoose(get('branchName'));
    const roomRaw = cleanKeyLoose(get('roomName')).replace(/호$/,'');
    if(!branchRaw && !roomRaw) return;

    const resolvedBranchName = BRANCH_NAME_ALIASES[branchRaw] || branchRaw;
    let branch = DB.branches.find(b=> cleanKeyLoose(b.name).toLowerCase()===resolvedBranchName.toLowerCase());
    let roomSearchName = roomRaw;
    if(!branch){
      // 고시원 명은 동 구분 없이 공통으로 쓰고, 방이름 앞에 "A동"처럼 건물 구분이 붙어 있는 경우
      // (예: "A동 309호 블레스+룸 / 원룸 / 외창") 지점명에 동을 붙인 이름("...A동")으로 다시 찾는다.
      const buildingMatch = roomRaw.match(/^([A-Za-z0-9가-힣]{1,4}동)\s+(.*)$/);
      if(buildingMatch){
        const withBuilding = cleanKeyLoose(`${resolvedBranchName} ${buildingMatch[1]}`);
        const branchWithBuilding = DB.branches.find(b=> cleanKeyLoose(b.name).toLowerCase()===withBuilding.toLowerCase());
        if(branchWithBuilding){
          branch = branchWithBuilding;
          roomSearchName = buildingMatch[2];
        }
      }
    }
    let room = branch ? DB.rooms.find(r=> r.branchId===branch.id && normalizeRoomNo(r.number)===normalizeRoomNo(roomSearchName)) : null;
    if(!room && branch){
      // 방이름에 호실번호 외의 상세 명칭이 붙어 있어도(예: "304 그레이스"), 지점명과 호실번호 앞자리 숫자만 일치하면 매칭
      const prefix = roomNumberPrefix(roomSearchName);
      if(prefix) room = DB.rooms.find(r=> r.branchId===branch.id && roomNumberPrefix(r.number)===prefix);
    }
    if(!room){
      unmatched.push(`[${i+2}행] ${branchRaw} ${roomRaw}호 (${!branch ? '지점' : '호실'} 못 찾음)`);
      return;
    }

    const candidate = {
      id: uid('ct'), roomId: room.id,
      contractDate: get('contractDate'), contractPeriod: get('contractPeriod'), district: get('district'),
      branchName: branchRaw, roomName: roomRaw, contractor: get('contractor'), contractorPhone: get('contractorPhone'), resident: get('resident'),
      rent: get('rent'), paymentAmount: get('paymentAmount'), contractStatus: get('contractStatus'),
      contractType: get('contractType'), contractCategory: get('contractCategory'), paymentCategory: get('paymentCategory'),
      deposit: get('deposit'), depositNote: get('depositNote'), contractContent: get('contractContent'),
      // 계약취소/변경으로 같은 계약일에 계약기간만 바뀐 "환불" 계약이 나중에 붙여넣기로 또
      // 들어오면, 어느 쪽이 더 나중에 등록된 것인지 계약일만으로는 구분이 안 된다(계약일이
      // 서로 같으므로) — findSupersedingRefundContract에서 이 실제 등록 시각으로 비교한다.
      importedAt: new Date().toISOString()
    };
    // 방이동으로 계약을 옮긴 사람의 행이 시트에 여전히 이전 방이름으로 들어오면 옮긴 방으로 보낸다 — 아래 중복·정정
    // 판정이 옮긴 계약과 같은 방에서 이뤄져야 이전 방에 같은 계약이 또 생기지 않는다(movedContractRouteFor).
    const route = movedContractRouteFor(candidate);
    if(route){
      candidate.sheetRoomId = candidate.roomId;
      candidate.roomId = route.roomId;
      if(route.movedOn) candidate.roomMovedOn = route.movedOn;
      routedCount++;
    }
    // 이미 등록된 계약 중 "날짜만 정정된 같은 계약"이 있으면, 새 계약으로 추가하지 않고 그
    // 계약을 이 값으로 덮어써서 갱신한다 — 둘 다 남기면 나중에 취소선/일괄정리로 걸러내야
    // 하는 중복이 계속 쌓이므로, 붙여넣는 시점에 아예 막는다.
    const existingSibling = findEditableContractSibling(candidate, DB.contracts);
    if(existingSibling){
      Object.assign(existingSibling, candidate, { id: existingSibling.id });
      updatedContracts.push(existingSibling);
      editedInPlaceCount++;
      return;
    }
    // 한 번에 여러 행을 붙여넣을 때, 이번 배치 안에서도 같은 계약의 정정 전/후 행이 함께 들어올
    // 수 있다 — 그 경우도 마찬가지로 이번 배치에 이미 담아둔 후보를 최신 값으로 덮어쓰고, 이
    // 행은 별도로 추가하지 않는다.
    const batchSibling = findEditableContractSibling(candidate, newContracts);
    if(batchSibling){
      Object.assign(batchSibling, candidate, { id: batchSibling.id });
      editedInPlaceCount++;
      return;
    }
    const sig = contractSignature(candidate);
    if(existingSigs.has(sig)){ duplicateCount++; return; }
    existingSigs.add(sig);
    newContracts.push(candidate);
  });

  if(newContracts.length===0 && updatedContracts.length===0){
    showAlert(`가져올 수 있는 계약 데이터가 없습니다.`
      + (duplicateCount ? `\n(이미 등록된 중복 데이터 ${duplicateCount}건 제외)` : '')
      + (unmatched.length ? `\n\n${unmatched.slice(0,20).join('\n')}` : ''));
    return;
  }

  // 결제구분에 "환불"이 포함된 행은 계약(취소/변경) 자체는 그대로 이력에 남기되, 아래의 "빈
  // 방이면 새 입실자 등록" 로직에서는 완전히 제외한다 — 환불 행을 최신 계약으로 잡아 새 입실자를
  // 만들어버리면 안 되기 때문이다. 별도로 refundRows에서만 다룬다(isRefundContractRow는
  // showContractHistoryModal의 결제/환불 배지 색 구분과도 같은 기준을 공유하는 공용 함수).
  // 호실별로 계약일이 가장 최신인 건 하나만 골라, 빈 방이면 그 계약 정보로 입실자를 새로 등록한다.
  // (한 번에 여러 건의 계약 이력이 붙여넣기 될 수 있으므로, 입실자 등록은 호실당 최신 계약 1건에만 적용)
  // 이미 입실자가 있는 방은 정보를 건드리지 않는다 — 계약 이력만 저장하고, 담당자가 확인할 수 있도록
  // "계약 확인 필요" 표시만 남긴다(최신 계약의 종료일과 퇴실예정일이 다르면 "계약현황" 버튼의
  // 기존 하이라이트도 함께 뜬다). 신규 등록이든 기존 입실자든 지점별로 한 곳에서 모아 볼 수 있다.
  // 기존 계약을 덮어쓴 것(updatedContracts)도 그 방의 "최신 계약"이 바뀐 것이므로 새 계약과
  // 똑같이 취급한다.
  const latestByRoom = new Map();
  [...newContracts, ...updatedContracts].filter(c=> !isRefundContractRow(c)).forEach(c=>{
    const prev = latestByRoom.get(c.roomId);
    if(!prev || (c.contractDate||'') >= (prev.contractDate||'')) latestByRoom.set(c.roomId, c);
  });
  const residentSyncActions = [];
  const existingResidentsToFlag = [];
  let residentSkipCount = 0;
  latestByRoom.forEach(c=>{
    const room = DB.rooms.find(r=>r.id===c.roomId);
    if(!room) return;
    const roomResidents = DB.residents.filter(p=>p.roomId===room.id);
    if(roomResidents.length > 0){
      // 기존 입실자가 있으면 정보를 자동으로 덮어쓰지 않고 "계약 확인 필요"로만 표시한다.
      // 담당자가 카드를 열면 해당 호실의 최신 계약(DB.contracts)에서 이름/연락처/입실일/퇴실일을
      // 그때그때 다시 계산해 기존 값과 비교해서 보여주므로, 여기서 따로 값을 저장해둘 필요는 없다.
      // 단, 이 계약 내용(이름·연락처·입실일·퇴실일)이 이미 그 입실자 카드에 그대로 반영되어
      // 있으면 표시하지 않는다 — 안 그러면 아무 변화도 없는 계약을 재붙여넣기할 때마다("이미
      // 반영된 경우"에도) 매번 다시 확인해야 하는 피로감이 쌓인다. 실제로 값이 다르거나
      // 아직 반영되지 않은 사람만 대상으로 삼는다.
      const proposed = contractProposedResidentData(c);
      const toFlag = roomResidents.filter(p=>{
        if(!proposed) return true;
        const alreadyReflected = (p.name||'').trim() === (proposed.name||'').trim()
          && (p.phone||'').trim() === (proposed.phone||'').trim()
          && p.moveIn === proposed.moveIn && p.moveOut === proposed.moveOut;
        return !alreadyReflected;
      });
      existingResidentsToFlag.push(...toFlag);
      return;
    }
    const range = parseContractPeriodRange(c.contractPeriod);
    const residentName = c.resident || c.contractor;
    if(!range || !residentName){ residentSkipCount++; return; }
    const newResident = {
      id: uid('p'), roomId: room.id, name: residentName, phone: c.contractorPhone || '',
      channel: '독립생활', resStatus:'', contractType: c.contractCategory || '신규',
      moveIn: range.start, moveOut: range.end, originalMoveIn: range.start, scheduledToLeave:false,
      carNumber:'', memo:'', firstSaveDone:true, slotIndex:0, justImported:true, sourceContractId: c.id
    };
    newResident.resStatus = computeResStatus(newResident);
    residentSyncActions.push({ room, newResident });
  });

  // 환불 행: 그 방에 재실 중이면서 이름이 일치하는 입실자가 있고, 과거(이번에 함께 붙여넣는
  // 행 포함) 같은 방·계약자로 실제 결제금액이 찍힌 계약이 있으면 "환불 처리 필요"로 표시한다.
  // 여기서는 표시만 하고, 실제 퇴실 처리는 담당자가 화면에서 버튼을 눌러 직접 확정해야 한다 —
  // 방/이름이 잘못 매칭되는 경우 실거주자를 실수로 퇴실 처리해버리면 되돌리기 어렵기 때문이다.
  const allContractsForPaymentCheck = [...DB.contracts, ...newContracts];
  const refundFlagActions = [];
  [...newContracts, ...updatedContracts].filter(isRefundContractRow).forEach(c=>{
    const room = DB.rooms.find(r=>r.id===c.roomId);
    if(!room) return;
    const refundName = cleanKeyLoose(c.resident || c.contractor);
    if(!refundName) return;
    const matchedResident = DB.residents.find(p=> p.roomId===room.id && cleanKeyLoose(p.name)===refundName);
    if(!matchedResident) return;
    const hasPriorPayment = allContractsForPaymentCheck.some(existing=>
      existing.roomId===room.id && !isRefundContractRow(existing) &&
      cleanKeyLoose(existing.resident || existing.contractor)===refundName &&
      Number(normalizeAmountStr(existing.paymentAmount)) > 0
    );
    if(!hasPriorPayment) return;
    refundFlagActions.push({ p: matchedResident, room, contractId: c.id, refundDate: normalizeFlexDate(c.contractDate) || c.contractDate || '' });
  });

  showConfirm(
    `계약 데이터 ${newContracts.length}건을 가져올까요?`
      + (editedInPlaceCount ? `\n(날짜만 정정된 것으로 보이는 ${editedInPlaceCount}건은 새로 추가하지 않고 기존 계약을 갱신합니다)` : '')
      + (duplicateCount ? `\n(이미 등록된 중복 ${duplicateCount}건은 제외됩니다)` : '')
      + (routedCount ? `\n(방이동한 입실자의 행 ${routedCount}건은 시트에 적힌 이전 방 대신 지금 방 기준으로 넣습니다)` : '')
      + (unmatched.length ? `\n(호실을 찾지 못한 ${unmatched.length}건은 제외됩니다)` : '')
      + (residentSyncActions.length ? `\n\n빈 호실 ${residentSyncActions.length}곳에 새 계약자 정보로 입실자를 등록합니다.` : '')
      + (existingResidentsToFlag.length ? `\n기존 입실자가 있는 호실 ${existingResidentsToFlag.length}곳은 계약 이력만 저장하고 "계약 확인 필요"로 표시합니다.` : '')
      + (refundFlagActions.length ? `\n환불 처리된 계약 ${refundFlagActions.length}건은 해당 입실자를 "환불 처리 필요"로 표시합니다(자동으로 퇴실 처리하지 않습니다).` : '')
      + (residentSkipCount ? `\n(계약기간·입실자 정보가 불명확해 입실자 등록을 건너뛴 호실: ${residentSkipCount}곳)` : ''),
    ()=>{
      DB.contracts.push(...newContracts);
      // updatedContracts는 이미 DB.contracts 안의 기존 항목을 그 자리에서 덮어쓴 것(같은 참조)
      // 이라 다시 push하지 않는다 — 새로 만든 게 아니라 갱신이므로 Firestore에도 같은 문서 id로
      // set(=업데이트)만 하면 된다.
      batchWriteDocs(CONTRACTS_COL, newContracts).catch(e=> console.error('계약 데이터 저장 실패:', e));
      if(updatedContracts.length) batchWriteDocs(CONTRACTS_COL, updatedContracts).catch(e=> console.error('계약 데이터 갱신 실패:', e));
      refreshContractsCache();
      residentSyncActions.forEach(action=> DB.residents.push(action.newResident));
      existingResidentsToFlag.forEach(p=> p.justImported = true);
      refundFlagActions.forEach(action=>{
        action.p.refundPending = true;
        action.p.refundPendingDate = action.refundDate;
        action.p.refundPendingContractId = action.contractId;
      });
      logChange(`계약 데이터 가져오기: ${newContracts.length}건 추가${editedInPlaceCount ? ` / 날짜 정정 갱신 ${editedInPlaceCount}건` : ''}${duplicateCount ? ` (중복 ${duplicateCount}건 제외)` : ''}${unmatched.length ? ` (미매칭 ${unmatched.length}건)` : ''}${residentSyncActions.length ? ` / 빈 호실 입실자 등록 ${residentSyncActions.length}건` : ''}${existingResidentsToFlag.length ? ` / 계약 확인 필요 표시 ${existingResidentsToFlag.length}건` : ''}${refundFlagActions.length ? ` / 환불 처리 필요 표시 ${refundFlagActions.length}건` : ''}`);
      scheduleSave(); render();
      if(typeof onImported === 'function') onImported();
      showAlert(`${newContracts.length}건을 가져왔습니다.`
        + (editedInPlaceCount ? `\n날짜/계약기간만 정정된 것으로 보여 새로 추가하지 않고 기존 계약을 갱신한 건: ${editedInPlaceCount}건` : '')
        + ((residentSyncActions.length || existingResidentsToFlag.length) ? `\n확인이 필요한 곳: ${residentSyncActions.length + existingResidentsToFlag.length}곳 (신규 등록 ${residentSyncActions.length}곳 + 기존 입실자 ${existingResidentsToFlag.length}곳)\n각 지점 화면의 "계약 확인 필요" 탭 또는 대시보드에서 모아볼 수 있고, 정보를 수정하면 목록에서 사라집니다.` : '')
        + (refundFlagActions.length ? `\n환불 처리 필요: ${refundFlagActions.length}건 — 대시보드의 "환불 처리 필요" 목록에서 확인 후 퇴실 처리해주세요.` : '')
        + (duplicateCount ? `\n이미 등록되어 제외된 중복 데이터: ${duplicateCount}건` : '')
        + (unmatched.length ? `\n\n호실을 찾지 못한 항목:\n${unmatched.slice(0,20).join('\n')}${unmatched.length>20 ? `\n...외 ${unmatched.length-20}건` : ''}` : ''));
    }
  );
}

function downloadContractTemplate(){
  if(typeof XLSX === 'undefined'){ showAlert('엑셀 라이브러리를 불러오지 못했습니다. 네트워크 연결을 확인해주세요.'); return; }
  const wb = XLSX.utils.book_new();
  const headers = ['계약내용','계약일','계약기간','고시원 명','방이름','계약자','계약자 연락처','입실자','입실료','결제금액','계약구분','결제구분','보증금','보증금 안내'];
  const example = {
    계약내용:'', 계약일:'2026-01-15', 계약기간:'2026-01-15~2027-01-14', '고시원 명':'먼슬리브 성수', 방이름:'304',
    계약자:'홍길동', '계약자 연락처':'010-1234-5678', 입실자:'홍길동', 입실료:450000, 결제금액:450000, 계약구분:'일반',
    결제구분:'카드', 보증금:0, '보증금 안내':''
  };
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([example], { header: headers }), 'Sheet1');
  XLSX.writeFile(wb, 'monthliv_계약데이터_양식.xlsx');
}

const CONTRACT_HISTORY_PAGE_SIZE = 10;
function showContractHistoryModal(room){
  // 계약취소/변경으로 계약일은 같은데 계약기간만 바뀐 환불 계약이 나중에 등록되면 계약일만으로는
  // 어느 쪽이 최신인지 구분이 안 된다 — 실제 등록 시각(importedAt)을 2차 기준으로 써서, 같은
  // 계약일이면 나중에 붙여넣은(환불로 대체하는) 쪽이 항상 먼저(최신으로) 오도록 한다. 이 필드가
  // 없는 옛날 계약은 동점 처리되어 원래 순서(등록 순서)를 그대로 유지한다.
  const contracts = DB.contracts.filter(c=>c.roomId===room.id)
    .slice()
    .sort((a,b)=> (b.contractDate||'').localeCompare(a.contractDate||'') || (b.importedAt||'').localeCompare(a.importedAt||''));
  const totalPages = Math.max(1, Math.ceil(contracts.length / CONTRACT_HISTORY_PAGE_SIZE));
  let page = 1;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  box.style.maxWidth = '820px';
  const close = ()=> overlay.remove();
  const roomResidents = DB.residents.filter(p=>p.roomId===room.id);
  const latestContract = contracts[0] || null; // 가장 나중에 생성된(계약일 기준 최신) 계약만 대상
  // 입실자가 있는 방은 최신 계약이 "신규"일 때만 교체 대상으로 본다. "연장"은 같은 입실자의
  // 계약 기간만 늘어난 것이라 퇴실 처리할 대상이 없으므로 아이콘을 아예 노출하지 않는다.
  // (빈 방은 애초에 퇴실 처리할 기존 입실자가 없으므로 이 조건과 무관하게 노출한다.)
  // 이미 이 계약으로 입실자 정보를 반영한 적이 있으면(appliedResident) 같은 계약으로
  // 중복 처리하지 않도록 아이콘을 다시 노출하지 않는다.
  const canApplyUpdate = canEdit() && !!latestContract && !latestContract.appliedResident
    && (roomResidents.length===0 || latestContract.contractCategory === '신규');

  function markContractApplied(c){
    c.appliedResident = true;
    // 계약 실시간 동기화(initApp)가 importedAt이 더 늦은 문서만 구독하므로, 이 필드를 갱신
    // 하지 않는 수정은 다른 계정에 실시간으로 반영되지 않는다. 다른 모든 계약 쓰기 경로와
    // 마찬가지로 "지금 등록/수정됨"을 남겨 그 경로들과 일관되게 맞춘다.
    c.importedAt = new Date().toISOString();
    CONTRACTS_COL.doc(c.id).set(c).catch(e=> console.error('계약 데이터 갱신 실패:', e));
    refreshContractsCache();
  }

  function buildResidentFromContract(pu, range, c){
    const newResident = {
      id: uid('p'), roomId: room.id, name: pu.name, phone: pu.phone,
      channel: '독립생활', resStatus:'', contractType: c.contractCategory || '신규',
      moveIn: range.start, moveOut: range.end, originalMoveIn: range.start, scheduledToLeave:false,
      carNumber:'', memo:'', firstSaveDone:true, slotIndex:0, sourceContractId: c.id
    };
    newResident.resStatus = computeResStatus(newResident);
    return newResident;
  }

  function replaceResidentsWithContract(c){
    const pu = contractProposedResidentData(c);
    const range = parseContractPeriodRange(c.contractPeriod);
    if(!pu.name || !range){
      showAlert('이 계약에는 입실자 이름 또는 계약기간 정보가 없어 처리할 수 없습니다.');
      return;
    }
    const detail = `이름: ${pu.name}\n연락처: ${pu.phone || '-'}\n입실일: ${pu.moveIn || '-'}\n퇴실일: ${pu.moveOut || '-'}`;

    if(roomResidents.length===0){
      // 기존 입실자가 없는 빈 방: 새 계약자 정보로 바로 입실 처리
      showConfirm(
        `이 계약 내용으로 신규 입실자를 등록할까요?\n\n${detail}`,
        ()=>{
          DB.residents.push(buildResidentFromContract(pu, range, c));
          markContractApplied(c);
          logChange(`${room.number}호 계약(${c.contractDate || '-'}) 내용으로 신규 입실자 등록: ${pu.name}`);
          scheduleSave(); render(); close();
        }
      );
      return;
    }

    const oldNames = roomResidents.map(p=> p.name || '(이름 미입력)').join(', ');
    const anyNotYetDue = roomResidents.some(p=> !isOverdue(p));

    if(anyNotYetDue){
      // 기존 입실자의 퇴실일이 아직 지나지 않은 경우: 기존 입실자는 퇴실예정으로 두고, 신규 계약자는 입실예정자로 등록
      showConfirm(
        `기존 입실자(${oldNames})의 퇴실일이 아직 지나지 않았습니다.\n`
        + `기존 입실자는 퇴실확정으로 표시하고, 새 계약 내용으로 입실예정자를 등록할까요?\n\n${detail}`,
        ()=>{
          roomResidents.forEach(p=>{ p.scheduledToLeave = true; });
          DB.residents.push(buildResidentFromContract(pu, range, c));
          markContractApplied(c);
          logChange(`${room.number}호 계약(${c.contractDate || '-'}) 내용으로 입실예정자 등록 (기존 입실자 ${oldNames} 퇴실확정 처리)`);
          scheduleSave(); render(); close();
        }
      );
      return;
    }

    // 기존 입실자의 퇴실일이 이미 지난 경우: 즉시 퇴실 처리 후 신규 입실자 등록
    showConfirm(
      `기존 입실자(${oldNames})를 퇴실 처리하고, 새 계약 내용으로 신규 입실자를 등록할까요?\n\n${detail}`,
      ()=>{
        roomResidents.forEach(p=> moveResidentToHistory(p));
        DB.residents.push(buildResidentFromContract(pu, range, c));
        markContractApplied(c);
        logChange(`${room.number}호 계약(${c.contractDate || '-'}) 내용으로 입실자 교체: ${oldNames} → ${pu.name}`);
        scheduleSave(); render(); close();
      }
    );
  }

  function deleteContract(c){
    // 이 계약으로 자동 생성됐던 입실자(현재 입실자 또는 이미 퇴실해 히스토리로 넘어간 기록)가
    // 있으면 계약과 함께 정리한다 — 계약만 지우고 그 계약으로 만들어진 입실자는 그대로 남아
    // 타임라인 등에 계속 노출되는 문제를 막기 위함.
    const linkedResident = DB.residents.find(p=>p.sourceContractId===c.id) || null;
    const linkedHistory = !linkedResident ? (DB.residentHistory.find(h=>h.sourceContractId===c.id) || null) : null;
    const linkedName = linkedResident ? (linkedResident.name || '이름 미입력') : (linkedHistory ? (linkedHistory.name || '이름 미입력') : null);
    const linkedNote = linkedName ? `\n\n이 계약으로 등록된 입실자 "${linkedName}" 님도 함께 삭제됩니다.` : '';
    showConfirm(
      `이 계약 이력을 삭제할까요?\n\n계약일: ${c.contractDate || '-'}\n계약기간: ${c.contractPeriod || '-'}\n계약자: ${c.contractor || '-'}${linkedNote}\n\n삭제 후에는 되돌릴 수 없습니다.`,
      ()=>{
        DB.contracts = DB.contracts.filter(x=>x.id!==c.id);
        CONTRACTS_COL.doc(c.id).delete().catch(e=> console.error('계약 데이터 삭제 실패:', e));
        refreshContractsCache();
        if(linkedResident){
          DB.residents = DB.residents.filter(x=>x.id!==linkedResident.id);
        } else if(linkedHistory){
          DB.residentHistory = DB.residentHistory.filter(x=>x.id!==linkedHistory.id);
          RESIDENT_HISTORY_COL.doc(linkedHistory.id).delete().catch(e=> console.error('퇴실 이력 삭제 실패:', e));
          refreshHistoryCache();
        }
        logChange(`${room.number}호 계약(${c.contractDate || '-'} / ${c.contractor || '-'}) 이력 삭제${linkedName ? ` (연결된 입실자 "${linkedName}" 함께 삭제)` : ''}`);
        scheduleSave();
        close();
        showContractHistoryModal(room);
      }
    );
  }

  function renderBody(){
    box.innerHTML = '';
    const title = el('div', 'modal-msg', `${room.number}호 계약현황 (${contracts.length}건)`, 'margin-bottom:10px;font-weight:700;');
    box.appendChild(title);
    if(canApplyUpdate){
      box.appendChild(el('div', null, '가장 최근 계약 옆의 ↻ 버튼으로 신규 계약자 정보를 반영합니다. 빈 방이면 바로 입실 처리되고, 기존 입실자가 있으면 퇴실일이 지난 경우 즉시 퇴실 후 신규 입실자를 등록하며, 퇴실일 전이면 기존 입실자를 퇴실확정으로 두고 신규 계약자를 입실예정자로 등록합니다.', 'font-size:12px;color:var(--ink-soft);margin-bottom:10px;'));
    }

    if(contracts.length===0){
      box.appendChild(el('div', null, '등록된 계약 이력이 없습니다.', 'font-size:12.5px;color:var(--ink-soft);padding:12px 0;'));
    } else {
      const tableWrap = document.createElement('div');
      tableWrap.style.cssText = 'overflow-x:auto;';
      const table = document.createElement('table');
      table.className = 'contract-table';
      table.style.cssText = 'width:100%;border-collapse:collapse;font-size:12px;';
      table.innerHTML = `
        <thead><tr>
          ${canEdit() ? '<th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);"></th>' : ''}
          <th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);">계약일</th>
          <th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);">계약기간</th>
          <th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);">입실자</th>
          <th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);">연락처</th>
          <th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);">계약자</th>
          <th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);">입실료</th>
          <th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);">결제금액</th>
          <th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);">계약구분</th>
          <th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);">결제구분</th>
          ${canApplyUpdate ? '<th style="text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);"></th>' : ''}
        </tr></thead>
      `;
      const tbody = document.createElement('tbody');
      const start = (page-1)*CONTRACT_HISTORY_PAGE_SIZE;
      contracts.slice(start, start+CONTRACT_HISTORY_PAGE_SIZE).forEach(c=>{
        const tr = document.createElement('tr');
        // 계약취소/변경으로 같은 계약일에 계약기간만 바뀐 환불 계약이 나중에 등록되면, 이 계약은
        // 더 이상 유효하지 않다 — 지우지 않고 이력은 남기되 취소선으로 구분해 보여준다.
        // 계약기간·계약자·입실자·연락처·결제금액은 모두 같고 계약일만 다르게 재등록된 경우
        // (findSupersedingDateEditContract), 계약일·계약자·입실자·연락처·결제금액은 모두 같고
        // 계약기간만 다르게 재등록된 경우(findSupersedingPeriodEditContract — 어드민에서 입실자
        // 날짜를 바꾸면 계약일은 그대로 두고 계약기간만 고쳐서 다시 붙여넣는 운영 방식 때문에
        // 생긴다)도 같은 방식으로 처리한다. 셋 중 하나라도 해당하면 취소선을 긋되, 사유 표시는
        // 서로 다르게 구분한다.
        const supersedingRefund = findSupersedingRefundContract(c);
        const supersedingDateEdit = !supersedingRefund ? findSupersedingDateEditContract(c) : null;
        const supersedingPeriodEdit = (!supersedingRefund && !supersedingDateEdit) ? findSupersedingPeriodEditContract(c) : null;
        const superseding = supersedingRefund || supersedingDateEdit || supersedingPeriodEdit;
        const rowStyle = superseding ? 'text-decoration:line-through; color:var(--ink-soft);' : '';
        const supersededNote = supersedingRefund
          ? ' <span style="font-size:10.5px;color:var(--st-hold);text-decoration:none;">(환불로 대체됨)</span>'
          : (supersedingDateEdit ? ' <span style="font-size:10.5px;color:var(--st-hold);text-decoration:none;">(계약일 정정으로 대체됨)</span>'
          : (supersedingPeriodEdit ? ' <span style="font-size:10.5px;color:var(--st-hold);text-decoration:none;">(계약기간 정정으로 대체됨)</span>' : ''));
        // 결제/환불 구분: 결제구분(paymentCategory)에 "환불"이 포함된 행은 배지 색을 다르게 줘서
        // 한눈에 구분되게 한다. 취소선(superseding)과는 별개 표시라 동시에 적용될 수 있다 —
        // 취소선이 걸려도 이 행이 원래 환불 건이었는지는 계속 알아볼 수 있어야 하므로, 배지
        // 자체의 배경색은 취소선 여부와 무관하게 항상 같은 기준으로 칠한다.
        // 방이동으로 옮겨 온 계약은 시트에 적힌 원래 방을 함께 보여준다.
        const movedFromRoom = (c.sheetRoomId && c.sheetRoomId !== c.roomId) ? DB.rooms.find(r=> r.id === c.sheetRoomId) : null;
        const movedFromNote = movedFromRoom ? ` <span style="font-size:10.5px;color:var(--ink-soft);white-space:nowrap;">(${esc(movedFromRoom.number)}호에서 옮김)</span>` : '';
        const paymentCatLabel = c.paymentCategory || '-';
        const paymentCatBadge = isRefundContractRow(c)
          ? `<span class="badge" style="background:var(--st-hold-bg);color:var(--st-hold);${superseding?'text-decoration:line-through;':''}">${esc(paymentCatLabel)}</span>`
          : (c.paymentCategory ? `<span class="badge" style="background:var(--st-occupied-bg);color:var(--st-occupied);${superseding?'text-decoration:line-through;':''}">${esc(paymentCatLabel)}</span>` : esc(paymentCatLabel));
        tr.innerHTML = `
          <td style="padding:6px 8px;border-bottom:1px solid var(--line);${rowStyle}">${esc(c.contractDate||'-')}${movedFromNote}</td>
          <td style="padding:6px 8px;border-bottom:1px solid var(--line);${rowStyle}">${esc(c.contractPeriod||'-')}</td>
          <td style="padding:6px 8px;border-bottom:1px solid var(--line);${rowStyle}">${esc(c.resident||'-')}</td>
          <td style="padding:6px 8px;border-bottom:1px solid var(--line);${rowStyle}">${esc(c.contractorPhone||'-')}</td>
          <td style="padding:6px 8px;border-bottom:1px solid var(--line);${rowStyle}">${esc(c.contractor||'-')}</td>
          <td style="padding:6px 8px;border-bottom:1px solid var(--line);${rowStyle}">${esc(c.rent||'-')}</td>
          <td style="padding:6px 8px;border-bottom:1px solid var(--line);${rowStyle}">${esc(c.paymentAmount||'-')}</td>
          <td style="padding:6px 8px;border-bottom:1px solid var(--line);${rowStyle}">${esc(c.contractCategory||'-')}${supersededNote}</td>
          <td style="padding:6px 8px;border-bottom:1px solid var(--line);${rowStyle}">${paymentCatBadge}</td>
        `;
        if(canEdit()){
          const delTd = document.createElement('td');
          delTd.style.cssText = 'padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;';
          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'iconbtn del';
          delBtn.innerHTML = '&times;';
          delBtn.title = '이 계약 이력 삭제';
          delBtn.onclick = ()=> deleteContract(c);
          delTd.appendChild(delBtn);
          tr.insertBefore(delTd, tr.firstChild);
        }
        if(canApplyUpdate){
          const updTd = document.createElement('td');
          updTd.style.cssText = 'padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;';
          if(c === latestContract){
            const applyBtn = document.createElement('button');
            applyBtn.type = 'button';
            applyBtn.className = 'iconbtn active';
            applyBtn.innerHTML = '&#8635;';
            applyBtn.title = '이 계약 내용으로 입실 처리';
            applyBtn.onclick = ()=> replaceResidentsWithContract(c);
            updTd.appendChild(applyBtn);
          }
          tr.appendChild(updTd);
        }
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      tableWrap.appendChild(table);
      box.appendChild(tableWrap);

      if(totalPages > 1){
        const pager = document.createElement('div');
        pager.className = 'log-pager';
        for(let p=1; p<=totalPages; p++){
          const pBtn = document.createElement('button');
          pBtn.className = 'btn small' + (p===page ? ' primary' : '');
          pBtn.textContent = String(p);
          pBtn.onclick = ()=>{ page = p; renderBody(); };
          pager.appendChild(pBtn);
        }
        box.appendChild(pager);
      }
    }

    const btnRow = document.createElement('div');
    btnRow.className = 'modal-btn-row';
    const closeBtn = document.createElement('button');
    closeBtn.className = 'btn'; closeBtn.textContent = '닫기'; closeBtn.onclick = close;
    btnRow.appendChild(closeBtn);
    box.appendChild(btnRow);
  }
  renderBody();

  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

// 방 카드 "변경이력": 입퇴실·수정이력·청소이력을 한 창에서 탭으로 나눠 본다(담당자 요청 순서).
//  - 입퇴실: 퇴실 이력(DB.residentHistory). 예전에는 카드 안에 최근 3건만 펼쳐졌는데, 창에서는 전부 보여준다.
//    복원은 가장 최근 1건만, 방이 비어 있을 때만 된다(예전과 같은 규칙).
//  - 수정이력: editHistory 컬렉션(수정 권한 계정만). 처음 누를 때 한 번 읽어 이 창이 열린 동안 재사용한다.
//  - 청소이력: room.cleaningHistory.
// focusHistoryId를 주면(퇴실자 검색 결과에서 연 경우) 입퇴실 탭의 그 기록을 강조한다.
function showRoomHistoryModal(room, initialTab, focusHistoryId){
  const tabs = [{ key:'입퇴실', render: renderResidentTab }]
    .concat(canEdit() ? [{ key:'수정이력', render: renderEditTab }] : [])
    .concat([{ key:'청소이력', render: renderCleaningTab }]);
  let current = tabs.some(t=> t.key === initialTab) ? initialTab : tabs[0].key;

  const overlay = el('div', 'modal-overlay');
  const box = el('div', 'modal-box room-hist-box');
  const onKey = e=>{ if(e.key === 'Escape') close(); };
  const close = ()=>{ overlay.remove(); document.removeEventListener('keydown', onKey); };
  overlay.addEventListener('click', e=>{ if(e.target === overlay) close(); });
  document.addEventListener('keydown', onKey);

  const top = el('div', 'room-hist-top');
  const head = el('div', 'room-hist-head');
  head.appendChild(el('div', 'room-hist-title', `${room.number}호 변경이력`));
  const closeBtn = el('button', 'btn small', '닫기');
  closeBtn.onclick = close;
  head.appendChild(closeBtn);
  top.appendChild(head);
  const tabBar = el('div', 'room-hist-tabs');
  top.appendChild(tabBar);
  box.appendChild(top);
  const body = el('div', 'room-hist-body');
  box.appendChild(body);
  overlay.appendChild(box);
  document.body.appendChild(overlay);

  const residentHistory = ()=> DB.residentHistory.filter(h=> h.roomId === room.id)
    .sort((a,b)=> (b.moveOut||'').localeCompare(a.moveOut||''));
  const cleaningHistory = ()=> (room.cleaningHistory || []).slice().sort((a,b)=> (b.date||'').localeCompare(a.date||''));

  // 수정이력은 서버에서 개수만 센다(countEditHistoryForRoom). 실패하면 불러온 건수(더 있으면 "10+")를 보여준다.
  let editTotal = null;
  const editCountLabel = ()=>{
    if(editTotal != null) return editTotal;
    if(!editLoaded || editError) return null;
    return editHasMore ? `${editRaw.length}+` : editRaw.length;
  };
  function renderTabBar(){
    tabBar.innerHTML = '';
    tabs.forEach(t=>{
      const count = t.key === '입퇴실' ? residentHistory().length : (t.key === '청소이력' ? cleaningHistory().length : editCountLabel());
      const b = el('button', 'room-hist-tab' + (t.key === current ? ' active' : ''), t.key + (count != null ? ` ${count}` : ''));
      b.type = 'button';
      b.dataset.tab = t.key;
      b.onclick = ()=>{ current = t.key; show(); };
      tabBar.appendChild(b);
    });
  }
  function show(){
    renderTabBar();
    body.innerHTML = '';
    tabs.find(t=> t.key === current).render();
  }

  function renderResidentTab(){
    const hist = residentHistory();
    if(hist.length === 0){ body.appendChild(el('div', 'history-empty', '이 호실에는 아직 퇴실 이력이 없습니다.')); return; }
    const roomOccupied = roomHasActiveResident(room);
    hist.forEach((h, idx)=>{
      const entry = el('div', 'history-entry');
      entry.dataset.historyId = h.id;
      const topRow = el('div', 'history-top');
      // 대리결제였던 기록은 이름 하나로 실거주자만 대신 보여주지 않고, 계약자(h.name/h.phone)와
      // 실입실자를 각각 텍스트로 그대로 나열한다 — 색이 있는 플래그(배지)는 쓰지 않는다.
      topRow.innerHTML = `<span class="nm">${esc(maskViewerName(h.name))}</span><span class="ph">${esc(h.phone||'-')}</span>`;
      if(canEdit() && !roomOccupied){
        if(idx === 0){
          const restoreBtn = el('button', 'btn small', '복원');
          restoreBtn.title = '이 입실자 정보를 다시 입실자로 복원';
          restoreBtn.onclick = ()=>{ close(); restoreFromHistory(h); };
          topRow.appendChild(restoreBtn);
        }
        const delBtn = el('button', 'iconbtn del');
        delBtn.innerHTML = '&times;';
        delBtn.title = '이 히스토리 항목 삭제';
        delBtn.onclick = ()=>{
          showConfirm(`"${h.name}" 님의 히스토리 기록을 완전히 삭제할까요? 이 작업은 되돌릴 수 없습니다.`, ()=>{
            DB.residentHistory = DB.residentHistory.filter(x=> x.id !== h.id);
            RESIDENT_HISTORY_COL.doc(h.id).delete().catch(e=> console.error('퇴실 이력 삭제 실패:', e));
            refreshHistoryCache();
            logChange(`"${h.name}" 히스토리 기록 삭제`);
            scheduleSave(); render();
            show();
          });
        };
        topRow.appendChild(delBtn);
      }
      entry.appendChild(topRow);
      if(h.paymentProxy) entry.appendChild(el('div', 'history-sub', `실입실자 ${maskViewerName(h.actualResidentName) || '-'} ${h.actualResidentPhone || '-'}`));
      if(h.doubleOccupancy) entry.appendChild(el('div', 'history-sub', '2인 거주'));
      entry.appendChild(el('div', 'history-period', `${h.moveIn || '-'}~${h.moveOut || '-'}`));
      // 메모 원본의 색상/굵기 서식은 적용하지 않고, 다른 이력 항목들과 같은 일반 텍스트로 보여준다.
      if(h.memo) entry.appendChild(el('div', 'history-sub', h.memo));
      body.appendChild(entry);
    });
    if(focusHistoryId){
      const target = [...body.querySelectorAll('.history-entry')].find(n=> n.dataset.historyId === focusHistoryId);
      if(target){ target.classList.add('flash-highlight'); target.scrollIntoView({ block:'nearest' }); }
      focusHistoryId = null;
    }
  }

  // 수정이력은 EDIT_HISTORY_PAGE_SIZE건씩 읽고, "이전 기록 더 보기"를 누를 때만 마지막 문서 다음부터 이어서 읽는다.
  let editLoaded = false, editLoading = false, editRaw = [], editRows = [], editCursor = null, editHasMore = false, editError = '', editFilterValue = '';
  if(canEdit()){
    countEditHistoryForRoom(room.id)
      .then(n=>{ editTotal = n; if(overlay.isConnected) renderTabBar(); })
      .catch(e=> console.warn('수정 이력 건수 확인 실패:', e));
  }
  function loadEditPage(){
    editLoading = true;
    let q = EDIT_HISTORY_COL.where('roomKey', '>=', room.id + '|').where('roomKey', '<', room.id + '|~').orderBy('roomKey', 'desc');
    if(editCursor) q = q.startAfter(editCursor);
    q.limit(EDIT_HISTORY_PAGE_SIZE).get()
      .then(snap=>{
        snap.forEach(d=> editRaw.push(d.data()));
        if(snap.docs.length) editCursor = snap.docs[snap.docs.length - 1];
        editHasMore = snap.docs.length === EDIT_HISTORY_PAGE_SIZE;
        editRows = coalesceEditRows(editRaw);
      })
      .catch(e=>{ editError = (e && e.message) || String(e); })
      .then(()=>{
        editLoading = false; editLoaded = true;
        if(!overlay.isConnected) return;
        if(current === '수정이력') show(); else renderTabBar();
      });
  }
  function renderEditTab(){
    if(!editLoaded){
      body.appendChild(el('div', 'edit-hist-note', '불러오는 중…'));
      if(!editLoading) loadEditPage();
      return;
    }
    if(editError){
      body.appendChild(el('div', 'edit-hist-empty', `수정 이력을 불러오지 못했습니다. Firebase 보안 규칙에 editHistory가 없으면 이 오류가 납니다.\n\n오류 내용: ${editError}`));
      return;
    }
    const residents = new Map();
    editRows.forEach(r=>{ if(r.entity === 'resident' && !residents.has(r.entityId)) residents.set(r.entityId, r.target); });
    const bar = el('div', 'edit-hist-toolbar');
    const filter = document.createElement('select');
    filter.className = 'edit-hist-filter';
    filter.innerHTML = '<option value="">전체</option><option value="room">방 정보</option>'
      + [...residents].map(([id, name])=> `<option value="${esc(id)}">입실자 ${esc(name)}</option>`).join('');
    filter.value = editFilterValue;
    filter.onchange = ()=>{ editFilterValue = filter.value; show(); };
    bar.appendChild(filter);
    if(editRaw.length) bar.appendChild(el('span', 'edit-hist-note', `${editTotal != null ? `전체 ${editTotal}건 중 ` : ''}최근 ${editRaw.length}건` + (editHasMore ? ' · 더 오래된 기록 있음' : '')));
    body.appendChild(bar);
    const shown = !editFilterValue ? editRows
      : editRows.filter(r=> editFilterValue === 'room' ? r.entity === 'room' : r.entityId === editFilterValue);
    if(shown.length === 0) body.appendChild(el('div', 'edit-hist-empty', editHasMore ? '불러온 기록에는 해당 이력이 없습니다.' : '기록된 수정 이력이 없습니다.'));
    shown.forEach(r=>{
      const row = el('div', 'edit-hist-row');
      const meta = el('div', 'edit-hist-meta');
      meta.appendChild(el('span', 'edit-hist-time', formatKstStamp(r.at)));
      meta.appendChild(el('span', r.by === EDIT_BY_AUTO ? 'edit-hist-by auto' : 'edit-hist-by', r.by || '알 수 없음'));
      row.appendChild(meta);
      const what = r.action === 'add' ? '등록' : r.action === 'remove' ? '삭제' : r.action === 'moveout' ? '퇴실 처리' : r.fieldLabel;
      row.appendChild(el('div', 'edit-hist-target',
        `${r.entity === 'room' ? '방' : '입실자 ' + r.target} · ${what}` + (r.count > 1 ? ` (${r.count}번 저장)` : '')));
      if(r.action === 'change'){
        const ch = el('div', 'edit-hist-change');
        ch.appendChild(el('span', 'edit-hist-before', r.before));
        ch.appendChild(el('span', 'edit-hist-arrow', '→'));
        ch.appendChild(el('span', 'edit-hist-after', r.after));
        row.appendChild(ch);
      }else{
        row.appendChild(el('div', 'edit-hist-change', r.after || r.before));
      }
      body.appendChild(row);
    });
    if(editHasMore){
      const more = el('button', 'btn small edit-hist-more', editLoading ? '불러오는 중…' : `이전 기록 ${EDIT_HISTORY_PAGE_SIZE}건 더 보기`);
      more.disabled = editLoading;
      more.onclick = ()=>{
        if(editLoading) return;
        more.disabled = true; more.textContent = '불러오는 중…';
        loadEditPage();
      };
      body.appendChild(more);
    }
  }

  function renderCleaningTab(){
    const hist = cleaningHistory();
    if(hist.length === 0){ body.appendChild(el('div', 'history-empty', '등록된 청소 이력이 없습니다.')); return; }
    hist.forEach(h=>{
      const row = el('div', 'clean-hist-row');
      row.appendChild(el('span', null, `${h.date || '-'}  ${h.label || '-'}`));
      if(canEdit()){
        const delBtn = el('button', 'iconbtn del');
        delBtn.type = 'button';
        delBtn.innerHTML = '&times;';
        delBtn.title = '이 청소 이력 삭제';
        delBtn.onclick = ()=>{
          showConfirm(`"${h.date || '-'} ${h.label || ''}" 이력을 삭제할까요?`, ()=>{
            room.cleaningHistory = (room.cleaningHistory || []).filter(x=> x.id !== h.id);
            logChange(`${room.number}호 청소 이력(${h.date || '-'} ${h.label || ''}) 삭제`);
            scheduleSave();
            show();
          });
        };
        row.appendChild(delBtn);
      }
      body.appendChild(row);
    });
  }

  show();
}

function toISODateStr(v){
  if(v == null || v==='') return '';
  if(v instanceof Date){
    // 엑셀/구글시트 날짜 직렬값에 부동소수점 오차가 섞여 있어(예: 자정이 아닌 23:59:xx)
    // 하루 전날로 잘못 계산되는 경우가 있어, 가장 가까운 날짜로 반올림해 보정합니다.
    const rounded = new Date(Math.round(v.getTime() / 86400000) * 86400000);
    const y = rounded.getUTCFullYear(), m = String(rounded.getUTCMonth()+1).padStart(2,'0'), d = String(rounded.getUTCDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  if(typeof v === 'number'){
    // 엑셀 날짜 직렬번호(문자열이 아닌 순수 숫자로 남은 경우) 보정
    const parsed = XLSX.SSF && XLSX.SSF.parse_date_code ? XLSX.SSF.parse_date_code(Math.round(v)) : null;
    if(parsed){
      const y = parsed.y, m = String(parsed.m).padStart(2,'0'), d = String(parsed.d).padStart(2,'0');
      return `${y}-${m}-${d}`;
    }
  }
  return String(v).trim();
}
