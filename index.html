/* ---------------- 연박 체크(호스텔 OTA 예약 정리) ---------------- */
// OTA 예약 목록을 그대로 복사해 붙여넣으면, 한 예약이 여러 줄로 쪼개져 들어온다(도어락·계약
// 붙여넣기와 같은 문제). 열 위치를 세는 대신 "YYYY-MM-DD 부터 YYYY-MM-DD 까지" 줄을 앵커로
// 잡아 그 앞뒤에서 필요한 값만 찾아낸다 — 예약 한 건당 이 줄이 정확히 하나씩 있기 때문에
// 줄바꿈이 몇 개 끼어 있든 안전하다.
const STAY_PERIOD_RE = /(\d{4})-(\d{2})-(\d{2})\s*부터\s*(\d{4})-(\d{2})-(\d{2})\s*까지/;
function parseStayReservationPaste(text){
  const lines = String(text||'').replace(/\r/g,'').split('\n').map(l=> l.trim()).filter(l=> l!=='');
  const out = [];
  lines.forEach((line, i)=>{
    const m = line.match(STAY_PERIOD_RE);
    if(!m) return;
    const checkIn = `${m[1]}-${m[2]}-${m[3]}`;
    const checkOut = `${m[4]}-${m[5]}-${m[6]}`;
    // 박수 = 퇴실일 - 입실일. 두 값 모두 같은 방식으로 파싱하므로 시간대 영향이 없다.
    const nights = Math.max(1, Math.round((Date.parse(checkOut) - Date.parse(checkIn)) / 86400000));
    // 객실타입: 앵커 앞쪽에서 가장 가까운 "...베드 / N인실 / ...룸 / ...실" 형태의 줄.
    // (예약 객실 타입과 객실타입이 같은 값으로 두 번 나오는데, 가까운 쪽이 객실타입이다)
    let roomType = '';
    for(let j=i-1; j>=Math.max(0, i-8); j--){
      const v = lines[j];
      if(/^\d+\s*명$/.test(v)) continue;
      if(/(베드|인실|룸|실)$/.test(v)){ roomType = v; break; }
    }
    let people = '';
    for(let j=i-1; j>=Math.max(0, i-8); j--){
      const pm = lines[j].match(/^(\d+)\s*명$/);
      if(pm){ people = Number(pm[1]); break; }
    }
    const channel = lines[i+1] || '';
    // 예약자명: 예약처 다음 줄부터. "TL"처럼 짧은 라벨만 있는 줄은 건너뛴다.
    let name = '';
    for(let j=i+2; j<Math.min(lines.length, i+6); j++){
      const v = lines[j];
      if(!v || /^[A-Z]{1,3}$/.test(v)) continue;
      name = v; break;
    }
    out.push({ checkIn, checkOut, nights, roomType: roomType || '(타입 미상)', people, channel, name: name || '(이름 미상)' });
  });
  return out;
}
// 여성/남성 전용베드를 항상 위에, 그 다음 나머지 타입을 가나다순으로 보여준다.
const STAY_ROOM_TYPE_ORDER = ['여성전용베드', '남성전용베드'];
function groupStayReservations(list){
  const byType = new Map();
  list.forEach(r=>{
    if(!byType.has(r.roomType)) byType.set(r.roomType, []);
    byType.get(r.roomType).push(r);
  });
  const types = [...byType.keys()].sort((a,b)=>{
    const ia = STAY_ROOM_TYPE_ORDER.indexOf(a), ib = STAY_ROOM_TYPE_ORDER.indexOf(b);
    if(ia >= 0 || ib >= 0) return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    return a.localeCompare(b, 'ko');
  });
  return types.map(type=>{
    const items = byType.get(type);
    // 연박(2박 이상)을 먼저, 박수 많은 순으로. 그 다음 1박.
    const multi = items.filter(r=> r.nights >= 2).sort((a,b)=> b.nights - a.nights || a.name.localeCompare(b.name, 'ko'));
    const single = items.filter(r=> r.nights === 1).sort((a,b)=> a.name.localeCompare(b.name, 'ko'));
    return { type, multi, single, total: items.length };
  });
}

/* ---------------- 정산 반환 금액 계산기 ---------------- */
// 지점별 정산 설정(수수료율/보증금/환불계좌)을 엑셀 표에서 한 번에 등록하기 위한 헤더 매핑.
// 헤더는 공백을 모두 지운 뒤 정확히 일치하는 것만 인식한다("보증금관리"와 "보증금"이 서로
// 다른 열로 구분되어야 하므로 접두어 매칭은 쓰지 않는다).
const SETTLEMENT_FIELD_BY_HEADER = {
  '고시원명':'branchName', '고시원':'branchName', '고시원이름':'branchName',
  '지점명':'branchName', '지점':'branchName',
  '수수료율':'commissionRate', '수수료':'commissionRate', '정산수수료율':'commissionRate',
  '보증금관리':'managesDeposit', '보증금관리여부':'managesDeposit',
  '보증금':'depositAmount', '보증금금액':'depositAmount',
  '환불계좌':'refundAccount', '환부계좌':'refundAccount', '환급계좌':'refundAccount',
  '계좌':'refundAccount', '계좌번호':'refundAccount'
};
function parseSettlementBool(s){
  const v = cleanKeyLoose(s).toUpperCase();
  if(!v) return false;
  return ['O','Y','YES','TRUE','1','V','관리','관리함','관리O','있음','예'].includes(v);
}
function importSettlementGrid(headerCells, dataRows, onImported){
  const idx = {};
  headerCells.forEach((h, i)=>{
    const key = SETTLEMENT_FIELD_BY_HEADER[cleanKeyLoose(h).replace(/\s+/g,'')];
    if(key) idx[key] = i;
  });
  if(idx.branchName == null){
    showAlert('헤더 행에서 "고시원명"(또는 지점명) 열을 찾을 수 없습니다.\n첫 줄이 헤더인지 확인해주세요.');
    return;
  }
  const updates = [];
  const unmatched = [];
  dataRows.forEach((cells, i)=>{
    const get = (k)=> (idx[k]!=null && cells[idx[k]]!=null) ? String(cells[idx[k]]).trim() : '';
    const nameRaw = cleanKeyLoose(get('branchName'));
    if(!nameRaw) return;
    const resolved = BRANCH_NAME_ALIASES[nameRaw] || nameRaw;
    const branch = DB.branches.find(b=> cleanKeyLoose(b.name).toLowerCase() === resolved.toLowerCase());
    if(!branch){ unmatched.push(`[${i+2}행] ${nameRaw}`); return; }
    const patch = {};
    if(idx.commissionRate != null){
      const raw = get('commissionRate').replace(/[^0-9.]/g,'');
      if(raw !== ''){
        let rate = Number(raw) || 0;
        // "0.07"처럼 비율로 적힌 경우도 7%로 받아들인다 — 실제 운영상 1% 미만 수수료율은
        // 쓰이지 않으므로, 0과 1 사이 값은 소수 비율로 보고 100을 곱한다.
        if(rate > 0 && rate < 1) rate = rate * 100;
        patch.commissionRate = rate;
      }
    }
    if(idx.managesDeposit != null) patch.managesDeposit = parseSettlementBool(get('managesDeposit'));
    if(idx.depositAmount != null){
      const raw = get('depositAmount').replace(/[^0-9]/g,'');
      if(raw !== '') patch.depositAmount = Number(raw);
    }
    if(idx.refundAccount != null){
      const raw = get('refundAccount');
      if(raw && raw !== '-') patch.refundAccount = raw;
    }
    updates.push({ branch, patch });
  });
  if(updates.length === 0){
    showAlert('등록할 지점을 찾지 못했습니다.'
      + (unmatched.length ? `\n\n이름이 일치하는 지점이 없는 행:\n${unmatched.slice(0,20).join('\n')}` : ''));
    return;
  }
  showConfirm(
    `${updates.length}개 지점의 정산 설정을 업데이트할까요?`
      + (unmatched.length ? `\n(지점을 찾지 못한 ${unmatched.length}건은 제외됩니다)` : ''),
    ()=>{
      updates.forEach(u=> Object.assign(u.branch, u.patch));
      logChange(`지점 정산 설정 일괄 등록: ${updates.length}건`);
      scheduleSave(); render();
      if(typeof onImported === 'function') onImported();
      showAlert(`${updates.length}개 지점의 정산 설정을 업데이트했습니다.`
        + (unmatched.length ? `\n\n지점을 찾지 못해 제외된 행:\n${unmatched.slice(0,20).join('\n')}` : ''));
    }
  );
}
// 빈 양식이 아니라 현재 등록된 지점 목록과 지금 설정값을 그대로 채워서 내려준다 — 담당자는
// 값만 고쳐 다시 올리면 되고, 고시원명을 직접 타이핑하지 않아도 되니 매칭 실패도 줄어든다.
function downloadSettlementTemplate(){
  if(typeof XLSX === 'undefined'){ showAlert('엑셀 라이브러리를 불러오지 못했습니다. 네트워크 연결을 확인해주세요.'); return; }
  const headers = ['고시원명','수수료율','보증금관리','보증금','환불계좌'];
  const rows = allowedBranches().map(b=>({
    고시원명: branchLabel(b),
    수수료율: branchCommissionRate(b),
    보증금관리: b.managesDeposit ? 'O' : 'X',
    보증금: b.depositAmount || 0,
    환불계좌: b.refundAccount || ''
  }));
  if(rows.length === 0) rows.push({ 고시원명:'먼슬리브 성수', 수수료율:7, 보증금관리:'X', 보증금:0, 환불계좌:'' });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows, { header: headers }), '정산설정');
  XLSX.writeFile(wb, `monthliv_고시원별_정산설정_${todayISO()}.xlsx`);
}
function handleSettlementExcelFile(file, onImported){
  if(typeof XLSX === 'undefined'){ showAlert('엑셀 라이브러리를 불러오지 못했습니다. 네트워크 연결을 확인해주세요.'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    let grid;
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      grid = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'' });
    }catch(err){
      showAlert('엑셀 파일을 읽는 중 오류가 발생했습니다: ' + err.message);
      return;
    }
    if(!grid || grid.length < 2){
      showAlert('헤더 행과 데이터 행이 포함된 엑셀 파일을 업로드해주세요.');
      return;
    }
    const headerCells = grid[0].map(v=> v==null ? '' : String(v));
    const dataRows = grid.slice(1).map(row=> row.map(v=> v==null ? '' : v));
    importSettlementGrid(headerCells, dataRows, onImported);
  };
  reader.readAsArrayBuffer(file);
}
function showSettlementPasteModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';

  const close = ()=> overlay.remove();
  box.innerHTML = `
    <div class="modal-msg" style="margin-bottom:10px;font-weight:700;">지점 정산 설정 붙여넣기</div>
    <div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:10px;line-height:1.6;">
      엑셀에서 헤더 행을 포함해 복사한 표를 붙여넣어주세요.<br>
      인식하는 열: <b>고시원명</b>(필수), 수수료율, 보증금관리, 보증금, 환불계좌<br>
      보증금관리는 O / X (또는 Y/N, 관리/미관리)로 적어주세요.
    </div>`;
  const textarea = document.createElement('textarea');
  textarea.rows = 10;
  textarea.style.cssText = 'width:100%;font-family:monospace;font-size:11.5px;';
  textarea.placeholder = '고시원명\t수수료율\t보증금관리\t보증금\t환불계좌';
  box.appendChild(textarea);
  const btnRow = document.createElement('div');
  btnRow.className = 'modal-btn-row';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn'; cancelBtn.textContent = '취소'; cancelBtn.onclick = close;
  const importBtn = document.createElement('button');
  importBtn.className = 'btn primary'; importBtn.textContent = '가져오기';
  importBtn.onclick = ()=>{
    const lines = textarea.value.replace(/\r/g,'').split('\n').filter(l=> l.trim()!=='');
    if(lines.length < 2){ showAlert('헤더 행과 데이터 행이 포함된 표를 붙여넣어주세요.'); return; }
    importSettlementGrid(lines[0].split('\t'), lines.slice(1).map(l=> l.split('\t')), close);
  };
  btnRow.appendChild(cancelBtn); btnRow.appendChild(importBtn);
  box.appendChild(btnRow);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  setTimeout(()=> textarea.focus(), 0);
}

          ? '입실 전에 계약이 취소된 경우입니다. 입실자 정보를 삭제합니다(이용 기간이 없으므로 퇴실 이력에는 남기지 않습니다)'
          : '이 입실자를 환불 계약일 기준으로 퇴실 처리합니다';
        leaveBtn.onclick = ()=>{
          if(neverMovedIn){
            showConfirm(`"${item.p.name || '이 입실자'}"는 입실 예정일(${item.p.moveIn}) 전에 계약이 취소되었습니다.\n실제 이용한 적이 없으므로 퇴실 이력을 남기지 않고 입실자 정보를 삭제할까요?`, ()=>{
              delete UI.residentSnapshots[item.p.id];
              delete UI.residentFieldEdit[item.p.id];
              logChange(`"${item.p.name || '입실자'}" 입실 전 계약 취소로 삭제`);
              DB.residents = DB.residents.filter(x=>x.id!==item.p.id);
              scheduleSave(); render();
            });
          } else {
            showConfirm(`"${item.p.name || '이 입실자'}"를 환불 계약일(${item.p.refundPendingDate || '미상'}) 기준으로 퇴실 처리할까요?\n정보는 히스토리로 이동되고, 이 자리에 새 입실자를 등록할 수 있게 됩니다.`, ()=>{
              moveResidentToHistory(item.p, item.p.refundPendingDate || todayISO());
              scheduleSave(); render();
            });
          }
        };
        const dismissBtn = document.createElement('button');
        dismissBtn.className = 'btn small';
        dismissBtn.textContent = '무시';
        dismissBtn.title = '오매칭이거나 처리가 필요 없으면 표시만 지웁니다(입실자 정보는 그대로 유지)';
        dismissBtn.onclick = ()=>{
          delete item.p.refundPending;
          delete item.p.refundPendingDate;
          delete item.p.refundPendingContractId;
          logChange(`"${item.p.name}" 환불 처리 필요 표시 해제(무시)`);
          scheduleSave(); render();
        };
        row.appendChild(leaveBtn); row.appendChild(dismissBtn);
      }
      groupWrap.appendChild(row);
    });
    card.appendChild(groupWrap);
  });

  return card;
}

function renderCleaningView(){
  const wrap = document.createElement('div');
  wrap.style.paddingTop = '18px';
  wrap.appendChild(renderCleaningCards());
  wrap.appendChild(renderCleaningWeekMatrix());
  return wrap;
}

/* 청소 관리 대시보드(상단 카드·주간표)가 공유하는 단일 데이터 소스.
   퇴실청소: 계약만기일 등으로 퇴실이 확정된(scheduledToLeave) 입실자는, 청소 인력이
   나오는 월/수/금 중 퇴실일 이후 가장 빠른 날짜를 청소일로 잡는다(예: 8/9(일) 만기 →
   8/10(월)). 이미 퇴실청소가 필요로 표시된 호실은 그 날짜를 그대로 쓴다. 리터치는
   autoFlagDueRetouch()가 조건에 맞으면 자동으로 needsRetouch/maintenanceDate를 걸어주므로
   여기서는 그렇게 이미 걸린 값을 그대로 읽기만 한다(필요하면 수동으로도 계속 켤 수 있다).
   추가청소는 수동 관리이며 예정일을 입력하지 않았으면 date를 null로 둔다(카드 목록엔 "오늘"로
   표시되지만, 날짜가 없어 주간표에는 올릴 수 없음 — 소비하는 쪽에서 구분해서 처리한다). */
function collectCleaningEntries(){
  const entries = [];
  DB.rooms.filter(r=> (r.needsCleaning || r.needsRetouch || r.needsExtraCleaning) && hasBranchAccess(r.branchId)).forEach(r=>{
    const branch = DB.branches.find(b=>b.id===r.branchId);
    const kind = roomMaintKind(r);
    entries.push({ type:kind, branch, room:r, date: r.maintenanceDate || (kind==='moveout' ? todayISO() : null) });
  });
  // roomUpcomingLeaveDate는 방 카드 배지와 동일한 기준(퇴실확정된 입실자 유무 + 방 카드에서
  // "퇴실청소" 칩으로 취소한 적이 있는지)을 쓰므로, 방 카드에서 취소하면 여기서도 함께 사라진다.
  // 이 미리보기는 room.needsCleaning을 실제로 걸지 않고 계산만 하므로, 청소/리터치 자동 지정
  // 제외 지점(isAutoCleaningExcludedBranch)의 방은 여기서도 제외해야 한다 — 안 그러면 목록에는
  // 뜨는데 needsCleaning이 걸린 적이 없어(자동 지정 자체가 막혀 있으므로) "청소완료" 버튼이 영영
  // 나타나지 않는 상태로 남는다(제주 A202호 등에서 보고된 증상).
  DB.rooms.filter(r=> !roomMaintKind(r) && hasBranchAccess(r.branchId) && !isAutoCleaningExcludedBranch(roomBranch(r))).forEach(r=>{
    const date = roomUpcomingLeaveDate(r);
    if(!date) return;
    const branch = DB.branches.find(b=>b.id===r.branchId);
    entries.push({ type:'moveout', branch, room:r, date });
  });
  return entries;
}

// 리터치 자동 예약 기준일(입실예정일 기준 며칠 이내에 청소 이력이 없으면 리터치가 필요한지).
const RETOUCH_RECENT_CLEAN_DAYS = 10;
function roomCleanedWithin(room, beforeDateStr, windowDays){
  const from = addDaysISO(beforeDateStr, -windowDays);
  return (room.cleaningHistory || []).some(h=> h.date && h.date >= from && h.date < beforeDateStr);
}
/* 리터치 자동 예약: 지금 아무도 살고 있지 않고(이용중인 입실자 없음), 입실예정자가 있는 방인데
   그 입실예정일 기준 RETOUCH_RECENT_CLEAN_DAYS일 이내에 청소(퇴실청소/리터치/추가청소 무엇이든)
   이력이 없으면, 입실예정일 전 가장 가까운 월/수/금으로 리터치를 자동으로 건다. 예: 입실예정일이
   10/11이고 직전 퇴실청소가 9/30(11일 전이라 기준일 밖)이면 10/9(가장 가까운 금)에 리터치.
   이미 청소/리터치/추가청소가 걸려 있는 방, 공실 방은 건드리지 않는다(수동 관리 유지).
   AUTO_CLEANING_EXCLUDED_BRANCH_NAMES(제주·오산 등)는 일반 고시원과 다르게 운영되어 이 자동
   예약 대상에서 제외한다. */
function autoFlagDueRetouch(){
  let changed = false;
  DB.rooms.forEach(room=>{
    if(isAutoCleaningExcludedBranch(roomBranch(room))) return;
    // 퇴실확정된 입실자가 있어 퇴실청소가 표시/예정된 방(roomUpcomingLeaveDate — 방 카드 배지와
    // 같은 기준)에는 리터치를 자동으로 걸지 않는다. 둘 다 해당하는 상황이면 퇴실청소가 우선이다.
    // 이 검사는 반드시 아래 roomMaintKind 조기 반환보다 앞에 와야 한다 — 리터치가 이미 켜져
    // 있으면 roomMaintKind가 truthy라 거기서 걸러져, 정작 정리해야 할 상황에 도달하지 못한다.
    if(roomUpcomingLeaveDate(room)){
      // 퇴실이 확정된 방에 이전 공실 때 걸어둔 리터치가 그대로 남아 있으면, 더 포괄적인
      // 퇴실청소가 그 자리를 대신해야 한다. 표시만 바꾸는 게 아니라 플래그 자체를 정리해야
      // 청소관리 화면·완료 버튼까지 퇴실청소 기준으로 맞는다.
      if(room.needsRetouch){
        room.needsRetouch = false;
        room.maintenanceDate = '';
        room.maintenanceMemo = '';
        changed = true;
      }
      return;
    }
    if(roomMaintKind(room)) return;
    if(effectiveRoomStatus(room) === '공실') return;
    if(DB.residents.some(p=> p.roomId===room.id && isCurrentlyResiding(p))) return;
    const upcoming = DB.residents.filter(p=> p.roomId===room.id && isUpcoming(p))
      .sort((a,b)=> a.moveIn.localeCompare(b.moveIn))[0];
    if(!upcoming) return;
    if(roomCleanedWithin(room, upcoming.moveIn, RETOUCH_RECENT_CLEAN_DAYS)) return;
    room.needsRetouch = true;
    room.maintenanceDate = prevMonWedFri(addDaysISO(upcoming.moveIn, -1));
    room.maintenanceMemo = '';
    changed = true;
  });
  if(changed) scheduleSave();
}
// 리터치가 예정된 방에 "새로운" 입실자가 들어와 살기 시작하면 그 리터치는 더 이상 의미가 없다고 보고 자동으로
// 지운다(직원이 "리터치완료"를 잊었을 때의 안전장치이기도 하다).
// 퇴실청소는 지우지 않는다 — 당일 청소하고 당일 입실시키는 경우가 있어서, 새 입실자가 이미 살고 있다는 이유로
// 지우면 그날 해야 할 청소 지시가 사라진다(성수 301호, 담당자 정책). 퇴실청소는 청소완료 버튼으로만 지운다.
// 2026-09 이전에는 퇴실청소도 함께 지웠다. 추가청소(needsExtraCleaning)는 별개로 수동 관리되는 항목이라 건드리지 않는다.
// 주의: 재실 중인 입실자가 있다고 무조건 지우면 안 된다 — 예정을 만든 원인 입실자(room.cleaningFlagSourceId)가
// 아직 살고 있으면 "그 사람 본인이 아직 안 나간 것"이므로 건드리지 않는다(신삼B동 402호).
function clearCleaningFlagsOnMoveIn(){
  let changed = false;
  DB.rooms.forEach(room=>{
    // 퇴실청소가 함께 걸려 있으면 청소일(maintenanceDate)은 퇴실청소 것이므로 건드리지 않는다.
    if(!room.needsRetouch || room.needsCleaning) return;
    const current = DB.residents.filter(p=> p.roomId===room.id && isCurrentlyResiding(p));
    if(current.length === 0) return;
    if(room.cleaningFlagSourceId && current.some(p=> p.id === room.cleaningFlagSourceId)) return;
    room.needsRetouch = false;
    room.maintenanceDate = '';
    room.maintenanceMemo = '';
    room.cleaningFlagSourceId = null;
    changed = true;
  });
  if(changed) scheduleSave();
}
// 청소/리터치 자동 지정에서 제외된 지점(autoCleaningExcluded)의 방에 이미 청소/리터치 예정이
// 걸려 있으면(제외 설정 이전에 걸렸거나, 체크박스를 막 켠 시점 등) 지워준다. 체크박스를 켜는
// 순간 즉시 한 번(그 지점만) + 로그인 시·매시간 전체 지점을 대상으로 다시 확인해서, 어떤
// 경로로 걸렸든 계속 남아있지 않게 한다.
function clearCleaningFlagsForExcludedBranches(){
  let changed = false;
  DB.rooms.forEach(room=>{
    if(!isAutoCleaningExcludedBranch(roomBranch(room))) return;
    if(!(room.needsCleaning || room.needsRetouch)) return;
    room.needsCleaning = false;
    room.needsRetouch = false;
    room.maintenanceDate = '';
    room.maintenanceMemo = '';
    room.cleaningFlagSourceId = null;
    changed = true;
  });
  if(changed) scheduleSave();
}

/* 청소 관리 주간표에 "완료" 플래그로 표시할, 이미 처리된 청소 이력(room.cleaningHistory) 목록. */
function collectCleaningDoneEntries(){
  const entries = [];
  DB.rooms.filter(r=> hasBranchAccess(r.branchId) && Array.isArray(r.cleaningHistory) && r.cleaningHistory.length).forEach(r=>{
    const branch = DB.branches.find(b=>b.id===r.branchId);
    r.cleaningHistory.forEach(h=> entries.push({ type:h.type, branch, room:r, date:h.date, label:h.label }));
  });
  return entries;
}

// "오늘 청소방" 목록(collectCleaningEntries)에는 실제 플래그(needsCleaning 등)가 걸린 방뿐
// 아니라, 퇴실확정된 입실자로 인해 미리 표시만 되는(플래그는 안 걸려 있는) 퇴실청소 항목도
// 같이 뜬다 — 예를 들어 이 방에 이미 등록된 다음 입실자가 있는데 계약적용 경로로 등록돼
// flagUpcomingCleaning이 호출되지 않은 경우 등(마곡발산 등에서 반복 보고됨). 예전에는 실제
// 플래그가 없으면 버튼 자체가 안 떠서 완료 처리가 영영 불가능했다. 플래그가 있으면 그걸
// 끄고, 없으면(=미리보기였던 경우, 항상 moveout 타입) 방 카드에서 칩을 꺼서 취소했을 때와
// 같은 방식으로 "이 퇴실일 기준으로는 다시 자동으로 안 뜨게" cleaningDismissedMoveOut을
// 남긴다 — 어느 경로든 이력에는 남기고 목록에서 사라지게 한다.
function completeCleaningEntry(room, type){
  const field = MAINT_KIND_FIELD[type];
  const label = MAINT_KIND_META[type].label;
  const doneLabel = MAINT_DONE_LABEL[type] || `${label}완료`;
  const hasFlag = !!(field && room[field]);
  const scheduledDate = room.maintenanceDate || '';
  const memo = room.maintenanceMemo || '';
  if(hasFlag){
    room[field] = false;
    room.maintenanceDate = '';
    room.maintenanceMemo = '';
  } else if(type === 'moveout'){
    // 지금 이 방에 미리보기 퇴실청소가 실제로 떠 있을 때만 완료로 기록한다. 이미 이 퇴실일 기준으로 완료한 방이면
    // (다른 탭·오래된 화면에 남아 있던 버튼) 이력을 또 남기지 않는다.
    if(!roomUpcomingLeaveDate(room)) return;
  } else {
    // retouch/extra는 미리보기 경로가 없어(항상 실제 플래그로만 뜬다) 여기 도달할 일이 없지만,
    // 혹시라도 플래그가 이미 다른 곳에서 꺼진 뒤 뒤늦게 눌린 경우 조용히 무시한다.
    return;
  }
  // 퇴실청소를 완료하면 플래그를 끈 경우에도 "이 퇴실일 기준 청소는 끝났다"를 남긴다. 예전에는 플래그만 끄고
  // 이 표시를 남기지 않아, 퇴실확정 입실자가 아직 퇴실 처리 전인 동안(당일 청소 후 퇴실일이 지나기 전) 완료한
  // 방이 "오늘 청소방"·방 카드에 퇴실청소 예정(roomUpcomingLeaveDate)으로 곧바로 다시 떴다. 그걸 보고 한 번 더
  // 누르면 같은 날 "청소완료"가 두 번 기록됐다(성수역 102호). 퇴실일이 바뀌면 새 청소로 보고 다시 띄운다.
  if(type === 'moveout'){
    room.cleaningDismissedMoveOut = roomEarliestLeaverMoveOut(room) || room.cleaningDismissedMoveOut || '';
  }
  if(!Array.isArray(room.cleaningHistory)) room.cleaningHistory = [];
  room.cleaningHistory.unshift({ id: uid('cl'), type, label: doneLabel, date: todayISO(), scheduledDate, memo });
  room.cleaningHistory = room.cleaningHistory.slice(0, CLEANING_HISTORY_MAX);
  logChange(`${room.number}호 ${label} 완료 처리`);
  scheduleSave(); render();
}

function goToBranchRooms(branchId){
  UI.view='branch'; UI.branchId = branchId; UI.branchTab='rooms'; UI.roomStatusFilter='전체'; render();
}

function mondayOf(dateStr){
  const d = new Date(dateStr);
  const day = d.getDay();
  d.setDate(d.getDate() + (day===0 ? -6 : 1-day));
  return d.toISOString().slice(0,10);
}
function addDaysISO(dateStr, n){
  const d = new Date(dateStr);
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}

function renderCleaningWeekMatrix(){
  if(!UI.cleanWeekStart) UI.cleanWeekStart = mondayOf(todayISO());

  const box = document.createElement('div');
  box.className = 'stat-section';

  const weekDates = [0,1,2,3,4,5,6].map(i=> addDaysISO(UI.cleanWeekStart, i));
  const today = todayISO();

  const head = document.createElement('div');
  head.className = 'cal-head';
  const spacer = document.createElement('div');
  spacer.className = 'cal-head-spacer';
  const nav = document.createElement('div');
  nav.className = 'cal-head-nav';
  const prevBtn = document.createElement('button'); prevBtn.className='btn small'; prevBtn.textContent='◀';
  const nextBtn = document.createElement('button'); nextBtn.className='btn small'; nextBtn.textContent='▶';
  const title = document.createElement('div');
  title.className = 'cal-title';
  title.textContent = `${weekDates[0].slice(0,4)}년 ${Number(weekDates[0].slice(5,7))}월 청소 필요 현황`;
  prevBtn.onclick = ()=>{ UI.cleanWeekStart = addDaysISO(UI.cleanWeekStart, -7); render(); };
  nextBtn.onclick = ()=>{ UI.cleanWeekStart = addDaysISO(UI.cleanWeekStart, 7); render(); };
  nav.appendChild(prevBtn); nav.appendChild(title); nav.appendChild(nextBtn);
  head.appendChild(spacer); head.appendChild(nav);
  box.appendChild(head);

  const legend = document.createElement('div');
  legend.className = 'cal-legend';
  legend.innerHTML = `<span class="cal-legend-item">클릭 시 계약/입실관리의 해당 지점으로 이동 · 해당 없는 항목은 표시하지 않음 · 흐리게 표시된 항목은 완료 처리됨</span>`;
  box.appendChild(legend);

  const branches = allowedBranches();
  if(branches.length===0){
    box.appendChild(el('div','cleaning-empty','지점이 없습니다.'));
    return box;
  }

  const entries = collectCleaningEntries().filter(e=> e.date && weekDates.includes(e.date));
  const doneEntries = collectCleaningDoneEntries().filter(e=> e.date && weekDates.includes(e.date));
  const grid = new Map(); // branchId -> date -> {moveout:[room번호...], retouch:[...], extra:[...], moveoutDone:[...], retouchDone:[...], extraDone:[...]}
  function dayEntrySlot(dmap, date){
    if(!dmap.has(date)) dmap.set(date, { moveout:[], retouch:[], extra:[], moveoutDone:[], retouchDone:[], extraDone:[] });
    return dmap.get(date);
  }
  entries.forEach(e=>{
    const bkey = e.branch ? e.branch.id : '__none__';
    if(!grid.has(bkey)) grid.set(bkey, new Map());
    dayEntrySlot(grid.get(bkey), e.date)[e.type].push(e.room.number);
  });
  doneEntries.forEach(e=>{
    const bkey = e.branch ? e.branch.id : '__none__';
    if(!grid.has(bkey)) grid.set(bkey, new Map());
    dayEntrySlot(grid.get(bkey), e.date)[e.type+'Done'].push(e.room.number);
  });

  function chipsHtml(dayEntry, branchName, dateLabel){
    const pending = Object.keys(MAINT_KIND_META).filter(k=> dayEntry[k] && dayEntry[k].length).map(k=>{
      const rooms = dayEntry[k];
      const roomsText = rooms.map(n=> n+'호').join(', ');
      const tip = `${branchName} · ${roomsText} · ${MAINT_KIND_META[k].label} · 청소예정일 ${dateLabel}`;
      return `<span class="cal-chip ${k}" title="${esc(tip)}">${MAINT_KIND_META[k].label}(${rooms.length})</span>`;
    });
    const done = Object.keys(MAINT_KIND_META).filter(k=> dayEntry[k+'Done'] && dayEntry[k+'Done'].length).map(k=>{
      const rooms = dayEntry[k+'Done'];
      const roomsText = rooms.map(n=> n+'호').join(', ');
      const doneLabel = MAINT_DONE_LABEL[k] || `${MAINT_KIND_META[k].label}완료`;
      const tip = `${branchName} · ${roomsText} · ${doneLabel} · ${dateLabel}`;
      return `<span class="cal-chip ${k} done" title="${esc(tip)}">${doneLabel}(${rooms.length})</span>`;
    });
    return pending.concat(done).join('');
  }

  const DOW = ['월','화','수','목','금','토','일'];
  const table = document.createElement('table');
  table.className = 'branch-table week-matrix';
  const theadCells = weekDates.map((d,i)=> `<th${d===today?' class="wk-today"':''}>${DOW[i]}<br><span class="wk-date">${d.slice(5)}</span></th>`).join('');
  table.innerHTML = `<thead><tr><th>지점</th>${theadCells}</tr></thead>`;
  const tbody = document.createElement('tbody');

  branches.forEach(branch=>{
    const dmap = grid.get(branch.id);
    const tr = document.createElement('tr');
    const nameTd = document.createElement('td');
    nameTd.innerHTML = `<a href="#" style="color:var(--accent-ink);font-weight:700;text-decoration:none;">${esc(branchLabel(branch))}</a>`;
    nameTd.querySelector('a').onclick = (e)=>{ e.preventDefault(); goToBranchRooms(branch.id); };
    tr.appendChild(nameTd);

    weekDates.forEach(d=>{
      const counts = dmap ? dmap.get(d) : null;
      const td = document.createElement('td');
      td.className = 'wk-cell' + (d===today?' wk-today':'') + (counts ? '' : ' wk-empty');
      td.innerHTML = counts ? `<div class="wk-chips">${chipsHtml(counts, branchLabel(branch), d.slice(5))}</div>` : '-';
      if(counts){
        td.style.cursor = 'pointer';
        td.onclick = ()=> goToBranchRooms(branch.id);
      }
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  const scrollWrap = document.createElement('div');
  scrollWrap.className = 'table-scroll';
  scrollWrap.appendChild(table);
  box.appendChild(scrollWrap);
  return box;
}

function renderCleaningCards(){
  const wrap = document.createElement('div');
  wrap.className = 'cleaning-cards-grid';

  const today = todayISO();
  const weekAhead = addDaysISO(today, 7);
  const entries = collectCleaningEntries();
  const todayList = entries.filter(x=> !x.date || x.date<=today)
    .sort((a,b)=> (a.branch?branchLabel(a.branch):'').localeCompare(b.branch?branchLabel(b.branch):''));
  const futureList = entries.filter(x=> x.date && x.date>today && x.date<=weekAhead)
    .sort((a,b)=> a.date.localeCompare(b.date));

  wrap.appendChild(renderTodayCleaningCard(todayList));
  wrap.appendChild(renderCleaningCard('청소 예정방 (7일 이내)', futureList, true));
  return wrap;
}

const CLEANING_CARD_PAGE_SIZE = 4;
function paginateCleaningList(list, page){
  const totalPages = Math.max(1, Math.ceil(list.length / CLEANING_CARD_PAGE_SIZE));
  const clamped = Math.min(Math.max(page, 1), totalPages);
  const start = (clamped - 1) * CLEANING_CARD_PAGE_SIZE;
  return { pageList: list.slice(start, start + CLEANING_CARD_PAGE_SIZE), totalPages, page: clamped };
}
function appendCleaningPager(header, totalPages, currentPage, onPage){
  if(totalPages <= 1) return;
  const pager = document.createElement('div');
  pager.className = 'log-pager';
  pager.style.marginTop = '0';
  for(let p=1; p<=totalPages; p++){
    const pBtn = document.createElement('button');
    pBtn.className = 'btn small' + (p===currentPage ? ' primary' : '');
    pBtn.textContent = String(p);
    pBtn.onclick = ()=> onPage(p);
    pager.appendChild(pBtn);
  }
  header.appendChild(pager);
}

function renderTodayCleaningCard(list){
  const today = todayISO();
  const card = document.createElement('div');
  card.className = 'stat-section cleaning-card';

  const header = document.createElement('div');
  header.style.cssText = 'display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;';
  header.innerHTML = `<h3 style="margin:0;">오늘 청소방 <span class="cnt-badge">${list.length}</span></h3>`;
  card.appendChild(header);

  if(list.length===0){
    card.appendChild(el('div','cleaning-empty','해당하는 호실이 없습니다.'));
    return card;
  }

  const { pageList, totalPages, page } = paginateCleaningList(list, UI.cleanTodayPage);
  UI.cleanTodayPage = page;
  appendCleaningPager(header, totalPages, page, (p)=>{ UI.cleanTodayPage = p; render(); });

  const groupMap = new Map();
  pageList.forEach(x=>{
    const key = x.branch ? x.branch.id : '__none__';
    if(!groupMap.has(key)) groupMap.set(key, { branch: x.branch, entries: [] });
    groupMap.get(key).entries.push(x);
  });
  const groups = [...groupMap.values()].sort((a,b)=> (a.branch?branchLabel(a.branch):'').localeCompare(b.branch?branchLabel(b.branch):''));

  groups.forEach(group=>{
    const groupWrap = document.createElement('div');
    groupWrap.className = 'cleaning-branch-group';

    const head = document.createElement('div');
    head.className = 'cleaning-branch-head';
    const nameSpan = document.createElement('span');
    nameSpan.className = 'cleaning-branch-name';
    nameSpan.textContent = group.branch ? branchLabel(group.branch) : '(지점 정보 없음)';
    const copyBtn = document.createElement('button');
    copyBtn.className = 'iconbtn';
    copyBtn.innerHTML = '&#10697;';
    copyBtn.title = '이 지점의 청소방·메모를 클립보드에 복사';
    copyBtn.onclick = ()=>{
      const lines = [`[${group.branch ? branchLabel(group.branch) : ''} 청소방]`];
      group.entries.forEach(x=>{
        const kind = MAINT_KIND_META[x.type].label;
        lines.push(`${x.room.number}호 (${kind})${x.room.maintenanceMemo ? ' - ' + x.room.maintenanceMemo : ''}`);
      });
      navigator.clipboard.writeText(lines.join('\n')).then(()=>{
        const origTitle = copyBtn.title;
        copyBtn.innerHTML = '&#10003;';
        copyBtn.classList.add('active');
        copyBtn.title = '복사됨';
        setTimeout(()=>{ copyBtn.innerHTML = '&#10697;'; copyBtn.classList.remove('active'); copyBtn.title = origTitle; }, 1500);
      }).catch(()=>{
        showAlert('복사에 실패했습니다. 브라우저 권한을 확인해주세요.');
      });
    };
    head.appendChild(nameSpan); head.appendChild(copyBtn);
    groupWrap.appendChild(head);

    group.entries.forEach(x=>{
      const entry = document.createElement('div');
      entry.className = 'cleaning-entry';
      const row = document.createElement('div');
      row.className = 'cleaning-row';
      const kindBadge = maintBadgeHtml(x.type);
      row.innerHTML = `<span class="rm">${esc(x.room.number)}호</span>`;
      const kindSpan = document.createElement('span');
      kindSpan.className = 'kind';
      kindSpan.innerHTML = kindBadge;
      // "오늘 청소방"에는 정확히 오늘 예정인 방뿐 아니라, 예전에 청소/리터치가 걸렸는데 아직
      // 완료 처리되지 않은 방(지연)과 애초에 예정일이 없던 방(추가청소 등)도 함께 섞여 들어온다
      // (collectCleaningEntries·renderCleaningCards의 todayList 필터 참고). 지금까지는 이 셋이
      // 화면에서 전혀 구분되지 않았으므로, 오늘이 아닌 경우 실제 예정일(또는 미정 여부)을
      // 배지로 보여준다 — 지연은 눈에 띄도록 빨간색으로 표시한다.
      if(!x.date){
        const noteSpan = document.createElement('span');
        noteSpan.className = 'mdate';
        noteSpan.textContent = '예정일 미정';
        noteSpan.title = '예정일이 지정되지 않았습니다.';
        kindSpan.appendChild(noteSpan);
      } else if(x.date < today){
        const noteSpan = document.createElement('span');
        noteSpan.className = 'mdate';
        noteSpan.style.color = 'var(--st-hold)';
        noteSpan.textContent = `${x.date} 지연`;
        noteSpan.title = `원래 예정일: ${x.date} (아직 완료 처리되지 않았습니다)`;
        kindSpan.appendChild(noteSpan);
      }
      // 실제 플래그 없이 미리보기로만 뜬 항목(x.room에 needsCleaning 등이 안 걸려 있는 경우)도
      // completeCleaningEntry가 처리할 수 있으므로, 플래그 유무와 무관하게 항상 버튼을 보여준다.
      if(canEdit()){
        const doneBtn = document.createElement('button');
        doneBtn.className = 'btn small primary';
        doneBtn.textContent = '청소완료';
        doneBtn.onclick = (e)=>{ e.stopPropagation(); completeCleaningEntry(x.room, x.type); };
        kindSpan.appendChild(doneBtn);
      }
      row.appendChild(kindSpan);
      row.style.cursor = 'pointer';
      row.title = '해당 지점으로 이동';
      row.onclick = ()=>{
        if(!x.branch) return;
        goToBranchRooms(x.branch.id);
      };
      entry.appendChild(row);
      if(x.room.maintenanceMemo){
        entry.appendChild(el('div','cleaning-memo', x.room.maintenanceMemo));
      }
      groupWrap.appendChild(entry);
    });

    card.appendChild(groupWrap);
  });

  return card;
}

function renderCleaningCard(title, list, showDate){
  const card = document.createElement('div');
  card.className = 'stat-section cleaning-card';

  const header = document.createElement('div');
  header.style.cssText = 'display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;';
  header.innerHTML = `<h3 style="margin:0;">${title} <span class="cnt-badge">${list.length}</span></h3>`;
  card.appendChild(header);

  if(list.length===0){
    card.appendChild(el('div','cleaning-empty','해당하는 호실이 없습니다.'));
  } else {
    const { pageList, totalPages, page } = paginateCleaningList(list, UI.cleanFuturePage);
    UI.cleanFuturePage = page;
    appendCleaningPager(header, totalPages, page, (p)=>{ UI.cleanFuturePage = p; render(); });

    pageList.forEach(x=>{
      const entry = document.createElement('div');
      entry.className = 'cleaning-entry';
      const row = document.createElement('div');
      row.className = 'cleaning-row';
      const kindBadge = maintBadgeHtml(x.type);
      const dateTxt = showDate && x.date ? `<span class="mdate">${x.date}</span>` : '';
      row.innerHTML = `
        <span class="br">${esc(x.branch ? branchLabel(x.branch) : '-')}</span>
        <span class="rm">${esc(x.room.number)}호</span>
        <span class="kind">${kindBadge}${dateTxt}</span>
      `;

      row.title = '해당 지점으로 이동';

        goToBranchRooms(x.branch.id);

      if(x.room.maintenanceMemo){
        entry.appendChild(el('div','cleaning-memo', x.room.maintenanceMemo));
      }
      card.appendChild(entry);
    });
  }
  return card;
}

/* ---------------- custom alert/confirm (샌드박스 iframe에서 window.alert/confirm이
   막히는 경우를 대비해 네이티브 다이얼로그 대신 사용) ---------------- */
function showAlert(message){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  const msg = document.createElement('div');
  msg.className = 'modal-msg';
  msg.style.color = 'var(--st-hold)';
  msg.textContent = message;
  const btnRow = document.createElement('div');
  btnRow.className = 'modal-btn-row';
  const okBtn = document.createElement('button');
  okBtn.className = 'btn primary';
  okBtn.textContent = '확인';
  const close = ()=>{ overlay.remove(); };
  okBtn.onclick = close;
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  btnRow.appendChild(okBtn);
  box.appendChild(msg); box.appendChild(btnRow);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  setTimeout(()=> okBtn.focus(), 0);
}
function showConfirm(message, onConfirm){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  const msg = document.createElement('div');
  msg.className = 'modal-msg';
  msg.textContent = message;
  const btnRow = document.createElement('div');
  btnRow.className = 'modal-btn-row';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn';
  cancelBtn.textContent = '취소';
  const okBtn = document.createElement('button');
  okBtn.className = 'btn danger';
  okBtn.textContent = '확인';
  const close = ()=>{ overlay.remove(); };
  cancelBtn.onclick = close;
  okBtn.onclick = ()=>{ close(); onConfirm(); };
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  btnRow.appendChild(cancelBtn); btnRow.appendChild(okBtn);
  box.appendChild(msg); box.appendChild(btnRow);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  setTimeout(()=> okBtn.focus(), 0);
}

function showExtendChoiceModal(p, room, onApply){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  const close = ()=> overlay.remove();

  function tryApply(newMoveOut, confirmMsg){
    const violation = wouldExceedParking(p, p.moveIn, newMoveOut);
    if(violation){
      showAlert(`"${violation.branch.name}" 지점의 주차 가능 대수(${violation.cap}대)${branchParkingGroupSuffix(violation.branch)}를 초과합니다.\n(현재 이용중 ${violation.others}대 + 이 입실자 1대 = ${violation.projected}대)\n\n차량번호를 비우거나 지점의 주차 가능 대수를 먼저 늘려주세요.`);
      return;
    }
    const apply = ()=>{ close(); onApply(newMoveOut); };
    if(confirmMsg) showConfirm(confirmMsg, apply);
    else apply();
  }

  function renderChoices(){
    box.innerHTML = `<div class="modal-msg" style="margin-bottom:12px;font-weight:700;">${esc(p.name || '이 입실자')} 연장</div>`;
    const btnCol = document.createElement('div');
    btnCol.style.cssText = 'display:flex;flex-direction:column;gap:8px;';

    const oneMonthBtn = document.createElement('button');
    oneMonthBtn.className = 'btn';
    oneMonthBtn.textContent = '한달연장 (퇴실예정일 기준 1개월 뒤)';
    oneMonthBtn.onclick = ()=>{
      const newMoveOut = addOneMonth(p.moveOut || p.moveIn || todayISO());
      tryApply(newMoveOut, `퇴실예정일을 ${newMoveOut}로 연장할까요? (기존 퇴실예정일 기준 1개월 뒤)`);
    };

    const shortBtn = document.createElement('button');
    shortBtn.className = 'btn';
    shortBtn.textContent = '단기연장 (날짜 지정)';
    shortBtn.onclick = renderShortStep;

    btnCol.appendChild(oneMonthBtn); btnCol.appendChild(shortBtn);
    box.appendChild(btnCol);

    const btnRow = document.createElement('div');
    btnRow.className = 'modal-btn-row';
    const closeBtn = document.createElement('button');
    closeBtn.className = 'btn'; closeBtn.textContent = '닫기';
    closeBtn.onclick = close;
    btnRow.appendChild(closeBtn);
    box.appendChild(btnRow);
  }

  function renderShortStep(){
    box.innerHTML = `<div class="modal-msg" style="margin-bottom:12px;font-weight:700;">${esc(p.name || '이 입실자')} 단기연장 - 날짜 지정</div>`;
    const dateInput = document.createElement('input');
    dateInput.type = 'date';
    dateInput.value = p.moveOut || todayISO();
    dateInput.style.width = '100%';
    const dateRow = labeledReq('연장할 퇴실예정일', dateInput);
    dateRow.style.marginBottom = '14px';
    box.appendChild(dateRow);

    const btnRow = document.createElement('div');
    btnRow.className = 'modal-btn-row';
    const backBtn = document.createElement('button');
    backBtn.className = 'btn'; backBtn.textContent = '뒤로';
    backBtn.onclick = renderChoices;
    const okBtn = document.createElement('button');
    okBtn.className = 'btn primary'; okBtn.textContent = '확인';
    okBtn.onclick = ()=>{
      const chosen = dateInput.value;
      if(!chosen){ showAlert('연장할 날짜를 선택해주세요.'); return; }
      tryApply(chosen, null);
    };
    btnRow.appendChild(backBtn); btnRow.appendChild(okBtn);
    box.appendChild(btnRow);
  }

  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  renderChoices();
}

function showLeaveChoiceModal(p, room){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  const close = ()=> overlay.remove();

  function renderChoices(){
    box.innerHTML = `<div class="modal-msg" style="margin-bottom:12px;font-weight:700;">${esc(p.name || '이 입실자')} 퇴실 처리</div>`;
    const btnCol = document.createElement('div');
    btnCol.style.cssText = 'display:flex;flex-direction:column;gap:8px;';

    const expireBtn = document.createElement('button');
    expireBtn.className = 'btn';
    expireBtn.textContent = `만기퇴실 (계약 종료일: ${p.moveOut || '미정'})`;
    expireBtn.title = '계약 종료일 기준으로 퇴실 처리합니다';
    expireBtn.onclick = ()=>{
      if(!p.moveOut){ showAlert('퇴실예정일이 설정되어 있지 않습니다. 먼저 입실자 정보 수정에서 퇴실예정일을 입력해주세요.'); return; }
      showConfirm(`계약기간 종료일(${p.moveOut})로 퇴실 처리할까요?`, ()=>{
        const today = todayISO();
        if(p.moveOut <= today){
          moveResidentToHistory(p, p.moveOut);
        } else {
          p.scheduledToLeave = true;
          if(room && roomWouldBeVacantExcept(room, p.id)) flagUpcomingCleaning(room, p.moveOut, p.id);
          logChange(`${room ? room.number + '호 ' : ''}"${p.name}" 만기퇴실 예약 (${p.moveOut})`);
        }
        scheduleSave();
        close(); render();
      });
    };

    const midBtn = document.createElement('button');
    midBtn.className = 'btn';
    midBtn.textContent = '중도퇴실 (날짜 지정)';
    midBtn.onclick = renderMidTermStep;

    const sameDayBtn = document.createElement('button');
    sameDayBtn.className = 'btn danger';
    sameDayBtn.textContent = '당일퇴실 (오늘 날짜로 즉시 처리)';
    sameDayBtn.onclick = ()=>{
      const today = todayISO();
      showConfirm(`${p.name || '이 입실자'}를 오늘(${today}) 날짜로 퇴실 처리할까요?\n정보는 히스토리로 이동되고, 이 자리에 새 입실자를 등록할 수 있게 됩니다.`, ()=>{
        moveResidentToHistory(p, today);
        scheduleSave();
        close(); render();
      });
    };

    btnCol.appendChild(expireBtn); btnCol.appendChild(midBtn); btnCol.appendChild(sameDayBtn);
    box.appendChild(btnCol);

    const btnRow = document.createElement('div');
    btnRow.className = 'modal-btn-row';
    const closeBtn = document.createElement('button');
    closeBtn.className = 'btn'; closeBtn.textContent = '닫기';
    closeBtn.onclick = close;
    btnRow.appendChild(closeBtn);
    box.appendChild(btnRow);
  }

  function renderMidTermStep(){
    box.innerHTML = `<div class="modal-msg" style="margin-bottom:12px;font-weight:700;">${esc(p.name || '이 입실자')} 중도퇴실 - 날짜 지정</div>`;
    const dateInput = document.createElement('input');
    dateInput.type = 'date';
    dateInput.value = p.moveOut || todayISO();
    dateInput.style.width = '100%';
    const dateRow = labeledReq('퇴실 날짜', dateInput);
    dateRow.style.marginBottom = '14px';
    box.appendChild(dateRow);

    const btnRow = document.createElement('div');
    btnRow.className = 'modal-btn-row';
    const backBtn = document.createElement('button');
    backBtn.className = 'btn'; backBtn.textContent = '뒤로';
    backBtn.onclick = renderChoices;
    const okBtn = document.createElement('button');
    okBtn.className = 'btn primary'; okBtn.textContent = '확인';
    okBtn.onclick = ()=>{
      const chosen = dateInput.value;
      if(!chosen){ showAlert('퇴실 날짜를 선택해주세요.'); return; }
      const today = todayISO();
      if(chosen > today){
        p.moveOut = chosen;
        p.scheduledToLeave = true;
        if(room && roomWouldBeVacantExcept(room, p.id)) flagUpcomingCleaning(room, chosen, p.id);
        logChange(`${room ? room.number + '호 ' : ''}"${p.name}" 중도퇴실 예약 (${chosen})`);
        scheduleSave();
        close(); render();
      } else {
        showConfirm(`${p.name || '이 입실자'}를 ${chosen} 날짜로 퇴실 처리할까요?\n정보는 히스토리로 이동되고, 이 자리에 새 입실자를 등록할 수 있게 됩니다.`, ()=>{
          moveResidentToHistory(p, chosen);
          scheduleSave();
          close(); render();
        });
      }
    };
    btnRow.appendChild(backBtn); btnRow.appendChild(okBtn);
    box.appendChild(btnRow);
  }

  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  renderChoices();
}

function showRoomMoveModal(p, room){
  const branch = room ? DB.branches.find(b=>b.id===room.branchId) : null;
  const candidates = (branch ? DB.rooms.filter(r=> r.branchId===branch.id && r.id!==room.id && !roomHasActiveResident(r)) : [])
    .sort((a,b)=> a.number.localeCompare(b.number,'ko',{numeric:true}));

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  const close = ()=> overlay.remove();

  box.innerHTML = `<div class="modal-msg" style="margin-bottom:12px;font-weight:700;">${esc(p.name || '이 입실자')} 방이동</div>`;

  const btnRow = document.createElement('div');
  btnRow.className = 'modal-btn-row';

  if(candidates.length===0){
    box.appendChild(el('div','cleaning-empty','같은 지점에 이동 가능한(입실자가 없는) 방이 없습니다.'));
    const closeBtn = document.createElement('button');
    closeBtn.className = 'btn'; closeBtn.textContent = '닫기';
    closeBtn.onclick = close;
    btnRow.appendChild(closeBtn);
    box.appendChild(btnRow);
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    return;
  }

  const roomSel = document.createElement('select');
  roomSel.style.width = '100%';
  candidates.forEach(r=>{
    const o = document.createElement('option');
    o.value = r.id;
    o.textContent = `${r.number}호 (${r.type})`;
    roomSel.appendChild(o);
  });
  const roomRow = labeledReq('이동할 방', roomSel);
  roomRow.style.marginBottom = '12px';
  box.appendChild(roomRow);

  const dateInput = document.createElement('input');
  dateInput.type = 'date';
  dateInput.value = todayISO();
  dateInput.style.width = '100%';
  const dateRow = labeledReq('이동 날짜', dateInput);
  dateRow.style.marginBottom = '14px';
  box.appendChild(dateRow);

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn'; cancelBtn.textContent = '취소';
  cancelBtn.onclick = close;
  const okBtn = document.createElement('button');
  okBtn.className = 'btn primary'; okBtn.textContent = '확인';
  okBtn.onclick = ()=>{
    const toRoom = DB.rooms.find(r=>r.id===roomSel.value);
    const moveDate = dateInput.value;
    if(!toRoom || !moveDate){ showAlert('이동할 방과 날짜를 선택해주세요.'); return; }
    const today = todayISO();
    const carryCount = contractsToCarry(room.id, personNameKeys(p), p.sourceContractId, p.moveIn).length;
    if(moveDate > today){
      showConfirm(`${moveDate}에 ${room.number}호 → ${toRoom.number}호로 방이동 예정 등록할까요?${carryCount ? `\n이동일에 이 사람의 계약 이력도 함께 옮깁니다(지금 기준 ${carryCount}건).` : ''}`, ()=>{
        p.pendingRoomMove = { toRoomId: toRoom.id, date: moveDate };
        logChange(`${room.number}호 → ${toRoom.number}호 방이동 예약 (${moveDate}) - "${p.name}"`);
        scheduleSave();
        close(); render();
      });
    } else {
      showConfirm(`${room.number}호 → ${toRoom.number}호로 지금 방이동 처리할까요?${carryCount ? `\n이 사람의 계약 이력 ${carryCount}건도 ${toRoom.number}호로 옮깁니다.` : ''}`, ()=>{
        executeRoomMove(p, room, toRoom, moveDate);
        scheduleSave();
        close(); render();
      });
    }
  };
  btnRow.appendChild(cancelBtn); btnRow.appendChild(okBtn);
  box.appendChild(btnRow);

  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

function executeRoomMove(p, fromRoom, toRoom, moveDate){
  moveResidentToHistory(p, moveDate);
  const carriedMoveOut = (p.moveOut && p.moveOut > moveDate) ? p.moveOut : '';
  // 방이동은 새 방으로 자리만 옮기는 것일 뿐 다른 사람이 되는 게 아니므로, 대리결제·메모(색상/굵기
  // 포함)·2인 거주 등 기존 입실자의 모든 정보를 그대로 들고 가야 한다. 예전에는 옮길 필드를
  // 하나씩 나열해서 복사했는데, 그 목록에 없는 필드(대리결제 관련 정보 등)는 이동할 때마다
  // 누락되어 사라지는 문제가 있었다. 기존 객체를 통째로 복사한 뒤, 새 방/기간에 맞춰 바뀌어야
  // 하는 필드만 덮어쓴다.
  const newP = Object.assign({}, p, {
    id: uid('p'), roomId: toRoom.id, resStatus:'', contractType:'이동',
    moveIn: moveDate, moveOut: carriedMoveOut, originalMoveIn: moveDate, scheduledToLeave:false,
    firstSaveDone:true, slotIndex:0
  });
  newP.resStatus = computeResStatus(newP);
  DB.residents.push(newP);
  // 그 사람의 계약 이력도 새 방으로 옮긴다(contractsToCarry·moveContractsToRoom 참고).
  const names = personNameKeys(p);
  const carried = moveContractsToRoom(contractsToCarry(fromRoom.id, names, p.sourceContractId, p.moveIn), toRoom.id, moveDate, names);
  logChange(`${fromRoom.number}호 → ${toRoom.number}호 방이동 처리 ("${p.name}")${carried ? ` · 계약 ${carried}건 함께 이동` : ''}`);
}

function processPendingRoomMoves(){
  const today = todayISO();
  const due = DB.residents.filter(p => p.pendingRoomMove && p.pendingRoomMove.date <= today);
  if(due.length===0) return;
  due.forEach(p=>{
    const fromRoom = DB.rooms.find(r=>r.id===p.roomId);
    const toRoom = DB.rooms.find(r=>r.id===p.pendingRoomMove.toRoomId);
    if(!fromRoom || !toRoom){ delete p.pendingRoomMove; return; }
    if(roomHasActiveResident(toRoom)) return; // 대상 방이 그 사이 다시 채워졌으면 보류
    const moveDate = p.pendingRoomMove.date;
    delete p.pendingRoomMove;
    executeRoomMove(p, fromRoom, toRoom, moveDate);
  });
  scheduleSave();
}

function esc(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function initApp(user){
  CURRENT_USER = { uid: user.uid, email: user.email };
  lastSeenLocalDate = localDateKey();
  idleLoggedOut = false;
  indexEmail(user.email); // 기존 계정(이 색인 기능 도입 이전 가입)도 로그인 시 자동으로 채워 넣습니다.

  let roleDoc;
  try{
    roleDoc = await USERS_COL.doc(user.uid).get();
  }catch(e){
    console.error('사용자 권한 조회 실패:', e);
    showAlert('사용자 정보를 불러오지 못했습니다. 네트워크를 확인하거나 관리자에게 문의해주세요.');
    firebase.auth().signOut();
    return;
  }

  if(!roleDoc.exists){
    // 이전 방식으로 만든 계정 등, users 문서가 없는 경우 안전하게 대기 상태로 생성
    await USERS_COL.doc(user.uid).set({ email: user.email, role:'pending', createdAt: new Date().toISOString() });
    USER_ROLE = 'pending';
  } else {
    const roleData = roleDoc.data();
    USER_ROLE = roleData.role || 'pending';
    USER_BRANCH_SCOPE = roleData.branchScope || 'all';
    USER_BRANCH_IDS = Array.isArray(roleData.branchIds) ? roleData.branchIds : null;
  }

  if(USER_ROLE === 'pending'){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'none';
    document.getElementById('pendingScreen').style.display = 'flex';
    return;
  }

  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('pendingScreen').style.display = 'none';
  document.getElementById('app').style.display = '';
  const roleLabel = { viewer:'조회 전용', editor:'수정 가능', superadmin:'슈퍼어드민' }[USER_ROLE] || USER_ROLE;
  const loggedInAs = document.getElementById('loggedInAs');
  if(loggedInAs) loggedInAs.textContent = `${user.email} (${roleLabel})`;

  DB = await loadState();
  // 과거 버전에서 "완료" 없이 새로고침 등으로 남겨졌을 수 있는 미확정 입실자(이름 미입력 등) 정리
  const beforeCount = DB.residents.length;
  DB.residents = DB.residents.filter(p => p.firstSaveDone !== false);
  if(canEdit() && DB.residents.length !== beforeCount) scheduleSave();
  applyLoadedCore(DB);
  if(canEdit() && forSaleMigratedCount) scheduleSave();   // 판매중 플래그 이전 결과를 한 번 저장
  // 방 가격 원장도 별도 문서라 따로 읽는다(연장 계산기와 공유하는 값).
  await loadRoomPrices();
  if(canEdit()) processScheduledLeaves();
  if(canEdit()) processPendingRoomMoves();
  if(canEdit()) autoFlagDueRetouch();
  if(canEdit()) clearCleaningFlagsOnMoveIn();
  if(canEdit()) clearCleaningFlagsForExcludedBranches();
  let statusFixed = false;
  DB.rooms.forEach(room=>{
    if(!roomHasActiveResident(room) && !STATUS_LIST_MANUAL.includes(room.saleStatus)){
      room.saleStatus = '공실';
      statusFixed = true;
    }
  });
  if(canEdit() && statusFixed) scheduleSave();
  let roomTypesFilled = false;
  DB.branches.forEach(branch=>{
    if(!branch.roomTypes || !branch.roomTypes.length){
      // 기존 타입별가격에 저장된 타입과, 엑셀 일괄업로드 등으로 이미 호실에 쓰이고 있는
      // 타입 값을 모두 합쳐서 초기 목록으로 삼는다. (호실 타입은 고정 목록이 아니라
      // 지점마다 자유롭게 추가/삭제 가능 — 여기서 없던 타입이 나중에 발견되면 그냥 놓치고
      // 있었던 것이므로, 최초 1회에 한해 실제 사용 이력에서 복구한다)
      const fromPrices = branch.typePrices ? Object.keys(branch.typePrices) : [];
      const fromRooms = DB.rooms.filter(r=>r.branchId===branch.id).map(r=>r.type).filter(Boolean);
      branch.roomTypes = Array.from(new Set([...ROOM_TYPE_LIST, ...fromPrices, ...fromRooms]));
      roomTypesFilled = true;
    }
  });
  if(canEdit() && roomTypesFilled) scheduleSave();
  // 로그인 직후 자동 처리(자동 퇴실·방이동·청소/리터치 지정·해제·상태 정리)로 바뀐 값은 "자동"으로 기록한다.
  if(canEdit()) captureEdits(EDIT_BY_AUTO);
  // 방 가격은 이 대시보드에서 관리하지 않으므로 typePrices 기본값을 채우지 않는다.
  // 이미 저장된 값은 그대로 두고, 엑셀 일괄 업데이트에서만 계속 다룬다.
  if(canEdit()) maybeCreateDailyBackup();
  UI.branchId = allowedBranches()[0] ? allowedBranches()[0].id : null;
  if(USER_ROLE === 'editor') UI.view = 'branch'; // 수정 권한 계정은 전체 통계 대신 지점 대시보드로 바로 진입
  // 조회 전용(viewer) 계정과 슈퍼어드민은 기본값인 전체 통계 대시보드로 진입
  render();
  document.getElementById('savedNote').textContent = '자동 저장됨 · 이 대시보드를 사용하는 모든 사람에게 공유됩니다';

  if(isSuperAdmin()) checkPendingRequests();

  // 관제센터 특성상 여러 명이 각자 다른 탭/PC에서 동시에 이 대시보드를 켜두고 편집하는 일이
  // 잦다. 로그인 시 한 번만 불러오고 저장 시에만 충돌을 감지하던 기존 방식으로는, 누군가
  // 저장한 뒤 새로고침하기 전까지는 여전히 화면에 오래된 데이터가 보이고 있었다(그 상태에서
  // 다시 저장하면 최신 데이터가 사라질 위험도 있었음). 그래서 이 상태 문서를 실시간으로
  // 구독해서, 다른 곳에서 저장이 일어나는 즉시 이 탭의 화면에도 반영한다.
  if(firestoreUnsubscribe) firestoreUnsubscribe();
  firestoreUnsubscribe = FIRESTORE_DOC.onSnapshot(snap=>{
    if(!CURRENT_USER) return;
    if(snap.metadata.hasPendingWrites) return; // 이 탭 자신이 방금 쓴 낙관적 반영이면 무시
    if(!snap.exists) return;
    const data = snap.data();
    if(!data || !data.json || data.updatedAt === lastKnownUpdatedAt) return; // 이미 반영된 내용
    let parsed;
    try{ parsed = JSON.parse(data.json); }catch(e){ console.error('실시간 동기화 데이터 파싱 실패:', e); return; }
    if(anyEditInProgress()){
      // 지금 뭔가 편집 중이면 화면을 다시 그리지 않고 대기시킨다 — 다음 render()에서 반영됨
      pendingRemoteApply = { parsed, updatedAt: data.updatedAt };
      return;
    }
    applyLoadedCore(parsed);
    lastKnownUpdatedAt = data.updatedAt;
    render();
  }, err=> console.error('실시간 동기화 구독 실패:', err));

  // 방 가격 원장도 실시간으로 받는다. 시작할 때 한 번만 읽으면, 누군가 가격표를 올려도 켜둔
  // 다른 탭·PC의 방 카드에는 새로고침 전까지 가격이 뜨지 않는다. 문서 하나라 구독 비용은
  // 연결할 때 1회 + 가격표가 바뀔 때마다 1회뿐이다.
  if(roomPricesUnsubscribe) roomPricesUnsubscribe();
  roomPricesUnsubscribe = ROOM_PRICES_DOC.onSnapshot(applyRoomPricesSnapshot,
    err=> console.error('방 가격 실시간 구독 실패:', err));

  // 계약(DB.contracts)은 별도 컬렉션이라 위 구독의 대상이 아니다. 컬렉션 전체를 구독하면
  // 로그인마다 전체를 다시 읽어 무료 요금제 일일 읽기 한도를 넘긴 적이 있어(efb106e →
  // 4676cab에서 롤백) "지금 내가 가진 것보다 등록 시각(importedAt)이 늦은 것만" 구독한다.
  // 방금 loadState()에서 읽어온(캐시일 수도 있는) DB.contracts 중 가장 늦은 importedAt을
  // 기준으로 잡으면, 로그인 시점에 이미 그만큼은 갖고 있으므로 구독 시작 비용이 사실상
  // 0에 가깝고(새로 생긴 게 없으면 빈 결과), 로컬 캐시가 오래돼 있었어도 그 사이 다른
  // 계정이 추가·수정한 계약이 있으면 구독을 시작하는 즉시 받아온다. 삭제는 이 방식으로는
  // 못 잡는다(사라진 문서는 "더 새로운 문서"가 아니다) — 다음 로그인/새로고침 때 정리된다.
  const contractsCutoff = DB.contracts.reduce((max,c)=> (c.importedAt||'') > max ? c.importedAt : max, '');
  if(contractsUnsubscribe) contractsUnsubscribe();
  contractsUnsubscribe = CONTRACTS_COL.where('importedAt','>',contractsCutoff).onSnapshot(snap=>{
    if(!CURRENT_USER) return;
    if(snap.metadata.hasPendingWrites) return; // 이 탭 자신이 방금 쓴 낙관적 반영이면 무시
    const changed = snap.docChanges()
      .filter(dc=> dc.type==='added' || dc.type==='modified')
      .map(dc=> dc.doc.data());
    if(changed.length===0) return;
    if(anyEditInProgress()){
      pendingContractUpserts.push(...changed);
      return;
    }
    changed.forEach(doc=>{
      const idx = DB.contracts.findIndex(c=>c.id===doc.id);
      if(idx>=0) DB.contracts[idx] = doc; else DB.contracts.push(doc);
    });
    refreshContractsCache();
    render();
  }, err=> console.error('계약 실시간 동기화 구독 실패:', err));

  // 퇴실 이력도 계약과 완전히 같은 방식으로 구독한다. 커서(movedAt)가 없는 예전 문서는 이
  // 쿼리에 아예 걸리지 않으므로(정렬 필드가 없는 문서는 제외된다) 구독을 시작해도 예전 이력을
  // 통째로 다시 읽지 않는다 — 무료 요금제 읽기 한도를 넘겼던 "컬렉션 전체 구독"과 다른 점이다.
  const historyCutoff = DB.residentHistory.reduce((max,h)=> (h.movedAt||'') > max ? h.movedAt : max, '');
  if(historyUnsubscribe) historyUnsubscribe();
  historyUnsubscribe = RESIDENT_HISTORY_COL.where('movedAt','>',historyCutoff).onSnapshot(snap=>{
    if(!CURRENT_USER) return;
    if(snap.metadata.hasPendingWrites) return; // 이 탭 자신이 방금 쓴 낙관적 반영이면 무시
    const changed = snap.docChanges()
      .filter(dc=> dc.type==='added' || dc.type==='modified')
      .map(dc=> dc.doc.data());
    if(changed.length===0) return;
    if(anyEditInProgress()){
      pendingHistoryUpserts.push(...changed);
      return;
    }
    changed.forEach(doc=>{
      const idx = DB.residentHistory.findIndex(h=>h.id===doc.id);
      if(idx>=0) DB.residentHistory[idx] = doc; else DB.residentHistory.push(doc);
    });
    refreshHistoryCache();
    render();
  }, err=> console.error('퇴실 이력 실시간 동기화 구독 실패:', err));
}

async function checkPendingRequests(){
  try{
    const snap = await USERS_COL.where('role','==','pending').get();
    if(snap.empty) return;
    showAlert(`승인 대기 중인 계정 요청이 ${snap.size}건 있습니다.\n"관리자 설정" 화면의 "사용자 관리"에서 확인해주세요.`);
  }catch(e){ console.error('승인 대기 확인 실패:', e); }
}

    });
});

function showRequestAccountModal(prefillEmail){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  box.innerHTML = `
    <div class="modal-msg" style="margin-bottom:12px;font-weight:700;">계정 요청</div>
    <div style="font-size:12px;color:var(--ink-soft);margin-bottom:12px;">
      가입 즉시 사용은 불가하며, 관리자 승인 후 로그인할 수 있습니다.
    </div>
    <label class="field-label">이메일</label>
    <input type="email" id="reqEmail" style="width:100%;margin-bottom:10px;" value="${esc(prefillEmail||'')}">
    <label class="field-label">비밀번호 (6자 이상)</label>
    <input type="password" id="reqPw" style="width:100%;margin-bottom:10px;">
    <label class="field-label">비밀번호 확인</label>
    <input type="password" id="reqPw2" style="width:100%;margin-bottom:10px;">
    <label class="field-label">이름</label>
    <input type="text" id="reqName" style="width:100%;margin-bottom:10px;">
    <label class="field-label">연락처</label>
    <input type="tel" id="reqPhone" placeholder="010-0000-0000" style="width:100%;margin-bottom:10px;">
    <label class="field-label">희망 권한</label>
    <select id="reqRole" style="width:100%;">
      <option value="viewer">조회 전용</option>
      <option value="editor">수정 가능</option>
    </select>
    <div class="login-error" id="reqError"></div>
  `;
  const btnRow = document.createElement('div');
  btnRow.className = 'modal-btn-row';
  btnRow.style.marginTop = '14px';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn'; cancelBtn.textContent = '취소';
  cancelBtn.onclick = ()=> overlay.remove();
  const okBtn = document.createElement('button');
  okBtn.className = 'btn primary'; okBtn.textContent = '계정 요청';
  okBtn.onclick = ()=>{
    const email = document.getElementById('reqEmail').value.trim();
    const pw = document.getElementById('reqPw').value;
    const pw2 = document.getElementById('reqPw2').value;
    const name = document.getElementById('reqName').value.trim();
    const phone = document.getElementById('reqPhone').value.trim();
    const requestedRole = document.getElementById('reqRole').value;
    const err = document.getElementById('reqError');
    err.style.color = 'var(--st-hold)';
    if(!email || !pw || !pw2 || !name || !phone){ err.textContent = '모든 항목을 입력해주세요.'; return; }
    if(pw.length < 6){ err.textContent = '비밀번호는 6자 이상이어야 합니다.'; return; }
    if(pw !== pw2){ err.textContent = '비밀번호가 서로 일치하지 않습니다.'; return; }
    suppressAuthHandling = true;
    firebase.auth().createUserWithEmailAndPassword(email, pw)
      .then(cred=> USERS_COL.doc(cred.user.uid).set({ email, role:'pending', requestedRole, name, phone, createdAt: new Date().toISOString() })
        .then(()=> indexEmail(email))
        .then(()=> firebase.auth().signOut()))
      .then(()=>{
        suppressAuthHandling = false;
        overlay.remove();
        showLoginScreen();
        showAlert('계정 요청이 접수되었습니다. 관리자 승인 후 로그인해주세요.');
      })
      .catch(e=>{
        suppressAuthHandling = false;
        const map = {
          'auth/email-already-in-use': '이미 등록된 이메일입니다.',
          'auth/invalid-email': '이메일 형식이 올바르지 않습니다.',
          'auth/weak-password': '비밀번호가 너무 약합니다.'
        };
        err.textContent = map[e.code] || ('오류: ' + e.message);
      });
  };
  btnRow.appendChild(cancelBtn); btnRow.appendChild(okBtn);
  box.appendChild(btnRow);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}
document.getElementById('forgotPwLink').addEventListener('click', (e)=>{
  e.preventDefault();
  const errBox = document.getElementById('loginError');
  const email = document.getElementById('loginEmail').value.trim();
  if(!email){ errBox.style.color = 'var(--st-hold)'; errBox.textContent = '먼저 이메일을 입력한 뒤 눌러주세요.'; return; }
  errBox.style.color = 'var(--ink-soft)';
  errBox.textContent = '계정 확인 중…';
  // Firebase의 "이메일 열거 보호"가 켜져 있으면 sendPasswordResetEmail이 존재하지 않는
  // 이메일에도 에러 없이 성공 처리되어(메일은 실제로 발송되지 않음) 혼란을 줍니다.
  // 그래서 자체 emailIndex 컬렉션으로 가입 여부를 먼저 확인합니다.
  EMAIL_INDEX_COL.doc(normalizeEmailKey(email)).get().then(snap=>{
    if(!snap.exists){
      errBox.style.color = 'var(--st-hold)';
      errBox.textContent = `등록되지 않은 이메일입니다. 먼저 "계정 요청"으로 사용 신청을 해주세요.`;
      showRequestAccountModal(email);
      return;
    }
    return firebase.auth().sendPasswordResetEmail(email).then(()=>{
      errBox.style.color = 'var(--st-occupied)';
      errBox.textContent = `${email} 주소로 비밀번호 재설정 메일을 보냈어요. 메일함(스팸함 포함)을 확인해주세요.`;
    }).catch(err=>{
      errBox.style.color = 'var(--st-hold)';
      errBox.textContent = '오류: ' + err.message;
    });
  }).catch(err=>{
    errBox.style.color = 'var(--st-hold)';
    errBox.textContent = '계정 확인 중 오류가 발생했습니다: ' + err.message;
  });
});

function showChangePasswordModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  box.innerHTML = `
    <div class="modal-msg" style="margin-bottom:12px;font-weight:700;">비밀번호 변경</div>
    <label class="field-label">현재 비밀번호</label>
    <input type="password" id="curPw" style="width:100%;margin-bottom:10px;">
    <label class="field-label">새 비밀번호 (6자 이상)</label>
    <input type="password" id="newPw" style="width:100%;margin-bottom:10px;">
    <label class="field-label">새 비밀번호 확인</label>
    <input type="password" id="newPw2" style="width:100%;">
    <div class="login-error" id="pwChangeError"></div>
  `;
  const btnRow = document.createElement('div');
  btnRow.className = 'modal-btn-row';
  btnRow.style.marginTop = '14px';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn'; cancelBtn.textContent = '취소';
  cancelBtn.onclick = ()=> overlay.remove();
  const okBtn = document.createElement('button');
  okBtn.className = 'btn primary'; okBtn.textContent = '변경';
  okBtn.onclick = ()=>{
    const curPw = document.getElementById('curPw').value;
    const newPw = document.getElementById('newPw').value;
    const newPw2 = document.getElementById('newPw2').value;
    const err = document.getElementById('pwChangeError');
    err.style.color = 'var(--st-hold)';
    if(!curPw || !newPw || !newPw2){ err.textContent = '모든 항목을 입력해주세요.'; return; }
    if(newPw.length < 6){ err.textContent = '새 비밀번호는 6자 이상이어야 합니다.'; return; }
    if(newPw !== newPw2){ err.textContent = '새 비밀번호가 서로 일치하지 않습니다.'; return; }
    const user = firebase.auth().currentUser;
    const cred = firebase.auth.EmailAuthProvider.credential(user.email, curPw);
    user.reauthenticateWithCredential(cred)
      .then(()=> user.updatePassword(newPw))
      .then(()=>{
        overlay.remove();
        showAlert('비밀번호가 변경되었습니다. 다음 로그인부터 새 비밀번호를 사용해주세요.');
      })
      .catch(e=>{
        err.textContent = e.code === 'auth/wrong-password' ? '현재 비밀번호가 올바르지 않습니다.' : ('오류: ' + e.message);
      });
  };
  btnRow.appendChild(cancelBtn); btnRow.appendChild(okBtn);
  box.appendChild(btnRow);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

/* ---------------- 새 버전 확인 ----------------
   관제센터 탭은 며칠씩 켜져 있고, 자정 세션 초기화도 예전엔 로그아웃만 해서 페이지(코드)는 그대로 남았다. 그래서 새 기능이
   배포돼도 오래된 탭은 옛 코드로 계속 저장했다(수정 이력 배포 뒤 "연장했는데 수정이력이 없다"는 제보, 2026-09-16).
   30분마다, 그리고 탭을 다시 볼 때 배포된 페이지의 APP_BUILD를 읽어 다르면 화면 아래에 새로고침 안내를 띄운다. 탭이 안
   보이고 편집·저장 중이 아니면 바로 새로고침한다. 같은 사이트의 HTML을 읽는 것이라 Firestore 읽기 한도와 무관하다.
   APP_BUILD는 "날짜-글자" 형식을 지켜야 한다(아래 정규식이 그 형식만 읽는다 — 이 주석·정규식 자체와 헷갈리지 않게). */
const BUILD_CHECK_INTERVAL_MS = 30 * 60 * 1000;
let newerBuildSeen = '';
let lastBuildCheckAt = 0;
function canReloadQuietly(){
  return document.hidden && !anyEditInProgress() && !document.querySelector('.modal-overlay');
}
function checkForNewBuild(){
  if(!/^https?:$/.test(location.protocol)) return;
  if(Date.now() - lastBuildCheckAt < 60 * 1000) return;
  lastBuildCheckAt = Date.now();
  return fetch(location.pathname + '?build-check=' + Date.now(), { cache: 'no-store' })
    .then(r=> r.ok ? r.text() : '')
    .then(text=>{
      const m = /const APP_BUILD = '(\d{4}-\d{2}-\d{2}-[a-z0-9]+)'/.exec(text || '');
      if(!m || m[1] === APP_BUILD) return;
      newerBuildSeen = m[1];
      if(canReloadQuietly()){ location.reload(); return; }
      showNewBuildBanner();
    })
    .catch(e=> console.warn('새 버전 확인 실패:', e));
}
function showNewBuildBanner(){
  if(document.getElementById('newBuildBanner')) return;
  const bar = document.createElement('div');
  bar.id = 'newBuildBanner';
  bar.className = 'new-build-banner';
  const msg = document.createElement('span');
  msg.textContent = '대시보드가 업데이트되었습니다. 새로고침하면 새 버전으로 바뀝니다.';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'btn small primary';
  btn.textContent = '지금 새로고침';
  btn.onclick = ()=>{
    if(anyEditInProgress()) showConfirm('편집 중이거나 저장 중인 내용이 있습니다. 새로고침하면 저장되지 않은 내용은 사라집니다. 그래도 새로고침할까요?', ()=> location.reload());
    else location.reload();
  };
  bar.appendChild(msg);
  bar.appendChild(btn);
  document.body.appendChild(bar);
}
setInterval(checkForNewBuild, BUILD_CHECK_INTERVAL_MS);
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible') checkForNewBuild();
  else if(newerBuildSeen && canReloadQuietly()) location.reload();
});
/* ---- 새 버전 확인 끝 ---- */

// 관제센터 특성상 PC를 끄지 않고 탭을 며칠씩 열어두는 경우가 많다. 예전에는 그렇게 오래 열린
// 세션이 로그인 시점의(=시간이 지날수록 오래된) 데이터를 계속 들고 있다가 저장 시 다른 곳의
// 변경사항을 되돌릴 위험이 있어 유휴 시간 기준으로 주기적으로 로그아웃시켰는데, 지금은 실시간
// 동기화(onSnapshot)가 열려 있는 모든 탭의 데이터를 계속 최신으로 유지해주므로 그 목적은 이미
// 해결되었다. 그런데 재로그인마다 계약/이력 등을 다시 불러오는 비용도 있어(Firestore 무료
// 요금제 일일 읽기 한도 문제, 관련 캐시 도입 참고) 너무 자주 재로그인시키는 건 오히려 손해다.
// 그래서 유휴 시간이 아니라 "날짜가 바뀌는 시점(자정)"에만 하루 한 번 세션을 초기화한다.
// 예전에는 todayISO()가 UTC 기준이라 하루가 한국시간 오전 9시에 바뀌어서 여기서만 따로 브라우저
// 로컬 날짜를 계산했지만, 지금은 todayISO() 자체가 한국시간 기준이라 그대로 쓰면 된다.
function localDateKey(){ return todayISO(); }
let lastSeenLocalDate = localDateKey();
const SESSION_RESET_NOTICE_KEY = 'dashboardSessionResetNotice';
let idleLoggedOut = false;
function checkDailySessionReset(){
  if(!CURRENT_USER || idleLoggedOut) return;
  const today = localDateKey();
  if(today === lastSeenLocalDate) return;
  lastSeenLocalDate = today;
  idleLoggedOut = true;
  // 로그아웃만 하면 페이지(코드)는 그대로라 며칠 전 코드가 계속 돈다 — 새로고침까지 해서 그날 배포된 코드로 다시 시작한다.
  firebase.auth().signOut().then(()=>{
    try{ sessionStorage.setItem(SESSION_RESET_NOTICE_KEY, '1'); }catch(e){ /* 저장소를 못 쓰면 안내만 빠진다 */ }
    location.reload();
  });
}
setInterval(checkDailySessionReset, 60*1000);
// 백그라운드 탭에는 타이머 정확도가 떨어질 수 있으므로, 다시 화면을 보는 순간(visible로 전환)
// 바로 한 번 더 확인한다.
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') checkDailySessionReset(); });
try{
  if(sessionStorage.getItem(SESSION_RESET_NOTICE_KEY)){
    sessionStorage.removeItem(SESSION_RESET_NOTICE_KEY);
    showAlert('날짜가 바뀌어 세션이 초기화되었습니다(새 버전으로 새로고침됨). 다시 로그인해주세요.');
  }
}catch(e){ /* 저장소를 못 쓰는 환경 */ }
</script>
