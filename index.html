<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONTHLIV 운영 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F4EE;
    --panel:#FFFFFF;
    --ink:#1E2A32;
    --ink-soft:#5B6B72;
    --line:#E1DCCF;
    --accent:#10767A;
    --accent-ink:#0B5457;
    --accent-soft:#E1F1F1;

    --st-all:#4B5563;      --st-all-bg:#E9EAEC;
    --st-vacant:#8B96A0;   --st-vacant-bg:#EEF0F2;
    --st-forsale:#2F6FED;  --st-forsale-bg:#E8EFFD;
    --st-occupied:#10767A; --st-occupied-bg:#E1F1F1;
    --st-confirmed:#3B7A9E; --st-confirmed-bg:#E5F1F7;
    --st-leaving:#C98A2C;  --st-leaving-bg:#FBF0DD;
    --st-hold:#C0473F;     --st-hold-bg:#FBE7E5;
    --st-presell:#6C5FC7;  --st-presell-bg:#EDEBFA;
    --st-shortsale:#C2478B; --st-shortsale-bg:#FBE7F1;
    --st-proxy:#2E8B57;    --st-proxy-bg:#E4F3EA;
    --st-reserved:#A67C00; --st-reserved-bg:#FBF0D6;
    --st-imported:#1789A6; --st-imported-bg:#E1F4F8;
    --st-double:#8A56C7;   --st-double-bg:#F0E9FA;

    --ch-indep:#5B4FCF; --ch-33m2:#B5459A; --ch-liveany:#D6673E; --ch-etc:#7A8790;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Noto Sans KR', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size:14px; line-height:1.5;
  }
  .mono{ font-family:'JetBrains Mono', ui-monospace, monospace; }
  #app{ max-width:1320px; margin:0 auto; padding:0 20px 60px; }
  header.top{ position:sticky; top:0; z-index:20; background:var(--paper); padding:20px 0 16px; border-bottom:1px solid var(--line); }
  .brand{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:16px; }
  .brand h1{ font-size:20px; font-weight:800; letter-spacing:-0.02em; margin:0; }
  .brand h1 .tag{
    display:inline-block; margin-left:10px; font-family:'JetBrains Mono',monospace;
    font-size:11px; font-weight:600; color:var(--accent-ink);
    background:var(--accent-soft); padding:2px 8px; border-radius:20px; vertical-align:middle;
  }
  .brand .sub{ font-size:12px; color:var(--ink-soft); }
  .home-link{ cursor:pointer; display:flex; align-items:center; }
  .home-link:hover{ color:var(--accent-ink); }
  .home-icon{ font-size:20px; margin-right:8px; line-height:1; }

  .nav-row{ display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
  .branch-picker{ display:flex; align-items:center; gap:8px; }
  .branch-picker select{
    font-family:inherit; font-weight:700; font-size:14px; padding:9px 34px 9px 12px;
    border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink);
    -webkit-appearance:none; appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%235B6B72'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center;
  }
  .header-search{ position:relative; flex:1 1 260px; max-width:360px; }
  .header-search input{
    width:100%; padding:9px 12px; font-family:inherit; font-size:13px;
    border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink);
  }
  .header-search input:focus{ outline:none; border-color:var(--accent); }
  .header-search-results{
    position:absolute; top:calc(100% + 6px); left:0; right:0; background:#fff;
    border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.12);
    max-height:360px; overflow-y:auto; z-index:30;
  }
  .header-search-item{ display:flex; flex-direction:column; gap:2px; padding:9px 12px; cursor:pointer; border-bottom:1px solid var(--line); }
  .header-search-item:last-child{ border-bottom:none; }
  .header-search-item:hover{ background:var(--paper); }
  .header-search-item .hs-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13px; font-weight:700; }
  .header-search-item .hs-sub{ font-size:11.5px; color:var(--ink-soft); }
  .header-search-empty{ padding:12px; font-size:12.5px; color:var(--ink-soft); text-align:center; }
  .btn{
    font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer;
    border-radius:8px; padding:7px 12px; border:1px solid var(--line); background:var(--panel); color:var(--ink);
  }
  .btn:hover{ border-color:var(--accent); color:var(--accent-ink); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ background:var(--accent-ink); border-color:var(--accent-ink); color:#fff; }
  .btn.pill{ border-radius:999px; }
  .btn.danger{ color:var(--st-hold); }
  .btn.danger:hover{ border-color:var(--st-hold); color:var(--st-hold); }
  .btn.small{ padding:4px 9px; font-size:11.5px; border-radius:6px; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }

  .iconbtn{
    width:26px; height:26px; border-radius:7px; border:1px solid var(--line); background:#fff;
    color:var(--ink-soft); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    font-size:13px; line-height:1; padding:0; flex:none;
  }
  .iconbtn:hover{ border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft); }
  .iconbtn.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .iconbtn.del:hover{ border-color:var(--st-hold); color:var(--st-hold); background:var(--st-hold-bg); }

  .subnav{ display:inline-flex; gap:3px; background:#EFEAE0; padding:3px; border-radius:10px; margin:16px 0 16px; }
  .subnav button{
    border:none; background:none; cursor:pointer; font-family:inherit; font-weight:700;
    font-size:12.5px; padding:7px 14px; border-radius:8px; color:var(--ink-soft);
  }
  .subnav button.active{ background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }

  main{ padding-top:6px; }

  select, input[type=text], input[type=date], input[type=tel], input[type=number], textarea{
    font-family:inherit; font-size:12.5px; color:var(--ink);
    border:1px solid var(--line); border-radius:6px; padding:6px 8px; background:#fff;
  }
  textarea{ width:100%; resize:vertical; min-height:38px; }
  label.field-label{ display:block; font-size:11px; font-weight:600; color:var(--ink-soft); margin-bottom:3px; }

  .badge{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap; }
  .badge.overdue-badge{ background:#C0473F; color:#fff; font-weight:800; animation:overduePulse 1.8s ease-in-out infinite; }
  @keyframes overduePulse{ 0%,100%{ opacity:1; } 50%{ opacity:.65; } }
  .badge.muted{ background:#F1EFE8; color:var(--ink-soft); }
  .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }
  .empty-hint{ padding:40px 20px; text-align:center; color:var(--ink-soft); font-size:13px; border:1px dashed var(--line); border-radius:12px; background:var(--panel); }

  .branch-bar{
    position:relative;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:16px 18px; margin-bottom:18px; display:flex; flex-direction:column; gap:14px;
  }
  .branch-bar .branch-edit-pencil{ position:absolute; top:14px; right:14px; }
  .branch-bar .col h3{ margin:0 0 6px; font-size:11px; color:var(--ink-soft); font-weight:700; letter-spacing:.02em; }
  .branch-bar input, .branch-bar textarea{ width:100%; }
  .branch-bar .namewrap{ display:flex; gap:8px; align-items:center; }
  .branch-bar .namewrap input{ font-size:19px; font-weight:800; border:none; background:transparent; padding:2px 0; }
  .branch-bar .namewrap input:focus{ outline:none; border-bottom:1px solid var(--accent); }
  .parking-cap-row select{ width:100px; }
  .parking-cap-row{ margin-bottom:8px; }
  .branch-info-table{ width:100%; border-collapse:collapse; table-layout:fixed; }
  .branch-info-table td{ padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; font-size:13px; }
  .branch-info-table td.bi-label{ width:108px; color:var(--ink-soft); font-weight:700; font-size:11.5px; white-space:nowrap; }
  .branch-info-table tr:last-child td{ border-bottom:none; }
  .branch-info-table input, .branch-info-table select, .branch-info-table textarea{ width:100%; font-size:13px; }
  .parking-summary{ font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; }
  .parking-summary.parking-unavailable{ font-size:14px; font-weight:800; color:var(--st-hold); margin-bottom:0; }
  .parking-active-toggle{ color:var(--accent-ink); font-weight:700; text-decoration:underline; cursor:pointer; }
  .parking-active-toggle:hover{ color:var(--accent); }
  .parking-list{ background:#F4F1E9; border-radius:8px; padding:8px 10px; margin-bottom:8px; }
  .parking-list-row{ display:flex; gap:8px; font-size:12px; padding:3px 0; }
  .parking-list-row .rm{ font-family:'JetBrains Mono',monospace; font-weight:700; }
  .parking-list-row .nm{ font-weight:600; }
  .parking-list-row .car{ color:var(--ink-soft); margin-left:auto; font-family:'JetBrains Mono',monospace; }
  .parking-list-empty{ font-size:12px; color:var(--ink-soft); }

  .room-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:12px; flex-wrap:wrap; }
  .room-toolbar .legend{ display:flex; gap:10px; flex-wrap:wrap; }
  .legend-btn{ border:1px solid transparent; cursor:pointer; font-family:inherit; }
  .legend-btn:hover{ border-color:currentColor; }
  .legend-btn.active{ border-color:currentColor; box-shadow:0 0 0 1px currentColor inset; }

  .add-room-form{
    background:var(--panel); border:1.5px dashed var(--accent); border-radius:12px; padding:16px;
    margin-bottom:16px; display:grid; grid-template-columns:1fr 1fr 1fr 1fr 1fr auto auto; gap:10px; align-items:end;
  }
  .add-room-form .fld{ display:flex; flex-direction:column; }
  .add-room-form input, .add-room-form select{ width:100%; }

  .add-branch-form{
    background:var(--panel); border:1.5px dashed var(--accent); border-radius:12px; padding:16px;
    margin-bottom:16px; display:grid; grid-template-columns:2fr 1fr auto auto; gap:10px; align-items:end;
  }
  .add-branch-form .fld{ display:flex; flex-direction:column; }
  .add-branch-form input, .add-branch-form select{ width:100%; }

  .admin-add-form{
    background:var(--panel); border:1.5px dashed var(--accent); border-radius:12px; padding:16px;
    margin-bottom:16px; display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:10px; align-items:end;
  }
  .branch-order-list{ display:flex; flex-direction:column; gap:6px; }
  .branch-order-row{
    display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; padding:9px 12px; cursor:grab; user-select:none;
  }
  .branch-order-row.dragging{ opacity:.4; }
  .branch-order-handle{ color:var(--ink-soft); font-size:14px; }
  .branch-order-name{ font-weight:700; font-size:13.5px; flex:1; cursor:pointer; }
  .branch-order-name:hover{ color:var(--accent-ink); text-decoration:underline; }
  .admin-add-form .fld{ display:flex; flex-direction:column; }
  .admin-add-form input, .admin-add-form select, .admin-add-form textarea{ width:100%; }
  .admin-add-form .btn-row{ display:flex; gap:8px; }
  .branch-address{ font-size:13px; font-weight:400; color:var(--ink-soft); margin-left:10px; }

  .branch-view-text{ font-size:14px; font-weight:600; padding:2px 0; }
  .branch-view-text.title{ font-size:19px; font-weight:800; }
  .branch-title-toggle{ cursor:pointer; display:inline-flex; align-items:center; }
  .branch-title-toggle:hover{ color:var(--accent-ink); }
  .branch-title-chevron{ font-size:13px; margin-left:8px; color:var(--ink-soft); }
  .branch-view-text.small{ font-size:12.5px; font-weight:400; color:var(--ink-soft); white-space:pre-wrap; }

  .overdue-banner{
    display:flex; align-items:flex-start; gap:12px; background:var(--st-hold-bg);
    border:1.5px solid var(--st-hold); border-radius:12px; padding:14px 16px; margin-bottom:18px;
  }
  .overdue-banner-icon{ font-size:20px; line-height:1; flex:none; }
  .overdue-banner-title{ font-weight:800; font-size:13.5px; color:var(--st-hold); margin-bottom:8px; }
  .overdue-banner-rooms{ display:flex; flex-wrap:wrap; gap:6px; }
  .overdue-room-chip{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px;
    background:#fff; color:var(--st-hold); border:1px solid var(--st-hold); border-radius:6px; padding:3px 9px;
    cursor:pointer;
  }
  .overdue-room-chip:hover{ background:var(--st-hold); color:#fff; }
  .room-card.flash-highlight{
    animation:cardFlash 2.2s ease-out;
  }
  @keyframes cardFlash{
    0%{ box-shadow:0 0 0 4px var(--st-hold); }
    70%{ box-shadow:0 0 0 4px var(--st-hold); }
    100%{ box-shadow:0 0 0 0 transparent; }
  }

  .status-section{ margin-bottom:22px; }
  .status-section .sec-head{
    display:flex; align-items:center; gap:8px; margin-bottom:10px; padding-bottom:6px;
    border-bottom:2px solid; cursor:pointer; user-select:none;
  }
  .status-section .sec-head:hover .name{ text-decoration:underline; }
  .status-section .sec-head .name{ font-weight:800; font-size:14px; }
  .status-section .sec-head .count-badge{
    font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:800;
    padding:3px 11px; border-radius:20px;
  }
  .status-section .sec-head .sec-toggle-caret{ margin-left:auto; color:var(--ink-soft); font-size:13px; }
  .status-section .sec-head.collapsed{ margin-bottom:0; border-bottom-style:dashed; opacity:.85; }
  .status-section .sec-empty{ font-size:12px; color:var(--ink-soft); padding:8px 2px; }

  .grid-rooms{ display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:12px; align-items:start; }

  /* ---- room card (view layout, matches reference mockup) ---- */
  .room-card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; border-left:5px solid var(--st-vacant); }
  .rc-header{ display:flex; flex-direction:column; gap:6px; padding:12px 14px 8px; }
  .rc-header-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .rc-title{ display:flex; align-items:baseline; gap:6px; min-width:0; flex:1; }
  .rc-title .roomno{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; white-space:nowrap; }
  .rc-title .roomtype{ font-size:11.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rc-title .room-price{ font-size:11.5px; color:var(--accent-ink); font-weight:700; white-space:nowrap; }
  .rc-header-badges{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .history-btn{
    font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px; border:1px solid var(--line);
    background:#fff; color:var(--ink-soft); cursor:pointer; white-space:nowrap; flex:none;
  }
  .history-btn:hover, .history-btn.active{ border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft); }
  .history-btn.contract-mismatch{ border-color:var(--st-hold); color:var(--st-hold); background:var(--st-hold-bg); animation:overduePulse 1.8s ease-in-out infinite; }
  /* 판매중 플래그(방 번호 줄 끝): 테두리 없는 작은 글자 "판매중" + 토글. 켜짐(파랑)/꺼짐(회색)이 곧 현재 상태다.
     거쳐온 모양과 거절 이유(글자 버튼 → 배지로 읽힘, 글자+스위치 알약 → 어색함, 토글만 → 무슨 설정인지 모름)는 HANDOVER_NOTES 참고. */
  .sale-flag{ display:inline-flex; align-items:center; gap:4px; flex:none; align-self:center; margin-left:4px;
    font-size:10.5px; font-weight:700; color:var(--ink-soft); white-space:nowrap; cursor:pointer; }
  .sale-flag.on{ color:var(--st-forsale); }
  .sale-switch{ position:relative; flex:none; align-self:center; width:28px; height:16px; padding:0; margin:0;
    border:none; border-radius:8px; background:#CFCAC0; cursor:pointer; }
  .sale-switch::after{ content:''; position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%;
    background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); }
  .sale-flag:hover .sale-switch{ filter:brightness(.93); }
  .sale-switch:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .sale-switch.on{ background:var(--st-forsale); }
  .sale-switch.on::after{ left:14px; }
  .history-panel{ margin:0 14px 10px; background:#F4F1E9; border-radius:8px; padding:8px 10px; }
  .history-entry{ padding:6px 0; border-bottom:1px dashed #E1DCCF; }
  .history-entry:last-child{ border-bottom:none; }
  .history-top{ display:flex; align-items:center; gap:10px; font-size:12px; }
  .history-top .nm{ font-weight:700; }
  .history-top .ph{ color:var(--ink-soft); }
  .history-top .btn{ margin-left:auto; }
  .history-sub{ font-size:11.5px; color:var(--ink); margin-top:3px; }
  .history-period{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); margin-top:3px; }
  .history-empty{ font-size:12px; color:var(--ink-soft); }
  .rc-header-right{ display:flex; align-items:center; gap:6px; flex:none; }

  .rc-note-chip{
    margin:0 14px 8px; font-size:11.5px; color:var(--ink); background:#F4F1E9; border-radius:8px;
    padding:6px 10px; white-space:pre-wrap; word-break:break-word;
  }
  .rc-divider{ border:none; border-top:1px solid var(--line); margin:0; }

  .rc-body{ padding:12px 14px 14px; }

  .resident-block{ padding:9px 0; border-bottom:1px dashed #EAE5D8; }
  .resident-block:last-child{ border-bottom:none; }
  .resident-flags{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .resident-name-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:5px; }
  .resident-name-row .nm{ font-weight:700; font-size:13.5px; min-width:0; overflow-wrap:anywhere; }
  .resident-name-row .nm.nm-clickable{ cursor:pointer; }
  .resident-name-row .nm.nm-clickable:hover{ color:var(--accent-ink); text-decoration:underline; }
  /* 퇴실·연장·방이동은 이름 줄이 아니라 입실자 정보 맨 아래 왼쪽에 둔다 — 이름 줄에 두면 긴 이름이 가려지거나 줄이 깨졌다. */
  .resident-acts{ display:flex; justify-content:flex-start; flex-wrap:wrap; gap:5px; margin-top:6px; }
  .badge.tag-new{ background:#F1EFE8; color:var(--ink-soft); border:1px solid var(--line); }
  .badge.tag-ext{ background:#FBF0DD; color:#8A5F14; border:1px solid #E3B25C; }
  .badge.res-status{ background:#EEF0F2; color:var(--ink-soft); }
  .badge.res-status.leaving{ background:var(--st-leaving-bg); color:var(--st-leaving); }
  .badge.res-status.moving{ background:var(--st-presell-bg); color:var(--st-presell); }
  .badge.res-status.upcoming{ background:var(--st-forsale-bg); color:var(--st-forsale); }
  .resident-period{ font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-soft); margin-top:4px; }
  .resident-phone{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; font-family:'JetBrains Mono',monospace; }
  /* 대리결제 입실자: 이름 앞과 결제자(또는 실입실자) 줄 앞에 같은 모양의 구분 표시를 붙인다. */
  .who-tag{ flex:none; display:inline-block; min-width:44px; box-sizing:border-box; text-align:center; padding:0 5px;
    border-radius:4px; font-size:10px; font-weight:700; line-height:1.6; color:var(--st-presell); background:var(--st-presell-bg); }
  .resident-payer{ display:flex; align-items:center; gap:4px; font-size:11.5px; color:var(--ink-soft); margin-top:3px; min-width:0; }
  .resident-car{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; font-family:'JetBrains Mono',monospace; }
  .resident-memo{
    margin-top:5px; font-size:11.5px; color:var(--ink); background:#F4F1E9; border-radius:6px;
    padding:5px 9px; white-space:pre-wrap; word-break:break-word;
  }

  .tl-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
  .tl-month-nav{ display:flex; align-items:center; gap:10px; }
  .tl-month-nav .m-label{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; min-width:110px; text-align:center; }
  .tl-wrap{ background:var(--panel); border:1px solid var(--line); border-radius:12px; }
  /* 날짜 헤더(월 띠 + 일자 줄)는 방 목록과 분리된 자체 스크롤 영역이다 — 방이 많아 목록이
     길어져도 가로 스크롤바가 맨 아래로 밀려나지 않고 항상 화면 위쪽에 붙어 있게 한다.
     overflow-y:hidden으로 세로 스크롤은 막고(세로로 넘칠 내용이 없다) 가로만 허용한다. */
  .tl-head-scroll{ position:sticky; top:0; z-index:3; background:var(--panel); overflow-x:auto; overflow-y:hidden; border-top-left-radius:12px; border-top-right-radius:12px; border-bottom:1px solid var(--line); scrollbar-width:thin; }
  .tl-body-scroll{ overflow-x:auto; border-bottom-left-radius:12px; border-bottom-right-radius:12px; }
  .tl-head-grid, .tl-grid{ display:grid; min-width:900px; }
  /* 요일 칸 영역(오른쪽)을 1fr(=남은 공간에 맞춰 줄어듦) 대신 auto(=내용이 필요로 하는 폭
     그대로)로 둔다 — 3개월치 날짜 칸이 화면보다 넓으면 그 넓이 그대로 그리드가 커져서
     가로 스크롤이 실제로 걸리게 하기 위함이다. */
  .tl-monthband-row, .tl-headrow, .tl-row{ display:grid; grid-template-columns:220px auto; border-bottom:1px solid var(--line); }
  .tl-headrow{ background:var(--panel); }
  .tl-row:last-child{ border-bottom:none; }
  .tl-legend{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  /* 호실 번호가 있는 왼쪽 라벨 칸을 가로 스크롤 중에도 항상 보이도록 고정한다 — 3개월치를
     옆으로 이어붙이면서, 스크롤해서 뒤쪽 달을 보는 동안에도 "어느 호실인지"는 계속 보여야
     하기 때문이다. 각 행이 이미 자기 상태색으로 배경을 칠하므로(lbl.style.background),
     뒤에 스크롤되는 막대들이 비치지 않는다. */
  .tl-label{ padding:10px 12px; font-size:12px; border-right:1px solid var(--line); display:flex; flex-direction:column; justify-content:center; gap:2px; position:sticky; left:0; z-index:1; background:var(--panel); }
  .tl-headrow .tl-label, .tl-monthband-label{ z-index:2; }
  .tl-label .tl-status-dot{ width:6px; height:6px; border-radius:50%; display:inline-block; margin-right:3px; }
  .tl-label .rm{ font-family:'JetBrains Mono',monospace; font-weight:700; }
  .tl-label .nm{ color:var(--ink-soft); font-size:11px; }
  .tl-days{ position:relative; display:grid; }
  .tl-headrow .tl-days{ height:34px; }
  .tl-row .tl-days{ height:44px; }
  .tl-daycell{ border-right:1px solid #EFEBE0; }
  .tl-headrow .tl-daycell{ display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; }
  .tl-daycell.weekend{ background:#FBF8F1; }
  /* 오늘(한국시간) 날짜: 날짜 줄은 칸을 채워 강조하고, 방 행에서는 막대에 가려지지 않도록 그 날짜 칸 양쪽에
     세로선을 긋는다. 세로선에는 z-index를 주지 않는다 — 왼쪽에 고정된 호실 칸(.tl-label, z-index:1)보다
     아래에 깔려야 가로 스크롤할 때 호실 번호를 가리지 않는다(막대보다는 뒤에 추가해서 위에 그려진다). */
  .tl-daycell.today{ background:var(--accent-soft); }
  .tl-headrow .tl-daycell.today{ background:var(--accent); color:#fff; font-weight:700; }
  .tl-today-col{ position:absolute; top:0; bottom:0; border-left:2px solid var(--accent); border-right:2px solid var(--accent); box-sizing:border-box; pointer-events:none; opacity:.55; }
  /* 3개월이 이어져 있을 때 달이 바뀌는 첫날의 경계를 아주 옅게만 표시한다 — 어느 달인지는
     위쪽 월 띠(.tl-monthband)가 이미 보여주므로, 날짜 줄에서는 숫자만 깔끔하게 두고 살짝
     구분만 되면 충분하다. */
  .tl-daycell.month-start{ border-left:1px solid var(--ink-soft); }
  /* 달마다 하나의 칸으로 된 월 띠. 창(항상 온전한 3개월)의 각 달이 차지하는 폭만큼 칸이
     생기고, 처음 진입했을 때의 기준 달(가운데 달)은 강조색으로 구분해준다. */
  .tl-monthband{ position:relative; display:grid; height:26px; }
  .tl-monthband-cell{ display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; color:var(--ink-soft); border-right:1px solid var(--line); font-family:'JetBrains Mono',monospace; }
  .tl-monthband-cell.current{ color:var(--accent-ink); background:var(--accent-soft); }
  /* overflow는 hidden이 아니라 clip을 쓴다 — hidden은 스크롤 컨테이너를 만들어버려서 막대 안의
     position:sticky 라벨이 바깥 가로 스크롤(.tl-body-scroll)이 아니라 막대 자신을 기준으로
     붙어버린다(=전혀 움직이지 않는다). clip은 잘라내기만 하고 스크롤 컨테이너를 만들지 않아
     sticky가 의도대로 동작한다. */
  .tl-bar{ position:absolute; top:8px; height:28px; border-radius:7px; display:flex; align-items:center; padding:0 8px; font-size:11px; font-weight:700; color:#fff; white-space:nowrap; overflow:clip; border-left:2px solid var(--paper); }
  /* 긴 막대의 시작 부분이 왼쪽으로 스크롤되어 화면 밖으로 나가도 이름/메모는 계속 보이도록,
     막대 안쪽 라벨을 가로 스크롤 기준으로 고정한다. left 값(220px)은 왼쪽에 고정되어 있는
     호실 라벨 칸(.tl-label, grid-template-columns의 220px)에 가려지지 않도록 맞춘 값이고,
     막대를 벗어나서까지 따라오지는 않는다(sticky는 부모인 막대 안으로 제한된다). */
  .tl-bar .tl-bar-sticky{ position:sticky; left:calc(var(--tl-label-w, 220px) + 8px); display:flex; align-items:center; min-width:0; max-width:100%; overflow:clip; }
  .tl-bar .tl-bar-name{ font-weight:700; flex:none; }
  .tl-bar .tl-bar-memo{ font-weight:400; opacity:.9; margin-left:5px; overflow:hidden; text-overflow:ellipsis; }
  /* 퇴실확정 막대의 맨 마지막 날(실제 퇴실예정일)을 한눈에 알아볼 수 있도록, 막대 오른쪽
     끝에 진한 테두리를 준다. 막대 전체가 이미 퇴실확정 색(--st-leaving)이라 그 색과 겹치지
     않는 진한 잉크색으로 대비를 준다. */
  .tl-bar.tl-bar-leaving-end{ border-right:4px solid var(--ink); box-shadow:inset -2px 0 0 var(--ink); }
  /* 엔코스테이·리브애니웨어 등 외부 채널 예약은 결제 내역이 없어 계약이 아니라 입실자 카드의
     예약 기간으로 그린다. 색만으로는 채널별 색과 상태 색이 헷갈릴 수 있어, 빗금 무늬를 함께
     넣어 독립생활(계약 기반) 막대와 한눈에 구분되게 한다. */
  .tl-bar.tl-bar-external{ background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.28) 0 5px, transparent 5px 11px); border-left-style:dashed; }
  .tl-bar .tl-bar-leaving-tag{ font-weight:800; margin-left:4px; flex:none; }

<script>
const STORE_KEY = 'monthliv-state';
let DB = null;
let UI = {
  view:'stats', branchId:null, branchTab:'rooms',
  roomEditMode:{}, residentEditMode:{}, roomSnapshots:{}, residentSnapshots:{}, draftResident:{}, parkingListOpen:{}, residentFieldEdit:{},
  branchEditMode:{}, branchSnapshots:{}, branchInfoOpen:{}, addingBranch:false, addingRoom:false, managingRoom:false, managingTypePrice:false, editingBranchId:null, branchOrderOpen:false,
  tlYear:null, tlMonth:null, tlScrollLeft:null, roomStatusFilter:'전체', cleanWeekStart:null, overdueTabKey:null,
  cleanTodayPage:1, cleanFuturePage:1, shortcutSelectedId:null, upcomingSoonDays:7, roomPriceTableOpen:false
};

function uid(p){ return p + '_' + Math.random().toString(36).slice(2,9); }
// 이 서비스는 한국에서만 쓰이므로 "오늘"은 언제나 한국 날짜(KST, UTC+9)여야 한다.
// 예전에는 new Date().toISOString()(=UTC)을 그대로 잘라 썼는데, 그러면 한국시간
// 00:00~09:00 사이에 todayISO()가 "어제"를 돌려준다 — 이 값은 재실/퇴실 판정(isCurrentlyResiding·
// isUpcoming·isOverdue), 청소 예정일, 당일퇴실 처리 날짜, 일일 백업 문서 id까지 전부 쓰이므로
// 그 시간대에 출근해 작업하면 하루씩 밀린 결과가 저장된다.
// 주의: 날짜 문자열을 받아 계산하는 아래 헬퍼들(addOneMonth·nextMonWedFri·prevMonWedFri·
// addDaysISO·mondayOf)은 'YYYY-MM-DD'를 UTC 자정으로 파싱해 계산하고 다시 UTC로 잘라내므로
// 시간대와 무관하게 정확하다. 그래서 그쪽은 그대로 두고, "지금"을 기준으로 삼는 fallback만
// todayISO()를 거치게 해서 같은 기준을 쓰도록 맞춘다.
const KST_OFFSET_MS = 9 * 60 * 60 * 1000;
function todayISO(){ return new Date(Date.now() + KST_OFFSET_MS).toISOString().slice(0,10); }
function addOneMonth(dateStr){
  const d = new Date(dateStr || todayISO());
  const origDay = d.getDate();
  // 그 달의 말일(28~31일 등)이었던 날짜에 그냥 달만 +1 하면, 다음 달엔 그만큼 날짜가 없는
  // 경우(예: 8/31 + 1개월 → 9월엔 31일이 없음) JS Date가 자동으로 그다음다음 달로 넘겨버린다
  // (8/31 → 10/1, 하루이틀 모자란 채로 밀림). "한달연장"에서는 매달 말일 기준으로 도는 계약이
  // 항상 "다음 달의 말일"로 연장돼야 한다(예: 8/31 → 9/30, 2/28 → 3/31) — 다음 달에 같은
  // 날짜가 우연히 존재하는 경우(예: 4/30 → 5/30)에도 마찬가지로 "다음 달 말일"(5/31)로
  // 맞춘다. 매달 1일 기준으로 도는 계약은 그대로 같은 날짜(다음 달 1일)를 유지한다 — 1일은
  // 모든 달에 존재하므로 이 로직상 손댈 일이 없다. 월 경계를 넘을 때 날짜 오버플로우가
  // 안 생기도록, 먼저 1일로 옮긴 뒤에 달을 더한다.
  const origMonthLastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  const wasLastDayOfMonth = origDay === origMonthLastDay;
  d.setDate(1);
  d.setMonth(d.getMonth()+1);
  const newMonthLastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  d.setDate(wasLastDayOfMonth ? newMonthLastDay : Math.min(origDay, newMonthLastDay));
  return d.toISOString().slice(0,10);
}
function nextMonWedFri(fromDateStr){
  const d = new Date(fromDateStr || todayISO());
  while(![1,3,5].includes(d.getDay())) d.setDate(d.getDate()+1);
  return d.toISOString().slice(0,10);
}
function prevMonWedFri(fromDateStr){
  const d = new Date(fromDateStr || todayISO());
  while(![1,3,5].includes(d.getDay())) d.setDate(d.getDate()-1);
  return d.toISOString().slice(0,10);
}
function formatWon(n){ n = Number(n)||0; return n.toLocaleString('ko-KR') + '원'; }
function branchLabel(branch){ return (branch && branch.shortName && branch.shortName.trim()) ? branch.shortName : (branch ? branch.name : ''); }
function syncBranchSelectOption(branch){
  const opt = document.querySelector(`#branchSelect option[value="${branch.id}"]`);
  if(opt) opt.textContent = branchLabel(branch);
}

const STATUS_LIST = ['이용중','입실확정','이용중판매','단기판매','판매중','퇴실확정','공실','판매보류'];

const RESIDENT_STATUS_LIST = ['입실중','입실예정','퇴실확정'];

// 정산 수수료율(%). 지점별로 다르게 설정할 수 있고, 설정 전에는 표준 7%를 쓴다.
const SETTLEMENT_DEFAULT_COMMISSION_RATE = 7;
function branchCommissionRate(branch){
  if(!branch) return SETTLEMENT_DEFAULT_COMMISSION_RATE;
  const v = Number(branch.commissionRate);
  return (isFinite(v) && v >= 0) ? v : SETTLEMENT_DEFAULT_COMMISSION_RATE;
}
// 이미 정산이 끝난 뒤 환불이 발생하면, 회사는 원장에게 정산해준 금액을 되돌려받아야 한다.
// 운영팀 정산 로직 기준:
//   정산 기준 금액 = 총 판매가 − 원장님 쿠폰   (플랫폼 쿠폰/포인트는 정산 기준에서 빠지지 않음)
//   실결제금       = 총 판매가 − 쿠폰/포인트
//   고객 환불액    = 실결제금 − 차감액
//   원장 반환액    = (정산 기준 금액 − 차감액) × (1 − 수수료율)
// 반환 기준을 총 판매가가 아니라 정산 기준 금액으로 잡는 이유는, 원장에게 실제로 정산해준 돈이
// 정산 기준 금액(원장님 쿠폰을 뺀 금액) 기준이기 때문이다 — 총 판매가로 잡으면 원장님 쿠폰만큼
// 실제 정산액보다 많이 회수하게 된다. 원장님 쿠폰이 0이면 두 계산은 완전히 같다.
// 원장 반환액에 (1 − 수수료율)을 곱하는 이유는, 선차감했던 수수료 중 환불분에 해당하는 몫은
// 회사가 부담하고 나머지만 회수하기 때문이다(정산표의 "환불" 행과 같은 계산).
// 보증금은 원장에게 청구하는 항목이 아니라서 이 계산에서 완전히 제외한다.
function calcSettlementReturn(input){
  const num = (v)=> Math.max(0, Math.round(Number(String(v==null?'':v).replace(/[^0-9]/g,'')) || 0));
  const gross = num(input.gross);
  const ownerCoupon = num(input.ownerCoupon);
  const platformCoupon = num(input.platformCoupon);
  const deduction = num(input.deduction);
  const rate = Math.max(0, Number(input.rate) || 0);
  const settlementBase = gross - ownerCoupon;
  const actualPaid = settlementBase - platformCoupon;
  const customerRefund = actualPaid - deduction;
  const ownerReturnBase = Math.max(0, settlementBase - deduction);
  // 정산표와 동일하게 원 단위에서 반올림한다.
  const commissionBack = Math.round(ownerReturnBase * rate / 100);
  const ownerReturn = ownerReturnBase - commissionBack;
  return { gross, ownerCoupon, platformCoupon, deduction, rate,
           settlementBase, actualPaid, customerRefund, ownerReturnBase, commissionBack, ownerReturn };
}
// 타입은 지점마다 고정된 목록이 아니라 자유롭게 추가/삭제할 수 있다(관리자 설정 > 타입 관리).
// ROOM_TYPE_LIST는 새 지점이 생겼을 때 쓰는 초기값일 뿐이다.
function branchRoomTypes(branch){
  return (branch.roomTypes && branch.roomTypes.length) ? branch.roomTypes : ROOM_TYPE_LIST;
}
function registerRoomType(branch, type){
  if(!type) return;
  if(!branch.roomTypes || !branch.roomTypes.length) branch.roomTypes = [...ROOM_TYPE_LIST];
  if(!branch.roomTypes.includes(type)) branch.roomTypes.push(type);
  if(!branch.typePrices) branch.typePrices = {};
  if(!(type in branch.typePrices)) branch.typePrices[type] = 0;
}

function roomMaintKind(room){
  // 퇴실청소를 가장 먼저 본다. 퇴실청소는 리터치를 포함하는 더 포괄적인 작업이라, 한 방에

  // 걸어둔 리터치가 남아 있으면 퇴실이 확정돼도 리터치로 표시됐다 — 목동 306호 사례).
  if(room.needsCleaning) return 'moveout';
  if(room.needsExtraCleaning) return 'extra';

}

function roomCardMaintKind(room){
  // 청소/리터치 예정일이 지나면 방 카드(입실자 카드)에서는 배지를 더 이상 노출하지 않는다.
  // 단, 원본 데이터(needsCleaning 등)는 그대로 두어 청소 관리 화면에는 계속 기록이 남는다.
  const kind = roomMaintKind(room);
  if(kind){
    if(room.maintenanceDate && room.maintenanceDate < todayISO()) return null;
    return kind;
  }
  // 자동 지정 제외 지점(제주 등)은 이 경로도 막아야 한다. flagUpcomingCleaning을 막아
  // needsCleaning 플래그가 안 걸리게 해놨어도, 여기서 퇴실확정 여부만 보고 배지를 띄우면
  // 결국 "자동으로 퇴실청소가 지정되는" 것과 똑같이 보인다(제주점 제보).
  // 수동으로 켠 플래그는 위 roomMaintKind에서 이미 처리되므로 제외 지점에서도 그대로 보인다.
  if(isAutoCleaningExcludedBranch(roomBranch(room))) return null;
  // needsCleaning 플래그가 아직 안 걸려 있어도(예: 새 계약자를 미리 등록하며 기존 입실자만
  // 퇴실확정으로 표시해 둔 경우처럼 flagUpcomingCleaning이 호출되지 않는 경로), 청소관리
  // 화면(collectCleaningEntries)과 같은 기준으로 방 카드에도 청소예정일 배지를 미리 보여준다.
  if(roomUpcomingLeaveDate(room)) return 'moveout';
  return null;
}
function roomEarliestLeaverMoveOut(room){
  const leavers = DB.residents.filter(p=> p.roomId===room.id && p.scheduledToLeave && p.moveOut);
  if(leavers.length===0) return null;
  return leavers.reduce((a,b)=> a.moveOut < b.moveOut ? a : b).moveOut;
}
function roomUpcomingLeaveDate(room){
  // 청소관리 화면(collectCleaningEntries)의 예비 판정과 동일한 기준: room.needsCleaning이
  // 아직 안 걸려 있어도, 퇴실확정(scheduledToLeave)된 입실자가 있으면 그 퇴실일 기준으로
  // 청소예정일을 미리 계산해 보여준다(방이 곧 완전히 빌지 여부와 무관하게 동일하게 취급).
  const raw = roomEarliestLeaverMoveOut(room);
  if(!raw) return null;
  // 방 카드에서 "퇴실청소" 칩을 눌러 이 제안을 취소한 적이 있다면, 같은 퇴실일 기준으로는
  // 다시 자동으로 켜지 않는다(퇴실일이 바뀌면 새 정보이므로 다시 제안한다).
  if(room.cleaningDismissedMoveOut && room.cleaningDismissedMoveOut === raw) return null;
  return nextMonWedFri(raw);
}

async function batchWriteDocs(col, records){
  for(let i=0; i<records.length; i+=FIRESTORE_BATCH_CHUNK){
    const batch = firestoreDB.batch();
    records.slice(i, i+FIRESTORE_BATCH_CHUNK).forEach(r=> batch.set(col.doc(r.id), r));
    await batch.commit();
  }
}
async function batchDeleteDocs(col, ids){
  for(let i=0; i<ids.length; i+=FIRESTORE_BATCH_CHUNK){
    const batch = firestoreDB.batch();
    ids.slice(i, i+FIRESTORE_BATCH_CHUNK).forEach(id=> batch.delete(col.doc(id)));
    await batch.commit();
  }
}

/* 대리결제(paymentProxy)인 경우 계약자명(name) 대신 실제 거주자명(actualResidentName)을
   우선 표시한다. 입실자 카드(renderResidentView)와 타임라인이 이 기준을 공유한다.
   입실자 카드는 대리결제면 이름 앞에 "실입실자"/"결제자" 표시를 붙이고 나머지 한 사람을 아랫줄에 따로 보여준다. */
function residentDisplayName(p){

function maskViewerName(name){
  if(!name || USER_ROLE !== 'viewer') return name;

/* 슈퍼어드민은 항상 전체 지점에 접근 가능. 그 외 계정은 관리자가 지정한 범위(전체 또는 선택한 지점)로 제한된다. */

function isBlankEditValue(v){ return v === undefined || v === null || v === '' || v === false; }
function editHistorySummary(kind, o){
  return kind === 'room' ? `${o.number}호 · ${o.type || '타입 없음'}` : `${o.name || '이름 미입력'} · ${o.moveIn || '?'} ~ ${o.moveOut || '?'}`;

function formatEditValue(key, v){
  if(v === undefined || v === null || v === '') return '(비어 있음)';
  if(v === true) return '예';
  if(v === false) return '아니오';
  if(key === 'roomId'){ const r = (DB.rooms || []).find(x=> x.id === v); return r ? `${r.number}호` : String(v); }
  if(key === 'branchId'){ const b = (DB.branches || []).find(x=> x.id === v); return b ? branchLabel(b) : String(v); }
  const text = typeof v === 'object' ? JSON.stringify(v) : String(v);
  return text.length > 300 ? text.slice(0, 300) + '…' : text;
}
function diffForEditHistory(prev, next, by){
  const at = new Date().toISOString();
  const out = [];
  ['room', 'resident'].forEach(kind=>{
    const ignore = EDIT_HISTORY_IGNORE[kind];
    const labels = EDIT_HISTORY_LABELS[kind];
    const roomIdOf = o=> kind === 'room' ? o.id : o.roomId;
    const push = (o, roomId, field, before, after, action)=>{
      const room = (DB.rooms || []).find(r=> r.id === roomId);
      out.push({
        at, by, roomId: roomId || '', branchId: (kind === 'room' ? o.branchId : (room && room.branchId)) || '',
        entity: kind, entityId: o.id, target: kind === 'room' ? `${o.number}호` : (o.name || '이름 미입력'),
        field, fieldLabel: field ? (labels[field] || field) : '', before, after, action
      });
    };
    next[kind].forEach((json, id)=>{
      const was = prev[kind].get(id);
      if(was === json) return;
      const now = JSON.parse(json);
      if(was === undefined){ push(now, roomIdOf(now), '', '', editHistorySummary(kind, now), 'add'); return; }
      const old = JSON.parse(was);
      new Set([...Object.keys(old), ...Object.keys(now)]).forEach(k=>{
        if(ignore.has(k)) return;
        if(JSON.stringify(old[k]) === JSON.stringify(now[k])) return;
        if(isBlankEditValue(old[k]) && isBlankEditValue(now[k])) return;
        const before = formatEditValue(k, old[k]), after = formatEditValue(k, now[k]);
        push(now, roomIdOf(now), k, before, after, 'change');
        // 방이동은 옮기기 전 호실의 이력에도 남긴다.
        if(k === 'roomId' && old.roomId) push(now, old.roomId, k, before, after, 'change');
      });
    });
    prev[kind].forEach((json, id)=>{
      if(next[kind].has(id)) return;
      const old = JSON.parse(json);
      const movedOut = kind === 'resident' && (DB.residentHistory || []).some(h=>
        h.roomId === old.roomId && h.name === (old.name || '(이름 미입력)') && (h.moveIn || '') === (old.moveIn || ''));
      push(old, roomIdOf(old), '', editHistorySummary(kind, old), '', movedOut ? 'moveout' : 'remove');
    });
  });
  return out;
}
// 기준 상태 이후 바뀐 칸을 by(이메일 또는 "자동") 이름으로 떼어 대기열에 담고, 기준 상태를 지금으로 옮긴다.
function captureEdits(by){
  if(!editBaseline){ resetEditBaseline(); return 0; }
  const next = editHistorySnapshot();
  const entries = diffForEditHistory(editBaseline, next, by);
  editBaseline = next;
  if(entries.length) pendingEditEntries.push(...entries);
  return entries.length;
}
function flushEditHistory(){
  if(!pendingEditEntries.length) return;
  const entries = pendingEditEntries.splice(0);
  for(let i = 0; i < entries.length; i += 400){
    const batch = firestoreDB.batch();
    entries.slice(i, i + 400).forEach((e, j)=>{
      batch.set(EDIT_HISTORY_COL.doc(), Object.assign({}, e, { roomKey: `${e.roomId}|${e.at}|${String(i + j).padStart(4, '0')}` }));
    });
    batch.commit().catch(err=>{
      console.error('수정 이력 저장 실패:', err);
      if(editHistoryWarned) return;
      editHistoryWarned = true;
      showAlert(`수정 이력을 기록하지 못했습니다. 방·입실자 데이터 저장은 정상입니다.\n\nFirebase 보안 규칙에 editHistory가 없으면 이 경고가 뜹니다. 관리자에게 규칙 추가를 요청해 주세요.\n\n오류 내용: ${(err && err.message) || err}`);
    });
  }
}
// 수정이력 건수. 이 앱이 쓰는 compat SDK(10.12.2)에는 개수 세기(count) API가 없어, Firestore REST의
// runAggregationQuery를 로그인 토큰으로 부른다(보안 규칙 그대로 적용 — editHistory 읽기 권한이 있어야 한다).
// 문서를 읽지 않고 개수만 세므로 결과 1,000건마다 읽기 1회다. 방 변경이력 창을 열 때 한 번 부른다.
function editHistoryRoomQueryBody(roomId){
  const range = (op, value)=> ({ fieldFilter: { field: { fieldPath: 'roomKey' }, op, value: { stringValue: value } } });
  return {
    structuredAggregationQuery: {
      structuredQuery: {
        from: [{ collectionId: 'editHistory' }],
        where: { compositeFilter: { op: 'AND', filters: [range('GREATER_THAN_OR_EQUAL', roomId + '|'), range('LESS_THAN', roomId + '|~')] } }
      },
      aggregations: [{ alias: 'n', count: {} }]
    }
  };
}
function countEditHistoryForRoom(roomId){
  const user = firebase.auth().currentUser;
  if(!user) return Promise.reject(new Error('로그인 필요'));
  const url = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents:runAggregationQuery`;
  return user.getIdToken()
    .then(token=> fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify(editHistoryRoomQueryBody(roomId))
    }))
    .then(r=> r.json().then(j=>{
      if(!r.ok) throw new Error((j && j.error && j.error.message) || ('HTTP ' + r.status));
      const row = (Array.isArray(j) ? j : []).find(x=> x && x.result);
      const v = row && row.result.aggregateFields && row.result.aggregateFields.n;
      return v ? Number(v.integerValue || 0) : 0;
    }));
}
// 화면 표시용: 같은 사람이 같은 칸을 5분 안에 여러 번 저장한 것(입력하다 멈칫할 때마다 저장됨)은 한 줄로 합친다.
function coalesceEditRows(rowsDesc){
  const merged = [];
  const lastByKey = new Map();
  rowsDesc.slice().reverse().forEach(r=>{
    const key = r.entityId + '|' + r.field + '|' + r.roomId;
    const last = r.action === 'change' ? lastByKey.get(key) : null;
    if(last && last.by === r.by && Date.parse(r.at) - Date.parse(last.at) <= 5 * 60 * 1000){
      last.after = r.after; last.at = r.at; last.target = r.target; last.count = (last.count || 1) + 1;
      return;
    }
    const copy = Object.assign({}, r);
    merged.push(copy);
    if(r.action === 'change') lastByKey.set(key, copy);
  });
  // 썼다가 원래대로 되돌린 경우(합친 결과 이전 = 변경)는 보여주지 않는다.
  return merged.filter(r=> !(r.action === 'change' && r.before === r.after)).reverse();
}

// 별도 컬렉션(계약/퇴실 이력) 로딩이 어떻게 됐는지 남겨둔다. "특정 PC·계정에서만 이력이 안

const APP_BUILD = '2026-09-17-d';

// 계약 이력·퇴실 이력 컬렉션은 로그인할 때마다 컬렉션 전체를 통째로 읽어오는데, 문서 수가
// 쌓일수록 이 비용이 커지고, 관제센터 특성상 유휴 타임아웃(3시간)마다 재로그인이 일어나
// 하루에도 여러 번 반복된다. 이 두 컬렉션은 실시간으로 자주 바뀌는 데이터가 아니므로,
// 브라우저 localStorage에 최근 읽은 내용을 캐시해두고 일정 시간 안에는 재로그인해도 다시

// 유지한다(아래 각 변경 지점의 refreshContractsCache/refreshHistoryCache 호출 참고).
const COLLECTION_CACHE_TTL_MS = 6 * 60 * 60 * 1000; // 6시간
function readCachedCollection(key){
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.data) || typeof parsed.cachedAt !== 'number') return null;
    if(Date.now() - parsed.cachedAt > COLLECTION_CACHE_TTL_MS) return null;
    // 빈 배열은 "캐시 없음"으로 본다. 예전 코드는 일시적으로 0건을 받으면 그 빈 값을 그대로
    // 캐시했는데, 빈 배열도 JS에서는 truthy라 호출부의 if(cached)를 통과해버린다. 그러면
    // Firestore를 아예 읽지 않은 채 캐시 유효시간(6시간) 동안 계속 비어 보이고, 이 캐시는
    // 계정이 아니라 브라우저에 붙어 있어서 재로그인·새로고침으로도 풀리지 않았다
    // (실제로 특정 PC에서만 퇴실 이력이 안 보이던 원인). 이미 저장돼 있는 잘못된 빈 캐시도
    // 여기서 무시되므로, 다음 접속 때 자동으로 정상 복구된다.
    if(parsed.data.length === 0) return null;
    return parsed.data;
  }catch(e){ return null; }
}
function writeCachedCollection(key, data){
  try{ localStorage.setItem(key, JSON.stringify({ data, cachedAt: Date.now() })); }catch(e){ /* localStorage 사용 불가 시 캐시 없이 매번 새로 읽음 */ }
}
const CONTRACTS_CACHE_KEY = 'monthliv_contracts_cache_v1';

    // 컬렉션 구조로 옮겨 쓴다. 그 뒤로는 컬렉션 쪽 데이터가 항상 기준이 된다.

  try{
    const cachedHistory = readCachedCollection(HISTORY_CACHE_KEY);
    let historyFromCol;
    if(cachedHistory){
      historyFromCol = cachedHistory;
    } else {
      const historySnap = await RESIDENT_HISTORY_COL.get();
      historyFromCol = historySnap.docs.map(d=>d.data());
      if(historyFromCol.length > 0) writeCachedCollection(HISTORY_CACHE_KEY, historyFromCol);
    }
    if(historyFromCol.length===0 && Array.isArray(base.residentHistory) && base.residentHistory.length>0){
      await batchWriteDocs(RESIDENT_HISTORY_COL, base.residentHistory);
      writeCachedCollection(HISTORY_CACHE_KEY, base.residentHistory);
    } else {
      base.residentHistory = historyFromCol;
    }
    LOAD_DIAG.history = { count: (base.residentHistory||[]).length, source: cachedHistory ? '로컬 캐시' : '서버', error: '' };
    LOAD_DIAG.at = new Date().toLocaleString('ko-KR');
  }catch(e){
    console.error('퇴실 이력 불러오기 실패:', e);
    LOAD_DIAG.history = { count: 0, source: '실패', error: (e && (e.code || e.message)) || String(e) };
    LOAD_DIAG.at = new Date().toLocaleString('ko-KR');
    showAlert(`퇴실 이력을 불러오지 못했습니다. 퇴실자 검색과 호실별 퇴실 이력이 비어 보일 수 있습니다.

오류 내용: ${(e && e.message) || e}`);

  }

}

    // 초과인지 네트워크 문제인지 등)도 알 수 없었다. 그래서 실제 오류 메시지를 그대로 화면에 노출한다.

      `저장에 실패했습니다. 방금 하신 수정이 저장되지 않았을 수 있습니다.\n\n오류 내용: ${detail}` +

const CHANNEL_PALETTE = ['#D6673E','#B5459A','#5B4FCF','#2F8F5B','#C98A2C','#2F6FED','#B5335C','#5C8A3A','#0F7173','#A8481E'];

  if(fixed[c]) return fixed[c];
  // "기타"나 새로 추가한 채널(엔코스테이 등)도 흐릿한 회색 대신 눈에 띄는 고유 색을 자동으로 배정합니다.

  const ch = cleanKeyLoose(p && p.channel);
  return !!ch && ch !== INTERNAL_CHANNEL;
}
function externalChannelTimelineMeta(p){
  const ch = cleanKeyLoose(p && p.channel) || '외부채널';
  const color = channelColor(ch);
  return { key: `외부예약 · ${ch}`, fg: color, bg: color };
}

/* ---------------- root render ---------------- */
function render(){
  // 편집 중이라 미뤄뒀던 실시간 동기화 데이터가 있고, 이제는 편집이 끝나 안전하게 반영할 수
  // 있으면 화면을 그리기 직전에 적용한다.
  tryApplyPendingRemoteUpdate();
  tryApplyPendingContractUpserts();
  tryApplyPendingHistoryUpserts();
  renderTopNav();
  const main = document.getElementById('main');
  main.innerHTML = '';
  if(UI.view === 'stats'){ main.appendChild(renderStatsView()); return; }
  if(UI.view === 'admin'){ main.appendChild(renderAdminView()); return; }
  if(UI.view === 'cleaning'){ main.appendChild(renderCleaningView()); return; }
  // 정산 계산기(settlement)·연박 체크(staycheck)는 상단 메뉴에서 제외했다. 렌더 함수는
  // 그대로 남겨두었으니, 다시 노출하려면 여기 라우팅과 헤더 버튼만 되살리면 된다.
  // 연박 체크는 별도 페이지로 옮겼다: https://monthliv.github.io/Calculator/CheckDomitory.html
  if(UI.view === 'shortcuts'){ main.appendChild(renderShortcutsView()); return; }
  main.appendChild(renderBranchView());
}

function renderTopNav(){
  const sel = document.getElementById('branchSelect');
  sel.innerHTML = '';
  const placeholder = document.createElement('option');
  placeholder.value = ''; placeholder.textContent = '지점 선택';
  placeholder.selected = UI.view !== 'branch';
  sel.appendChild(placeholder);
  allowedBranches().forEach(br=>{
    const o = document.createElement('option');
    o.value = br.id; o.textContent = branchLabel(br);
    o.selected = UI.view === 'branch' && UI.branchId===br.id;
    sel.appendChild(o);
  });
  sel.onchange = ()=>{
    if(!sel.value) return;
    UI.view='branch'; UI.branchId = sel.value; UI.roomStatusFilter='전체'; render();
  };

  const cleaningBtn = document.getElementById('cleaningBtn');
  cleaningBtn.className = 'btn small' + (UI.view==='cleaning' ? ' primary' : '');
  cleaningBtn.onclick = ()=>{ UI.view = 'cleaning'; render(); };

  const shortcutsBtn = document.getElementById('shortcutsBtn');
  shortcutsBtn.className = 'btn small' + (UI.view==='shortcuts' ? ' primary' : '');
  shortcutsBtn.onclick = ()=>{ UI.view = 'shortcuts'; render(); };

  const adminBtn = document.getElementById('adminBtn');
  adminBtn.style.display = isSuperAdmin() ? '' : 'none';
  adminBtn.className = 'btn small' + (UI.view==='admin' ? ' primary' : '');
  adminBtn.onclick = ()=>{ UI.view = 'admin'; render(); };

  const forceSaveBtn = document.getElementById('forceSaveBtn');
  forceSaveBtn.style.display = canEdit() ? '' : 'none';
  forceSaveBtn.onclick = ()=>{
    if(saveInFlight) return;
    // 디바운스 대기 중(250ms)이던 자동저장이 있었다면 취소하고, 지금 즉시 저장한다 —
    // 수정 직후 몇 초 안에 새로고침하면 그 사이 저장이 아직 안 끝나 예전 데이터로
    // 되돌아가 보이는 문제를, 명시적으로 지금 저장을 끝내고 넘어갈 수 있게 해준다.
    clearTimeout(saveTimer); saveTimer = null;
    forceSaveBtn.disabled = true;
    saveState().finally(()=>{ forceSaveBtn.disabled = false; });
  };
}

function currentBranch(){
  const allowed = allowedBranches();
  if(!UI.branchId || !allowed.find(b=>b.id===UI.branchId)){
    UI.branchId = allowed[0] ? allowed[0].id : null;
  }
  return allowed.find(b=>b.id===UI.branchId);
}

/* ---------------- 상단 통합 검색 ---------------- */
function buildGlobalSearchIndex(){
  // 현재 입실중/입실예정 입실자는 DB.residents에 그대로 있고(퇴실일이 미래인 경우도 포함),
  // 이미 퇴실 처리된 입실자는 DB.residentHistory로 옮겨져 있으므로 둘 다 합쳐서 검색 대상으로 삼는다.
  const current = DB.residents.map(p=>{
    const room = DB.rooms.find(r=>r.id===p.roomId);
    if(!room) return null;
    const branch = DB.branches.find(b=>b.id===room.branchId);
    if(!branch || !hasBranchAccess(branch.id)) return null;
    return { kind:'resident', p, room, branch, isHistory:false };
  }).filter(Boolean);
  const past = DB.residentHistory.map(h=>{
    const room = DB.rooms.find(r=>r.id===h.roomId);
    if(!room) return null;
    const branch = DB.branches.find(b=>b.id===room.branchId);
    if(!branch || !hasBranchAccess(branch.id)) return null;
    return { kind:'resident', p:h, room, branch, isHistory:true };
  }).filter(Boolean);
  // 예약 중인 호실(방 카드의 "예약" 정보)도 검색 대상에 포함한다 — 입실자가 아니라 방 자체에
  // 붙어있는 정보라 별도 종류(kind:'reservation')로 다룬다.
  const reservations = DB.rooms.filter(r=>r.reserved).map(room=>{
    const branch = DB.branches.find(b=>b.id===room.branchId);
    if(!branch || !hasBranchAccess(branch.id)) return null;
    return { kind:'reservation', room, branch };
  }).filter(Boolean);
  // 계약현황(DB.contracts)의 계약자/입실자도 검색 대상에 포함한다 — 계약만 붙여넣어져 있고
  // 아직 입실자로 반영되지 않은 경우(예: "계약 확인 필요" 상태) 지금까지는 검색으로 전혀
  // 찾을 수 없었다. 이미 입실중/이력으로 잡히는 사람과 같은 방·같은 이름·같은 연락처로
  // 중복 표시되면 헷갈리므로, current·past에 이미 있는 사람은 계약 쪽에서는 제외한다.
  // 같은 방에 계약 이력이 여러 건 쌓여 있어도(연장 등) 사람당 한 줄만 나오도록, 방+이름+
  // 연락처 기준으로 묶어 계약일이 가장 최근인 것 하나만 대표로 남긴다.
  const coveredKeys = new Set(
    [...current, ...past].map(item=> `${item.room.id}|${cleanKeyLoose(item.p.name)}|${cleanKeyLoose(item.p.phone)}`)
  );
  const contractGroupMap = new Map();
  DB.contracts.forEach(c=>{
    const room = DB.rooms.find(r=>r.id===c.roomId);
    if(!room) return;
    const branch = DB.branches.find(b=>b.id===room.branchId);
    if(!branch || !hasBranchAccess(branch.id)) return;
    const name = (c.resident || c.contractor || '').trim();
    if(!name) return;
    const key = `${room.id}|${cleanKeyLoose(name)}|${cleanKeyLoose(c.contractorPhone)}`;
    if(coveredKeys.has(key)) return;
    const prev = contractGroupMap.get(key);
    if(!prev || (c.contractDate||'') >= (prev.c.contractDate||'')) contractGroupMap.set(key, { c, room, branch });
  });
  const contracts = [...contractGroupMap.values()].map(({c, room, branch})=> ({ kind:'contract', c, room, branch }));
  return [...current, ...past, ...reservations, ...contracts];
}
function globalSearchHaystack(item){
  if(item.kind === 'reservation'){
    const { room, branch } = item;
    const phoneDigits = (room.reservationPhone||'').replace(/\D/g,'');
    return [room.reservationName, room.reservationPhone, phoneDigits, room.number, branch.name, branch.shortName]
      .filter(Boolean).join(' ').toLowerCase();
  }
  if(item.kind === 'contract'){
    const { c, room, branch } = item;
    const phoneDigits = (c.contractorPhone||'').replace(/\D/g,'');
    return [c.resident, c.contractor, c.contractorPhone, phoneDigits, room.number, branch.name, branch.shortName]
      .filter(Boolean).join(' ').toLowerCase();
  }
  const { p, room, branch } = item;
  const phoneDigits = (p.phone||'').replace(/\D/g,'');
  // 대리결제인 경우 계약자 정보뿐 아니라 실입실자 이름/연락처로도 찾을 수 있어야 한다.
  const actualPhoneDigits = (p.actualResidentPhone||'').replace(/\D/g,'');
  return [p.name, p.phone, phoneDigits, p.actualResidentName, p.actualResidentPhone, actualPhoneDigits, p.carNumber, room.number, branch.name, branch.shortName]
    .filter(Boolean).join(' ').toLowerCase();
}
function runGlobalSearch(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  return buildGlobalSearchIndex().filter(item=> globalSearchHaystack(item).includes(q)).slice(0, 20);
}
function renderGlobalSearchResults(query){
  const box = document.getElementById('globalSearchResults');
  if(!box) return;
  const q = query.trim();
  if(!q){ box.style.display = 'none'; box.innerHTML = ''; return; }

  const results = runGlobalSearch(q);
  box.innerHTML = '';
  if(results.length===0){
    box.appendChild(el('div', 'header-search-empty', '검색 결과가 없습니다.'));
  } else {
    results.forEach((item)=>{
      const { room, branch } = item;
      const row = document.createElement('div');
      row.className = 'header-search-item';

      if(item.kind === 'reservation'){
        const top = document.createElement('div'); top.className = 'hs-top';
        top.appendChild(el('span', null, maskViewerName(room.reservationName) || '예약자명 미입력'));
        top.appendChild(el('span', 'badge muted', '예약'));
        row.appendChild(top);
        const periodText = room.reservationMoveIn ? ` (입실예정 ${room.reservationMoveIn}${room.reservationMoveOut ? '~'+room.reservationMoveOut : ''})` : '';
        row.appendChild(el('div', 'hs-sub', `${room.reservationPhone || '연락처 미입력'} · ${branchLabel(branch)} ${room.number}호${periodText}`));
        row.addEventListener('click', ()=>{
          UI.view = 'branch';
          UI.branchId = branch.id;
          scrollToRoomCard(room);
          const input = document.getElementById('globalSearchInput');
          if(input) input.value = '';
          box.style.display = 'none'; box.innerHTML = '';
        });
        box.appendChild(row);
        return;
      }

      if(item.kind === 'contract'){
        const { c } = item;
        const top = document.createElement('div'); top.className = 'hs-top';
        const displayName = c.resident || c.contractor || '이름 미입력';
        top.appendChild(el('span', null, maskViewerName(displayName)));
        top.appendChild(el('span', 'badge muted', '계약'));
        row.appendChild(top);
        row.appendChild(el('div', 'hs-sub', `${c.contractorPhone || '연락처 미입력'} · ${branchLabel(branch)} ${room.number}호 (계약기간 ${c.contractPeriod || '-'})`));
        row.title = '입실자로 반영되지 않았거나 이미 퇴실 처리된 계약 이력입니다. 클릭하면 계약현황을 확인할 수 있습니다.';
        row.addEventListener('click', ()=>{
          UI.view = 'branch';
          UI.branchId = branch.id;
          scrollToRoomCard(room);
          showContractHistoryModal(room);
          const input = document.getElementById('globalSearchInput');
          if(input) input.value = '';
          box.style.display = 'none'; box.innerHTML = '';
        });
        box.appendChild(row);
        return;
      }

      const { p, isHistory } = item;
      const top = document.createElement('div'); top.className = 'hs-top';
      top.appendChild(el('span', null, maskViewerName(p.name) || '이름 미입력'));
      const isUpcoming = !isHistory && computeResStatus(p) === '입실예정';
      const statusLabel = isHistory ? '퇴실' : (isUpcoming ? '입실예정' : '입실중');
      top.appendChild(el('span', 'badge' + (isHistory || isUpcoming ? ' muted' : ''), statusLabel));
      row.appendChild(top);

      const periodText = isHistory ? ` (${p.moveIn || '?'} ~ ${p.moveOut || '?'})` : '';
      row.appendChild(el('div', 'hs-sub', `${p.phone || '연락처 미입력'} · ${branchLabel(branch)} ${room.number}호${periodText}`));
      if(p.paymentProxy && (p.actualResidentName || p.actualResidentPhone)){
        row.appendChild(el('div', 'hs-sub', `실입실자 ${maskViewerName(p.actualResidentName) || '-'} ${p.actualResidentPhone || '-'}`));
      }

      row.addEventListener('click', ()=>{
        UI.view = 'branch';
        UI.branchId = branch.id;
        scrollToRoomCard(room);
        // 퇴실자를 누르면 그 방의 이력 창을 입퇴실 탭으로 열고 해당 기록을 강조한다.
        if(isHistory) showRoomHistoryModal(room, '입퇴실', p.id);
        const input = document.getElementById('globalSearchInput');
        if(input) input.value = '';
        box.style.display = 'none'; box.innerHTML = '';
      });
      box.appendChild(row);
    });
  }
  box.style.display = '';
}

  const rooms = DB.rooms.filter(r=>r.branchId===branch.id);
  const overdueRooms = rooms.filter(r=>roomHasOverdueResident(r))
    .sort((a,b)=> a.number.localeCompare(b.number,'ko',{numeric:true}));
  if(overdueRooms.length===0) return null;

  const box = document.createElement('div');
  box.className = 'overdue-banner';

  const icon = document.createElement('span');
  icon.className = 'overdue-banner-icon';
  icon.textContent = '📢';
  box.appendChild(icon);

  const body = document.createElement('div');
  body.className = 'overdue-banner-body';
  const title = document.createElement('div');
  title.className = 'overdue-banner-title';
  title.textContent = `연체 중인 입실자가 있는 호실이 ${overdueRooms.length}개 있어요`;
  body.appendChild(title);

  const roomsWrap = document.createElement('div');
  roomsWrap.className = 'overdue-banner-rooms';
  overdueRooms.forEach(room=>{
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'overdue-room-chip';
    chip.textContent = room.number + '호';
    chip.title = '해당 호실로 이동';
    chip.onclick = ()=> scrollToRoomCard(room);
    roomsWrap.appendChild(chip);
  });
  body.appendChild(roomsWrap);
  box.appendChild(body);

  return box;
}

const UPCOMING_SOON_DAYS_OPTIONS = [1,3,5,7];
const UPCOMING_SOON_DAYS_DEFAULT = 7;
function renderBranchUpcomingCards(branch){
  const soonDays = UPCOMING_SOON_DAYS_OPTIONS.includes(UI.upcomingSoonDays) ? UI.upcomingSoonDays : UPCOMING_SOON_DAYS_DEFAULT;
  const today = todayISO();
  const soonEnd = addDaysISO(today, soonDays);
  const rooms = DB.rooms.filter(r=>r.branchId===branch.id);
  const roomIds = new Set(rooms.map(r=>r.id));

  const moveInItems = DB.residents
    .filter(p=> roomIds.has(p.roomId) && computeResStatus(p)==='입실예정' && p.moveIn && p.moveIn<=soonEnd)
    .map(p=> ({ room: rooms.find(r=>r.id===p.roomId), date: p.moveIn, name: maskViewerName(p.name) || '이름 미입력' }))
    .sort((a,b)=> a.date.localeCompare(b.date));

  const moveOutItems = DB.residents
    .filter(p=> roomIds.has(p.roomId) && p.scheduledToLeave && p.moveOut && p.moveOut>=today && p.moveOut<=soonEnd)
    .map(p=> ({ room: rooms.find(r=>r.id===p.roomId), date: p.moveOut, name: maskViewerName(p.name) || '이름 미입력' }))
    .sort((a,b)=> a.date.localeCompare(b.date));

  // 계약만료 예정은 "지금 이 방에 실제로 살고 있는 입실자"를 기준으로 판단한다.
  // 계약 기록만 보고 판단하던 예전 방식은 세 가지 문제가 있었다.
  //  (1) 이미 퇴실해서 입실자 목록에 없는 사람도, 그 사람 계약의 종료일이 남아 있으면 계속
  //      "곧 만료"로 노출됐다(예: 이미 비어있는 방인데 이전 입실자가 퇴실 예정으로 표시).
  //  (2) 계약 데이터가 없는 외부 채널 예약(엔코스테이·리브애니웨어 등)은 영원히 빠졌다.
  //  (3) "가장 최근 계약"을 계약 등록일 기준으로 골라서, 추가결제처럼 나중에 등록된 짧은
  //      계약이 있으면 실제 만료일보다 이른 날짜가 표시됐다.
  const contractEndItems = [];
  rooms.forEach(room=>{
    DB.residents.filter(p=> p.roomId===room.id && isCurrentlyResiding(p)).forEach(p=>{
      if(p.scheduledToLeave) return; // 이미 퇴실확정된 사람은 퇴실확정 카드에서 다룬다
      const end = residentContractEndDate(p, room);
      if(!end || end < today || end > soonEnd) return;
      contractEndItems.push({ room, date: end, name: maskViewerName(residentDisplayName(p)) || '이름 미입력' });
    });
  });
  contractEndItems.sort((a,b)=> a.date.localeCompare(b.date));

  function card(title, items){
    const box = document.createElement('div');
    box.className = 'stat-section cleaning-card';
    box.innerHTML = `<h3>${title} <span class="cnt-badge">${items.length}</span></h3>`;
    if(items.length===0){
      box.appendChild(el('div','cleaning-empty','해당하는 호실이 없습니다.'));
      return box;
    }
    items.forEach(item=>{
      const entry = document.createElement('div');
      entry.className = 'cleaning-entry';
      const row = document.createElement('div');
      row.className = 'cleaning-row';
      row.innerHTML = `<span class="rm">${esc(item.room.number)}호</span><span class="kind"><span class="upcoming-name">${esc(item.name)}</span><span class="mdate">${esc(item.date.slice(5))}</span></span>`;
      row.style.cursor = 'pointer';
      row.title = '클릭 시 호실로 이동';
      row.onclick = ()=> scrollToRoomCard(item.room);
      entry.appendChild(row);
      box.appendChild(entry);
    });
    return box;
  }

  const outer = document.createElement('div');

  const toolbar = document.createElement('div');
  toolbar.className = 'upcoming-days-toolbar';
  const label = document.createElement('span');
  label.className = 'upcoming-days-label';
  label.textContent = '노출 기준';
  toolbar.appendChild(label);
  UPCOMING_SOON_DAYS_OPTIONS.forEach(d=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn small' + (soonDays === d ? ' primary' : '');
    btn.textContent = `${d}일`;
    btn.onclick = ()=>{ UI.upcomingSoonDays = d; render(); };
    toolbar.appendChild(btn);
  });
  outer.appendChild(toolbar);

  const wrap = document.createElement('div');
  wrap.className = 'upcoming-cards-grid';
  wrap.appendChild(card(`입실예정 (${soonDays}일 이내)`, moveInItems));
  wrap.appendChild(card(`계약만료 (${soonDays}일 이내)`, contractEndItems));
  wrap.appendChild(card(`퇴실확정 (${soonDays}일 이내)`, moveOutItems));
  outer.appendChild(wrap);
  return outer;
}

function renderBranchView(){
  const wrap = document.createElement('div');
  const branch = currentBranch();
  if(!branch){
    wrap.innerHTML = '<div class="empty-hint">지점이 없습니다. 상단의 "+ 지점 추가"로 시작하세요.</div>';
    return wrap;
  }
  wrap.appendChild(renderBranchInfoBar(branch));

  if(USER_ROLE !== 'viewer'){
    const overdueBanner = renderOverdueBanner(branch);
    if(overdueBanner) wrap.appendChild(overdueBanner);
  }

  wrap.appendChild(renderBranchUpcomingCards(branch));

  const subnav = document.createElement('div');
  subnav.className = 'subnav';
  [['rooms','호실 현황'],['timeline','타임라인']].forEach(([key,label])=>{
    const b = document.createElement('button');
    b.textContent = label;
    b.className = UI.branchTab===key ? 'active' : '';
    b.onclick = ()=>{ UI.branchTab = key; render(); };
    subnav.appendChild(b);
  });
  wrap.appendChild(subnav);

  if(UI.branchTab === 'timeline') wrap.appendChild(renderTimelineSection(branch));
  else wrap.appendChild(renderRoomsSection(branch));
  return wrap;
}

function renderBranchInfoBar(branch){
  const wrap = document.createElement('div');
  const editOn = !!UI.branchEditMode[branch.id];
  const infoOpen = editOn || !!UI.branchInfoOpen[branch.id];

  const pencil = document.createElement('button');
  pencil.className = 'iconbtn branch-edit-pencil' + (editOn ? ' active' : '');
  pencil.innerHTML = editOn ? '&#10003;' : '&#9998;';
  pencil.title = editOn ? '수정 완료' : '지점 정보 수정';
  pencil.onclick = ()=>{
    if(!editOn){ UI.branchSnapshots[branch.id] = Object.assign({}, branch); }
    else { delete UI.branchSnapshots[branch.id]; }
    UI.branchEditMode[branch.id] = !editOn; render();
  };

  const bar = document.createElement('div');
  bar.className = 'branch-bar';

  // ---- 지점명 ----

  // ---- 정보 표 (주소·주차·시설 정보를 2열 표로 압축 배치) ----
  function parkingGroupNote(){ return branchParkingGroupSuffix(branch); }
  // 입실자 차량 + 외부(입실자 아닌) 등록 차량을 합쳐서 "이용중" 대수로 보여준다.
  function combinedParkingItems(){
    const residentItems = branchActiveCarResidents(branch).map(item=>({
      roomText: `${item.roomNumber}호`, name: item.name, carNumber: item.carNumber, branchLabel: item.branchLabel, external:false
    }));
    const externalItems = branchExternalParkingList(branch).map(item=>({
      roomText: '외부', name: item.label, carNumber: item.carNumber, branchLabel: item.branchLabel, external:true, id: item.id, branchId: item.branchId
    }));
    return [...residentItems, ...externalItems];
  }
  function renderParkingListRow(item, editable){
    const row = document.createElement('div');
    row.className = 'parking-list-row';
    const prefix = item.branchLabel ? `[${esc(item.branchLabel)}] ` : '';
    row.innerHTML = `<span class="rm">${prefix}${esc(item.roomText)}</span><span class="nm">${esc(item.name)}</span><span class="car">${esc(item.carNumber)}</span>`;
    if(item.external && editable){
      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'iconbtn';
      delBtn.innerHTML = '&times;';
      delBtn.title = '외부 주차 삭제';
      delBtn.style.cssText = 'margin-left:6px;flex-shrink:0;';
      delBtn.onclick = ()=>{
        showConfirm(`"${item.name}" (${item.carNumber}) 외부 주차 등록을 삭제할까요?`, ()=>{
          const targetBranch = DB.branches.find(b=>b.id===item.branchId) || branch;
          const list = targetBranch.externalParking || [];
          const idx = list.findIndex(x=>x.id===item.id);
          if(idx>=0) list.splice(idx,1);
          logChange(`"${targetBranch.name}" 외부 주차 삭제: ${item.name} ${item.carNumber}`);
          scheduleSave(); render();
        });
      };
      row.appendChild(delBtn);
    }
    return row;
  }
  function openAddExternalParkingModal(){
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const box = document.createElement('div');
    box.className = 'modal-box';
    box.appendChild(el('div', 'modal-msg', '외부 주차 등록', 'margin-bottom:12px;font-weight:700;'));
    const labelInput = document.createElement('input');
    labelInput.type = 'text'; labelInput.placeholder = '예: 직원, 사장님 등';
    const labelRow = labeled('이름/설명', labelInput);
    labelRow.style.marginBottom = '10px';
    const carInput = document.createElement('input');
    carInput.type = 'text'; carInput.placeholder = '12가3456';
    const carRow = labeledReq('차량번호', carInput);
    carRow.style.marginBottom = '14px';
    box.appendChild(labelRow); box.appendChild(carRow);
    const btnRow = document.createElement('div');
    btnRow.className = 'modal-btn-row';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn'; cancelBtn.textContent = '취소';
    cancelBtn.onclick = ()=> overlay.remove();
    const okBtn = document.createElement('button');
    okBtn.className = 'btn primary'; okBtn.textContent = '등록';
    okBtn.onclick = ()=>{
      const carNumber = carInput.value.trim();
      if(!carNumber){ showAlert('차량번호를 입력해주세요.'); return; }
      const cap = branchParkingCapCeiling(branch);
      const others = branchActiveCarCount(branch);
      if(others + 1 > cap){
        showAlert(`"${branch.name}" 지점의 주차 가능 대수(${cap}대)${parkingGroupNote()}를 초과합니다.\n(현재 이용중 ${others}대 + 외부 주차 1대 = ${others+1}대)\n\n먼저 주차 가능 대수를 늘려주세요.`);
        return;
      }
      const label = labelInput.value.trim();
      if(!branch.externalParking) branch.externalParking = [];
      branch.externalParking.push({ id: uid('ep'), label: label || '외부', carNumber });
      logChange(`"${branch.name}" 외부 주차 등록: ${label || '외부'} ${carNumber}`);
      scheduleSave(); overlay.remove(); render();
    };
    btnRow.appendChild(cancelBtn); btnRow.appendChild(okBtn);
    box.appendChild(btnRow);
    overlay.appendChild(box);
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });
    document.body.appendChild(overlay);
  }
  function parkingView(){
    const div = document.createElement('div');
    const items = combinedParkingItems();
    const cap = branch.parkingCapacity || 0;
    const summary = document.createElement('div');
    if(cap===0){
      summary.className = 'parking-summary parking-unavailable';
      summary.textContent = '⚠ 주차 불가';
    } else {
      summary.className = 'parking-summary';
      summary.innerHTML = `전체 ${cap}대${esc(parkingGroupNote())} / 이용중 <span class="parking-active-toggle">${items.length}대</span>`;
      summary.querySelector('.parking-active-toggle').onclick = ()=>{ UI.parkingListOpen[branch.id] = !UI.parkingListOpen[branch.id]; render(); };
    }
    div.appendChild(summary);
    if(UI.parkingListOpen[branch.id] && cap!==0){
      const list = document.createElement('div');
      list.className = 'parking-list';

  function textField(field, placeholder, logLabel){
    return {
      view: ()=> document.createTextNode(branch[field] || '-'),
      edit: ()=>{
        const input = document.createElement('input');
        input.type = 'text'; input.placeholder = placeholder; input.value = branch[field] || '';
        input.addEventListener('input', ()=>{ logChange(`"${branch.name}" ${logLabel} 수정`); branch[field] = input.value; scheduleSave(); });
        return input;
      }
    };
  }
  function feeField(field, placeholder, logLabel){
    return {
      view: ()=> document.createTextNode(branch[field] ? formatWon(branch[field]) : '-'),
      edit: ()=>{
        const input = document.createElement('input');
        input.type = 'number'; input.min = '0'; input.step = '1000'; input.placeholder = placeholder; input.value = branch[field] || 0;
        input.addEventListener('input', ()=>{ logChange(`"${branch.name}" ${logLabel} 수정`); branch[field] = Number(input.value) || 0; scheduleSave(); });
        return input;
      }
    };
  }
  function boolField(field, trueLabel, falseLabel, logLabel, hint, onChange){
    return {
      view: ()=> document.createTextNode(branch[field] ? trueLabel : falseLabel),
      edit: ()=>{
        const label = document.createElement('label');
        label.style.cssText = 'display:flex; align-items:center; gap:6px; font-weight:400; cursor:pointer; white-space:nowrap;';
        if(hint) label.title = hint;
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        // .branch-info-table input{ width:100% } 규칙이 체크박스에도 그대로 걸려서(다른 텍스트
        // 입력칸용 규칙인데) 왼쪽 박스 줄과 어긋나 보였다 — 체크박스는 원래 크기로 고정한다.
        checkbox.style.cssText = 'width:auto; flex:none;';
        checkbox.checked = !!branch[field];
        checkbox.addEventListener('change', ()=>{
          logChange(`"${branch.name}" ${logLabel} ${checkbox.checked ? '설정' : '해제'}`);
          branch[field] = checkbox.checked;
          if(onChange) onChange(checkbox.checked);
          scheduleSave(); render();
        });
        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(trueLabel));
        return label;
      }

  }

  const infoRows = [
    { label:'주차', view: parkingView, edit: parkingEdit },
    { label:'주차비용', ...textField('parkingFee', '예: 30000원', '주차비용') },
    { label:'엘리베이터', ...textField('elevator', '예: 있음', '엘리베이터 정보') },

    { label:'1인 추가금', ...textField('doubleOccupancyFee', '예: 100000원', '1인 추가금') },

    { label:'종량제 봉투', ...textField('trashBagLocation', '예: 1층 관리실', '종량제 봉투 보관위치') },
    // 정산 수수료율·보증금 관리·보증금·환불계좌는 이 대시보드에서 관리하는 항목이 아니라
    // 화면에서 제외했다(실제 운영은 다른 곳에서 이뤄진다). 저장된 값 자체는 지우지 않았고,
    // 정산 계산기를 다시 노출하면 그대로 쓸 수 있다.
  ];

  if(infoOpen){
    const infoCol = document.createElement('div'); infoCol.className = 'col';
    const table = document.createElement('table');
    table.className = 'branch-info-table';
    const tbody = document.createElement('tbody');
    for(let i=0; i<infoRows.length; i+=2){
      const tr = document.createElement('tr');
      [infoRows[i], infoRows[i+1]].forEach(row=>{
        const th = document.createElement('td'); th.className = 'bi-label';

      tbody.appendChild(tr);

    table.appendChild(tbody);
    infoCol.appendChild(table);
    bar.appendChild(infoCol);

    // ---- 출입문 비번 ----
    const doorCol = document.createElement('div'); doorCol.className = 'col';
    doorCol.appendChild(el('h3', null, '출입문 비번'));
    if(editOn){
      const doorInput = document.createElement('input');
      doorInput.type = 'text'; doorInput.placeholder = '예: *1234#'; doorInput.value = branch.doorPasscode || '';
      doorInput.addEventListener('input', ()=>{ logChange(`"${branch.name}" 출입문 비번 수정`); branch.doorPasscode = doorInput.value; scheduleSave(); });
      doorCol.appendChild(doorInput);
    } else {
      doorCol.appendChild(el('div', 'branch-view-text', branch.doorPasscode || '-'));
    }
    bar.appendChild(doorCol);

    // ---- 기타 특이사항 (맨 하단) ----
    const memoCol = document.createElement('div'); memoCol.className = 'col';
    memoCol.appendChild(el('h3', null, '기타 특이사항'));
    if(editOn){
      const memoArea = document.createElement('textarea');
      memoArea.placeholder = '지점 전체 공지/특이사항';

      memoCol.appendChild(memoArea);
      memoCol.appendChild(renderMemoStyleControls(branch, 'memoColor', 'memoBold'));
    } else {

      if(branch.memo){

      memoCol.appendChild(memoDiv);
    }
    bar.appendChild(memoCol);
  }

  wrap.appendChild(bar);

  if(editOn){
    const btnRow = document.createElement('div');
    btnRow.style.cssText = 'display:flex;gap:8px;margin-top:10px;';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn small';
