      showConfirm(`"${branch.name}" 지점과 소속 호실/입실자 정보를 모두 삭제할까요?`, ()=>{
        DB.rooms = DB.rooms.filter(r=>{
          if(r.branchId===branch.id){ DB.residents = DB.residents.filter(p=>p.roomId!==r.id); return false; }
          return true;
        });
        DB.branches = DB.branches.filter(b=>b.id!==branch.id);
        UI.branchId = null;
        logChange(`"${branch.name}" 지점 삭제`);
        scheduleSave(); render();
      });
    };
    btnRow.appendChild(cancelBtn); btnRow.appendChild(delBtn);
    wrap.appendChild(btnRow);
  }

  return wrap;
}

/* ---------------- rooms section ---------------- */
function roomNumberTaken(branchId, number, excludeRoomId){
  const norm = String(number).replace(/[\u200B-\u200D\uFEFF]/g,'').trim().toLowerCase();
  return DB.rooms.some(r => r.branchId===branchId && r.id!==excludeRoomId && String(r.number).replace(/[\u200B-\u200D\uFEFF]/g,'').trim().toLowerCase()===norm);
}

function roomHasScheduledLeaveResident(room){
  return DB.residents.some(p => p.roomId===room.id && p.scheduledToLeave && isCurrentlyResiding(p));
}
function roomIsLeavingSoon(room){
  return roomHasScheduledLeaveResident(room) || effectiveRoomStatus(room)==='퇴실확정';
}
function roomHasPaymentProxy(room){
  return DB.residents.some(p=> p.roomId===room.id && p.paymentProxy);
}
function roomHasJustImportedResident(room){
  return DB.residents.some(p=> p.roomId===room.id && p.justImported);
}
function roomHasDoubleOccupancy(room){
  return DB.residents.some(p=> p.roomId===room.id && p.doubleOccupancy);
}
const ROOM_TAB_LIST = ['전체', ...STATUS_LIST_STATS, '대리결제', '예약', '2인 거주'];
function roomsInFilterTab(rooms, s){
  if(s === '전체') return rooms;
  if(s === '퇴실확정') return rooms.filter(roomIsLeavingSoon);
  if(s === '대리결제') return rooms.filter(roomHasPaymentProxy);
  // "예약"에는 스태프가 직접 체크한 예약 플래그뿐 아니라, 입실예정일이 많이 남아 "입실확정"으로
  // 분류된 방(effectiveRoomStatus 참고)도 예약 건으로 합산한다 — 둘 다 "아직 실입주는 없지만
  // 이 방은 향후 특정 입실자에게 배정돼있다"는 같은 의미라, 대시보드 수치와 여기 목록이 항상
  // 일치하도록 같은 조건을 쓴다.
  if(s === '예약') return rooms.filter(r=> r.reserved || roomTabs(r).includes('입실확정'));
  if(s === '계약 확인 필요') return rooms.filter(roomHasJustImportedResident);
  if(s === '2인 거주') return rooms.filter(roomHasDoubleOccupancy);
  return rooms.filter(r=> roomTabs(r).includes(s));
}
function renderRoomsSection(branch){
  const wrap = document.createElement('div');
  const rooms = DB.rooms.filter(r=>r.branchId===branch.id);

  const status = UI.roomStatusFilter || '전체';
  const meta = statusMeta(status);

  const toolbar = document.createElement('div');
  toolbar.className = 'room-toolbar';
  const legend = document.createElement('div');
  legend.className = 'legend';
  // "계약 확인 필요"는 계약 데이터 붙여넣기로 새로 등록되었거나 계약 이력이 갱신된 입실자를
  // 담당자가 확인하기 전까지만 임시로 보여주는 탭이라, 해당 지점에 대상이 있을 때만 노출한다.
  const tabList = rooms.some(roomHasJustImportedResident) ? [...ROOM_TAB_LIST, '계약 확인 필요'] : ROOM_TAB_LIST;
  tabList.forEach(s=>{
    const m = statusMeta(s);
    const cnt = roomsInFilterTab(rooms, s).length;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'badge legend-btn' + (status === s ? ' active' : '');
    btn.style.background = m.bg; btn.style.color = m.fg;
    btn.innerHTML = `<span class="dot" style="background:${m.fg}"></span>${s}(${cnt})`;
    btn.title = `${s} 호실만 모아보기`;
    btn.onclick = ()=>{ UI.roomStatusFilter = s; render(); };
    legend.appendChild(btn);
  });
  toolbar.appendChild(legend);
  wrap.appendChild(toolbar);

  if(rooms.length===0){
    wrap.appendChild(el('div','empty-hint','등록된 호실이 없습니다.'));
    return wrap;
  }

  const inStatus = roomsInFilterTab(rooms, status)
    .sort((a,b)=> a.number.localeCompare(b.number,'ko',{numeric:true}));

  const section = document.createElement('div');
  section.className = 'status-section';
  const head = document.createElement('div');
  head.className = 'sec-head';
  head.style.borderColor = meta.fg;
  head.innerHTML = `
    <span class="dot" style="background:${meta.fg}"></span>
    <span class="name" style="color:${meta.fg}">${status}</span>
    <span class="count-badge" style="background:${meta.bg};color:${meta.fg};">${inStatus.length}개</span>
  `;
  section.appendChild(head);

  if(inStatus.length===0){
    section.appendChild(el('div','sec-empty', `${status} 상태의 호실이 없습니다.`));
  } else {
    const grid = document.createElement('div');
    grid.className = 'grid-rooms';
    inStatus.forEach(room => grid.appendChild(renderRoomCard(room, status)));
    section.appendChild(grid);
  }
  wrap.appendChild(section);

  return wrap;
}

function addResidentToRoom(room){
  const cap = occupancyCapacity(room);
  const confirmedCount = DB.residents.filter(p=>p.roomId===room.id).length;
  const hasDraft = !!UI.draftResident[room.id];
  if(confirmedCount + (hasDraft?1:0) >= cap){
    showAlert(`이 호실(${room.occupancy || '2인실'})은 최대 ${cap}인까지만 입실 가능합니다.`);
    return;
  }
  const p = { id: uid('p'), roomId: room.id, name:'', channel:'독립생활', resStatus:'', contractType:'신규',
    moveIn: todayISO(), moveOut:'', originalMoveIn:'', scheduledToLeave:false, phone:'', memo:'', carNumber:'', firstSaveDone:false, slotIndex: confirmedCount,
    paymentProxy:false, actualResidentName:'', actualResidentPhone:'' };
  p.resStatus = computeResStatus(p);
  // 최초 입력 중에는 DB에 반영하지 않고 화면(초안) 상태로만 유지합니다.
  // "완료"를 눌러야 실제로 저장되고, 취소/새로고침 시 남지 않습니다.
  UI.draftResident[room.id] = p;
  render();
}
function roomHasVacatingResident(room){
  return DB.residents.some(p=>p.roomId===room.id && (p.scheduledToLeave || p.pendingRoomMove));
}
function roomHasUpcomingResident(room){
  // 이미 등록된 입실예정자가 있어도, 그 사람이 단기 이용 후 퇴실확정된 상태라면 "다음 예약자"를
  // 미리 등록할 수 있어야 하므로, 퇴실확정된 입실예정자는 여기서 제외한다.
  return DB.residents.some(p=>p.roomId===room.id && computeResStatus(p)==='입실예정' && !p.scheduledToLeave);
}
function addUpcomingResidentToRoom(room){
  if(UI.draftResident[room.id]){
    showAlert('이미 등록 중인 입실자가 있습니다. 먼저 완료하거나 취소해주세요.');
    return;
  }
  const leaving = DB.residents.filter(p=>p.roomId===room.id && p.scheduledToLeave);
  const defaultMoveIn = leaving.length===1 ? (leaving[0].moveOut || '') : '';
  // 정원이 이미 찬 방이지만, 현재 입실자가 모두 퇴실예정으로 확정된 경우에 한해
  // 다음 입실자를 미리 등록할 수 있도록 slotIndex 0(주 입실자 자리)을 그대로 사용합니다.
  // 실제 퇴실 처리(moveResidentToHistory)가 되면 기존 입실자만 제거되어 자연스럽게 정리됩니다.
  const p = { id: uid('p'), roomId: room.id, name:'', channel:'독립생활', resStatus:'', contractType:'신규',
    moveIn: defaultMoveIn, moveOut:'', originalMoveIn:'', scheduledToLeave:false, phone:'', memo:'', carNumber:'', firstSaveDone:false, slotIndex:0,
    paymentProxy:false, actualResidentName:'', actualResidentPhone:'' };
  p.resStatus = computeResStatus(p);
  UI.draftResident[room.id] = p;
  render();
}

/* ---------------- room card: view mode ---------------- */
function computeResStatus(p){
  // 입실 시작일 기준 자동 계산 (화면에는 노출하지 않고 내부 데이터로만 사용)
  if(!p.moveIn) return p.resStatus || '입실중';
  const today = todayISO();
  if(p.moveIn > today) return '입실예정';
  if(p.moveIn === today) return '입실중';
  return '퇴실';
}
function isCurrentlyResiding(p){
  // 입실일이 이미 지났고(오늘 포함) 아직 퇴실 처리가 되지 않았다면 "이용중"으로 간주합니다.
  // 퇴실예정일이 지났더라도 실제 퇴실 처리(히스토리 이동) 전까지는 계속 이용중으로 봅니다.
  if(!p.moveIn) return false;
  return p.moveIn <= todayISO();
}
function isOverdue(p){
  return !!(p.moveOut && p.moveOut < todayISO());
}
function isUpcoming(p){
  return !!(p.moveIn && p.moveIn > todayISO());
}
function occupiesRoom(p){
  return isCurrentlyResiding(p) || isUpcoming(p);
}
// 퇴실일에 방이 비는지 판단할 때 "계속 사는 사람"으로 셀 입실자인지: 퇴실일 이전부터 살고 있었고(입실일<퇴실일)
// 퇴실일 이후에도 계속 사는(퇴실일이 없거나 그 뒤) 사람만 해당한다(2인실 룸메이트 등). 퇴실청소 판단에 쓴다.
//  - 퇴실일 당일에 들어오는 새 입실자는 세지 않는다 — 당일 청소하고 당일 입실시키는 경우가 있어서, 그 입실자
//    때문에 퇴실청소가 안 걸리면 안 된다(담당자 요청, 예전 residesOnDate는 당일 입실자도 "그날 거주"로 셌다).
//  - occupiesRoom()은 "오늘" 기준으로 미래의 아무 때나 입실 예정이기만 하면 true라서, 몇 달 뒤에나 입실할
//    예약자 때문에 "지금 나가는 사람이 있는데도 방이 안 빈다"고 잘못 판단한다(마곡발산 902호, 성수 301호).
function keepsLivingThrough(p, leaveDate){
  if(!p.moveIn || !leaveDate) return false;
  return p.moveIn < leaveDate && (!p.moveOut || p.moveOut > leaveDate);
}
function roomHasOverdueResident(room){
  return DB.residents.some(p => p.roomId===room.id && isOverdue(p));
}
// 만기/중도 퇴실 예약(아직 실제로 퇴실 처리되진 않은 미래 날짜)과 실제 퇴실 처리(당일퇴실,
// 또는 예약일이 지나 처리되는 경우) 둘 다 이 방이 앞으로 비게 될 예정이면 퇴실청소 날짜를
// 같은 방식으로 미리 표시해준다. sourceResidentId를 남겨두면, 그 입실자가 나중에 연장으로
// 마음을 바꿨을 때 이 플래그가 그 사람 때문에 걸린 것인지 알 수 있어 안전하게 되돌릴 수 있다
// (실제로 퇴실 처리된 경우처럼 되돌릴 대상이 없을 땐 생략한다).
// AUTO_CLEANING_EXCLUDED_BRANCH_NAMES(제주·오산 등)는 일반 고시원과 다르게 운영되어(현장에서
// 별도로 청소를 관리), 퇴실확정되어도 청소필요 플래그를 자동으로 걸지 않는다 — 이 함수 하나만
// 막으면 실제 퇴실 처리·만기퇴실 예약·중도퇴실 예약(호출부 3곳) 모두 자동으로 제외된다.
function flagUpcomingCleaning(room, cleaningBaseDate, sourceResidentId){
  if(isAutoCleaningExcludedBranch(roomBranch(room))) return;
  room.needsCleaning = true;
  room.needsRetouch = false;
  room.needsExtraCleaning = false;
  room.maintenanceDate = nextMonWedFri(cleaningBaseDate);
  room.maintenanceMemo = '';
  room.cleaningFlagSourceId = sourceResidentId || null;
}
// 이 입실자(excludeId)가 빠지고 나서도 그 방에 남아있는 재실/입실예정 입실자가 있는지 확인한다.
// roomHasActiveResident와 달리, 아직 DB.residents에서 빠지지 않은(=아직 퇴실 예약 상태인)
// 입실자 본인은 셈에서 제외해야 "이 사람이 나가면 방이 비는지"를 정확히 판단할 수 있다.
// 예전에는 occupiesRoom()을 써서 "미래에 입실 예정"이기만 하면(아무리 먼 미래라도) 무조건
// 방이 안 빈다고 봤는데, 그러면 몇 달 뒤에나 입실할 다음 입실자가 이미 등록돼 있다는 이유만
// 으로 지금 나가는 사람의 퇴실청소가 걸리지 않는 문제가 있었다(마곡발산 902호 등). 이 사람이
// 실제로 나가는 날(퇴실일) 기준으로, 그날 실제로 거주 중인 다른 입실자가 있을 때만 "방이 안
// 빈다"고 판단해야 한다 — 다음 입실자가 그날 이후에나 들어온다면 그 사이는 빈 방이므로 청소가
// 필요하다.
function roomWouldBeVacantExcept(room, excludeId){
  const leaver = DB.residents.find(x=> x.id===excludeId);
  const asOfDate = (leaver && leaver.moveOut) || todayISO();
  return !DB.residents.some(x=> x.roomId===room.id && x.id!==excludeId && keepsLivingThrough(x, asOfDate));
}
// 퇴실 예약 때문에 미리 걸어둔 퇴실청소 플래그를, 정작 그 입실자가 연장해서 계속 거주하기로
// 하면 취소한다. cleaningFlagSourceId로 "이 사람 때문에" 걸린 플래그인지 확인하므로, 다른
// 이유(2인실의 다른 입실자가 실제로 퇴실한 경우 등)로 이미 걸려있는 플래그는 건드리지 않는다.
function clearCleaningFlagIfSourcedFrom(room, residentId){
  if(room && room.cleaningFlagSourceId && room.cleaningFlagSourceId === residentId){
    room.needsCleaning = false;
    room.maintenanceDate = '';
    room.maintenanceMemo = '';
    room.cleaningFlagSourceId = null;
  }
}
function moveResidentToHistory(p, moveOutOverride){
  logChange(`${p.name || '입실자'} 퇴실 처리`);
  const historyEntry = {
    // movedAt: 이 이력이 등록된 실제 시각. 계약의 importedAt과 같은 역할로, 실시간 구독의
    // 커서로 쓴다(내가 이미 가진 것보다 나중에 등록된 것만 받아오기 위해).
    movedAt: new Date().toISOString(),
    id: uid('h'), roomId: p.roomId,
    name: p.name || '(이름 미입력)', phone: p.phone || '',
    // 연장/직접 수정 등으로 입실일이 최초 등록 시점 이후 바뀌었을 수 있으므로, 항상 카드에
    // 남아있는 "지금" 값(p.moveIn)을 남긴다 — 최초 등록 당시 값(originalMoveIn)을 쓰면 그
    // 사이의 수정 내역이 무시되고 이전 기간으로 되돌아가 버린다.
    moveIn: p.moveIn || '', moveOut: moveOutOverride || p.moveOut || todayISO(),
    sourceContractId: p.sourceContractId || null,
    // 퇴실 처리 시점까지 입실자 카드에서 수정된 내용을 그대로 이력에 남긴다 — memo/대리결제/
    // 2인 거주 여부 등은 카드가 저장하고 있는 최신 값이 곧 여기서 남겨야 할 값이다.
    channel: p.channel || '', carNumber: p.carNumber || '',
    memo: p.memo || '', memoColor: p.memoColor || 'black', memoBold: !!p.memoBold,
    paymentProxy: !!p.paymentProxy, actualResidentName: p.actualResidentName || '', actualResidentPhone: p.actualResidentPhone || '',
    doubleOccupancy: !!p.doubleOccupancy
  };
  DB.residentHistory.push(historyEntry);
  RESIDENT_HISTORY_COL.doc(historyEntry.id).set(historyEntry).catch(e=> console.error('퇴실 이력 저장 실패:', e));
  refreshHistoryCache();
  DB.residents = DB.residents.filter(x=>x.id!==p.id);
  delete UI.residentEditMode[p.id];
  delete UI.residentSnapshots[p.id];
  // 마지막 재실 입실자가 퇴실한 뒤에도 저장된 상태값이 "이용중"처럼 더 이상 유효하지 않게
  // 남아있으면(과거 데이터 등) 공실로 정리합니다. 그 외에는 관리자가 이미 설정해둔 판매
  // 상태(공실/판매보류)와 판매중 플래그(room.forSale)를 그대로 유지하며, 자동으로 바꾸지 않습니다.
  const room = DB.rooms.find(r=>r.id===p.roomId);
  if(room && !roomHasActiveResident(room)){
    if(!STATUS_LIST_MANUAL.includes(room.saleStatus)){
      room.saleStatus = '공실';
    }
  }
  // 퇴실청소는 "이 사람이 나간 날 방이 비는지"로 판단한다 — 퇴실확정 때(roomWouldBeVacantExcept)와 같은 기준
  // (keepsLivingThrough). 예전에는 roomHasActiveResident(먼 미래의 입실예정자도 재실로 셈)를 써서, 다음
  // 입실자가 미리 등록돼 있기만 하면 당일퇴실·중도퇴실·환불 퇴실·자동 퇴실 처리 때 청소가 아예 걸리지 않았다
  // (성수 301호). 퇴실확정 때 이미 걸어둔 퇴실청소는 청소일이 바뀌지 않도록 그대로 둔다.
  if(room && !room.needsCleaning){
    const leftOn = historyEntry.moveOut;
    const vacantOnLeave = !DB.residents.some(x=> x.roomId===room.id && keepsLivingThrough(x, leftOn));
    if(vacantOnLeave) flagUpcomingCleaning(room, todayISO());
  }
}
function restoreFromHistory(h){
  const room = DB.rooms.find(r=>r.id===h.roomId);
  if(!room){ showAlert('해당 호실을 찾을 수 없습니다. (삭제된 호실일 수 있어요)'); return; }
  const cap = occupancyCapacity(room);
  const currentCount = DB.residents.filter(p=>p.roomId===room.id).length;
  if(currentCount >= cap){
    showAlert(`이 호실은 이미 정원(${cap}인)이 가득 차 있어 복원할 수 없습니다. 먼저 자리를 비워주세요.`);
    return;
  }
  showConfirm(`"${h.name}" 님의 정보를 이 호실의 입실자로 복원할까요?`, ()=>{
    const usedSlots = new Set(DB.residents.filter(p=>p.roomId===room.id).map(p=>p.slotIndex||0));
    let freeSlot = 0;
    while(usedSlots.has(freeSlot)) freeSlot++;
    const p = {
      id: uid('p'), roomId: room.id, name: h.name, phone: h.phone,
      channel: h.channel || '독립생활', resStatus:'', contractType:'신규',
      moveIn: h.moveIn, moveOut: h.moveOut, originalMoveIn: h.moveIn, scheduledToLeave:false,
      carNumber: h.carNumber || '', memo: h.memo || '', memoColor: h.memoColor || 'black', memoBold: !!h.memoBold,
      paymentProxy: !!h.paymentProxy, actualResidentName: h.actualResidentName || '', actualResidentPhone: h.actualResidentPhone || '',
      doubleOccupancy: !!h.doubleOccupancy,
      firstSaveDone:true, slotIndex: freeSlot
    };
    p.resStatus = computeResStatus(p);
    DB.residents.push(p);
    DB.residentHistory = DB.residentHistory.filter(x=>x.id!==h.id);
    RESIDENT_HISTORY_COL.doc(h.id).delete().catch(e=> console.error('퇴실 이력 삭제 실패:', e));
    refreshHistoryCache();
    // "복원" 버튼은 이 방에 재실 입실자가 하나도 없을 때만 나타나므로, 지금 복원하는 것 자체가
    // 그 공실 상태(=이 방의 현재 퇴실청소 플래그를 만든 바로 그 퇴실)를 되돌리는 것이다. 즉시
    // 퇴실 처리는 예약 퇴실과 달리 cleaningFlagSourceId를 남기지 않으므로, 여기서는 무조건
    // 지운다.
    room.needsCleaning = false;
    room.needsRetouch = false;
    room.needsExtraCleaning = false;
    room.maintenanceDate = '';
    room.maintenanceMemo = '';
    room.cleaningFlagSourceId = null;
    logChange(`"${h.name}" 님을 ${room.number}호 입실자로 복원`);
    scheduleSave(); render();
  });
}
function processScheduledLeaves(){
  const today = todayISO();
  const toLeave = DB.residents.filter(p => p.scheduledToLeave && p.moveOut && p.moveOut < today);
  if(toLeave.length===0) return;
  toLeave.forEach(p => moveResidentToHistory(p));
  scheduleSave();
}
function roomHasActiveResident(room){
  return DB.residents.some(p => p.roomId===room.id && occupiesRoom(p));
}
function branchParkingCombineGroup(branch){
  // 신대방삼거리역 A동/B동은 물리적으로 주차 공간을 나눠 쓰지 않고 하나로 관리하므로,
  // 이 지점들만 예외적으로 이용 현황(대수)을 항상 합산해서 보여준다. (다른 지점은 해당 없음)
  if(!branch || !cleanKeyLoose(branch.name).includes('신대방삼거리역')) return [branch].filter(Boolean);
  return DB.branches.filter(b=> cleanKeyLoose(b.name).includes('신대방삼거리역'));
}
function branchParkingCapCeiling(branch){
  // 합산 대상 지점끼리는 실제 물리적 주차 대수를 관리하는 B동 지점의 설정값을 초과 여부 판단 기준으로 쓴다.
  const group = branchParkingCombineGroup(branch);
  if(group.length <= 1) return branch.parkingCapacity || 0;
  const bBranch = group.find(b=> cleanKeyLoose(b.name).includes('B동'));
  return (bBranch || branch).parkingCapacity || 0;
}
function branchParkingGroupSuffix(branch){
  const group = branchParkingCombineGroup(branch);
  if(group.length <= 1) return '';
  return ` (${group.map(b=>branchLabel(b)).join('+')} 합산)`;
}
function branchActiveCarResidents(branch){
  const group = branchParkingCombineGroup(branch);
  const branchIds = new Set(group.map(b=>b.id));
  const isGrouped = group.length > 1;
  const roomIds = new Set(DB.rooms.filter(r=>branchIds.has(r.branchId)).map(r=>r.id));
  return DB.residents
    .filter(p => roomIds.has(p.roomId) && p.carNumber && p.carNumber.trim() && occupiesRoom(p))
    .map(p => {
      const room = DB.rooms.find(r=>r.id===p.roomId);
      const roomBranch = room ? DB.branches.find(b=>b.id===room.branchId) : null;
      return {
        roomNumber: room ? room.number : '-', name: maskViewerName(p.name) || '(이름 미입력)', carNumber: p.carNumber,
        branchLabel: (isGrouped && roomBranch) ? branchLabel(roomBranch) : ''
      };
    });
}
function branchActiveCarCount(branch, excludeResidentId){
  const group = branchParkingCombineGroup(branch);
  const branchIds = new Set(group.map(b=>b.id));
  const roomIds = new Set(DB.rooms.filter(r=>branchIds.has(r.branchId)).map(r=>r.id));
  const residentCount = DB.residents.filter(p =>
    p.id !== excludeResidentId && roomIds.has(p.roomId) && p.carNumber && p.carNumber.trim() && occupiesRoom(p)
  ).length;
  return residentCount + branchExternalParkingCount(branch);
}
function branchExternalParkingList(branch){
  // 입실자와 무관하게 등록하는 외부 주차(직원·방문자 등). 지점의 전체 주차 대수에 함께 집계된다.
  const group = branchParkingCombineGroup(branch);
  const isGrouped = group.length > 1;
  const items = [];
  group.forEach(b=>{
    (b.externalParking||[]).forEach(item=>{
      items.push({ id: item.id, label: item.label || '외부', carNumber: item.carNumber, branchId: b.id, branchLabel: isGrouped ? branchLabel(b) : '' });
    });
  });
  return items;
}
function branchExternalParkingCount(branch){
  return branchExternalParkingList(branch).length;
}
// 오늘 날짜와 ISO 날짜 문자열(YYYY-MM-DD) 사이의 일수 차이. 미래 날짜면 양수.
function daysUntilISO(dateStr){
  return Math.round((new Date(dateStr) - new Date(todayISO())) / 86400000);
}
// 판매중 플래그 이전(한 번). 예전에는 판매중이 판매 상태(saleStatus) 값이었는데, 입실자가 사는 방에서는 퇴실확정이
// 아니면 무시됐고, 판매중인 방에 새 입실자가 들어와도 값이 자동으로 꺼지지 않아 숨은 판매중이 많이 남아 있다. 그 값을
// 그대로 플래그로 옮기면 입실 중인 방이 한꺼번에 판매중으로 잡혀 대시보드 수치가 틀어지므로, "그때 화면에 판매중으로
// 보이던 방"만 플래그를 켠다. 옛 코드가 돌던 탭이 이전 뒤에 판매중을 저장한 경우(forSale이 이미 있음)는 그 사람이 판매중을
// 고른 것이므로 플래그를 켠다. applyLoadedCore에서 부르고, 바뀐 게 있으면 로그인 직후 한 번 저장한다.
let forSaleMigratedCount = 0;
function migrateForSaleFlag(){
  let changed = 0;
  (DB.rooms || []).forEach(room=>{
    const legacySale = room.saleStatus === '판매중';
    if(room.forSale !== undefined && !legacySale) return;
    if(room.forSale === undefined){
      const hasCurrent = DB.residents.some(p=> p.roomId===room.id && isCurrentlyResiding(p));
      room.forSale = legacySale && (!hasCurrent || roomHasScheduledLeaveResident(room));
    }else{
      room.forSale = true;
    }
    if(legacySale) room.saleStatus = '공실';
    changed++;
  });
  return changed;
}
function effectiveRoomStatus(room){
  // "이용중"/"입실확정"/"이용중판매"/"단기판매"는 오늘 날짜 기준 재실·예약 여부로 자동 판정하며 수동 설정 불가.
  // 판매중은 판매 상태(saleStatus) 값이 아니라, 입실자 여부와 상관없이 방 카드에서 켜고 끄는 플래그(room.forSale)다
  // (2026-09 담당자 요청, migrateForSaleFlag 참고).
  //  - 실제로 거주 중인 입실자가 있으면 기본은 "이용중", 판매중이면 "이용중판매"(이용중/판매중 탭 모두에 노출,
  //    roomTabs 참고). 예전에는 그 입실자가 퇴실확정일 때만 판매중을 반영했다.
  //  - 실거주자 없이 입실예정자만 있으면: 판매중이면 "단기판매"(이용중/판매중 탭), 아니면 입실예정일이 오늘 기준 D-6 이상
  //    남았을 때 "입실확정", 임박(D-5 이내)하면 "이용중" — 한참 남은 예약까지 "이용중" 집계에 섞이지 않게 하기 위함이다.
  //    단, 제주점은 당일 실제 재실 입실자가 없으면 "이용중"/"입실확정"으로 자동 전환하지 않고 지정해둔 판매 상태를 보여준다.
  //  - 입실자가 없으면 판매중이면 "판매중", 아니면 지정해둔 판매 상태(공실/판매보류).
  const forSale = !!room.forSale;
  if(roomHasActiveResident(room)){
    const hasCurrent = DB.residents.some(p => p.roomId===room.id && isCurrentlyResiding(p));
    if(hasCurrent) return forSale ? '이용중판매' : '이용중';
    if(!forSale){
      if(isJejuBranch(roomBranch(room))) return room.saleStatus;
      const nearestUpcoming = DB.residents.filter(p=> p.roomId===room.id && isUpcoming(p))
        .sort((a,b)=> a.moveIn.localeCompare(b.moveIn))[0];
      if(nearestUpcoming && daysUntilISO(nearestUpcoming.moveIn) >= 6) return '입실확정';
      return '이용중';
    }
    return '단기판매';
  }
  return forSale ? '판매중' : room.saleStatus;
}

    moveBtn.className = 'btn small';

    moveBtn.title = '같은 지점의 비어있는 방으로 이동 처리';
    moveBtn.onclick = ()=> showRoomMoveModal(p, room);

    acts.appendChild(leaveBtn); acts.appendChild(extendBtn); acts.appendChild(moveBtn);
  }
  nameLine.appendChild(nameWrap);
  block.appendChild(nameLine);

  const displayPhone = residentDisplayPhone(p);
  if(displayPhone && displayPhone.trim()){
    const phoneLine = document.createElement('div');
    phoneLine.className = 'resident-phone';
    phoneLine.textContent = displayPhone;
    block.appendChild(phoneLine);
  }

  if(isProxy){
    const otherLine = document.createElement('div');
    otherLine.className = 'resident-payer';
    const otherText = showsActual
      ? [maskViewerName(p.name) || '(이름 미입력)', String(p.phone || '').trim()].filter(Boolean).join(' · ')
      : '미입력';
    otherLine.innerHTML = `<span class="who-tag">${showsActual ? '결제자' : '실입실자'}</span><span>${esc(otherText)}</span>`;
    block.appendChild(otherLine);
  }

  if(!isSecondary){
    const period = document.createElement('div');
    period.className = 'resident-period';
    period.textContent = `${p.moveIn || '-'} ~ ${p.moveOut || '미정'}`;
    block.appendChild(period);

    if(p.carNumber && p.carNumber.trim()){
      const carLine = document.createElement('div');
      carLine.className = 'resident-car';
      carLine.textContent = `차량 ${p.carNumber}`;
      block.appendChild(carLine);
    }

    if(p.memo){
      const memo = document.createElement('div');
      memo.className = 'resident-memo';
      memo.textContent = p.memo;
      memo.title = p.memo;
      memo.style.color = MEMO_COLORS[p.memoColor] || MEMO_COLORS.black;
      if(p.memoBold) memo.style.fontWeight = '700';
      block.appendChild(memo);
    }
  }
  // 퇴실·연장·방이동은 입실자 정보(이름·연락처·기간·차량·메모) 맨 아래 왼쪽 정렬(담당자 요청).
  if(acts.childElementCount) block.appendChild(acts);
  return block;
}

/* ---------------- room info: edit mode (방 정보만) ---------------- */
// 이 편집 패널 안의 필드들은 더 이상 값이 바뀔 때마다 바로 저장하지 않는다. 방 카드 헤더의
// 연필(✎) 아이콘을 눌러 들어왔다가 체크(✓) 아이콘을 눌러 나가는 시점에 한 번만 저장한다
// (renderRoomCard의 pencil.onclick 참고). 여기서는 render()만 호출해 화면엔 바로 반영하고,
// scheduleSave()는 호출하지 않는다.
function renderRoomEditForm(room){
  const wrap = document.createElement('div');

  grid.className = 'edit-grid';
  grid.innerHTML = `
    <div>
      <label class="field-label">판매 상태</label>
      <select data-f="saleStatus">${STATUS_LIST_MANUAL.map(s=>`<option ${s===room.saleStatus?'selected':''}>${s}</option>`).join('')}</select>
    </div>
  `;
  const saleStatusSel = grid.querySelector('[data-f="saleStatus"]');
  if(saleStatusSel) saleStatusSel.addEventListener('change', (e)=>{ logChange(`${room.number}호 판매상태 변경: ${room.saleStatus} → ${e.target.value}`); room.saleStatus = e.target.value; if(room.saleStatus === '판매보류') room.forSale = false; render(); });
  wrap.appendChild(grid);

  const chipRow = document.createElement('div');
  chipRow.style.marginBottom = '10px';
  chipRow.innerHTML = `<label class="field-label">퇴실청소 / 리터치 / 추가청소</label>`;
  const chips = document.createElement('div');
  chips.className = 'maint-chips';
  Object.keys(MAINT_KIND_META).forEach(kind=>{
    const field = MAINT_KIND_FIELD[kind];
    // needsCleaning 등 원본 필드뿐 아니라, 퇴실확정 입실자로 인해 배지가 자동 표시된 상태(fallback)도
    // "켜짐"으로 보여줘야 클릭했을 때 의도대로 꺼짐(취소) 처리가 된다.
    const isOn = roomCardMaintKind(room) === kind;
    const chip = document.createElement('span');
    chip.className = 'flagchip ' + kind + (isOn ? ' on' : '');
    chip.textContent = MAINT_KIND_META[kind].label;
    chip.onclick = ()=>{
      const turningOn = !isOn;
      Object.values(MAINT_KIND_FIELD).forEach(f=> room[f]=false);
      room[field] = turningOn;
      if(turningOn){
        if(!room.maintenanceDate) room.maintenanceDate = nextMonWedFri(todayISO());
        room.cleaningDismissedMoveOut = '';
      } else {
        room.maintenanceDate=''; room.maintenanceMemo='';
        // moveout을 껐는데도 아직 퇴실확정된 입실자가 남아있으면, 다음 렌더에서 fallback이
        // 같은 배지를 곧바로 다시 켜버린다. 그 입실자의 퇴실일을 "취소함"으로 기억해서,
        // 그 퇴실일이 바뀌기 전까지는 배지가 다시 뜨지 않게 한다.
        if(kind==='moveout'){
          room.cleaningDismissedMoveOut = roomEarliestLeaverMoveOut(room) || '';
        }
      }
      logChange(`${room.number}호 ${MAINT_KIND_META[kind].label} ${turningOn?'설정':'해제'}`);
      render();
    };
    chips.appendChild(chip);
  });
  chipRow.appendChild(chips);
  wrap.appendChild(chipRow);

  const currentMaintKind = roomMaintKind(room);
  if(currentMaintKind){
    const kindLabel = MAINT_KIND_META[currentMaintKind].label;
    const dateWrap = document.createElement('div');
    dateWrap.style.marginBottom = '10px';
    const dateInput = document.createElement('input');
    dateInput.type = 'date';
    dateInput.value = room.maintenanceDate || '';
    dateInput.addEventListener('change', ()=>{
      logChange(`${room.number}호 ${kindLabel} 예정일 변경: ${dateInput.value || '미정'}`);
      room.maintenanceDate = dateInput.value; render();
    });
    dateWrap.appendChild(labeled(`${kindLabel} 예정일`, dateInput));
    wrap.appendChild(dateWrap);

    const memoWrap = document.createElement('div');
    memoWrap.style.marginBottom = '10px';
    const memoInput = document.createElement('textarea');
    memoInput.rows = 2;
    memoInput.value = room.maintenanceMemo || '';
    memoInput.placeholder = '예: 변기 물 안 내려감, 방충망 파손 등';
    memoInput.addEventListener('input', ()=>{
      logChange(`${room.number}호 ${kindLabel} 메모 수정`);
      room.maintenanceMemo = memoInput.value;
    });
    memoWrap.appendChild(labeled(`${kindLabel} 메모`, memoInput));
    wrap.appendChild(memoWrap);
  }

  const reserveChipRow = document.createElement('div');
  reserveChipRow.style.marginBottom = '10px';
  reserveChipRow.innerHTML = `<label class="field-label">예약</label>`;
  const reserveChips = document.createElement('div');
  reserveChips.className = 'maint-chips';
  const reserveChip = document.createElement('span');
  reserveChip.className = 'flagchip reserved' + (room.reserved ? ' on' : '');
  reserveChip.textContent = '예약';
  reserveChip.onclick = ()=>{
    const turningOn = !room.reserved;
    room.reserved = turningOn;
    if(!turningOn){
      room.reservationName=''; room.reservationPhone=''; room.reservationMoveIn=''; room.reservationMoveOut=''; room.reservationMemo='';
    }
    logChange(`${room.number}호 예약 ${turningOn?'설정':'해제'}`);
    render();
  };
  reserveChips.appendChild(reserveChip);
  reserveChipRow.appendChild(reserveChips);
  wrap.appendChild(reserveChipRow);

  if(room.reserved){
    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.value = room.reservationName || '';
    nameInput.placeholder = '예약자명';
    nameInput.addEventListener('input', ()=>{ logChange(`${room.number}호 예약자명 수정`); room.reservationName = nameInput.value; });
    wrap.appendChild(labeled('예약자명', nameInput));

    const phoneInput = document.createElement('input');
    phoneInput.type = 'text';
    phoneInput.value = room.reservationPhone || '';
    phoneInput.placeholder = '연락처';
    phoneInput.addEventListener('input', ()=>{ logChange(`${room.number}호 예약자 연락처 수정`); room.reservationPhone = phoneInput.value; });
    wrap.appendChild(labeled('연락처', phoneInput));

    const moveInInput = document.createElement('input');
    moveInInput.type = 'date';
    moveInInput.value = room.reservationMoveIn || '';
    moveInInput.addEventListener('change', ()=>{
      logChange(`${room.number}호 예약 입실예정일 변경: ${moveInInput.value || '미정'}`);
      room.reservationMoveIn = moveInInput.value;
    });
    wrap.appendChild(labeled('입실예정일', moveInInput));

    const moveOutInput = document.createElement('input');
    moveOutInput.type = 'date';
    moveOutInput.value = room.reservationMoveOut || '';
    moveOutInput.addEventListener('change', ()=>{
      logChange(`${room.number}호 예약 퇴실예정일 변경: ${moveOutInput.value || '미정'}`);
      room.reservationMoveOut = moveOutInput.value;
    });
    wrap.appendChild(labeled('퇴실예정일', moveOutInput));

    const reserveMemoInput = document.createElement('textarea');
    reserveMemoInput.rows = 2;
    reserveMemoInput.value = room.reservationMemo || '';
    reserveMemoInput.placeholder = '예: 계약금 입금 예정, 문의 채널 등';
    reserveMemoInput.addEventListener('input', ()=>{ logChange(`${room.number}호 예약 메모 수정`); room.reservationMemo = reserveMemoInput.value; });
    wrap.appendChild(labeled('메모', reserveMemoInput));
  }

  const noteWrap = document.createElement('div');
  noteWrap.style.marginBottom = '4px';
  noteWrap.innerHTML = `<label class="field-label">호실 특이사항</label>`;
  const noteArea = document.createElement('textarea');
  noteArea.value = room.note;
  noteArea.placeholder = '예: 204호 정독립 이동 예정';
  noteArea.addEventListener('input', ()=>{ logChange(`${room.number}호 특이사항 메모 수정`); room.note = noteArea.value; });
  noteWrap.appendChild(noteArea);
  noteWrap.appendChild(renderMemoStyleControls(room, 'noteColor', 'noteBold', true));
  wrap.appendChild(noteWrap);

  return wrap;
}

function wouldExceedParking(p, candidateMoveIn, candidateMoveOut){
  if(!p.carNumber || !p.carNumber.trim()) return null;
  const room = DB.rooms.find(r=>r.id===p.roomId);
  const branch = room ? DB.branches.find(b=>b.id===room.branchId) : null;
  if(!branch) return null;
  if(!occupiesRoom({ moveIn: candidateMoveIn, moveOut: candidateMoveOut })) return null;
  const cap = branchParkingCapCeiling(branch);
  const others = branchActiveCarCount(branch, p.id);
  const projected = others + 1;
  if(projected > cap) return { branch, cap, others, projected };
  return null;
}

function renderResidentEditCard(p, isSecondary, isDraft, room){
  const card = document.createElement('div');
  card.className = 'resident-edit-card';
  // 입실자 카드도 방 카드와 마찬가지로 필드가 바뀔 때마다 바로 저장하지 않고, 상단의 체크(✓)
  // "수정 완료" 버튼(doneBtn)을 누르는 시점에 한 번만 저장한다. 여기서는 render()만 한다.
  const maybeSave = ()=>{};

  if(UI.residentFieldEdit[p.id] === undefined) UI.residentFieldEdit[p.id] = !p.firstSaveDone;
  const identityOpen = UI.residentFieldEdit[p.id];

  const top = document.createElement('div');
  top.className = 'redit-top';
  const titleWrap = document.createElement('div');
  titleWrap.style.cssText = 'display:flex; align-items:center; gap:6px;';
  const titleSpan = document.createElement('span');
  titleSpan.className = 'redit-title';
  titleSpan.textContent = isSecondary ? '2번째 입실자' : '입실자 정보';
  titleWrap.appendChild(titleSpan);
  const infoEditBtn = document.createElement('button');
  infoEditBtn.type = 'button';
  infoEditBtn.className = 'iconbtn' + (identityOpen ? ' active' : '');
  infoEditBtn.innerHTML = identityOpen ? '&#10003;' : '&#9998;';
  infoEditBtn.title = identityOpen ? '기본 정보 입력 완료' : '기본 정보 수정';
  infoEditBtn.onclick = ()=>{ UI.residentFieldEdit[p.id] = !identityOpen; render(); };
  titleWrap.appendChild(infoEditBtn);
  top.appendChild(titleWrap);
  const acts = document.createElement('div');
  acts.style.cssText = 'display:flex;gap:5px;';
  const doneBtn = document.createElement('button');
  doneBtn.className = 'iconbtn active'; doneBtn.innerHTML = '&#10003;'; doneBtn.title = '수정 완료';
  doneBtn.onclick = ()=>{
    const missing = residentMissingFields(p, isSecondary);
    if(missing.length){
      showAlert(`필수 항목이 비어 있습니다: ${missing.join(', ')}\n입력을 완료한 뒤 다시 시도해주세요.`);
      return;
    }
    const violation = wouldExceedParking(p, p.moveIn, p.moveOut);
    if(violation){
      showAlert(`"${violation.branch.name}" 지점의 주차 가능 대수(${violation.cap}대)${branchParkingGroupSuffix(violation.branch)}를 초과합니다.\n(현재 이용중 ${violation.others}대 + 이 입실자 1대 = ${violation.projected}대)\n\n차량번호를 비우거나 지점의 주차 가능 대수를 먼저 늘려주세요.`);
      return;
    }
    p.firstSaveDone = true;
    if(isDraft){
      p.originalMoveIn = p.moveIn;
      DB.residents.push(p);
      delete UI.draftResident[p.roomId];
      delete UI.residentFieldEdit[p.id];
      logChange(`${room ? room.number + '호 ' : ''}"${p.name}" 입실자 신규 등록`);
    } else {
      delete UI.residentSnapshots[p.id];
      delete UI.residentFieldEdit[p.id];
      UI.residentEditMode[p.id] = false;
      // 계약 데이터 붙여넣기로 자동 생성된 입실자는 담당자가 내용을 확인하고
      // "수정 완료"를 누르는 순간, 임시 확인 목록(계약 확인 필요 탭)에서 빠진다.
      if(p.justImported) delete p.justImported;
      logChange(`${room ? room.number + '호 ' : ''}"${p.name}" 입실자 정보 수정`);
    }
    scheduleSave(); render();
  };
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'iconbtn'; cancelBtn.innerHTML = '&#8634;'; cancelBtn.title = '취소';
  cancelBtn.onclick = ()=>{
    if(isDraft){
      // 아직 저장된 적 없는 초안이므로 그냥 버립니다 (DB에는 존재하지 않음)
      delete UI.draftResident[p.roomId];
      delete UI.residentFieldEdit[p.id];
      render();
      return;
    }
    const snap = UI.residentSnapshots[p.id];
    if(snap) Object.assign(p, snap);
    delete UI.residentSnapshots[p.id];
    delete UI.residentFieldEdit[p.id];
    UI.residentEditMode[p.id] = false;
    scheduleSave(); render();
  };
  const delBtn = document.createElement('button');
  delBtn.className = 'iconbtn del'; delBtn.innerHTML = '&times;'; delBtn.title = '입실자 삭제';
  delBtn.onclick = ()=>{
    if(isDraft){
      delete UI.draftResident[p.roomId];
      delete UI.residentFieldEdit[p.id];
      render();
      return;
    }
    showConfirm(`${p.name || '이 입실자'} 정보를 삭제할까요?`, ()=>{
      delete UI.residentSnapshots[p.id];
      delete UI.residentFieldEdit[p.id];
      DB.residents = DB.residents.filter(x=>x.id!==p.id); scheduleSave(); render();
    });
  };
  acts.appendChild(cancelBtn); acts.appendChild(doneBtn); acts.appendChild(delBtn);
  top.appendChild(acts);
  card.appendChild(top);

  const identityGrid = document.createElement('div');
  identityGrid.className = 'redit-grid2';

  function identityCell(label, required, valueText, buildInput){
    const content = identityOpen ? buildInput() : el('div', 'redit-readonly-text' + (valueText ? '' : ' empty'), valueText || '미입력');
    identityGrid.appendChild((required ? labeledReq : labeled)(label, content));
  }

  identityCell('이름', true, p.name, ()=>{
    const nameInput = document.createElement('input');
    nameInput.type = 'text'; nameInput.placeholder = '홍길동'; nameInput.value = p.name;
    if(!p.name || !p.name.trim()) nameInput.classList.add('invalid');
    nameInput.addEventListener('input', ()=>{ p.name = nameInput.value; maybeSave(); nameInput.classList.toggle('invalid', !nameInput.value.trim()); });
    if(!p.name) setTimeout(()=> nameInput.focus(), 0);
    return nameInput;
  });

  identityCell('연락처', true, p.phone, ()=>{
    const phoneInput = document.createElement('input');
    phoneInput.type = 'tel'; phoneInput.placeholder = '010-0000-0000'; phoneInput.value = p.phone;
    if(!p.phone || !p.phone.trim()) phoneInput.classList.add('invalid');
    phoneInput.addEventListener('input', ()=>{ p.phone = phoneInput.value; maybeSave(); phoneInput.classList.toggle('invalid', !phoneInput.value.trim()); });
    return phoneInput;
  });

  const proxyRow = document.createElement('div');
  proxyRow.className = 'redit-proxy-row';
  const proxyCheckbox = document.createElement('input');
  proxyCheckbox.type = 'checkbox';
  proxyCheckbox.id = 'proxy-' + p.id;
  proxyCheckbox.checked = !!p.paymentProxy;
  proxyCheckbox.addEventListener('change', ()=>{
    p.paymentProxy = proxyCheckbox.checked;
    if(proxyCheckbox.checked) UI.residentFieldEdit[p.id] = true;
    maybeSave(); render();
  });
  const proxyLabel = document.createElement('label');
  proxyLabel.htmlFor = proxyCheckbox.id;
  proxyLabel.textContent = '대리결제';
  proxyRow.appendChild(proxyCheckbox); proxyRow.appendChild(proxyLabel);
  identityGrid.appendChild(proxyRow);

  if(p.paymentProxy){
    identityCell('실입실자 이름', false, p.actualResidentName, ()=>{
      const input = document.createElement('input');
      input.type = 'text'; input.placeholder = '홍길동'; input.value = p.actualResidentName || '';
      input.addEventListener('input', ()=>{ p.actualResidentName = input.value; maybeSave(); });
      return input;
    });
    identityCell('실입실자 연락처', false, p.actualResidentPhone, ()=>{
      const input = document.createElement('input');
      input.type = 'tel'; input.placeholder = '010-0000-0000'; input.value = p.actualResidentPhone || '';
      input.addEventListener('input', ()=>{ p.actualResidentPhone = input.value; maybeSave(); });
      return input;
    });
  }

  if(isSecondary){
    card.appendChild(identityGrid);
    return card;
  }

  identityCell('유입채널', false, p.channel, ()=>{
    const chSel = document.createElement('select');
    DB.channelList.forEach(c=>{ const o=document.createElement('option'); o.textContent=c; o.selected=c===p.channel; chSel.appendChild(o); });
    chSel.addEventListener('change', ()=>{ p.channel = chSel.value; maybeSave(); render(); });
    return chSel;
  });

  const branchForCar = room ? DB.branches.find(b=>b.id===room.branchId) : null;
  const parkingAvailable = !branchForCar || (branchForCar.parkingCapacity||0) > 0;
  if(parkingAvailable){
    identityCell('차량 번호 (선택)', false, p.carNumber, ()=>{
      const carInput = document.createElement('input');
      carInput.type = 'text'; carInput.placeholder = '12가3456'; carInput.value = p.carNumber || '';
      carInput.addEventListener('change', ()=>{
        const newVal = carInput.value.trim();
        const branch = branchForCar;
        if(newVal && branch && occupiesRoom(p)){
          const cap = branch.parkingCapacity || 0;
          const others = branchActiveCarCount(branch, p.id);
          const projected = others + 1;
          if(projected > cap){
            showAlert(`"${branch.name}" 지점의 주차 가능 대수(${cap}대)${branchParkingGroupSuffix(branch)}를 초과합니다.\n(현재 이용중 ${others}대 + 이 입실자 1대 = ${projected}대)\n\n차량번호를 비우거나, 지점 정보에서 주차 가능 대수를 먼저 늘려주세요.`);

        maybeSave();
      });
      return carInput;

  const doubleRow = document.createElement('div');

  });
  inDateRow.appendChild(labeledReq('입실일', inDate));
  if(p.firstSaveDone){
    const extendBtn = document.createElement('button');
    extendBtn.className = 'btn small';
    extendBtn.textContent = '연장';
    extendBtn.title = '단기연장 또는 한달연장을 선택합니다';
    extendBtn.onclick = ()=> showExtendChoiceModal(p, room, (newMoveOut)=>{
      p.moveOut = newMoveOut;
      p.scheduledToLeave = false;
      p.contractType = '연장';
      clearCleaningFlagIfSourcedFrom(room, p.id);
      maybeSave(); render();
    });
    const extendWrap = document.createElement('div');
    extendWrap.style.cssText = 'display:flex;align-items:flex-end;padding-bottom:1px;';
    extendWrap.appendChild(extendBtn);
    inDateRow.appendChild(extendWrap);
  }
  card.appendChild(inDateRow);

  const outDate = document.createElement('input'); outDate.type='date'; outDate.value = p.moveOut || '';
  if(!p.moveOut) outDate.classList.add('invalid');
  outDate.addEventListener('change', ()=>{
    const violation = wouldExceedParking(p, p.moveIn, outDate.value);
    if(violation){
      showAlert(`"${violation.branch.name}" 지점의 주차 가능 대수(${violation.cap}대)${branchParkingGroupSuffix(violation.branch)}를 초과합니다.\n(현재 이용중 ${violation.others}대 + 이 입실자 1대 = ${violation.projected}대)\n\n퇴실예정일을 다시 확인하거나 차량번호를 비운 뒤 저장해주세요.`);
      outDate.value = p.moveOut || '';
      return;
    }
    p.moveOut = outDate.value; maybeSave(); render();
  });

  const outDateRow = document.createElement('div');
  outDateRow.className = 'redit-inline-row';
  outDateRow.appendChild(labeledReq('퇴실(예정)일', outDate));
  if(p.firstSaveDone){
    const btnCol = document.createElement('div');
    btnCol.style.cssText = 'display:flex;gap:6px;align-items:flex-end;padding-bottom:1px;';
    const leaveBtn = document.createElement('button');
    leaveBtn.className = 'btn small danger';
    leaveBtn.textContent = '퇴실';
    leaveBtn.title = '퇴실 유형을 선택해 처리합니다';
    leaveBtn.onclick = ()=> showLeaveChoiceModal(p, room);
    btnCol.appendChild(leaveBtn);
    outDateRow.appendChild(btnCol);
  }
  card.appendChild(outDateRow);

  const memo = document.createElement('textarea');
  memo.placeholder = '입실자 메모 (실거주자 정보, 결제방식 등)';
  memo.value = p.memo;
  memo.style.marginTop = '4px';
  memo.addEventListener('input', ()=>{ p.memo = memo.value; maybeSave(); });
  card.appendChild(memo);
  card.appendChild(renderMemoStyleControls(p, 'memoColor', 'memoBold', true));

  if(room && !isDraft && !UI.draftResident[room.id] && !roomHasUpcomingResident(room) && roomHasVacatingResident(room)){
    const addRow = document.createElement('div');
    addRow.style.cssText = 'margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);';
    const addBtn = document.createElement('button');
    addBtn.className = 'btn small primary';
    addBtn.textContent = '+ 입실예정자 미리 등록';
    addBtn.title = '현재 입실자 중 퇴실확정된 사람이 있어 다음 입실자를 미리 등록할 수 있어요';
    addBtn.onclick = ()=> addUpcomingResidentToRoom(room);
    addRow.appendChild(addBtn);
    card.appendChild(addRow);
  }

  return card;
}

const MEMO_COLORS = { black:'#1E2A32', red:'#C0473F', blue:'#2F6FED' };
// deferSave가 true면 저장을 미루고 render()만 한다 — 방/입실자 카드의 편집 패널처럼 체크(✓)
// 아이콘을 누를 때 한 번에 저장하는 화면에서 쓴다. 지점 정보 메모처럼 필드별로 바로바로
// 저장하는 화면에서는 기존대로 deferSave 없이 호출한다.
function renderMemoStyleControls(obj, colorField, boldField, deferSave){
  const row = document.createElement('div');
  row.className = 'memo-style-row';
  Object.keys(MEMO_COLORS).forEach(key=>{
    const sw = document.createElement('button');
    sw.type = 'button';
    sw.className = 'color-swatch' + ((obj[colorField]||'black')===key ? ' active' : '');
    sw.style.background = MEMO_COLORS[key];
    sw.title = key==='black' ? '검정' : (key==='red' ? '빨강' : '파랑');
    sw.onclick = ()=>{ obj[colorField] = key; if(!deferSave) scheduleSave(); render(); };
    row.appendChild(sw);
  });
  const boldBtn = document.createElement('button');
  boldBtn.type = 'button';
  boldBtn.className = 'bold-toggle-btn' + (obj[boldField] ? ' active' : '');
  boldBtn.textContent = 'B';
  boldBtn.title = '굵게';
  boldBtn.onclick = ()=>{ obj[boldField] = !obj[boldField]; if(!deferSave) scheduleSave(); render(); };
  row.appendChild(boldBtn);
  return row;
}

function labeled(text, elm){
  const wrap = document.createElement('div');
  const lbl = document.createElement('label');
  lbl.className = 'field-label'; lbl.textContent = text;
  wrap.appendChild(lbl); wrap.appendChild(elm);
  return wrap;
}
function labeledReq(text, elm){
  const wrap = document.createElement('div');
  const lbl = document.createElement('label');
  lbl.className = 'field-label'; lbl.innerHTML = `${text} <span class="req">*</span>`;
  wrap.appendChild(lbl); wrap.appendChild(elm);
  return wrap;
}
function fullRow(elm){
  const wrap = document.createElement('div');
  wrap.style.marginBottom = '8px';
  wrap.appendChild(elm);
  return wrap;
}
function residentMissingFields(p, isSecondary){
  const missing = [];
  if(!p.name || !p.name.trim()) missing.push('이름');
  if(!p.phone || !p.phone.trim()) missing.push('연락처');
  if(!isSecondary){
    if(!p.moveIn) missing.push('입실일');
    if(!p.moveOut) missing.push('퇴실(예정)일');
  }
  return missing;
}
function el(tag, cls, text, style){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text!=null) e.textContent = text;
  if(style) e.style.cssText = style;
  return e;
}

/* ---------------- timeline section ---------------- */
function renderTimelineSection(branch){
  const wrap = document.createElement('div');
  // 기본으로 펼칠 연/월도 다른 화면과 같은 "오늘"(한국시간) 기준을 쓴다.
  const [nowYear, nowMonth] = todayISO().split('-').map(Number);
  if(UI.tlYear==null){ UI.tlYear = nowYear; UI.tlMonth = nowMonth - 1; }

  const toolbar = document.createElement('div');
  toolbar.className = 'tl-toolbar';
  toolbar.innerHTML = `
    <div class="tl-month-nav">
      <button class="btn small" id="tlPrev">◀</button>
      <div class="m-label">${UI.tlYear}년 ${UI.tlMonth+1}월</div>
      <button class="btn small" id="tlNext">▶</button>
    </div>
    <div class="sub" style="font-size:11.5px;color:var(--ink-soft);">막대 = 입실~퇴실 기간 · 회색 막대는 이번 달과 겹치는 과거 퇴실자 · 라벨만 있는 행은 현재/과거 입실자 없음 · 앞뒤 달까지 3개월이 이어져 있으니 좌우로 스크롤해서 달이 바뀌는 부분도 확인하세요</div>
  `;
  wrap.appendChild(toolbar);

  const tlLegend = document.createElement('div');
  tlLegend.className = 'tl-legend';
  tlLegend.innerHTML = TIMELINE_BAR_STATUSES.map(m=>
    `<span class="badge" style="background:${m.bg};color:${m.fg}"><span class="dot" style="background:${m.fg}"></span>${m.key}</span>`
  ).join('')
  + `<span class="badge" style="background:var(--paper);color:var(--ink-soft);border:1px dashed var(--line);">빗금 막대 = 외부 채널 예약(계약 없이 예약 기간 기준 · 채널별 색)</span>`;
  wrap.appendChild(tlLegend);

  // 한 달만 보이면 달이 바뀌는 경계(예: 9월 말~10월 초에 걸쳐 있는 입실자)를 확인하려고
  // ◀/▶ 버튼으로 매번 왔다갔다해야 했다. 이번 달(가운데) 앞뒤로 한 달씩 더해 3개월을 한
  // 그리드에 이어붙이고, 좌우 스크롤로 자유롭게 넘나들 수 있게 한다. ◀/▶ 버튼은 이 3개월
  // 창의 중심을 옮기는 용도로 남겨둔다(먼 과거/미래로 빠르게 이동할 때 여전히 유용하다).
  const centerMonthStart = new Date(UI.tlYear, UI.tlMonth, 1);
  const windowStart = new Date(UI.tlYear, UI.tlMonth-1, 1);
  const windowEnd = new Date(UI.tlYear, UI.tlMonth+2, 0);
  const DAY_MS = 24*60*60*1000;
  const totalDays = Math.round((windowEnd - windowStart)/DAY_MS) + 1;
  const DAY_CELL_PX = 28;
  // 문자열로 파싱한 날짜(예: new Date('2026-09-05'), UTC 자정 기준)와 new Date(y,m,d)로 만든
  // 날짜(로컬 자정 기준)가 뒤섞여도 항상 정확한 일수 차이를 구하기 위해, 각 날짜의 "로컬 달력
  // 연/월/일"만 뽑아 UTC 자정 기준값으로 다시 만든 뒤 그 차이를 쓴다 — getFullYear/getMonth/
  // getDate는 원래 어떤 방식으로 파싱됐든 항상 정확한 로컬 날짜를 돌려주므로, 시간대 차이로
  // 인한 반올림 오차(9시간 어긋남 등)가 생기지 않는다.
  const windowStartUTC = Date.UTC(windowStart.getFullYear(), windowStart.getMonth(), windowStart.getDate());
  function dayIndexOf(d){
    const utcMs = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
    return Math.round((utcMs - windowStartUTC) / DAY_MS);
  }
  // 오늘(한국시간) 날짜 칸의 위치. 3개월 창 밖(다른 달로 이동해서 볼 때)이면 표시하지 않는다.
  const [todayY, todayM, todayD] = todayISO().split('-').map(Number);
  const todayIdx = dayIndexOf(new Date(todayY, todayM - 1, todayD));
  const todayInWindow = todayIdx >= 0 && todayIdx < totalDays;

  // 요일 칸 영역이 화면 스크롤이 아니라 이 화면 안에서만 좌우로 스크롤되므로, 가로 스크롤바가
  // 방이 많을 때 맨 아래(전체 행을 다 지나야 나오는 위치)에 생겨 손이 잘 안 닿았다. 날짜
  // 헤더(월 띠 + 일자 줄)를 방 목록과 분리된 별도의 좁은 스크롤 영역으로 떼어내 맨 위에
  // 고정해두고, 그 스크롤 위치를 아래 방 목록 영역과 서로 맞춰준다(둘 중 어디를 스크롤해도
  // 같이 움직인다) — 위쪽에서 바로 스크롤할 수 있고, 항상 지금 보고 있는 날짜가 상단에 붙어
  // 있어 확인하기 쉽다.
  const tlWrap = document.createElement('div');
  tlWrap.className = 'tl-wrap';
  const gridTotalWidth = 220 + totalDays*DAY_CELL_PX;

  const headScroll = document.createElement('div');
  headScroll.className = 'tl-head-scroll';
  const headGrid = document.createElement('div');
  headGrid.className = 'tl-head-grid';
  headGrid.style.minWidth = gridTotalWidth + 'px';

  // 날짜 칸 안에 "9월 1"처럼 글자를 억지로 끼워넣는 대신, 그 위에 달마다 하나의 칸으로 된
  // 월 띠를 따로 둔다 — 날짜 줄은 순수하게 숫자만 남아 훨씬 깔끔하고, 지금 스크롤해서 보고
  // 있는 구간이 몇 월인지 위쪽 월 띠만 보면 바로 알 수 있다. 창(windowStart~windowEnd)은
  // 항상 온전한 달 3개로 이뤄지므로(이전 달 1일 ~ 다음 달 말일) 딱 3칸이 나온다.
  const monthBandRow = document.createElement('div');
  monthBandRow.className = 'tl-monthband-row';
  monthBandRow.appendChild(el('div', 'tl-label tl-monthband-label', ''));
  const monthBand = document.createElement('div');
  monthBand.className = 'tl-monthband';
  const monthSpans = [];
  {
    let cy = windowStart.getFullYear(), cm = windowStart.getMonth();
    const endY = windowEnd.getFullYear(), endM = windowEnd.getMonth();
    while(cy < endY || (cy===endY && cm <= endM)){
      monthSpans.push({ y:cy, m:cm, days: new Date(cy, cm+1, 0).getDate() });
      cm++; if(cm>11){ cm=0; cy++; }
    }
  }
  monthBand.style.gridTemplateColumns = monthSpans.map(ms=> (ms.days*DAY_CELL_PX)+'px').join(' ');
  monthSpans.forEach(ms=>{
    const isCurrent = ms.y===UI.tlYear && ms.m===UI.tlMonth;
    const cell = el('div', 'tl-monthband-cell' + (isCurrent ? ' current' : ''), `${ms.y}년 ${ms.m+1}월`);
    monthBand.appendChild(cell);
  });
  monthBandRow.appendChild(monthBand);
  headGrid.appendChild(monthBandRow);

  const headRow = document.createElement('div');
  headRow.className = 'tl-headrow';
  const headLabel = document.createElement('div');
  headLabel.className = 'tl-label'; headLabel.style.fontWeight = '700'; headLabel.textContent = '호실 · 입실자';
  headRow.appendChild(headLabel);
  const headDays = document.createElement('div');
  headDays.className = 'tl-days';
  headDays.style.gridTemplateColumns = `repeat(${totalDays}, ${DAY_CELL_PX}px)`;
  for(let i=0; i<totalDays; i++){
    const d = new Date(windowStart.getTime() + i*DAY_MS);
    const dow = d.getDay();
    const cell = document.createElement('div');
    cell.className = 'tl-daycell' + ((dow===0||dow===6) ? ' weekend' : '') + (d.getDate()===1 ? ' month-start' : '') + (i===todayIdx ? ' today' : '');
    cell.textContent = String(d.getDate());
    if(i===todayIdx) cell.title = '오늘';
    headDays.appendChild(cell);
  }
  headRow.appendChild(headDays);
  headGrid.appendChild(headRow);
  headScroll.appendChild(headGrid);

  const bodyScroll = document.createElement('div');
  bodyScroll.className = 'tl-body-scroll';
  const gridWrap = document.createElement('div');
  gridWrap.className = 'tl-grid';
  gridWrap.style.gridTemplateColumns = '1fr';
  gridWrap.style.minWidth = gridTotalWidth + 'px';

  const rooms = DB.rooms.filter(r=>r.branchId===branch.id)
    .sort((a,b)=> a.number.localeCompare(b.number,'ko',{numeric:true}));

  if(rooms.length===0){
    const none = document.createElement('div');
    none.className = 'empty-hint'; none.style.margin = '16px';
    none.textContent = '등록된 호실이 없습니다. "호실 현황" 탭에서 먼저 호실을 추가하세요.';
    gridWrap.appendChild(none);
  }

  function buildDayCells(){
    const days = document.createElement('div');
    days.className = 'tl-days';
    days.style.gridTemplateColumns = `repeat(${totalDays}, ${DAY_CELL_PX}px)`;
    for(let i=0; i<totalDays; i++){
      const d = new Date(windowStart.getTime() + i*DAY_MS);
      const dow = d.getDay();
      const cell = document.createElement('div');
      cell.className = 'tl-daycell' + ((dow===0||dow===6) ? ' weekend' : '') + (d.getDate()===1 ? ' month-start' : '') + (i===todayIdx ? ' today' : '');
      days.appendChild(cell);
    }
    return days;
  }

  function appendRow(meta, labelHtml, bars, onLabelClick){
    const row = document.createElement('div');
    row.className = 'tl-row';
    const lbl = document.createElement('div');
    lbl.className = 'tl-label';
    lbl.style.borderLeft = `4px solid ${meta.fg}`;
    lbl.style.background = meta.bg;
    lbl.innerHTML = labelHtml;
    if(onLabelClick){ lbl.style.cursor = 'pointer'; lbl.onclick = onLabelClick; }
    row.appendChild(lbl);
    const days = buildDayCells();
    bars.forEach(bar=>{ if(bar) days.appendChild(bar); });
    if(todayInWindow){
      const todayCol = el('div', 'tl-today-col');
      todayCol.style.left = (todayIdx * DAY_CELL_PX) + 'px';
      todayCol.style.width = DAY_CELL_PX + 'px';
      days.appendChild(todayCol);
    }
    row.appendChild(days);
    gridWrap.appendChild(row);
  }
  // 타임라인 왼쪽 라벨(호실번호가 표시되는 영역)은 입실자/계약 상태가 아니라 방 자체의 상태
  // (이용중/판매중/판매보류/공실)를 보여준다 — 개별 입실자·계약의 상태는 오른쪽 막대 쪽에서
  // 확인한다.
  function roomStatusRowMeta(room){
    const effStatus = effectiveRoomStatus(room);
    const roomOverdue = roomHasOverdueResident(room);
    const label = roomOverdue ? '연체중' : effStatus;
    const meta = roomOverdue ? { fg:'var(--st-hold)', bg:'var(--st-hold-bg)' } : statusMeta(effStatus);
    return { meta, label };
  }
  function appendEmptyRoomRow(room){
    const { meta, label } = roomStatusRowMeta(room);
    appendRow(meta,
      `<span class="rm">${esc(room.number)}</span>
       <span class="nm" style="color:${meta.fg};font-weight:700;"><span class="tl-status-dot" style="background:${meta.fg}"></span>${esc(label)}</span>`,
      [], null);
  }
  // 계약의 주인을 지금 입실자(DB.residents)와 퇴실 이력(DB.residentHistory)을 함께 후보로 놓고 찾는다.
  //  1) sourceContractId로 직접 연결된 입실자, 그다음 이력이 있으면 그것.
  //  2) 없으면(기존 입실자에게 계약만 추가로 등록된 경우가 훨씬 흔함) 같은 방에서 계약 기간과 거주 기간이
  //     겹치는 입실자·이력 중 계약서의 입실자/계약자명과 이름이 같은 쪽을 우선한다 — 2인실처럼 같은 기간에
  //     둘 이상 겹치면 날짜만으로는 누구 계약인지 알 수 없다.
  //  3) 그 안에서는 입실일이 계약 시작일에 가장 가까운 쪽을 고른다(같으면 지금 입실자).
  // 예전에는 겹치는 "지금 입실자"가 한 명이라도 있으면 이력은 아예 보지 않아서, 중도퇴실한 사람의 계약이
  // 그 뒤에 들어온 다음 입실자 이름으로 계약 종료일까지 이용중처럼 그려졌다(강남일원 409호 류의 제보).
  function findContractOwner(c, range, group){
    const linkedResident = DB.residents.find(p=> p.sourceContractId===c.id);
    if(linkedResident) return { resident: linkedResident };
    const linkedHistory = DB.residentHistory.find(h=> h.sourceContractId===c.id);
    if(linkedHistory) return { history: linkedHistory };
    const declaredName = String(c.resident || c.contractor || '').trim();
    const nameHit = x=> !!declaredName && (x.name===declaredName || x.actualResidentName===declaredName);
    const candidates = [];
    DB.residents.forEach(p=>{
      if(!group.roomIds.has(p.roomId) || !p.moveIn) return;
      if(p.moveIn <= range.end && (p.moveOut || '9999-12-31') >= range.start) candidates.push({ resident: p, rec: p, order: 0 });
    });
    DB.residentHistory.forEach(h=>{
      if(!group.roomIds.has(h.roomId) || !h.moveIn) return;
      if(h.moveIn <= range.end && (h.moveOut || h.moveIn) >= range.start) candidates.push({ history: h, rec: h, order: 1 });
    });
    if(candidates.length === 0) return {};
    const pool = candidates.some(x=> nameHit(x.rec)) ? candidates.filter(x=> nameHit(x.rec)) : candidates;
    const startMs = Date.parse(range.start);
    const gap = x=> Math.abs(Date.parse(x.rec.moveIn) - startMs) || 0;
    pool.sort((a,b)=> (gap(a) - gap(b)) || (a.order - b.order));
    return pool[0];
  }
  // 계약/입실자/과거 퇴실자 세 가지 출처를 전부 {range, meta, name, memo, room}로 통일해서 다루고,
  // 같은 호실번호의 항목들은 (아래에서) 한 행 안에 막대 여러 개로 이어 붙인다.
  function contractTimelineEntry(x, group){
    const c = x.contract, range = x.range;
    const room = group.rooms.find(r=> r.id===c.roomId) || group.rooms[0];
    // 주인이 지금 입실자면 그 카드의 실거주자명·메모·퇴실예정 여부를 따르고, 퇴실 이력이면 퇴실자로 그린다.
    // 아무도 못 찾으면 계약 데이터의 입실자/계약자명만으로 표시한다.
    const owner = findContractOwner(c, range, group);
    const matched = owner.resident || null;
    const matchedHistory = owner.history || null;
    // 퇴실 처리된 입실자는 계약현황에 계약 날짜가 남아 있어도 실제 거주 기간(이력의 입실일~퇴실일)으로
    // 그린다(담당자 요청). 계약 날짜를 쓰면 중도퇴실한 사람이 계약 종료일까지 거주한 것처럼 보인다.
    // 같은 이력에 연결된 계약이 여러 건(갱신 계약 등)이면 아래에서 막대 하나로 합친다.
    const effectiveRange = matchedHistory
      ? { start: matchedHistory.moveIn || range.start, end: matchedHistory.moveOut || matchedHistory.moveIn || range.end }
      : range;
    const today = todayISO();
    let meta;
    if(matchedHistory) meta = timelineStatusMeta('퇴실');
    else if(range.end < today) meta = timelineStatusMeta('퇴실');
    else if(range.start > today) meta = timelineStatusMeta('입실예정');
    else if(matched && isOverdue(matched)) meta = timelineStatusMeta('연체');
    else if(matched && matched.scheduledToLeave) meta = timelineStatusMeta('퇴실확정');
    else meta = timelineStatusMeta('이용중');
    const rawName = matched ? residentDisplayName(matched) : (matchedHistory ? matchedHistory.name : (c.resident || c.contractor));
    // "오늘 이용중인 사람이 미리 등록해 둔 연장 계약"인지 나중에 판별하기 위한 식별자.
    // 연장 계약은 아직 입실자 레코드의 moveIn/moveOut이 새 계약 기간으로 갱신되기 전이라
    // matched(입실자 레코드) 기준으로는 서로 다른 사람처럼 보일 수 있어서, 입실자가 아니라
    // 계약서에 적힌 입실자/계약자명 자체를 기준으로 같은 사람 여부를 비교한다.
    const contractOccupantName = String(c.resident || c.contractor || '').trim();
    const matchKey = matchedHistory ? null : (contractOccupantName ? ('n:'+contractOccupantName) : (matched ? ('id:'+matched.id) : null));
    return { range: effectiveRange, meta, name: maskViewerName(rawName) || '이름 미입력', memo: matched ? (matched.memo||'') : '', room, matchKey, historyId: matchedHistory ? matchedHistory.id : null };
  }
  function residentTimelineEntry(p, room){
    return {
      range: { start: p.moveIn, end: p.moveOut || '9999-12-31' },
      meta: residentTimelineMeta(p, room),
      name: maskViewerName(residentDisplayName(p)) || '이름 미입력',
      memo: p.memo || '',
      room
    };
  }
  // 외부 채널 예약은 계약이 없으므로 입실자 카드의 예약 기간을 그대로 막대로 쓴다.
  // 막대 색은 채널 색을 쓰고, 이름 앞에 채널명을 붙여 독립생활 건과 확실히 구분한다.
  function externalResidentTimelineEntry(p, room){
    const ch = cleanKeyLoose(p.channel) || '외부채널';
    return {
      range: { start: p.moveIn, end: p.moveOut || '9999-12-31' },
      meta: externalChannelTimelineMeta(p),
      name: `[${ch}] ${maskViewerName(residentDisplayName(p)) || '이름 미입력'}`,
      memo: p.memo || '',
      room,
      external: true
    };
  }
  function historyTimelineEntry(h, room){
    return {
      range: { start: h.moveIn, end: h.moveOut || h.moveIn },
      meta: timelineStatusMeta('퇴실'),
      name: maskViewerName(h.name) || '이름 미입력',
      memo: '',
      room
    };
  }
  function buildTimelineBar(entry){
    const inD = new Date(entry.range.start);
    const outD = new Date(entry.range.end);
    if(outD < windowStart || inD > windowEnd) return null;
    const clampIn = inD < windowStart ? windowStart : inD;
    const clampOut = outD > windowEnd ? windowEnd : outD;
    const startIdx = dayIndexOf(clampIn);
    const endIdx = dayIndexOf(clampOut);
    const leftPx = startIdx * DAY_CELL_PX;
    const widthPx = Math.max((endIdx - startIdx + 1) * DAY_CELL_PX, DAY_CELL_PX);
    const bar = document.createElement('div');
    bar.className = 'tl-bar';
    bar.style.left = leftPx + 'px';
    bar.style.width = widthPx + 'px';
    bar.style.background = entry.meta.fg;
    // 퇴실확정 막대는 이미 전체가 퇴실확정 색으로 칠해져 있지만, 정확히 "언제 나가는지"는
    // 막대만 봐서는 바로 안 들어온다는 요청 — 실제 퇴실예정일(막대가 창 경계로 잘린 게 아니라
    // 진짜 마지막 날인 경우)에 진한 테두리와 "퇴실" 표시를 남겨 한눈에 알아보게 한다. 3개월
    // 창의 끝에서 잘린 막대(실제 퇴실일이 그 이후)는 창의 끝이 진짜 퇴실일이 아니므로
    // 표시하지 않는다.
    const isLeavingEnd = entry.meta.key === '퇴실확정' && outD <= windowEnd;
    if(isLeavingEnd) bar.classList.add('tl-bar-leaving-end');
    if(entry.external) bar.classList.add('tl-bar-external');
    const memoText = entry.memo ? ` <span class="tl-bar-memo">${esc(entry.memo)}</span>` : '';
    const leavingTag = isLeavingEnd ? ' <span class="tl-bar-leaving-tag">▶퇴실</span>' : '';
    bar.innerHTML = `<span class="tl-bar-sticky"><span class="tl-bar-name">${esc(entry.name)}</span>${memoText}${leavingTag}</span>`;
    bar.title = `${entry.name} · ${entry.meta.key} · ${entry.range.start} ~ ${entry.range.end}${entry.memo ? ' · ' + entry.memo : ''}${isLeavingEnd ? ` · ${entry.range.end}에 퇴실확정` : ''} (클릭 시 호실로 이동)`;
    bar.style.cursor = 'pointer';
    bar.onclick = ()=> scrollToRoomCard(entry.room);
    return bar;
  }

  // 같은 호실번호를 쓰는 방 레코드가 여러 건 존재해도(예: 호실 삭제 후 재등록 등) 타임라인에는
  // 호실당 정확히 한 행만 나와야 하므로, DB.rooms의 id가 아니라 화면에 보이는 호실번호로 묶는다.
  const roomGroups = [];
  const groupMap = new Map();
  rooms.forEach(room=>{
    let g = groupMap.get(room.number);
    if(!g){ g = { number: room.number, rooms: [], roomIds: new Set() }; groupMap.set(room.number, g); roomGroups.push(g); }
    g.rooms.push(room);
    g.roomIds.add(room.id);
  });

  roomGroups.forEach(group=>{
    const primaryRoom = group.rooms[0];
    // 계약현황(DB.contracts)에 이 호실의 계약 기록이 하나라도 있으면 계약 기준으로 표시하고,
    // 계약 기록이 전혀 없는 호실만 입실자 카드(DB.residents/History) 기준으로 대체 표시한다.
    // 시작일=종료일(하루도 안 되는 기간)인 계약과, 계약현황 모달에서 취소선으로 걸러지는 세 가지
    // 중복(환불 대체·계약일 정정·계약기간 정정)은 타임라인에도 표시하지 않는다 — 안 그러면
    // 계약현황에서는 걸러지는 중복이 타임라인에는 겹치는 막대 두 개로 나온다.
    const roomContracts = DB.contracts
      .filter(c=> group.roomIds.has(c.roomId))
      // 방이동으로 옮겨 온 계약은 옮겨 온 날부터 그린다(movedContractRange).
      .map(c=> ({ contract:c, range: movedContractRange(c, parseContractPeriodRange(c.contractPeriod)) }))
      .filter(x=> x.range && x.range.start !== x.range.end
        && !findSupersedingRefundContract(x.contract)
        && !findSupersedingDateEditContract(x.contract)
        && !findSupersedingPeriodEditContract(x.contract));

    // 외부 채널(엔코스테이·리브애니웨어 등) 예약은 결제 내역이 없어 계약 데이터가 만들어지지
    // 않는다. 아래 계약 분기는 "계약이 하나라도 있으면 계약만" 그리기 때문에, 과거 독립생활
    // 계약이 남아있는 호실에 들어온 외부 예약은 타임라인에서 통째로 사라져버렸다. 그래서 이
    // 예약들은 계약 유무와 무관하게 항상 입실자 카드의 예약 기간 기준으로 따로 그려준다.
    // (계약으로 만들어진 입실자는 sourceContractId가 있으므로 제외 — 막대가 두 번 그려진다.)
    const externalEntries = DB.residents
      .filter(p=> group.roomIds.has(p.roomId) && isExternalChannelResident(p) && !p.sourceContractId && p.moveIn)
      .map(p=> externalResidentTimelineEntry(p, group.rooms.find(r=>r.id===p.roomId) || primaryRoom));

    let entries;
    if(roomContracts.length > 0){
      // 한 계약 기간이 다른 계약 기간에 완전히 포함되면(예: 9/1~9/30 계약이 있는데 9/3 하루짜리
      // 단기 계약이 그 안에 또 있는 경우), 포함되는 더 짧은 쪽은 표시하지 않는다.
      const visible = roomContracts.filter(x=>
        !roomContracts.some(y=> y!==x
          && y.range.start <= x.range.start && y.range.end >= x.range.end
          && (y.range.start < x.range.start || y.range.end > x.range.end))
      );
      // 이미 이용중인 입실자가 미리 등록해 둔 연장 계약(미래 시작)은 새 입실 예정자가 아니라
      // 같은 사람이 계속 거주하는 것인데, 그 연장 계약만 보이는 미래 달을 보고 있으면 "오늘"
      // 걸쳐 있는 원래 계약은 이번 달 표시 대상(monthContracts)에서 이미 빠져 있어 비교 대상이
      // 없어진다. 그래서 이번 달로 자르기 전, 호실의 계약 전체를 기준으로 먼저 판별한다.
      // 같은 퇴실 이력에 연결된 계약이 여러 건(갱신 계약 등)이어도 실제 거주는 한 번이므로 막대 하나로 합친다.
      const seenHistoryIds = new Set();
      const allContractEntries = visible
        .map(x=> contractTimelineEntry(x, group))
        .filter(e=>{
          if(!e.historyId) return true;
          if(seenHistoryIds.has(e.historyId)) return false;
          seenHistoryIds.add(e.historyId);
          return true;
        })
        .sort((a,b)=> a.range.start.localeCompare(b.range.start));
      const today0 = todayISO();
      const activeToday = allContractEntries.find(e=> e.matchKey && e.range.start<=today0 && e.range.end>=today0);
      if(activeToday){
        allContractEntries.forEach(e=>{
          if(e!==activeToday && e.matchKey===activeToday.matchKey && e.range.start>today0){
            e.meta = activeToday.meta;
          }
        });
      }
      // 어느 계약에도 연결되지 않은 퇴실 이력(계약 데이터가 없던 시기의 거주, 외부 채널로 들어왔다 나간
      // 입실자 등)도 계약이 없는 호실과 똑같이 실제 거주 기간으로 보여준다 — 계약이 있는 호실이라는
      // 이유만으로 퇴실자가 타임라인에서 사라지지 않게.
      const unlinkedHistory = DB.residentHistory
        .filter(h=> group.roomIds.has(h.roomId) && h.moveIn && !seenHistoryIds.has(h.id)
          && new Date(h.moveOut || h.moveIn) >= windowStart && new Date(h.moveIn) <= windowEnd)
        .map(h=> historyTimelineEntry(h, group.rooms.find(r=>r.id===h.roomId) || primaryRoom));
      entries = allContractEntries
        .filter(e=> new Date(e.range.end) >= windowStart && new Date(e.range.start) <= windowEnd)
        .concat(externalEntries)
        .concat(unlinkedHistory)
        .sort((a,b)=> a.range.start.localeCompare(b.range.start));
    } else {
      // 현재 입실자가 퇴실예정으로 확정되면 다음 입실자를 미리 등록해둘 수 있어서(관리자 설정과
      // 무관하게 언제나 가능), 실제로는 동시에 거주하지 않는데도 DB.residents에 그 방 레코드가
      // 2건(퇴실예정 중인 사람 + 아직 입실 전인 예정자) 존재하는 경우가 있다. 실제로 지금 그
      // 자리에 있는 사람은 하나뿐이므로, "지금 이미 입실한(이용중/퇴실예정)" 레코드가 있으면
      // 그것만 보여주고 아직 입실 전인 예정자는 그 사람이 실제로 입실할 때(=더 이상 예정자가
      // 아니게 될 때)까지는 별도로 노출하지 않는다.
      const allResidents = DB.residents.filter(p=> group.roomIds.has(p.roomId));
      const currentResidents = allResidents.filter(p=> !isUpcoming(p));
      const residents = currentResidents.length > 0 ? currentResidents : allResidents;
      // 과거 퇴실자는 지금 보이는 3개월 창과 겹치는 기간의 기록만 보여준다 — 그렇지 않으면
      // 오래 운영한 방일수록 목록이 한없이 길어진다.
      const history = DB.residentHistory.filter(h=>{
        if(!group.roomIds.has(h.roomId) || !h.moveIn) return false;
        const hIn = new Date(h.moveIn);
        const hOut = new Date(h.moveOut || h.moveIn);
        return hOut >= windowStart && hIn <= windowEnd;
      });
      // 외부 채널 예약은 위 externalEntries에서 이미 만들었고, "재실자가 있으면 입실예정자는
      // 감춘다"는 규칙과 무관하게 항상 보여야 하므로 여기서는 제외한다.
      entries = [
        ...residents.filter(p=> !isExternalChannelResident(p) || p.sourceContractId)
          .map(p=> residentTimelineEntry(p, group.rooms.find(r=>r.id===p.roomId) || primaryRoom)),
        ...externalEntries,
        ...history.map(h=> historyTimelineEntry(h, group.rooms.find(r=>r.id===h.roomId) || primaryRoom))
      ].sort((a,b)=> a.range.start.localeCompare(b.range.start));
    }

    if(entries.length===0){ appendEmptyRoomRow(primaryRoom); return; }

    // 같은 호실의 여러 항목(계약 갱신, 입실자 교체 등)은 한 행 안에 막대 여러 개로 이어 붙인다.
    const bars = entries.map(e=> buildTimelineBar(e));
    const { meta, label } = roomStatusRowMeta(primaryRoom);

    appendRow(meta,
      `<span class="rm">${esc(group.number)}</span>
       <span class="nm"><span class="tl-status-dot" style="background:${meta.fg}"></span>${esc(label)}</span>`,
      bars,
      ()=> scrollToRoomCard(primaryRoom)
    );
  });

  bodyScroll.appendChild(gridWrap);
  tlWrap.appendChild(headScroll);
  tlWrap.appendChild(bodyScroll);
  wrap.appendChild(tlWrap);

  setTimeout(()=>{
    const prevBtn = document.getElementById('tlPrev');
    const nextBtn = document.getElementById('tlNext');
    if(prevBtn) prevBtn.onclick = ()=>{ UI.tlMonth--; if(UI.tlMonth<0){ UI.tlMonth=11; UI.tlYear--; } UI.tlScrollLeft = null; render(); };
    if(nextBtn) nextBtn.onclick = ()=>{ UI.tlMonth++; if(UI.tlMonth>11){ UI.tlMonth=0; UI.tlYear++; } UI.tlScrollLeft = null; render(); };
    // 사이트 상단 헤더(header.top)가 이미 position:sticky; top:0으로 화면 맨 위에 고정되어
    // 있어서, 이 날짜 헤더도 그냥 top:0으로 고정하면 둘이 같은 자리를 두고 겹친다(호실/타임라인
    // 탭이 스크롤로 화면 밖으로 밀려나도, 방 목록을 보는 동안 날짜 헤더가 상단 헤더 자리를
    // 침범하거나 그 뒤에 가려지는 문제). 상단 헤더의 실제 높이만큼 아래로 내려 붙여야 "고정된
    // 틀"이 위아래로 두 겹 깔끔하게 쌓인다. 화면 폭 등에 따라 헤더 높이가 달라질 수 있어
    // 고정 숫자 대신 실제 렌더된 높이를 읽어서 쓴다.
    const topHeaderEl = document.querySelector('#app > header.top');
    if(topHeaderEl) headScroll.style.top = topHeaderEl.offsetHeight + 'px';
    // 막대 안 라벨(.tl-bar-sticky)은 왼쪽에 고정된 호실 칸(.tl-label) 뒤로 숨으면 안 된다.
    // 그 칸 너비는 CSS(grid-template-columns)상 220px이지만, 브라우저 확대/폰트 설정에 따라
    // 실제 렌더 너비가 달라질 수 있어 고정값 대신 실제 값을 재서 쓴다.
    const firstLabel = gridWrap.querySelector('.tl-row .tl-label');
    if(firstLabel){
      const w = Math.round(firstLabel.getBoundingClientRect().width);
      if(w > 0) gridWrap.style.setProperty('--tl-label-w', w + 'px');
    }
    // 날짜 헤더(위쪽, headScroll)와 방 목록(아래쪽, bodyScroll)이 서로 다른 스크롤 영역으로
    // 분리되어 있으므로, 어느 한쪽을 스크롤하면 다른 쪽도 같은 위치로 맞춰준다 — 그래야 위쪽
    // 날짜 헤더를 스크롤해도 아래 막대들이 같이 움직이고, 반대로 방 목록 위에서 마우스 휠/
    // 트랙패드로 옆으로 스크롤해도 위쪽 날짜가 항상 맞게 따라온다. scrollLeft를 같은 값으로
    // 다시 대입하는 건 아무 효과가 없는 안전한 동작이라 무한 루프로 이어지지 않는다.
    let syncing = false;
    function syncScroll(from, to){
      if(syncing) return;
      syncing = true;
      to.scrollLeft = from.scrollLeft;
      UI.tlScrollLeft = from.scrollLeft;
      syncing = false;
    }
    headScroll.addEventListener('scroll', ()=> syncScroll(headScroll, bodyScroll));
    bodyScroll.addEventListener('scroll', ()=> syncScroll(bodyScroll, headScroll));
    // render()는 이 화면과 무관한 이유로도 앱 여기저기서 호출되므로, 스크롤해서 보던 위치가
    // 매번 가운데(이번 달)로 되돌아가면 오히려 불편하다. ◀/▶ 버튼으로 3개월 창 자체를 옮긴
    // 경우(위에서 UI.tlScrollLeft를 지움)나 처음 여는 경우에만 이번 달 시작 위치로 스크롤하고,

function normalizeFlexDate(s){
  const c = String(s||'').trim().replace(/[./]/g,'-');
  const m = c.match(/^(\d{2,4})-(\d{1,2})-(\d{1,2})$/);
  if(!m) return null;
  let [, y, mo, d] = m;
  if(y.length===2) y = '20'+y;

function parseContractPeriodRange(periodStr){

  const parts = raw.split(/[~–—]|\s+to\s+/i).map(s=>s.trim()).filter(Boolean);
  if(parts.length < 2) return null;
  const start = normalizeFlexDate(parts[0]);
  const end = normalizeFlexDate(parts[1]);
  if(!start || !end) return null;
  return { start, end };
}

// 계약일·계약자·입실자·연락처·결제금액이 전부 같은데 계약기간만 다르게 등록된 계약은, 원본

/* ---------------- 방이동한 사람의 계약 이력 옮기기 ----------------

   계약의 방은 붙여넣은 시트의 지점·방이름으로 정해지므로, 옮긴 계약에는 처음 방(sheetRoomId)과 옮겨 온 날(roomMovedOn)을 남긴다.
    - 누구 계약인가: 계약서의 입실자 또는 계약자 이름이 그 사람(이름·실거주자명)과 같은 것. 같은 방에 예전에 따로 살았던 기간의

    - 붙여넣기: 시트에는 여전히 이전 방이름이 적혀 있어서, 그대로 두면 이미 옮긴 계약이 이전 방에 중복으로 또 생긴다.
      movedContractRouteFor가 그런 행(같은 계약일·계약기간이거나, 그 사람이 지금 옮긴 방에 살고 있는 경우)을 옮긴 방으로 보낸다.
    - 타임라인: 옮긴 계약은 옮겨 온 날부터 그린다(movedContractRange). 그 전 거주는 이전 방의 퇴실 이력 막대로 보인다.
    - 실시간 반영은 importedAt 커서 구독이라 옮길 때 importedAt을 새로 매겨야 다른 탭에 간다. 환불·정정 대체 판정이
      importedAt 순서를 쓰므로, 옮기는 계약과 도착 방에 이미 있는 그 사람 계약을 원래 순서 그대로 다시 매긴다
      (importedAt이 없던 옛 계약은 이때 값이 생겨 대체 판정 대상이 된다). */
function contractPersonKey(c){ return cleanKeyLoose(c.resident || c.contractor); }
function personNameKeys(p){ return new Set([p && p.name, p && p.actualResidentName].map(cleanKeyLoose).filter(Boolean)); }
function contractBelongsTo(c, names, sourceContractId){
  if(sourceContractId && c.id === sourceContractId) return true;
  return names.has(cleanKeyLoose(c.resident)) || names.has(cleanKeyLoose(c.contractor));
}
function contractsToCarry(fromRoomId, names, sourceContractId, stayStart){
  if(!names.size && !sourceContractId) return [];
  return DB.contracts.filter(c=>{
    if(c.roomId !== fromRoomId || !contractBelongsTo(c, names, sourceContractId)) return false;
    if(c.sheetRoomId || !stayStart) return true;   // 이미 한 번 옮겨 온 계약은 그 사람 것이 확실하다
    const range = parseContractPeriodRange(c.contractPeriod);
    return !range || range.end >= stayStart;
  });
}
function moveContractsToRoom(list, toRoomId, movedOn, names){
  if(!list.length) return 0;
  const moving = new Set(list);
  list.forEach(c=>{
    if(!c.sheetRoomId) c.sheetRoomId = c.roomId;
    c.roomId = toRoomId;
    c.roomMovedOn = movedOn;
    // 이미 옮겨 간 입실자로 반영된 계약이다 — 새 방 계약현황에 "이 계약으로 입실자 교체"(↻)를 띄우지 않는다.
    c.appliedResident = true;
  });
  const resequence = DB.contracts
    .filter(c=> moving.has(c) || (c.roomId === toRoomId && contractBelongsTo(c, names)))
    .sort((a,b)=> (a.importedAt||'').localeCompare(b.importedAt||''));
  const base = Date.now();
  resequence.forEach((c, i)=>{ c.importedAt = new Date(base + i).toISOString(); });
  batchWriteDocs(CONTRACTS_COL, resequence).catch(e=>{
    console.error('계약 이력 옮기기 저장 실패:', e);
    showAlert(`계약 이력을 새 방으로 옮기지 못했습니다. 새로고침하면 이전 방에 그대로 보일 수 있습니다.\n\n오류 내용: ${(e && e.message) || e}`);
  });
  refreshContractsCache();
  return list.length;
}
// 붙여넣는 행(candidate)의 방이, 방이동으로 계약을 옮겨 간 사람의 이전 방이면 옮긴 방을 돌려준다.
function movedContractRouteFor(candidate){
  const name = contractPersonKey(candidate);
  if(!name) return null;
  const moved = DB.contracts
    .filter(m=> m.sheetRoomId && m.sheetRoomId === candidate.roomId && m.roomId !== candidate.roomId && contractPersonKey(m) === name)
    .sort((a,b)=> (b.contractDate||'').localeCompare(a.contractDate||'') || (b.importedAt||'').localeCompare(a.importedAt||''));
  if(!moved.length) return null;
  const date = normalizeFlexDate(candidate.contractDate) || String(candidate.contractDate||'').trim();
  const period = String(candidate.contractPeriod||'').trim();
  // 이미 옮긴 계약의 재붙여넣기·정정·환불 행(계약일 또는 계약기간이 같음)은 그 계약이 있는 방으로
  const same = moved.find(m=>
    (date && (normalizeFlexDate(m.contractDate) || String(m.contractDate||'').trim()) === date)
    || (period && String(m.contractPeriod||'').trim() === period));
  // 그 밖의 새 행(연장 등)은 그 사람이 지금 그 방에 살고 있을 때만
  const target = same || moved.find(m=> DB.residents.some(p=> p.roomId === m.roomId && personNameKeys(p).has(name)));
  return target ? { roomId: target.roomId, movedOn: target.roomMovedOn || '' } : null;
}
// 옮겨 온 계약은 옮겨 온 날부터가 이 방의 거주 기간이다. 옮기기 전에 끝난 계약은 이 방에 그리지 않는다(null).
function movedContractRange(c, range){
  if(!range || !c.roomMovedOn || range.start >= c.roomMovedOn) return range;
  if(range.end <= c.roomMovedOn) return null;
  return { start: c.roomMovedOn, end: range.end };
}
// 이 기능 전에 방이동한 사람: 방이동으로 들어온 지금 입실자(contractType "이동")마다 이전 방의 퇴실 이력(같은 이름,
// 퇴실일 = 다음 방 입실일)을 거슬러 올라가며 그 방들에 남은 그 사람 계약을 모은다. 이미 방이동해 나간 사람(퇴실 이력만
// 남은 사람)은 이동 여부를 알 수 없어 대상이 아니다.
function planPastRoomMoveContracts(){
  const plans = [];
  DB.residents.filter(p=> p.contractType === '이동' && p.moveIn).forEach(p=>{
    const names = personNameKeys(p);
    const toRoom = DB.rooms.find(r=> r.id === p.roomId);
    if(!names.size || !toRoom) return;
    const seen = new Set();
    const contracts = [];
    const fromRooms = [];
    let cur = { roomId: p.roomId, moveIn: p.moveIn };
    for(let hop = 0; hop < 10; hop++){
      const h = DB.residentHistory.find(x=> !seen.has(x.id) && x.roomId !== cur.roomId && x.moveOut === cur.moveIn
        && [...personNameKeys(x)].some(n=> names.has(n)));
      if(!h) break;
      seen.add(h.id);
      const found = contractsToCarry(h.roomId, names, h.sourceContractId, h.moveIn).filter(c=> !contracts.includes(c));
      if(found.length){
        contracts.push(...found);
        const fromRoom = DB.rooms.find(r=> r.id === h.roomId);
        if(fromRoom && !fromRooms.includes(fromRoom)) fromRooms.push(fromRoom);
      }
      cur = h;
    }
    if(contracts.length) plans.push({ p, toRoom, fromRooms, contracts });
  });
  return plans;
}
function carryPastRoomMoveContracts(){
  const plans = planPastRoomMoveContracts();
  if(!plans.length){
    showAlert('옮길 계약이 없습니다.\n방이동으로 들어온 지금 입실자의 이전 방에 그 사람 이름의 계약이 남아 있지 않습니다.');
    return;
  }
  const total = plans.reduce((n, x)=> n + x.contracts.length, 0);
  const lines = plans.slice(0, 30).map(x=>
    `- ${(roomBranch(x.toRoom) || {}).name || ''} ${x.fromRooms.map(r=> r.number + '호').join('·')} → ${x.toRoom.number}호 ${x.p.name}: ${x.contracts.length}건`);
  showConfirm(
    `방이동한 입실자 ${plans.length}명의 이전 방 계약 ${total}건을 지금 사는 방으로 옮길까요?\n\n${lines.join('\n')}`
      + (plans.length > 30 ? `\n...외 ${plans.length - 30}명` : ''),
    ()=>{
      plans.forEach(x=> moveContractsToRoom(x.contracts, x.toRoom.id, x.p.moveIn, personNameKeys(x.p)));
      logChange(`방이동 계약 옮기기: ${plans.length}명 · 계약 ${total}건`);
      scheduleSave(); render();
      showAlert(`계약 ${total}건을 옮겼습니다.`);
    });
}
/* ---- 방이동한 사람의 계약 이력 옮기기 끝 ---- */
function contractProposedResidentData(c){
  if(!c) return null;
  const range = parseContractPeriodRange(c.contractPeriod);
  return { contractId: c.id, name: c.resident || c.contractor || '', phone: c.contractorPhone || '', moveIn: range ? range.start : '', moveOut: range ? range.end : '' };
}
function roomContractSegments(room){
  const segments = [];
  DB.contracts.filter(c=>c.roomId===room.id).forEach(c=>{
    const range = parseContractPeriodRange(c.contractPeriod);
    if(!range) return;
    segments.push({ start: range.start, end: range.end, contract: c });
  });
  // "가장 최근 계약"은 계약기간의 시작일이 아니라 계약일(계약 등록/연장 시점) 기준으로 판단한다.
  // (예: 같은 계약을 여러 번 나눠 결제/연장 등록하면서 계약기간이 하루짜리로 찍히는 등
  //  기간 자체는 뒤죽박죽일 수 있어도, 계약일은 항상 실제 최신 순서를 반영하기 때문)
  segments.sort((a,b)=> (a.contract.contractDate||'').localeCompare(b.contract.contractDate||'') || a.start.localeCompare(b.start));
  return segments;
}
// 이 입실자의 계약 만료일. 계약이 있으면 그 방 계약들 중 "가장 늦은 종료일"을 쓴다 —
// 추가결제/분할결제처럼 나중에 등록된 짧은 계약이 있어도 실제 만료일이 앞당겨지지 않게 하기
// 위해서다(가장 최근 계약 하나만 보면 안 된다). 계약 데이터가 없는 외부 채널 예약은 입실자
// 카드의 예약 종료일을 만료일로 본다. 방에 남아있는 계약이 이 입실자가 들어오기도 전에
// 끝난 것이라면 이전 입실자의 계약이므로 쓰지 않는다.
function residentContractEndDate(p, room){
  if(isExternalChannelResident(p) && !p.sourceContractId) return p.moveOut || '';
  const segments = roomContractSegments(room);
  if(segments.length > 0){
    const maxEnd = segments.reduce((m, seg)=> seg.end > m ? seg.end : m, segments[0].end);
    if(!p.moveIn || maxEnd >= p.moveIn) return maxEnd;
  }
  return p.moveOut || '';
}
function contractEndDateMismatch(room){
  const segments = roomContractSegments(room);
  if(segments.length === 0) return false;
  // 계약이 여러 건으로 나뉘어 있어도(연장/분할결제 등) 실제 비교 대상은
  // 그 중 계약만료일(종료일)이 가장 늦은 날짜 하나면 충분하다.
  const latestEnd = segments.reduce((max, seg)=> seg.end > max ? seg.end : max, segments[0].end);
  const residents = DB.residents.filter(p=>p.roomId===room.id);
  if(residents.length === 0) return false;
  return !residents.some(p=> p.moveOut === latestEnd);
}
