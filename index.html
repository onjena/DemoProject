function renderUserManagePanel(){
  const box = document.createElement('div');
  box.className = 'stat-section';
  box.innerHTML = `<h3>사용자 관리</h3>`;
  const body = document.createElement('div');
  body.textContent = '불러오는 중…';
  body.style.cssText = 'font-size:12px;color:var(--ink-soft);';
  box.appendChild(body);

  USERS_COL.get().then(snap=>{
    body.innerHTML = '';
    const users = [];
    snap.forEach(doc=> users.push({ id: doc.id, ...doc.data() }));
    const order = { pending:0, viewer:1, editor:2, superadmin:3 };
    users.sort((a,b)=> (order[a.role] ?? 9) - (order[b.role] ?? 9) || (a.email||'').localeCompare(b.email||''));
    if(users.length===0){ body.textContent = '등록된 사용자가 없습니다.'; return; }

    users.forEach(u=>{
      const isPending = u.role === 'pending';
      const entryWrap = document.createElement('div');
      entryWrap.className = 'user-entry';

      const row = document.createElement('div');
      row.className = 'user-row';

      const emailSpan = document.createElement('span');
      emailSpan.className = 'user-email';
      emailSpan.textContent = u.email || u.id;
      row.appendChild(emailSpan);
      // 로그인한 본인 계정은 여기서 권한을 바꾸거나 차단·삭제할 수 없다(담당자 요청 — 스스로 권한을 없애 관리자 설정에서 잠기는 일을 막는다).
      const isSelf = !!CURRENT_USER && u.id === CURRENT_USER.uid;
      const SELF_LOCK_TITLE = '로그인한 본인 계정은 여기서 바꾸거나 삭제할 수 없습니다. 다른 슈퍼어드민 계정으로 처리하세요.';
      if(isSelf) row.appendChild(el('span', 'user-self', '현재 로그인'));

      if(isPending){
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.style.background = 'var(--st-leaving-bg)'; badge.style.color = 'var(--st-leaving)';
        badge.textContent = '승인 대기';
        row.appendChild(badge);
      }

      if(u.name || u.phone){
        const info = document.createElement('span');
        info.style.cssText = 'font-size:11.5px;color:var(--ink-soft);';
        const roleLabel = { viewer:'조회 전용', editor:'수정 가능', superadmin:'슈퍼어드민' }[u.requestedRole];
        info.textContent = [u.name, u.phone, isPending && roleLabel ? `희망: ${roleLabel}` : null].filter(Boolean).join(' · ');
        row.appendChild(info);
      }

      const roleSel = document.createElement('select');
      const defaultRole = isPending ? (u.requestedRole || 'viewer') : u.role;
      [['viewer','조회 전용'], ['editor','수정 가능'], ['superadmin','슈퍼어드민']].forEach(([val,label])=>{
        const o = document.createElement('option');
        o.value = val; o.textContent = label; o.selected = defaultRole === val;
        roleSel.appendChild(o);
      });
      row.appendChild(roleSel);

      const scopeSel = document.createElement('select');
      scopeSel.title = '이 계정이 접근할 수 있는 지점 범위';
      [['all','전체 지점'], ['selected','지점 선택']].forEach(([val,label])=>{
        const o = document.createElement('option');
        o.value = val; o.textContent = label; o.selected = (u.branchScope || 'all') === val;
        scopeSel.appendChild(o);
      });
      row.appendChild(scopeSel);

      const branchChecks = document.createElement('div');
      branchChecks.className = 'user-branch-checks';
      const checkInputs = DB.branches.map(b=>{
        const lbl = document.createElement('label');
        lbl.className = 'user-branch-check-item';
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.value = b.id;
        cb.checked = Array.isArray(u.branchIds) && u.branchIds.includes(b.id);
        lbl.appendChild(cb);
        lbl.appendChild(document.createTextNode(branchLabel(b)));
        branchChecks.appendChild(lbl);
        return cb;
      });

      function syncScopeVisibility(){
        const isSuper = roleSel.value === 'superadmin';
        scopeSel.style.display = isSuper ? 'none' : '';
        branchChecks.style.display = (!isSuper && scopeSel.value === 'selected') ? '' : 'none';
      }
      roleSel.addEventListener('change', syncScopeVisibility);
      scopeSel.addEventListener('change', syncScopeVisibility);
      syncScopeVisibility();

      const approveBtn = document.createElement('button');
      approveBtn.className = 'btn small primary';
      approveBtn.textContent = isPending ? '승인' : '역할 변경';
      approveBtn.onclick = ()=>{
        if(isSelf){ showAlert(SELF_LOCK_TITLE); return; }
        const newRole = roleSel.value;
        const branchScope = newRole === 'superadmin' ? 'all' : scopeSel.value;
        const branchIds = branchScope === 'selected' ? checkInputs.filter(cb=>cb.checked).map(cb=>cb.value) : [];
        if(branchScope === 'selected' && branchIds.length===0){
          showAlert('지점을 1개 이상 선택해주세요.');
          return;
        }
        USERS_COL.doc(u.id).set({ email: u.email, role: newRole, branchScope, branchIds, approvedBy: CURRENT_USER.email, approvedAt: new Date().toISOString() }, { merge:true })
          .then(()=>{
            const scopeLabel = branchScope === 'selected'
              ? ` (${branchIds.map(id=> DB.branches.find(b=>b.id===id)?.name || id).join(', ')})`
              : '';
            writeChangeLog(`${u.email} 계정 권한을 "${newRole}"(으)로 설정${scopeLabel}`);
            render();
          })
          .catch(e=> showAlert('처리 실패: ' + e.message));
      };
      row.appendChild(approveBtn);

      // 버튼 배치(담당자 요청 — 흔한 관리 화면처럼 같은 급의 동작은 나란히, ×는 삭제): 승인 대기 줄은 [승인][거절],
      // 쓰고 있는 계정 줄은 [역할 변경][접근 차단]과 맨 오른쪽 ×(계정 삭제). 거절은 요청을 사용자 목록에서 지우는 것이라
      // 승인 대기 줄에는 ×를 따로 두지 않는다(같은 동작 버튼이 둘이면 헷갈린다).
      const label = u.email || u.id;
      // 사용자 목록(users)과 이메일 등록 정보(emailIndex)만 지운다. 로그인 계정(Firebase Authentication)은 브라우저에서
      // 남의 것을 지울 수 없어(관리자 SDK 필요) 남는다 — 예전엔 삭제 뒤 Firebase 콘솔 안내 창을 띄웠는데 담당자 요청으로 뺐다.
      // 그 사람이 다시 로그인하면 initApp이 승인 대기 문서를 새로 만들어 목록에 다시 나타난다.
      const removeAccount = (confirmMsg, logMsg)=>{
        if(isSelf){ showAlert(SELF_LOCK_TITLE); return; }
        showConfirm(confirmMsg, ()=>{
          const batch = firestoreDB.batch();
          batch.delete(USERS_COL.doc(u.id));
          const emailKey = normalizeEmailKey(u.email);
          if(emailKey) batch.delete(EMAIL_INDEX_COL.doc(emailKey));
          batch.commit()
            .then(()=>{ writeChangeLog(logMsg); render(); })
            .catch(e=> showAlert('처리 실패: ' + e.message));
        });
      };
      const lockable = [roleSel, scopeSel, approveBtn, ...checkInputs];
      if(isPending){
        const rejectBtn = el('button', 'btn small', '거절');
        rejectBtn.title = '가입 요청을 거절하고 사용자 목록에서 지웁니다';
        rejectBtn.onclick = ()=> removeAccount(
          `${label} 계정 요청을 거절할까요?\n\n요청이 사용자 목록에서 지워지며 되돌릴 수 없습니다.`,
          `${label} 계정 요청 거절(사용자 목록 삭제)`);
        row.appendChild(rejectBtn);
        lockable.push(rejectBtn);
      } else {
        const blockBtn = el('button', 'btn small', '접근 차단');
        blockBtn.title = '계정은 두고 승인 대기로 돌려 로그인해도 쓸 수 없게 합니다(다시 승인하면 복구)';
        blockBtn.onclick = ()=>{
          if(isSelf){ showAlert(SELF_LOCK_TITLE); return; }
          showConfirm(`${label} 계정의 접근을 차단할까요?\n\n승인 대기 상태로 바뀌고, 다시 승인하면 복구됩니다.`, ()=>{
            USERS_COL.doc(u.id).set({ email: u.email, role:'pending' }, { merge:true })
              .then(()=>{ writeChangeLog(`${label} 계정 접근 차단`); render(); })
              .catch(e=> showAlert('처리 실패: ' + e.message));
          });
        };
        row.appendChild(blockBtn);
        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'iconbtn del user-del';
        delBtn.innerHTML = '&times;';
        delBtn.title = '계정 삭제';
        delBtn.setAttribute('aria-label', '계정 삭제');
        delBtn.onclick = ()=> removeAccount(
          `${label} 계정을 삭제할까요?\n\n사용자 목록과 이메일 등록 정보가 지워지며 되돌릴 수 없습니다.`,
          `${label} 계정 삭제(사용자 목록)`);
        row.appendChild(delBtn);
        lockable.push(blockBtn, delBtn);
      }

      if(isSelf) lockable.forEach(x=>{ x.disabled = true; x.title = SELF_LOCK_TITLE; });

      entryWrap.appendChild(row);
      entryWrap.appendChild(branchChecks);
      body.appendChild(entryWrap);
    });
  }).catch(e=>{ body.textContent = '사용자 목록을 불러오지 못했습니다: ' + e.message; });

  return box;
}

const CHANGELOG_PAGE_SIZE = 10;
const CHANGELOG_RECENT_LIMIT = 100;
// 기간 조회 한 번에 읽는 최대 건수. 무료 요금제 일일 읽기 한도(5만 건)를 지키기 위한 상한이다.
const CHANGELOG_RANGE_LIMIT = 1000;
// 변경 로그 timestamp는 writeChangeLog()에서 new Date().toISOString() (=UTC)으로 저장한다.
// 저장 형식을 UTC로 유지해야 Firestore의 문자열 정렬(orderBy 'timestamp')이 실제 시간 순서와
// 그대로 일치하므로, 저장은 UTC 그대로 두고 "화면에 보여줄 때"만 한국시간(KST, UTC+9)으로
// 바꾼다 — 기존에 쌓여 있는 로그도 별도 마이그레이션 없이 같은 규칙으로 읽힌다.
// (KST_OFFSET_MS는 todayISO() 옆에서 한 번만 선언한다.)
function formatKstStamp(iso){
  if(!iso) return '';
  const t = new Date(iso);
  // 혹시 파싱이 안 되는 옛 형식이 섞여 있으면 원문을 그대로 보여준다(빈칸으로 사라지지 않게).
  if(isNaN(t.getTime())) return String(iso).replace('T',' ').slice(0,16);
  return new Date(t.getTime() + KST_OFFSET_MS).toISOString().replace('T',' ').slice(0,16);
}
// 한국시간 기준 하루(00:00~24:00 KST)를 저장 형식인 UTC ISO 문자열 범위로 변환한다.
// UTC 하루로 조회하면 KST 09:00~다음날 09:00이 잡혀서 날짜가 어긋난다.
function kstDayRangeUtc(dateStr){
  return {
    start: new Date(`${dateStr}T00:00:00.000+09:00`).toISOString(),
    end:   new Date(`${dateStr}T23:59:59.999+09:00`).toISOString()
  };
}
function renderChangeLogPanel(){
  const box = document.createElement('div');
  box.className = 'stat-section';
  box.innerHTML = `<h3>변경 로그 <span class="log-tz-note">한국시간(KST) 기준</span></h3>`;

  // 기간(시작일~종료일, 한국시간)으로 조회한다. 종료일은 오늘로 채워 두고, 비우면 시작일 하루만 본다.
  const toolbar = document.createElement('div');
  toolbar.className = 'log-toolbar';
  const dateField = (labelText)=>{
    const wrap = document.createElement('div');
    const label = document.createElement('label');
    label.className = 'field-label'; label.textContent = labelText;
    const input = document.createElement('input');
    input.type = 'date';
    wrap.appendChild(label); wrap.appendChild(input);
    toolbar.appendChild(wrap);
    return input;
  };
  const startInput = dateField('시작일');
  const endInput = dateField('종료일');
  endInput.value = todayISO();
  const searchBtn = document.createElement('button');
  searchBtn.className = 'btn small primary'; searchBtn.textContent = '기간 조회';
  const resetBtn = document.createElement('button');
  resetBtn.className = 'btn small'; resetBtn.textContent = `최근 ${CHANGELOG_RECENT_LIMIT}건 보기`;
  toolbar.appendChild(searchBtn); toolbar.appendChild(resetBtn);
  box.appendChild(toolbar);

  const note = el('div', 'log-note', '', 'font-size:11.5px;color:var(--ink-soft);margin-bottom:6px;');
  box.appendChild(note);
  const body = document.createElement('div');
  body.style.cssText = 'font-size:12px;color:var(--ink-soft);';
  box.appendChild(body);
  const pager = document.createElement('div');
  pager.className = 'log-pager';
  box.appendChild(pager);

  let currentLogs = [];
  let currentPage = 1;

  function renderPage(){
    body.innerHTML = '';
    pager.innerHTML = '';
    if(currentLogs.length === 0){ body.textContent = '기록된 변경 로그가 없습니다.'; return; }
    const totalPages = Math.ceil(currentLogs.length / CHANGELOG_PAGE_SIZE);
    if(currentPage > totalPages) currentPage = totalPages;
    const start = (currentPage - 1) * CHANGELOG_PAGE_SIZE;
    currentLogs.slice(start, start + CHANGELOG_PAGE_SIZE).forEach(d=>{
      const time = formatKstStamp(d.timestamp);
      const row = document.createElement('div');
      row.className = 'log-row';
      row.innerHTML = `
        <span class="log-time">${esc(time)}</span>
        <span class="log-email">${esc(d.email || '-')}</span>
        <span class="log-summary">${esc(d.summary || '')}</span>
      `;
      body.appendChild(row);
    });
    if(totalPages > 1){
      // 기간 조회로 수백 건이 잡히면 페이지 버튼이 수십 개가 되므로, 현재 페이지 주변 10개만 보여준다.
      const pageBtn = (label, p, active)=>{
        const b = document.createElement('button');
        b.className = 'btn small' + (active ? ' primary' : '');
        b.textContent = label;
        b.onclick = ()=>{ currentPage = p; renderPage(); };
        pager.appendChild(b);
      };
      const from = Math.max(1, Math.min(currentPage - 4, totalPages - 9));
      const to = Math.min(totalPages, from + 9);
      if(from > 1) pageBtn('« 처음', 1, false);
      for(let p=from; p<=to; p++) pageBtn(String(p), p, p===currentPage);
      if(to < totalPages) pageBtn(`끝(${totalPages}) »`, totalPages, false);
    }
  }

  function load(query, describe){
    body.textContent = '불러오는 중…';
    pager.innerHTML = '';
    note.textContent = '';
    query.get().then(snap=>{
      currentLogs = []; snap.forEach(doc=> currentLogs.push(doc.data()));
      currentPage = 1;
      note.textContent = describe(currentLogs.length);
      renderPage();
    }).catch(e=>{ body.textContent = '로그를 불러오지 못했습니다: ' + e.message; });
  }
  function loadDefault(){
    load(CHANGELOG_COL.orderBy('timestamp','desc').limit(CHANGELOG_RECENT_LIMIT), n=> `최근 ${n}건`);
  }
  function loadByRange(startDate, endDate){
    const from = kstDayRangeUtc(startDate).start;
    const to = kstDayRangeUtc(endDate).end;
    load(CHANGELOG_COL.where('timestamp','>=',from).where('timestamp','<=',to)
        .orderBy('timestamp','desc').limit(CHANGELOG_RANGE_LIMIT),
      n=> `${startDate === endDate ? startDate : startDate + ' ~ ' + endDate} · ${n}건`
        + (n >= CHANGELOG_RANGE_LIMIT ? ` (가장 최근 ${CHANGELOG_RANGE_LIMIT.toLocaleString('ko-KR')}건까지만 표시 — 기간을 좁혀 주세요)` : ''));
  }

  searchBtn.onclick = ()=>{
    const startDate = startInput.value;
    const endDate = endInput.value || startDate;
    if(!startDate){ showAlert('조회할 시작일을 선택해주세요.'); return; }
    if(endDate < startDate){ showAlert('종료일이 시작일보다 앞설 수 없습니다.'); return; }
    loadByRange(startDate, endDate);
  };
  resetBtn.onclick = ()=>{ startInput.value = ''; endInput.value = todayISO(); loadDefault(); };

  loadDefault();
  return box;
}

function renderChannelManagePanel(){
  const box = document.createElement('div');
  box.className = 'stat-section';
  box.innerHTML = `<h3>유입채널 관리</h3>`;

  const list = document.createElement('div');
  list.className = 'channel-list';
  DB.channelList.forEach(ch=>{
    const chip = document.createElement('span');
    chip.className = 'channel-chip';
    const inUse = DB.residents.some(p=>p.channel===ch);
    chip.innerHTML = `<span>${esc(ch)}</span>`;
    const delBtn = document.createElement('button');
    delBtn.className = 'iconbtn del';
    delBtn.innerHTML = '&times;';
    delBtn.title = '이 채널 삭제';
    delBtn.onclick = ()=>{
      const msg = inUse
        ? `"${ch}" 채널을 목록에서 삭제할까요?\n이미 이 채널로 등록된 입실자들의 값은 그대로 남고, 새로 선택하는 목록에서만 사라집니다.`
        : `"${ch}" 채널을 목록에서 삭제할까요?`;
      showConfirm(msg, ()=>{
        DB.channelList = DB.channelList.filter(x=>x!==ch);
        logChange(`"${ch}" 유입채널 삭제`);
        scheduleSave(); render();
      });
    };
    chip.appendChild(delBtn);
    list.appendChild(chip);
  });
  box.appendChild(list);

  const addRow = document.createElement('div');
  addRow.className = 'channel-add-row';
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = '새 채널 이름 (예: 네이버부동산)';
  const addBtn = document.createElement('button');
  addBtn.className = 'btn small primary';
  addBtn.textContent = '+ 채널 추가';
  const doAdd = ()=>{
    const name = input.value.trim();
    if(!name){ return; }
    if(DB.channelList.some(c=>c.toLowerCase()===name.toLowerCase())){
      showAlert('이미 있는 채널명입니다.');
      return;
    }
    DB.channelList.push(name);
    logChange(`"${name}" 유입채널 추가`);
    scheduleSave(); render();
  };
  addBtn.onclick = doAdd;
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') doAdd(); });
  addRow.appendChild(input); addRow.appendChild(addBtn);
  box.appendChild(addRow);

  return box;
}

/* ---------------- 바로가기(유용한 기능 링크 모음) ---------------- */
function renderShortcutsView(){
  const wrap = document.createElement('div');
  wrap.style.paddingTop = '18px';
  wrap.className = 'shortcuts-layout';

  if((UI.shortcutSelectedId==null || !DB.shortcuts.some(s=>s.id===UI.shortcutSelectedId)) && DB.shortcuts.length){
    UI.shortcutSelectedId = DB.shortcuts[0].id;
  }

  const lnb = document.createElement('div');
  lnb.className = 'shortcuts-lnb';
  lnb.appendChild(el('h3', null, '바로가기'));

  const list = document.createElement('div');
  list.className = 'shortcuts-lnb-list';
  if(DB.shortcuts.length===0){
    list.appendChild(el('div','cleaning-empty','등록된 바로가기가 없습니다.'));
  } else {
    DB.shortcuts.forEach(s=>{
      const item = document.createElement('div');
      item.className = 'shortcuts-lnb-item';
      const linkBtn = document.createElement('button');
      linkBtn.className = 'link' + (UI.shortcutSelectedId===s.id ? ' active' : '');
      linkBtn.textContent = s.name;
      linkBtn.onclick = ()=>{ UI.shortcutSelectedId = s.id; render(); };
      item.appendChild(linkBtn);
      if(canEdit()){
        const delBtn = document.createElement('button');
        delBtn.className = 'iconbtn del';
        delBtn.innerHTML = '&times;';
        delBtn.title = '이 바로가기 삭제';
        delBtn.onclick = ()=>{
          showConfirm(`"${s.name}" 바로가기를 삭제할까요?`, ()=>{
            DB.shortcuts = DB.shortcuts.filter(x=>x.id!==s.id);
            if(UI.shortcutSelectedId===s.id) UI.shortcutSelectedId = DB.shortcuts[0] ? DB.shortcuts[0].id : null;
            logChange(`"${s.name}" 바로가기 삭제`);
            scheduleSave(); render();
          });
        };
        item.appendChild(delBtn);
      }
      list.appendChild(item);
    });
  }
  lnb.appendChild(list);

  if(canEdit()){
    const addRow = document.createElement('div');
    addRow.className = 'shortcuts-add-row';
    const nameInput = document.createElement('input');
    nameInput.type = 'text'; nameInput.placeholder = '기능명 (예: 환불금액 계산기)';
    const urlInput = document.createElement('input');
    urlInput.type = 'text'; urlInput.placeholder = '링크 주소 (예: https://...)';
    const addBtn = document.createElement('button');
    addBtn.className = 'btn small primary';
    addBtn.textContent = '+ 바로가기 추가';
    const doAdd = ()=>{
      const name = nameInput.value.trim();
      let url = urlInput.value.trim();
      if(!name || !url){ showAlert('기능명과 링크 주소를 모두 입력해주세요.'); return; }
      if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
      const s = { id: uid('sc'), name, url };
      DB.shortcuts.push(s);
      UI.shortcutSelectedId = s.id;
      logChange(`"${name}" 바로가기 추가`);
      scheduleSave(); render();
    };
    addBtn.onclick = doAdd;
    urlInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') doAdd(); });
    addRow.appendChild(nameInput); addRow.appendChild(urlInput); addRow.appendChild(addBtn);
    lnb.appendChild(addRow);
  }

  wrap.appendChild(lnb);

  const frameWrap = document.createElement('div');
  frameWrap.className = 'shortcuts-frame-wrap';
  const selected = DB.shortcuts.find(s=>s.id===UI.shortcutSelectedId);
  if(selected){
    const frameHead = document.createElement('div');
    frameHead.className = 'shortcuts-frame-head';
    const nameSpan = document.createElement('span');
    nameSpan.textContent = selected.name;
    const openLink = document.createElement('a');
    openLink.href = selected.url; openLink.target = '_blank'; openLink.rel = 'noopener';
    openLink.textContent = '새 탭에서 열기 ↗';
    frameHead.appendChild(nameSpan); frameHead.appendChild(openLink);
    frameWrap.appendChild(frameHead);
    const iframe = document.createElement('iframe');
    iframe.src = selected.url;
    iframe.title = selected.name;
    frameWrap.appendChild(iframe);
  } else {
    frameWrap.appendChild(el('div','shortcuts-empty','왼쪽에서 바로가기를 선택하거나 추가해주세요.'));
  }
  wrap.appendChild(frameWrap);

  return wrap;
}

/* ---------------- stats view ---------------- */
function renderStatsView(){
  const wrap = document.createElement('div');
  wrap.style.paddingTop = '18px';

  if(USER_ROLE !== 'viewer'){
    wrap.appendChild(renderOverdueStatsCard());
    wrap.appendChild(renderPendingMoveStatsCard());
    wrap.appendChild(renderJustImportedStatsCard());
    wrap.appendChild(renderRefundPendingStatsCard());
  }

  const branchSection = document.createElement('div');
  branchSection.className = 'stat-section';
  branchSection.innerHTML = `<h3 style="margin:0 0 12px;font-size:19px;">지점별 현황 (${localDateKey().replace(/-/g,'/')})</h3>`;
  const table = document.createElement('table');
  table.className = 'branch-table branch-stat-table';
  // 조회 전용 계정에는 판매보류를 호실·메모 대신 건수로만 보여준다(담당자 요청). 수정 가능·슈퍼어드민은 그대로.
  const holdCountOnly = USER_ROLE === 'viewer';
  // 열 너비 합계 100% — 호실·메모를 보여줄 때는 마지막 판매보류 열이 정확히 40%, 건수만 보여줄 때는 다른 숫자 칸과 같다.
  table.innerHTML = `<colgroup>`
    + (holdCountOnly
      ? `<col style="width:28%"><col style="width:12%"><col style="width:12%"><col style="width:12%"><col style="width:12%"><col style="width:12%"><col style="width:12%">`
      : `<col style="width:16%"><col style="width:8%"><col style="width:9%"><col style="width:9%">`
        + `<col style="width:9%"><col style="width:9%"><col style="width:40%">`)
    + `</colgroup>`
    + `<thead><tr><th>지점</th><th>호실수</th><th>이용중</th><th>판매중</th><th>입실율</th><th>예약</th><th>판매보류</th></tr></thead>`;
  const tbody = document.createElement('tbody');
  const totals = { total:0, occupied:0, forSale:0, hold:0, reserved:0 };
  allowedBranches().forEach(b=>{
    const rms = DB.rooms.filter(r=>r.branchId===b.id);
    const total = rms.length;
    let occupied=0, forSale=0;
    const holdRooms = [];
    rms.forEach(r=>{
      const tabs = roomTabs(r);
      if(tabs.includes('이용중')) occupied++;
      if(tabs.includes('판매중')) forSale++;
      if(tabs.includes('판매보류')) holdRooms.push(r);
    });
    // roomsInFilterTab의 "예약" 정의(예약 플래그 + 입실확정)와 항상 일치하도록 같은 함수를
    // 재사용한다 — 대시보드 숫자를 클릭해 들어간 방 목록과 여기 숫자가 어긋나면 안 된다.
    const reserved = roomsInFilterTab(rms, '예약').length;
    // 입실율 = 이용중 / 호실수 * 100. "입실확정"(입실예정일이 많이 남아 이용중과 별도로
    // 구분되는 상태, effectiveRoomStatus 참고)이나 roomHasActiveResident(입실확정 포함)
    // 기준으로 계산하면 "이용중" 칸의 숫자와 입실율이 서로 안 맞아 보이는 문제가 있었다.
    const occRate = total ? Math.round((occupied/total)*100) : 0;
    totals.total += total; totals.occupied += occupied; totals.forSale += forSale;
    totals.hold += holdRooms.length; totals.reserved += reserved;
    const occColor = occRate >= 90 ? 'var(--ink)' : (occRate >= 80 ? 'var(--st-forsale)' : 'var(--st-hold)');
    const holdText = holdCountOnly ? holdRooms.length
      : holdRooms.length
        ? holdRooms.map(r=> esc(r.note ? `${r.number}: ${r.note}` : `${r.number}`)).join('<br>')
        : '-';
    const tabCell = (tab, content, cls)=> `<td${cls ? ` class="${cls}"` : ''}><a href="#" data-goto="${b.id}" data-tab="${tab}" class="stat-cell-link">${content}</a></td>`;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><a href="#" data-goto="${b.id}" data-tab="전체" style="color:var(--accent-ink);font-weight:700;text-decoration:none;">${esc(branchLabel(b))}</a></td>
      <td>${total}</td>${tabCell('이용중', occupied)}${tabCell('판매중', forSale)}<td style="color:${occColor};font-weight:700;">${occRate}%</td>${tabCell('예약', reserved)}${tabCell('판매보류', holdText, holdCountOnly ? '' : 'hold-cell')}`;
    tbody.appendChild(tr);
  });
  const totalOccRate = totals.total ? Math.round((totals.occupied/totals.total)*100) : 0;
  const totalOccColor = totalOccRate >= 90 ? 'var(--ink)' : (totalOccRate >= 80 ? 'var(--st-forsale)' : 'var(--st-hold)');
  const totalTr = document.createElement('tr');
  totalTr.className = 'branch-table-total';
  totalTr.innerHTML = `<td>전체</td>
    <td>${totals.total}</td><td>${totals.occupied}</td><td>${totals.forSale}</td><td style="color:${totalOccColor};font-weight:700;">${totalOccRate}%</td><td>${totals.reserved}</td><td>${totals.hold}</td>`;
  tbody.insertBefore(totalTr, tbody.firstChild);
  table.appendChild(tbody);
  branchSection.appendChild(table);
  wrap.appendChild(branchSection);

  wrap.querySelectorAll('[data-goto]').forEach(a=>{
    a.addEventListener('click', (e)=>{ e.preventDefault(); UI.view='branch'; UI.branchId = a.dataset.goto; UI.branchTab='rooms'; UI.roomStatusFilter=a.dataset.tab || '전체'; render(); });
  });

  return wrap;
}

// "이 PC(계정)에서만 퇴실자 검색·이력이 안 보인다"류 문제를 화면만 보고 진단할 수 있게,

// (캐시를 쓴 건지, 서버에서 0건을 받은 건지, 권한 오류로 실패한 건지가 구분되지 않아
//  같은 문제를 여러 번 헛짚었다.)
function renderLoadDiagnosticsPanel(){
  const box = document.createElement('div');
  box.className = 'stat-section';
  box.appendChild(el('h3', null, '데이터 로딩 상태'));

  const rows = [
    ['실행 중인 코드 버전', APP_BUILD],
    ['배포된 최신 버전', newerBuildSeen ? `${newerBuildSeen} (새로고침 필요)` : '실행 중인 버전과 같음 (30분마다 확인)'],
    ['로그인 계정', (CURRENT_USER && CURRENT_USER.email) || '-'],
    ['권한', USER_ROLE || '-'],
    ['지점 접근 범위', USER_BRANCH_SCOPE === 'selected' ? `선택한 지점 ${Array.isArray(USER_BRANCH_IDS) ? USER_BRANCH_IDS.length : 0}곳` : '전체'],
    ['계약 이력', `${LOAD_DIAG.contracts.count}건 (${LOAD_DIAG.contracts.source})${LOAD_DIAG.contracts.error ? ' · 오류: ' + LOAD_DIAG.contracts.error : ''}`],
    ['퇴실 이력', `${LOAD_DIAG.history.count}건 (${LOAD_DIAG.history.source})${LOAD_DIAG.history.error ? ' · 오류: ' + LOAD_DIAG.history.error : ''}`],
    ['불러온 시각', LOAD_DIAG.at || '-']
  ];
  const table = document.createElement('table');
  table.style.cssText = 'width:100%;border-collapse:collapse;font-size:12.5px;';
  table.innerHTML = rows.map(([k,v])=>{
    const bad = /실패|오류|새로고침 필요/.test(String(v)) || (k.includes('이력') && /^0건/.test(String(v)));
    return `<tr>
      <td style="padding:6px 4px;color:var(--ink-soft);width:150px;">${esc(k)}</td>
      <td style="padding:6px 4px;font-weight:700;${bad ? 'color:var(--st-hold);' : ''}">${esc(v)}</td>
    </tr>`;
  }).join('');
  box.appendChild(table);

  const btn = document.createElement('button');
  btn.className = 'btn small primary';
  btn.textContent = '캐시 비우고 다시 불러오기';
  btn.style.marginTop = '10px';
  btn.onclick = ()=>{
    showConfirm('로컬에 저장된 계약·퇴실 이력 캐시를 지우고 서버에서 새로 불러옵니다.\n(저장된 데이터는 지워지지 않습니다.)', ()=>{
      try{
        localStorage.removeItem(CONTRACTS_CACHE_KEY);
        localStorage.removeItem(HISTORY_CACHE_KEY);
      }catch(e){ /* localStorage 사용 불가 환경이면 어차피 캐시가 없다 */ }
      location.reload();
    });
  };
  box.appendChild(btn);
  return box;
}

// 목록 한 묶음(버튼·항목 / 알아두기 / 주의)을 그린다. [이름, 설명] 쌍이면 이름을 굵게 표시한다.
function appendHelpList(parent, rows){
  const ul = el('ul', 'help-list');
  rows.forEach(row=>{
    const li = document.createElement('li');
    if(Array.isArray(row)){
      li.appendChild(el('b', null, row[0]));
      li.appendChild(document.createTextNode(' — ' + row[1]));
    }else{
      li.textContent = row;
    }
    ul.appendChild(li);
  });
  parent.appendChild(ul);
}
// 영역 하나의 도움말. 전체 도움말 창과 영역별 ? 창이 같은 모양을 쓴다.
function renderAdminHelpSection(sec){
  const node = el('section', 'help-sec');
  node.appendChild(el('h3', null, sec.title));
  if(sec.summary) node.appendChild(el('p', null, sec.summary));
  if(sec.items && sec.items.length){ node.appendChild(el('h4', null, '버튼 · 항목')); appendHelpList(node, sec.items); }
  if(sec.notes && sec.notes.length){ node.appendChild(el('h4', null, '알아두기')); appendHelpList(node, sec.notes); }
  if(sec.cautions && sec.cautions.length){
    const c = el('div', 'help-caution');
    c.appendChild(el('h4', null, '주의'));
    appendHelpList(c, sec.cautions);
    node.appendChild(c);
  }
  return node;
}

  closeAdminHelpPopover();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box help-box';
  box.setAttribute('role', 'dialog');
  box.setAttribute('aria-label', '관리자 설정 도움말');

  // 제목 줄과 목차 탭을 한 덩어리로 위에 고정한다 — 목차를 눌러 아래로 이동해도 탭이 사라지지 않게(담당자 요청).
  const stickyTop = el('div', 'help-top');
  const head = el('div', 'help-head');
  head.appendChild(el('h2', null, '관리자 설정 도움말'));
  const closeBtn = el('button', 'btn small', '닫기');
  head.appendChild(closeBtn);
  stickyTop.appendChild(head);
  const toc = el('div', 'help-toc');
  stickyTop.appendChild(toc);
  box.appendChild(stickyTop);

  const body = el('div', 'help-body');
  const secEls = {};
  adminHelpSections().forEach(sec=>{
    const node = renderAdminHelpSection(sec);
    secEls[sec.id] = node;
    body.appendChild(node);
    const link = el('button', null, sec.title);
    link.type = 'button';
    link.onclick = ()=> jump(sec.id);
    toc.appendChild(link);
  });
  box.appendChild(body);
  overlay.appendChild(box);

  function jump(id){
    const node = secEls[id];
    if(!node) return;
    node.scrollIntoView({ block:'start' });
    node.classList.remove('flash');
    void node.offsetWidth;   // 같은 영역을 다시 눌러도 강조 애니메이션이 다시 돌도록
    node.classList.add('flash');
  }
  const onKey = (e)=>{ if(e.key === 'Escape') close(); };
  function close(){ overlay.remove(); document.removeEventListener('keydown', onKey); }
  closeBtn.onclick = close;
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(overlay);
  // 영역으로 이동했을 때 제목이 고정 영역에 가려지지 않도록 그 높이만큼 여백을 둔다(탭이 몇 줄로 접히느냐에 따라 다르다).
  box.style.setProperty('--help-top-h', (stickyTop.offsetHeight + 8) + 'px');
  setTimeout(()=> closeBtn.focus(), 0);
}

// 영역 제목 옆 ?: 그 영역 도움말만 ? 바로 아래 작은 창으로 띄운다(전체는 상단 "📖 도움말", 담당자 요청).
// 같은 ?를 다시 누르거나, 바깥을 누르거나, Esc를 누르면 닫힌다. 한 번에 하나만 열린다.
let adminHelpPopover = null;   // { anchor, close }
function closeAdminHelpPopover(){
  if(!adminHelpPopover) return;
  const p = adminHelpPopover;
  adminHelpPopover = null;
  p.close();
}
function toggleAdminHelpPopover(anchor, helpId){
  const sameOpen = !!adminHelpPopover && adminHelpPopover.anchor === anchor;
  closeAdminHelpPopover();
  if(sameOpen) return;
  const sec = adminHelpSections().find(x=> x.id === helpId);
  if(!sec) return;

  const pop = el('div', 'help-popover');
  pop.setAttribute('role', 'dialog');
  pop.setAttribute('aria-label', sec.title + ' 도움말');
  const closeBtn = el('button', 'help-popover-close', '✕');
  closeBtn.type = 'button';
  closeBtn.title = '닫기';
  closeBtn.onclick = closeAdminHelpPopover;
  const body = el('div', 'help-popover-body');
  body.appendChild(renderAdminHelpSection(sec));
  pop.appendChild(closeBtn);
  pop.appendChild(body);
  document.body.appendChild(pop);

  // ? 바로 아래에 붙이되, 오른쪽으로 넘치면 안쪽으로 당기고, 아래 공간이 모자라면 위로 올린다.
  const r = anchor.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  const left = Math.max(8, Math.min(r.left - 12, document.documentElement.clientWidth - w - 8));
  const top = (r.bottom + 6 + h > window.innerHeight && r.top - 6 - h >= 0) ? r.top - 6 - h : r.bottom + 6;
  pop.style.left = (left + window.scrollX) + 'px';
  pop.style.top = (top + window.scrollY) + 'px';
  anchor.classList.add('active');

  const onDown = (e)=>{ if(!pop.contains(e.target) && !anchor.contains(e.target)) closeAdminHelpPopover(); };
  const onKey = (e)=>{ if(e.key === 'Escape') closeAdminHelpPopover(); };
  // 창 너비가 바뀌면 ? 위치가 달라지므로 닫는다. 휴대폰에서 스크롤할 때 주소창이 접히며 생기는
  // 높이 변화에는 닫지 않는다(긴 도움말을 스크롤하다 창이 사라지지 않게).
  const openWidth = window.innerWidth;
  const onResize = ()=>{ if(window.innerWidth !== openWidth) closeAdminHelpPopover(); };
  document.addEventListener('mousedown', onDown);
  document.addEventListener('keydown', onKey);
  window.addEventListener('resize', onResize);
  adminHelpPopover = { anchor, close: ()=>{
    pop.remove();
    anchor.classList.remove('active');
    document.removeEventListener('mousedown', onDown);
    document.removeEventListener('keydown', onKey);
    window.removeEventListener('resize', onResize);
  }};
}

/* 지점/호실/입실자 등 핵심 데이터만 하루 1건씩 자동 스냅샷으로 남긴다. 계약·퇴실 이력은
   제외한다 — 이미 건별 문서로 저장되어 있어 별도 백업 없이도 안전하고, 통째로 백업하면
   예전처럼 문서 용량 제한에 다시 걸릴 수 있다. 최근 3일치만 남기고 오래된 건 정리한다. */
async function maybeCreateDailyBackup(){
  const today = todayISO();
  try{
    const existing = await BACKUPS_COL.doc(today).get();
    if(existing.exists) return;
    const core = { branches: DB.branches, rooms: DB.rooms, residents: DB.residents, channelList: DB.channelList, shortcuts: DB.shortcuts };
    await BACKUPS_COL.doc(today).set({ json: JSON.stringify(core), backedUpAt: new Date().toISOString() });
    const allBackups = await BACKUPS_COL.get();
    const dates = allBackups.docs.map(d=>d.id).sort(); // 오래된 날짜부터
    const toDelete = dates.slice(0, Math.max(0, dates.length - 3));
    if(toDelete.length) await batchDeleteDocs(BACKUPS_COL, toDelete);
  }catch(e){ console.error('자동 백업 실패:', e); }
}

function downloadFullBackup(){
  const backup = {
    branches: DB.branches, rooms: DB.rooms, residents: DB.residents,
    contracts: DB.contracts, residentHistory: DB.residentHistory,
    channelList: DB.channelList, shortcuts: DB.shortcuts,
    backedUpAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(backup)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `monthliv_backup_${todayISO()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function restoreLatestBackup(){
  let snap;
  try{
    snap = await BACKUPS_COL.get();
  }catch(e){
    console.error(e);
    showAlert('백업 목록을 불러오지 못했습니다: ' + e.message);
    return;
  }
  if(snap.empty){ showAlert('저장된 자동 백업이 없습니다.'); return; }
  const docs = snap.docs.map(d=>({ id:d.id, data:d.data() })).sort((a,b)=> b.id.localeCompare(a.id));
  const latest = docs[0];
  let core;
  try{ core = JSON.parse(latest.data.json); }catch(e){ showAlert('백업 데이터를 읽지 못했습니다.'); return; }

  showConfirm(
    `"${latest.id}" 날짜 백업을 가져올까요?\n\n` +
    `백업 데이터: 지점 ${core.branches.length}개 · 호실 ${core.rooms.length}개 · 입실자 ${core.residents.length}명\n` +
    `현재 데이터: 지점 ${DB.branches.length}개 · 호실 ${DB.rooms.length}개 · 입실자 ${DB.residents.length}명\n\n` +
    `⚠ 현재 화면의 지점·호실·입실자 정보가 백업 시점 내용으로 완전히 대체됩니다(계약·퇴실 이력은 영향 없음). 되돌릴 수 없으니 신중히 확인해주세요.`,
    async ()=>{
      DB.branches = core.branches;
      DB.rooms = core.rooms;
      DB.residents = core.residents;
      if(Array.isArray(core.channelList)) DB.channelList = core.channelList;
      if(Array.isArray(core.shortcuts)) DB.shortcuts = core.shortcuts;
      resetEditBaseline();   // 백업 복원은 항목별 수정 이력으로 남기지 않는다(변경 로그에 복원 한 줄로 남는다)
      try{
        const newCore = { branches: DB.branches, rooms: DB.rooms, residents: DB.residents, channelList: DB.channelList, shortcuts: DB.shortcuts };
        await FIRESTORE_DOC.set({ json: JSON.stringify(newCore), updatedAt: new Date().toISOString() });
        logChange(`"${latest.id}" 백업으로 복원`);
        render();
        showAlert('백업 데이터로 복원되었습니다.');
      }catch(e){
        console.error(e);
        showAlert('복원 중 저장에 실패했습니다: ' + e.message);
      }
    }
  );
}

/* ---------------- 방 가격 원장 ----------------
   방 가격은 이 대시보드와 연장 계산기(monthliv.github.io/Calculator/Extend.html) 두 곳에서
   쓰는데, 예전에는 계산기 쪽 HTML에 하드코딩돼 있어서 가격이 바뀔 때마다 코드를 고쳐야 했다.
   이제 Firestore 문서 하나(monthliv/roomPrices)를 원장으로 두고 두 사이트가 같은 값을 읽는다.
   여기서는 엑셀로 내려받아 고치고 다시 올리는 것만 하면 된다.

   한 행 = 지점 + 룸타입 조합. 필드 이름은 계산기 쪽 데이터 구조를 그대로 따른다.
     b    지점명            r    룸타입
     p1   1인 입실료        p2   2인 입실료(없으면 null)
     new  신규회원 1박      ex   기존회원 1박 (숫자, 또는 1인/2인이 다르면 [1인, 2인])
     nums 이 조합에 속한 호실 목록
*/
// 포트폴리오용 복사본: 실제 운영 가격/지점 데이터는 제거했습니다. 방 가격 관리 화면에서
// 엑셀 업로드로 원하는 예시 데이터를 새로 올려 쓰세요.
const ROOM_PRICE_SEED = [
];

let ROOM_PRICES = { rooms: [], updatedAt: '', updatedBy: '' };

// 엑셀은 호실 1개 = 1행으로 다룬다(실무에서 호실 단위로 관리하기 때문). 저장은 계산기가
// 쓰는 구조에 맞춰 지점+룸타입으로 묶어 nums 배열로 되돌린다.
// 뒤의 두 칸(성수기)은 시기에 따라 입실료가 바뀌는 지점만 채운다. 나머지는 비워둔다.
const ROOM_PRICE_HEADERS = ['지점', '호실', '룸타입', '1인 입실료', '2인 입실료', '신규회원 1박', '기존회원 1박(1인)', '기존회원 1박(2인)', '성수기 1인 입실료', '성수기 적용월'];

async function loadRoomPrices(){
  try{
    const snap = await ROOM_PRICES_DOC.get();
    const d = snap.exists ? snap.data() : null;
    ROOM_PRICES = {
      rooms: (d && Array.isArray(d.rooms)) ? d.rooms : [],
      updatedAt: (d && d.updatedAt) || '',
      updatedBy: (d && d.updatedBy) || ''
    };
  }catch(e){
    // 조용히 넘기면 "가격이 원래 없는 것"과 구분이 안 된다(도어락 때 겪은 문제).
    console.error('방 가격 불러오기 실패:', e);
    showAlert(`방 가격을 불러오지 못했습니다. 방 가격 관리 화면이 비어 보일 수 있습니다.\n\n오류 내용: ${(e && e.message) || e}`);
  }
}

// 방 가격 원장 실시간 반영. 시작할 때 읽은 값이나 이 탭이 방금 저장한 값처럼 updatedAt이
// 같으면 이미 반영된 것이라 건너뛴다. 편집 중이면 값만 바꿔두고 화면은 다음 render()에서 그린다.
function applyRoomPricesSnapshot(snap){
  if(!CURRENT_USER) return;
  if(snap.metadata && snap.metadata.hasPendingWrites) return;
  const d = snap.exists ? snap.data() : null;
  const updatedAt = (d && d.updatedAt) || '';
  if(updatedAt === ROOM_PRICES.updatedAt) return;
  ROOM_PRICES = {
    rooms: (d && Array.isArray(d.rooms)) ? d.rooms : [],
    updatedAt,
    updatedBy: (d && d.updatedBy) || ''
  };
  if(anyEditInProgress()) return;
  render();
}

function roomPricesToRows(){ return roomPriceRowsOf(ROOM_PRICES.rooms || []); }
// 저장 구조(지점+타입에 호실 목록)를 엑셀용으로 펼친다 — 호실 하나가 한 행이 된다.
function roomPriceRowsOf(list){
  const out = [];
  (list || []).forEach(r=>{
    const ex1 = Array.isArray(r.ex) ? r.ex[0] : r.ex;
    const ex2 = Array.isArray(r.ex) ? r.ex[1] : '';
    const base = {
      '룸타입': r.r || '',
      '1인 입실료': r.p1 || 0,
      '2인 입실료': (r.p2 == null ? '' : r.p2),
      '신규회원 1박': r.new || 0,
      '기존회원 1박(1인)': ex1 || 0,
      '기존회원 1박(2인)': (ex2 === '' || ex2 == null) ? '' : ex2,
      '성수기 1인 입실료': r.p1Alt || '',
      '성수기 적용월': (r.p1Alt && r.altMonths && r.altMonths.length) ? r.altMonths.join(',') : ''
    };
    const nums = (r.nums && r.nums.length) ? r.nums : [''];
    nums.forEach(n=>{
      out.push(Object.assign({ '지점': r.b || '', '호실': n }, base));
    });
  });
  return out;
}

// 다운로드에 쓸 기준 행. 원장에 저장된 값이 있으면 그걸 쓰고, 아직 없으면 시드(현재 운영
// 중인 가격표)를 쓴다 — 첫 다운로드부터 빈 양식이 아니라 실제 가격이 담겨 나온다.
function currentRoomPriceRows(){
  const rooms = (ROOM_PRICES.rooms && ROOM_PRICES.rooms.length) ? ROOM_PRICES.rooms : ROOM_PRICE_SEED;
  return { rooms, fromSeed: !(ROOM_PRICES.rooms && ROOM_PRICES.rooms.length) };
}
// 대시보드에는 있는데 가격표 어느 행에도 안 들어있는 호실. 담당자가 무엇을 추가해야 하는지
// 알 수 있게 두 번째 시트로 함께 내려준다(가격표 시트에 섞으면 지점명 표기가 뒤엉킨다).
function roomsMissingFromPriceLedger(){
  const out = [];
  (DB.rooms || []).forEach(room=>{
    if(roomLedgerPrice(room)) return;
    const branch = (DB.branches || []).find(b=> b.id === room.branchId);
    if(!branch) return;
    out.push({
      '지점': branchLabel(branch),
      '호실': room.number || '',
      '타입': room.type || '',
      '사유': ledgerRowsForBranch(branch).length === 0 ? '가격표에 이 지점이 없음' : '가격표의 호실 목록에 없음'
    });
  });
  return out;
}
function downloadRoomPriceTemplate(){
  if(typeof XLSX === 'undefined'){ showAlert('엑셀 라이브러리를 불러오지 못했습니다. 네트워크 연결을 확인해주세요.'); return; }
  const { rooms, fromSeed } = currentRoomPriceRows();
  const rows = roomPriceRowsOf(rooms);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows, { header: ROOM_PRICE_HEADERS }), '방가격');
  const missing = roomsMissingFromPriceLedger();
  if(missing.length > 0){
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(missing, { header: ['지점','호실','타입','사유'] }), '미등록 호실');
  }
  XLSX.writeFile(wb, `monthliv_방가격_${todayISO()}.xlsx`);
  if(fromSeed){
    showAlert(`아직 저장된 가격표가 없어 현재 운영 중인 가격(${rows.length}개 타입)을 그대로 내려받았습니다.\n확인 후 그대로 업로드하시면 이 값이 기준이 됩니다.`);
  }
}

// 엑셀 행 -> 원장 형식. 숫자 칸은 "950,000원"처럼 적혀 있어도 숫자만 뽑아 쓴다.
// 엑셀(호실 1개 = 1행)을 읽어 저장 구조로 되돌린다. 같은 지점·룸타입이면서 가격이 모두 같은
// 행들을 한 묶음(nums 배열)으로 합친다 — 계산기가 지점 -> 룸타입 -> 호실 순으로 고르는 구조라
// 타입 단위로 묶여 있어야 한다.
function parseRoomPriceGrid(headerCells, dataRows){
  const idx = {};
  headerCells.forEach((h, i)=>{ idx[cleanKeyLoose(h).replace(/\s+/g,'')] = i; });
  const col = (names)=>{
    for(const n of names){ if(idx[n] != null) return idx[n]; }
    return null;
  };
  const cB = col(['지점','지점명','고시원명','b']);
  const cR = col(['룸타입','타입','방타입','r']);
  const cNum = col(['호실','호실번호','방','nums']);
  if(cB == null || cR == null || cNum == null){
    return { error: '헤더 행에서 "지점" · "호실" · "룸타입" 열을 찾을 수 없습니다.\n호실 하나가 한 줄인 표여야 합니다.' };
  }
  const cP1 = col(['1인입실료','1인가격','입실료','p1']);
  const cP2 = col(['2인입실료','2인가격','p2']);
  const cP1Alt = col(['성수기1인입실료','성수기입실료','p1Alt']);
  const cAltMonths = col(['성수기적용월','성수기월','altMonths']);
  const cNew = col(['신규회원1박','신규1박','new']);
  const cEx1 = col(['기존회원1박(1인)','기존회원1박','기존1박','ex']);
  const cEx2 = col(['기존회원1박(2인)','기존1박2인']);

  const num = (v)=>{
    const digits = String(v == null ? '' : v).replace(/[^0-9]/g,'');
    return digits ? Number(digits) : null;
  };

  const items = [];
  const skipped = [];

  dataRows.forEach((cells, i)=>{
    const get = (c)=> (c != null && cells[c] != null) ? String(cells[c]).trim() : '';
    const at = `[${i+2}행]`;
    const b = cleanKeyLoose(get(cB));
    const r = cleanKeyLoose(get(cR));
    const numText = cleanKeyLoose(get(cNum));
    if(!b && !r && !numText) return;                      // 빈 줄
    if(!b || !r || !numText){ skipped.push(`${at} 지점·호실·룸타입 중 빈 칸이 있음`); return; }
    const p1 = num(get(cP1));
    if(p1 == null){ skipped.push(`${at} ${b} ${numText} — 1인 입실료가 비어 있음`); return; }

    const ex1 = num(get(cEx1));
    const ex2 = num(get(cEx2));
    items.push({
      at, b, r, num: numText,
      p1,
      p2: num(get(cP2)),
      new: num(get(cNew)) || 0,
      ex: (ex2 == null) ? (ex1 || 0) : [ex1 || 0, ex2],
      p1Alt: num(get(cP1Alt)),
      altMonths: parseAltMonths(get(cAltMonths))
    });
  });

  const grouped = groupRoomPriceItems(items);
  return { rooms: grouped.rooms, skipped: skipped.concat(grouped.skipped), warnings: grouped.warnings };
}

// "7,8,9" / "7~9월" 처럼 적힌 성수기 적용월을 숫자 배열로 바꾼다.
function parseAltMonths(text){
  const s = String(text == null ? '' : text);
  const range = s.match(/(\d{1,2})\s*[~\-–]\s*(\d{1,2})/);
  if(range){
    const a = Number(range[1]), b = Number(range[2]);
    if(a >= 1 && b <= 12 && a <= b){
      const out = [];
      for(let m = a; m <= b; m++) out.push(m);
      return out;
    }
  }
  const months = (s.match(/\d{1,2}/g) || []).map(Number).filter(m=> m >= 1 && m <= 12);
  return [...new Set(months)].sort((a, b)=> a - b);
}

// 호실 단위 항목들을 저장 구조(지점+룸타입 묶음)로 되돌린다. 엑셀 업로드와 관리표(.xlsm)
// 가져오기가 같은 규칙(중복 호실 제외, 가격이 갈리는 타입 경고)을 쓰도록 한 곳에 모아둔다.
// items: { at, b, r, num, p1, p2, new, ex, p1Alt, altMonths }
function groupRoomPriceItems(items){
  const groups = new Map();   // 지점|타입|가격조합 -> 묶음
  const skipped = [];
  const conflicts = new Map(); // 지점|타입 -> 서로 다른 가격 조합 수(같은 타입인데 가격이 갈리는 경우)
  const seen = new Set();      // 지점|호실 중복 확인

  (items || []).forEach(it=>{
    const dupKey = it.b + '|' + normalizeRoomNo(String(it.num).replace(/호$/,''));
    if(seen.has(dupKey)){ skipped.push(`${it.at} ${it.b} ${it.num} — 같은 호실이 이미 있어 건너뜀`); return; }
    seen.add(dupKey);

    const price = {
      p1: it.p1,
      p2: (it.p2 == null ? null : it.p2),
      new: it.new || 0,
      ex: (it.ex == null ? 0 : it.ex)
    };
    // 시기에 따라 입실료가 바뀌는 지점(예: 방배 3분기)은 두 값을 모두 들고 있다가 조회 시점의
    // 달로 고른다. 하나만 저장하면 분기가 바뀔 때마다 다시 올려야 하고, 안 올리면 조용히 틀린다.
    if(it.p1Alt && it.altMonths && it.altMonths.length && it.p1Alt !== it.p1){
      price.p1Alt = it.p1Alt;
      price.altMonths = it.altMonths;
    }
    const priceKey = JSON.stringify([price.p1, price.p2, price.new, price.ex, price.p1Alt || 0, price.altMonths || []]);
    const key = it.b + '|' + it.r + '|' + priceKey;
    if(!groups.has(key)) groups.set(key, Object.assign({ b: it.b, r: it.r, nums: [] }, price));
    groups.get(key).nums.push(it.num);

    const typeKey = it.b + '|' + it.r;
    if(!conflicts.has(typeKey)) conflicts.set(typeKey, new Set());
    conflicts.get(typeKey).add(priceKey);
  });

  // 같은 지점·타입인데 가격이 서로 다른 경우: 계산기 드롭다운에 같은 타입이 두 번 나오게 되므로
  // 저장은 하되 확인할 수 있게 알려준다.
  const warnings = [];
  conflicts.forEach((set, typeKey)=>{
    if(set.size > 1){
      const [b, r] = typeKey.split('|');
      warnings.push(`${b} ${r} — 같은 룸타입인데 가격이 ${set.size}가지로 갈립니다.`);
    }
  });

  return { rooms: [...groups.values()], skipped, warnings };
}

async function saveRoomPrices(rooms){
  const updatedAt = new Date().toISOString();
  const updatedBy = (CURRENT_USER && CURRENT_USER.email) || '';
  await ROOM_PRICES_DOC.set({ rooms, updatedAt, updatedBy });
  // 실시간 구독이 이 저장을 다른 곳의 변경으로 착각해 다시 그리지 않도록 같은 updatedAt을 쓴다.
  ROOM_PRICES = { rooms, updatedAt, updatedBy };
}

function applyRoomPriceUpload(parsed){
  const before = (ROOM_PRICES.rooms || []).length;
  const branches = new Set(parsed.rooms.map(r=> r.b));
  const numsCount = parsed.rooms.reduce((a, r)=> a + (r.nums || []).length, 0);
  // 이 가격표로 바꾸면 방 타입이 달라지는 호실(방 카드의 방 타입도 가격표 기준으로 맞춘다).
  const typeChanges = roomTypeSyncPlan(parsed.rooms);
  showConfirm(
    `방 가격을 아래 내용으로 교체할까요?\n\n`
      + (parsed.source ? `· 읽은 파일: ${parsed.source}\n` : '')
      + `· ${branches.size}개 지점 / ${parsed.rooms.length}개 타입 / 호실 ${numsCount}개\n`
      + `· 기존 ${before}개 타입은 이 내용으로 완전히 대체됩니다.\n`
      + (parsed.warnings && parsed.warnings.length
          ? `\n확인 필요 ${parsed.warnings.length}건:\n${parsed.warnings.slice(0,8).join('\n')}\n`
            + (parsed.warnings.length > 8 ? `… 외 ${parsed.warnings.length - 8}건\n` : '')
          : '')
      + (parsed.skipped.length ? `\n제외되는 행 ${parsed.skipped.length}건:\n${parsed.skipped.slice(0,10).join('\n')}` : '')
      + (typeChanges.length ? `\n\n방 타입이 가격표와 달라 함께 바뀌는 호실 ${typeChanges.length}개:\n${roomTypeSyncSummary(typeChanges, 8)}` : '')
      + `\n\n저장하면 대시보드와 연장·환불 계산기에 바로 반영됩니다.`,
    ()=>{
      saveRoomPrices(parsed.rooms).then(()=>{
        // 방 타입도 방금 저장한 가격표 기준으로 맞춘다(확인 창 이후 실시간 동기화로 호실이 바뀌었을 수 있어 다시 계산).
        const typed = applyRoomTypeSync(roomTypeSyncPlan());
        logChange(`방 가격 업데이트: ${parsed.rooms.length}개 타입` + (typed ? ` · 방 타입 ${typed}개 호실 변경` : ''));
        if(typed) scheduleSave();
        render();
        showAlert(`방 가격을 저장했습니다. (${parsed.rooms.length}개 타입)`
          + (typed ? `\n방 타입 ${typed}개 호실도 가격표 기준으로 바꿨습니다.` : '')
          + `\n연장·환불 계산기에도 바로 반영됩니다.`);
      }).catch(e=>{
        showAlert(`방 가격 저장에 실패했습니다.\n\n오류 내용: ${(e && e.message) || e}`);
      });
    }
  );
}

/* ---- 지점정보 관리표(.xlsm) 그대로 올리기 ----
   실무에서 쓰는 원본 관리 파일을 변환 없이 올릴 수 있게 한다. 이 파일은 시트 하나가 지점
   하나이고, 시트 안이 다시 두 블록으로 나뉜다.
     왼쪽  = 호실별 표 ("호수" / "방타입" / 가격 / "2인 추가금" / 1박 비용 ...)
     오른쪽 = 방타입별 1박 요금 참조표 ("방타입" 열과 "… 1박 비용" 열이 짝을 이룸)
   오산·강남 일원·구로는 왼쪽 1박 비용이 비어 있고 오른쪽 참조표에만 값이 있어서, 왼쪽이
   비면 방타입으로 오른쪽에서 찾아온다. 열의 순서·개수가 시트마다 달라(같은 이름이 두 번
   나오기도 한다) 위치를 세지 않고 이름으로 찾고, 두 번째 "방타입" 열을 좌우 경계로 삼는다. */
const MGMT_SKIP_SHEETS = ['지점_목록', '호텔스테이_객실별인원', '청량리', '종로종각', '충무로'];
// 기준으로 삼을 입실료 열이 지점마다 다르다(담당자 확인 사항). 키·값 모두 공백을 뺀 이름이다.
const MGMT_PRICE_RULES = {
  '마곡발산역':      { base: '가격' },
  '잠실석촌고분역':   { base: '가격' },
  '가산디지털독산역': { base: '가격' },
  '방배이수역':      { base: '가격', alt: '3분기가격', altMonths: [7, 8, 9] },
  '고려대안암역':    { base: '성수기가격' },
  '강남일원':        { base: '변동가격' },
  '구로':            { base: '초기세팅가격' }
};

// 지점명 비교용 정규화(공백·밑줄 제거, 여러 지점에 공통으로 붙는 명칭 제거, 끝의 "점" 제거).
// 관리표 시트 이름 매칭과 도어락 기기명 매칭 둘 다에서 쓰던 공용 유틸이라 이름은 그대로 둔다.
const GENERIC_BRANCH_WORDS = ['먼슬리브','레지던스','원룸텔','호텔스테이','스테이'].sort((a,b)=> b.length-a.length);
function stripGenericBranchWords(s){
  const hasMonthliv = s.includes('먼슬리브');
  let cleaned = s;
  GENERIC_BRANCH_WORDS.forEach(w=>{
    if((w === '스테이' || w === '호텔스테이') && !hasMonthliv) return;
    const re = new RegExp(w + '(?!\\d)', 'g');
    cleaned = cleaned.replace(re, '');
  });
  return cleaned.trim();
}
function normalizeForDoorlockBranchMatch(s){
  let cleaned = String(s||'').replace(/[\s_]+/g,'');
  cleaned = stripGenericBranchWords(cleaned);
  return cleaned.replace(/점$/, '');
}

// 관리표의 시트 이름을 대시보드에 등록된 지점명으로 맞춘다. 표기가 서로 달라
// ("신대방삼거리역A" vs "먼슬리브 신대방삼거리역 A동") 지점명 정규화를 재사용하되,
// "성수"와 "성수역"처럼 한쪽이 다른 쪽에 포함되는 이름이 있어 정확히 일치하는 것을 먼저 본다.
function resolveMgmtBranchName(sheetTitle){
  const fallback = { name: '먼슬리브 ' + sheetTitle, matched: false };
  const norm = normalizeForDoorlockBranchMatch(sheetTitle);
  if(!norm) return fallback;
  const names = (DB.branches || []).map(b=> b.name).filter(Boolean);
  let hit = names.filter(n=> normalizeForDoorlockBranchMatch(n) === norm);
  if(hit.length === 0){
    hit = names.filter(n=>{
      const x = normalizeForDoorlockBranchMatch(n);
      return x && (x.includes(norm) || norm.includes(x));
    });
  }
  return hit.length === 1 ? { name: hit[0], matched: true } : fallback;
}

function looksLikeManagementWorkbook(wb){
  const names = wb.SheetNames || [];
  if(names.indexOf('지점_목록') >= 0) return true;
  if(names.length === 0) return false;
  const head = (XLSX.utils.sheet_to_json(wb.Sheets[names[0]], { header:1, defval:'' })[0] || [])
    .map(v=> String(v == null ? '' : v).replace(/\s+/g,''));
  return head.indexOf('호수') >= 0 && head.indexOf('방타입') >= 0 && head.indexOf('지점') < 0;
}

// "4.8만/1박" -> 48000, "3.5만, 3.9만/1박" -> [35000, 39000](1인/2인),
// "40,000 / 50,000" -> [40000, 50000], "950,000원" -> 950000.
// "-"·"#REF!"·"약14.2㎡"처럼 금액이 아닌 값은 null. 열이 밀려 엉뚱한 칸을 읽었을 때 면적이
// 가격으로 들어가는 것을 막기 위해 한글·영문이 섞인 값은 버린다.
function parseMgmtMoney(v){
  const s = cleanKeyLoose(v);
  if(!s) return null;
  const mans = s.match(/\d+(?:\.\d+)?\s*만/g);
  if(mans){
    const vals = mans.map(x=> Math.round(parseFloat(x) * 10000));
    return vals.length === 1 ? vals[0] : vals;
  }
  if(!/\d/.test(s)) return null;
  if(/[가-힣a-zA-Z]/.test(s.replace(/원/g, ''))) return null;
  // "40,000 / 50,000"처럼 1인/2인 금액을 슬래시로 나눠 적은 칸. 쉼표는 자릿수 구분이라
  // 슬래시만 기준으로 자르고, 1,000원 미만으로 읽히는 조각("/1박"의 1 등)은 버린다.
  const parts = s.split('/').map(x=> Number(x.replace(/[^0-9.]/g, ''))).filter(n=> isFinite(n) && n >= 1000);
  if(parts.length > 1) return parts.map(n=> Math.round(n));
  const n = Number(s.replace(/[^0-9.]/g, ''));
  return (isFinite(n) && n > 0) ? Math.round(n) : null;
}

// 관리표에 1박 금액이 아예 비어 있는 지점이 있다(오산의 신규 1박). 0원으로 덮어쓰면 연장
// 계산기가 0원을 계산해버리므로, 그런 칸은 지금 원장에 있는 값을 그대로 유지한다.
function mgmtNightFallbackMap(){
  const map = new Map();
  currentRoomPriceRows().rooms.forEach(r=>{
    const key = normalizeForDoorlockBranchMatch(r.b) + '|' + mgmtTypeKey(r.r);
    if(!map.has(key)) map.set(key, r);
  });
  return map;
}
// 같은 방타입을 관리표 안에서도 다르게 적어둔 곳이 있다("트리니티-파우더룸-더블침대" vs
// "트리니티 -파우더룸-더블침대", "블레스 플러스" vs "블레스플러스"). 저장은 원래 표기
// 그대로 하되, 찾을 때만 공백·하이픈을 지우고 맞춰본다.
function mgmtTypeKey(s){ return cleanKeyLoose(s).replace(/[\s\-–—]/g, ''); }
function mgmtFirst(v){ return Array.isArray(v) ? v[0] : v; }

function parseManagementWorkbook(wb){
  const nk = (s)=> String(s == null ? '' : s).replace(/\s+/g, '');
  const items = [];
  const skipped = [];
  const warnings = [];
  const sheetsUsed = [];
  const unresolved = [];
  const fallback = mgmtNightFallbackMap();
  const kept = new Map();      // 지점 -> 관리표가 비어 기존 값을 유지한 호실 수

  (wb.SheetNames || []).forEach(sheetName=>{
    const title = String(sheetName).trim();
    if(MGMT_SKIP_SHEETS.indexOf(title) >= 0) return;
    let grid;
    try{ grid = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header:1, defval:'' }); }
    catch(e){ warnings.push(`${title} 시트를 읽지 못했습니다: ${(e && e.message) || e}`); return; }
    if(!grid || grid.length < 2) return;
    const hdr = (grid[0] || []).map(nk);
    if(hdr.indexOf('호수') < 0 || hdr.indexOf('방타입') < 0) return;   // 지점 시트가 아님

    const rule = MGMT_PRICE_RULES[nk(title)] || { base: '가격' };
    const typeCols = [];
    hdr.forEach((h, i)=>{ if(h === '방타입') typeCols.push(i); });
    const leftEnd = typeCols.length > 1 ? typeCols[1] : hdr.length;
    const findLeft = (name)=>{
      const want = nk(name);
      for(let i = 0; i < leftEnd; i++){ if(hdr[i] === want) return i; }
      return -1;
    };

    const iBase = findLeft(rule.base);
    if(iBase < 0){
      warnings.push(`${title} 시트 — 기준 가격 열 "${rule.base}"을(를) 찾지 못해 건너뜁니다.`);
      return;
    }
    const iRoom = findLeft('호수');
    const iType = typeCols[0];
    const iAlt = rule.alt ? findLeft(rule.alt) : -1;
    const iAdd = findLeft('2인 추가금');
    const iApplied = findLeft('2인 적용가');
    const iNew = findLeft('신규 계약 1박 비용');
    const iEx = findLeft('기존 계약 1박 비용');
    const iOne = findLeft('1박 비용');   // 신규/기존 구분 없이 한 칸만 쓰는 지점(구로)

    // 오른쪽 참조표: "방타입" 열 바로 뒤에 붙은 "… 1박 비용" 열이 그 표의 값이다.
    const lookupNew = new Map(), lookupEx = new Map();
    typeCols.slice(1).forEach(t=>{
      let val = -1;
      for(let j = t + 1; j < Math.min(t + 4, hdr.length); j++){
        if(hdr[j] === '방타입') break;
        if(hdr[j] && hdr[j].indexOf('1박') >= 0){ val = j; break; }
      }
      if(val < 0) return;
      const target = (hdr[val].indexOf('기존') >= 0) ? lookupEx : lookupNew;
      for(let r = 1; r < grid.length; r++){
        const cells = grid[r] || [];
        const name = mgmtTypeKey(cells[t]);
        const price = parseMgmtMoney(cells[val]);
        if(name && price != null && !target.has(name)) target.set(name, price);
      }
    });

    const branch = resolveMgmtBranchName(title);
    if(!branch.matched) unresolved.push(title);

    let count = 0;
    for(let r = 1; r < grid.length; r++){
      const cells = grid[r] || [];
      const roomRaw = cleanKeyLoose(cells[iRoom]);
      if(!roomRaw || !/^\d/.test(roomRaw)) continue;      // 빈 줄·합계 줄
      const roomNo = /^\d+(?:\.0+)?$/.test(roomRaw) ? (String(parseInt(roomRaw, 10)) + '호') : roomRaw;
      const type = cleanKeyLoose(cells[iType]);
      if(!type){ skipped.push(`[${title} ${roomNo}] 방타입이 비어 있음`); continue; }

      const p1 = mgmtFirst(parseMgmtMoney(cells[iBase]));
      if(p1 == null){ skipped.push(`[${title} ${roomNo}] "${rule.base}"이(가) 비어 있음`); continue; }

      let p2 = (iApplied >= 0) ? mgmtFirst(parseMgmtMoney(cells[iApplied])) : null;
      if(p2 == null && iAdd >= 0){
        const add = mgmtFirst(parseMgmtMoney(cells[iAdd]));
        if(add) p2 = p1 + add;
      }

      let nNew = (iNew >= 0) ? parseMgmtMoney(cells[iNew]) : null;
      let nEx  = (iEx  >= 0) ? parseMgmtMoney(cells[iEx])  : null;
      if(iOne >= 0){                                       // 구로: 신규·기존을 같은 값으로 쓴다
        const one = parseMgmtMoney(cells[iOne]);
        if(nNew == null) nNew = one;
        if(nEx == null) nEx = one;
      }
      const typeKey = mgmtTypeKey(type);
      if(nNew == null && lookupNew.has(typeKey)) nNew = lookupNew.get(typeKey);
      if(nEx == null && lookupEx.has(typeKey)) nEx = lookupEx.get(typeKey);
      if(nNew == null || nEx == null){
        const prev = fallback.get(normalizeForDoorlockBranchMatch(branch.name) + '|' + typeKey);
        if(prev){
          if(nNew == null && prev.new){ nNew = prev.new; }
          if(nEx == null && prev.ex){ nEx = prev.ex; }
          if(nNew != null && nEx != null) kept.set(branch.name, (kept.get(branch.name) || 0) + 1);
        }
      }

      const ex1 = mgmtFirst(nEx);
      const ex2 = Array.isArray(nEx) ? nEx[1] : null;
      items.push({
        at: `[${title} ${roomNo}]`,
        b: branch.name,
        r: type,
        num: roomNo,
        p1,
        p2,
        new: mgmtFirst(nNew) || 0,
        ex: (ex2 == null) ? (ex1 || 0) : [ex1 || 0, ex2],
        p1Alt: (iAlt >= 0) ? mgmtFirst(parseMgmtMoney(cells[iAlt])) : null,
        altMonths: rule.altMonths || []
      });
      count++;
    }
    if(count > 0) sheetsUsed.push(title);
  });

  if(items.length === 0){
    return { error: '지점 시트를 찾지 못했습니다.\n"호수"와 "방타입" 열이 있는 시트가 하나 이상 있어야 합니다.' };
  }

  // 대시보드에 없는 지점명으로 저장되면 그 지점 방 카드에는 가격이 조용히 안 붙는다.
  unresolved.forEach(t=>{
    warnings.push(`${t} 시트 — 대시보드에서 같은 지점을 특정하지 못해 "먼슬리브 ${t}"으로 저장합니다.`);
  });

  kept.forEach((n, b)=>{
    warnings.push(`${b} — ${n}개 호실은 관리표에 1박 금액이 비어 있어 기존에 등록된 금액을 그대로 유지합니다.`);
  });

  // 유지할 기존 값조차 없는 경우. 연장 계산기가 0원으로 계산하게 되므로 저장 전에 알려준다.
  const gaps = new Map();
  items.forEach(it=>{
    const ex1 = Array.isArray(it.ex) ? it.ex[0] : it.ex;
    if(it.new && ex1) return;
    const d = gaps.get(it.b) || { n: 0, what: new Set() };
    d.n++;
    if(!it.new) d.what.add('신규 1박');
    if(!ex1) d.what.add('기존 1박');
    gaps.set(it.b, d);
  });
  gaps.forEach((d, b)=>{
    warnings.push(`${b} — ${d.n}개 호실에 ${[...d.what].join('·')} 금액이 없습니다(관리표가 비어 있음). 0원으로 저장됩니다.`);
  });

  const odd = items.filter(it=>{
    const vals = [it.new].concat(Array.isArray(it.ex) ? it.ex : [it.ex]);
    return vals.some(v=> v && v % 100 !== 0);
  });
  if(odd.length > 0){
    warnings.push(`1박 금액이 100원 단위로 떨어지지 않는 호실 ${odd.length}개(예: ${odd[0].b} ${odd[0].num} ${formatWon(odd[0].new)}). 관리표에 계산식 결과가 그대로 들어 있는 경우입니다.`);
  }

  const grouped = groupRoomPriceItems(items);
  return {
    rooms: grouped.rooms,
    skipped: skipped.concat(grouped.skipped),
    warnings: warnings.concat(grouped.warnings),
    source: `지점정보 관리표 · ${sheetsUsed.length}개 지점 시트`
  };
}

function handleRoomPriceExcelFile(file){
  if(typeof XLSX === 'undefined'){ showAlert('엑셀 라이브러리를 불러오지 못했습니다. 네트워크 연결을 확인해주세요.'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    let wb;
    try{
      wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
    }catch(err){ showAlert('엑셀 파일을 읽는 중 오류가 발생했습니다: ' + err.message); return; }

    let parsed;
    if(looksLikeManagementWorkbook(wb)){
      // 지점정보 관리표 원본을 그대로 올린 경우
      try{ parsed = parseManagementWorkbook(wb); }
      catch(err){ showAlert('관리표를 읽는 중 오류가 발생했습니다: ' + ((err && err.message) || err)); return; }
    }else{
      const grid = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, defval:'' });
      if(!grid || grid.length < 2){ showAlert('헤더 행과 데이터 행이 포함된 엑셀 파일을 업로드해주세요.'); return; }
      parsed = parseRoomPriceGrid(grid[0].map(v=> v==null?'':String(v)), grid.slice(1));
    }
    if(parsed.error){ showAlert(parsed.error); return; }
    if(parsed.rooms.length === 0){
      showAlert('가져올 수 있는 행이 없습니다.' + (parsed.skipped.length ? `\n\n${parsed.skipped.slice(0,10).join('\n')}` : ''));
      return;
    }
    applyRoomPriceUpload(parsed);
  };
  reader.readAsArrayBuffer(file);
}

// 방 카드에 보여줄 가격을 원장에서 찾는다.
// 지점명 표기가 두 시스템에서 다르다("잠실" vs "먼슬리브 잠실 석촌고분역")이라 도어락에서
// 쓰던 정규화(공백·"먼슬리브"·"레지던스" 등 제거)를 그대로 재사용한다.
// 다만 포함 관계만으로 고르면 "성수"와 "성수역"처럼 실제로 다른 지점이 함께 걸린다(가격도
// 95만/105만으로 다르다). 후보가 하나로 좁혀지지 않으면 틀린 가격을 보여주느니 아무것도
// 보여주지 않는다.
function ledgerRowsForBranch(branch, list){
  if(!branch) return [];
  const bn = normalizeForDoorlockBranchMatch(branch.name);
  if(!bn) return [];
  const rooms = list || ROOM_PRICES.rooms || [];   // list: 업로드 직전의 새 가격표로 미리 계산할 때
  const names = [...new Set(rooms.map(r=> r.b))];
  let hit = names.filter(n=> normalizeForDoorlockBranchMatch(n) === bn);
  if(hit.length === 0){
    hit = names.filter(n=>{
      const x = normalizeForDoorlockBranchMatch(n);
      return x && (x.includes(bn) || bn.includes(x));
    });
  }
  if(hit.length !== 1) return [];
  return rooms.filter(r=> r.b === hit[0]);
}
// 시기에 따라 입실료가 바뀌는 지점(방배 3분기 등)은 오늘이 몇 월인지로 값을 고른다.
// 2인 입실료에는 시기별 값이 없어서 1인 기준만 갈아끼운다.
function ledgerP1For(row, date){
  if(!row) return 0;
  if(!row.p1Alt || !Array.isArray(row.altMonths) || row.altMonths.length === 0) return row.p1 || 0;
  const m = (date || new Date()).getMonth() + 1;
  return row.altMonths.includes(m) ? row.p1Alt : (row.p1 || 0);
}
// 호실번호로 원장 행을 찾는다("201호"와 "201"을 같게 본다). 지점이 하나로 특정되지 않거나 원장에
// 없는 호실이면 null. list를 주면(업로드 직전의 새 가격표) 그 기준으로 찾는다.
function roomLedgerRow(room, list){
  const branch = DB.branches.find(b=> b.id === room.branchId);
  const rows = ledgerRowsForBranch(branch, list);
  if(rows.length === 0) return null;
  const target = normalizeRoomNo(String(room.number || '').replace(/호$/,''));
  if(!target) return null;
  return rows.find(r=> (r.nums || []).some(n=> normalizeRoomNo(String(n).replace(/호$/,'')) === target)) || null;
}
// 방 카드 가격: 2인 거주 중이고 2인 입실료가 있으면 그 값을, 아니면 1인 입실료를 쓴다.
function roomLedgerPrice(room){
  const row = roomLedgerRow(room);
  if(!row) return null;
  const amount = (roomHasDoubleOccupancy(room) && row.p2) ? row.p2 : ledgerP1For(row);
  return amount ? amount : null;
}

// 방 카드의 방 타입도 가격표(원장)가 기준이다(담당자 요청). 원장에서 찾은 호실의 타입이 대시보드와
// 다르면 원장 쪽으로 바꾼다. 원장에 없는 호실은 건드리지 않는다. list를 주면 그 가격표 기준으로 계산한다.
function roomTypeSyncPlan(list){
  const changes = [];
  (DB.rooms || []).forEach(room=>{
    const row = roomLedgerRow(room, list);
    const to = row ? cleanKeyLoose(row.r) : '';
    if(!to || to === cleanKeyLoose(room.type)) return;
    changes.push({ room, from: room.type || '', to });
  });
  return changes;
}
// 계획대로 호실 타입을 바꾸고 지점의 타입 목록에도 등록한다. 저장·로그는 부르는 쪽에서 한다(가격표
// 업로드와 한 줄로 기록하려고). 실시간 동기화로 호실 객체가 바뀌었을 수 있으니 적용 직전에 계획을
// 다시 만들어 넘길 것.
function applyRoomTypeSync(changes){
  changes.forEach(({ room, to })=>{
    room.type = to;
    const branch = DB.branches.find(b=> b.id === room.branchId);
    if(branch) registerRoomType(branch, to);
  });
  return changes.length;
}
function roomTypeSyncSummary(changes, limit){
  const out = changes.slice(0, limit).map(({ room, from, to })=>{
    const branch = DB.branches.find(b=> b.id === room.branchId);
    return `${branch ? branchLabel(branch) + ' ' : ''}${room.number}호: ${from || '(없음)'} → ${to}`;
  });
  if(changes.length > limit) out.push(`… 외 ${changes.length - limit}개`);
  return out.join('\n');
}
function confirmRoomTypeSync(){
  const changes = roomTypeSyncPlan();
  if(!changes.length){ showAlert('방 타입이 모두 가격표와 같습니다.'); return; }
  showConfirm(`방 카드의 방 타입을 가격표 기준으로 바꿀까요?\n\n바뀌는 호실 ${changes.length}개:\n${roomTypeSyncSummary(changes, 12)}\n\n가격표에 없는 호실은 그대로 둡니다.`, ()=>{
    const n = applyRoomTypeSync(roomTypeSyncPlan());
    logChange(`방 타입을 가격표 기준으로 변경: ${n}개 호실`);
    scheduleSave(); render();
    showAlert(`${n}개 호실의 방 타입을 가격표 기준으로 바꿨습니다.`);
  });
}
function renderRoomPricePanel(){
  const box = document.createElement('div');
  box.className = 'stat-section';
  box.innerHTML = `<h3>방 가격 관리</h3>`;

  const info = document.createElement('div');
  const rooms = ROOM_PRICES.rooms || [];
  const branchCount = new Set(rooms.map(r=> r.b)).size;
  const numsCount = rooms.reduce((a, r)=> a + (r.nums || []).length, 0);
  info.style.cssText = 'font-size:12.5px;margin-bottom:12px;'
    + (rooms.length === 0 ? 'color:var(--st-hold);font-weight:600;' : 'color:var(--ink-soft);');
  info.textContent = rooms.length === 0
    ? `아직 저장된 가격표가 없습니다. "가격표 다운로드"를 누르면 현재 운영 중인 가격(${ROOM_PRICE_SEED.length}개 타입)이 그대로 담겨 나오니, 확인 후 그대로 올리면 됩니다.`
    : `현재 ${branchCount}개 지점 · ${rooms.length}개 타입 · 호실 ${numsCount}개`
      + (ROOM_PRICES.updatedAt ? ` · 최종 수정 ${new Date(ROOM_PRICES.updatedAt).toLocaleString('ko-KR')}` : '')
      + (ROOM_PRICES.updatedBy ? ` (${ROOM_PRICES.updatedBy})` : '');
  box.appendChild(info);

  // 방 카드에 가격이 뜨려면 원장의 지점·호실이 대시보드와 맞아떨어져야 한다. 안 맞으면
  // 그 방은 조용히 가격이 비므로, 몇 개가 연결됐는지 여기서 알려준다.
  if(rooms.length > 0 && (DB.rooms || []).length > 0){
    const total = DB.rooms.length;
    const matched = DB.rooms.filter(r=> roomLedgerPrice(r)).length;
    const unmatchedBranches = allowedBranches()
      .filter(b=> DB.rooms.some(r=> r.branchId===b.id) && ledgerRowsForBranch(b).length === 0)
      .map(b=> branchLabel(b));
    const m = document.createElement('div');
    const ok = matched === total;
    m.style.cssText = 'font-size:12.5px;margin-bottom:12px;line-height:1.7;'
      + (ok ? 'color:var(--ink-soft);' : 'color:var(--st-hold);font-weight:600;');
    m.textContent = ok
      ? `방 카드 가격 연결: ${matched}/${total}개 호실`
      : `방 카드 가격 연결: ${matched}/${total}개 호실 — 나머지는 원장에 없어 가격이 표시되지 않습니다.`
        + (unmatchedBranches.length ? ` (지점 자체가 안 잡힘: ${unmatchedBranches.join(', ')})` : '');
    box.appendChild(m);

    // 방 타입이 가격표와 다른 호실(이 기능 이전에 올린 가격표, 또는 호실-타입 매칭에서 따로 바꾼 경우).
    const typeChanges = roomTypeSyncPlan();
    if(typeChanges.length){
      const t = document.createElement('div');
      t.className = 'room-type-sync';
      t.style.cssText = 'display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12.5px; margin:-4px 0 12px; color:var(--st-hold); font-weight:600;';
      t.appendChild(el('span', null, `방 타입이 가격표와 다른 호실: ${typeChanges.length}개`));
      const syncBtn = el('button', 'btn small primary', '가격표 기준으로 맞추기');
      syncBtn.title = '가격표에서 찾은 호실의 방 타입을 가격표 기준으로 바꿉니다(바뀌는 호실을 먼저 보여줍니다)';
      syncBtn.onclick = confirmRoomTypeSync;
      t.appendChild(syncBtn);
      box.appendChild(t);
    }
  }

  const btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex; gap:8px; flex-wrap:wrap;';
  const dlBtn = document.createElement('button');
  dlBtn.className = 'btn';
  dlBtn.textContent = '⬇ 가격표 다운로드';
  dlBtn.title = '현재 등록된 가격을 엑셀로 내려받습니다. 값을 고쳐서 그대로 다시 올리면 됩니다.';
  dlBtn.onclick = downloadRoomPriceTemplate;
  btnRow.appendChild(dlBtn);

  const upBtn = document.createElement('button');
  upBtn.className = 'btn primary';
  upBtn.textContent = '⬆ 가격표 업로드';
  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = '.xlsx,.xlsm,.xls';
  fileInput.style.display = 'none';
  upBtn.onclick = ()=> fileInput.click();
  fileInput.addEventListener('change', ()=>{
    if(fileInput.files && fileInput.files[0]){
      handleRoomPriceExcelFile(fileInput.files[0]);
      fileInput.value = '';
    }
  });
  btnRow.appendChild(upBtn); btnRow.appendChild(fileInput);
  box.appendChild(btnRow);

  if(rooms.length > 0){
    // 업로드하면 60여 개 타입이 한꺼번에 펼쳐져 화면이 끝없이 길어진다(업로드 전엔 비어 있어 몰랐다).
    // 기본은 접어두고, 펼쳐도 표 안에서만 스크롤되게 한다. 열림 상태는 UI에 둬서 실시간 반영으로
    // 화면을 다시 그려도 펼친 채로 유지된다.
    const details = document.createElement('details');
    details.className = 'room-price-details';
    details.open = !!UI.roomPriceTableOpen;
    details.addEventListener('toggle', ()=>{ UI.roomPriceTableOpen = details.open; });
    const summary = document.createElement('summary');
    summary.textContent = `등록된 가격표 보기 (${branchCount}개 지점 · ${rooms.length}개 타입 · 호실 ${numsCount}개)`;
    details.appendChild(summary);
    const wrap = document.createElement('div');
    wrap.className = 'room-price-table-wrap';
    const table = document.createElement('table');
    table.className = 'branch-table';
    table.innerHTML = `<thead><tr><th>지점</th><th>룸타입</th><th>1인</th><th>2인</th><th>신규 1박</th><th>기존 1박</th><th>호실</th></tr></thead>`;
    const tbody = document.createElement('tbody');
    rooms.forEach(r=>{
      const ex = Array.isArray(r.ex) ? `${formatWon(r.ex[0])} / ${formatWon(r.ex[1])}` : formatWon(r.ex || 0);
      const tr = document.createElement('tr');
      // 시기별 입실료가 있는 방은 지금 적용되는 값을 굵게 보여준다(어느 쪽이 지금 값인지 헷갈리지 않게).
      const nowP1 = ledgerP1For(r);
      const p1Cell = r.p1Alt
        ? `${esc(formatWon(nowP1))} <span style="font-size:11px;color:var(--ink-soft);">(${(r.altMonths||[]).join('·')}월 ${esc(formatWon(r.p1Alt))} / 그 외 ${esc(formatWon(r.p1 || 0))})</span>`
        : esc(formatWon(r.p1 || 0));
      tr.innerHTML = `<td>${esc(r.b)}</td><td>${esc(r.r)}</td>`
        + `<td>${p1Cell}</td>`
        + `<td>${r.p2 ? esc(formatWon(r.p2)) : '<span style="color:var(--ink-soft);">-</span>'}</td>`
        + `<td>${esc(formatWon(r.new || 0))}</td>`
        + `<td>${esc(ex)}</td>`
        + `<td style="font-size:11.5px;color:var(--ink-soft);">${(r.nums||[]).length}개</td>`;
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    details.appendChild(wrap);
    box.appendChild(details);
  }
  return box;
}
/* ---------------- 인수인계 자료 ----------------
   담당자가 바뀔 때 새로 오는 사람이 알아야 할 것들을 한 파일로 뽑아준다.

    '방 카드의 "변경이력" 버튼 하나로 입퇴실·수정이력·청소이력을 탭으로 본다(showRoomHistoryModal, 담당자 요청 순서). 수정이력은 저장할 때 "마지막으로 불러오거나 기록한 상태 ↔ 지금 상태"를 항목 단위로 비교해 editHistory 컬렉션에 남긴다(captureEdits·diffForEditHistory). 수정 화면마다 기록 코드를 붙이지 않는 방식이라 새 항목도 자동으로 기록된다 — 대신 계산값·내부값은 EDIT_HISTORY_IGNORE에 넣어야 이력이 지저분해지지 않는다. 로그인 직후·매시간 자동 처리는 앞뒤로 captureEdits를 불러 "자동"으로 남기고, 다른 탭 변경 반영(applyLoadedCore)·백업 가져오기 때는 기준 상태만 다시 잡는다(안 그러면 남의 변경이 내 이름으로 기록됨). 새로운 자동 처리를 추가하면 같은 방식으로 감쌀 것. Firestore 규칙에 editHistory(읽기·추가: 수정 권한, 수정·삭제 불가)가 필요하다.',

    '퇴실청소 완료(completeCleaningEntry)는 플래그를 끈 경우에도 cleaningDismissedMoveOut에 그 퇴실일을 남긴다. 안 남기면 퇴실확정 입실자가 아직 퇴실 처리 전인 동안(퇴실 처리는 퇴실일 다음 날) 같은 방이 "플래그 없는 퇴실청소 예정"(roomUpcomingLeaveDate)으로 목록·방 카드에 다시 떠서, 한 번 더 누르면 같은 날 청소완료가 두 번 기록된다(성수역 102호). 미리보기 경로는 미리보기가 실제로 떠 있을 때만 기록한다. 청소 이력은 방마다 최근 5건(CLEANING_HISTORY_MAX)만 남으니 중복이 생기면 오래된 기록이 밀려난다.',

    '사용자 관리에 "계정 삭제"를 추가했다(users·emailIndex 문서 삭제, 슈퍼어드민만 — 보안 규칙에서 둘 다 isSuperAdmin 삭제 허용). 로그인 계정(Firebase Authentication)은 브라우저 SDK로 남의 계정을 지울 수 없어(관리자 SDK·Cloud Functions 필요, 무료 요금제라 없음) 대시보드 목록에서만 지운다(처음엔 삭제 뒤 Firebase 콘솔 안내 창을 띄웠는데 담당자 요청으로 뺐다). 로그인 계정이 남아 있으면 그 사람이 다시 로그인할 때 initApp이 승인 대기 문서를 새로 만든다. 로그인한 본인 줄은 역할 변경·차단·삭제를 잠갔다(담당자 요청 — 스스로 권한을 없애는 사고 방지). 버튼은 처음에 ×=차단, "계정 삭제"=삭제였는데 "흔한 UI가 아니다"는 지적으로 승인 대기 줄 [승인][거절](거절=요청 삭제), 쓰는 계정 줄 [역할 변경][접근 차단] + 맨 오른쪽 ×=계정 삭제로 바꿨다. 거절(요청 삭제)과 ×(계정 삭제) 모두 확인 창만 거쳐 목록에서 지운다.',

function buildHandoverDoc(){
  const L = [];
  const now = new Date();
  L.push('# MONTHLIV 운영 대시보드 인수인계 자료');
  L.push('');
  L.push('- 생성 시각: ' + now.toLocaleString('ko-KR'));
  L.push('- 실행 중인 코드 버전: ' + APP_BUILD);
  L.push('- 배포 주소: https://monthliv.github.io/Dashboard-Branch/');
  L.push('- 저장소: https://github.com/Monthliv/Dashboard-Branch');
  L.push('');
  L.push('> 이 문서는 관리자 설정 > 데이터 백업에서 버튼 한 번으로 다시 뽑을 수 있습니다.');
  L.push('> 아래 "현재 운영 현황"은 뽑은 시점의 실제 데이터이고, 그 뒤 내용은 코드만 봐서는');
  L.push('> 알 수 없는 제약사항이라 사고나 결정이 생길 때마다 갱신됩니다.');
  L.push('');

  L.push('## 현재 운영 현황');
  L.push('');
  L.push('| 항목 | 수량 |');
  L.push('| --- | --- |');
  L.push('| 지점 | ' + (DB.branches||[]).length + '곳 |');
  L.push('| 호실 | ' + (DB.rooms||[]).length + '실 |');
  L.push('| 입실자(재실·입실예정) | ' + (DB.residents||[]).length + '명 |');
  L.push('| 계약 이력 | ' + (DB.contracts||[]).length + '건 |');
  L.push('| 퇴실 이력 | ' + (DB.residentHistory||[]).length + '건 |');
  L.push('');

  // 수수료율·보증금 관리는 이 대시보드에서 관리하는 항목이 아니라 넣지 않는다.
  // (필드 자체는 남아 있지만 실제 운영은 다른 곳에서 이뤄지므로, 인수인계 문서에
  //  적어두면 여기서 관리하는 것처럼 오해를 준다.)
  L.push('## 지점별 현황');
  L.push('');
  L.push('| 지점 | 호실 | 이용중 | 청소/리터치 자동지정 |');
  L.push('| --- | --- | --- | --- |');
  (DB.branches||[]).forEach(function(b){
    const rms = (DB.rooms||[]).filter(function(r){ return r.branchId===b.id; });
    const occupied = rms.filter(function(r){ return roomTabs(r).includes('이용중'); }).length;
    L.push('| ' + branchLabel(b) + ' | ' + rms.length + ' | ' + occupied + ' | ' +
      (b.autoCleaningExcluded ? '제외' : '사용') + ' |');
  });
  L.push('');

  HANDOVER_NOTES.forEach(function(sec){
    L.push('## ' + sec.title);
    L.push('');
    sec.items.forEach(function(it){ L.push('- ' + it); });
    L.push('');
  });

  L.push('---');
  L.push('');
  L.push('생성: 관리자 설정 > 데이터 백업 > 인수인계 자료 다운로드');
  return L.join('\n');
}

function downloadHandoverDoc(){
  const blob = new Blob([buildHandoverDoc()], { type:'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `monthliv_인수인계_${todayISO()}.md`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

const ADMIN_PANEL_TOGGLE_FLAGS = ['addingBranch','addingRoom','managingRoom','managingTypePrice','matchingRoomType'];
function renderBranchRoomManagePanel(){
  const box = document.createElement('div');
  box.className = 'stat-section';
  box.innerHTML = `<h3>지점 · 호실 관리</h3>`;

  const btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;';

  function toggleBtn(flag, onLabel, offLabel, variant){
    const btn = document.createElement('button');
    btn.className = 'btn small' + (variant ? ' '+variant : '');
    btn.textContent = UI[flag] ? offLabel : onLabel;
    btn.onclick = ()=>{
      const turningOn = !UI[flag];
      ADMIN_PANEL_TOGGLE_FLAGS.forEach(f=> UI[f] = false);
      UI.editingBranchId = null;
      UI[flag] = turningOn;
      render();
    };
    return btn;
  }
  btnRow.appendChild(toggleBtn('addingBranch', '+ 지점 추가', '지점 추가 취소', 'primary'));
  btnRow.appendChild(toggleBtn('addingRoom', '+ 호실 추가', '호실 추가 취소', 'primary'));
  btnRow.appendChild(toggleBtn('managingTypePrice', '타입 관리', '타입 관리 취소', 'primary'));
  btnRow.appendChild(toggleBtn('matchingRoomType', '호실-타입 매칭', '호실-타입 매칭 취소', 'primary'));
  // 예전 "지점/호실 관리 엑셀 일괄 업데이트" 영역은 없애고 업로드 버튼만 여기로 옮겼다(담당자 요청).
  // 엑셀 형식(필수 시트·열)은 도움말에 있다.
  const bulkBtn = el('button', 'btn small', '⬆ 엑셀 업로드');
  bulkBtn.title = '지점정보·호실정보 시트가 담긴 엑셀로 여러 지점·호실을 한꺼번에 추가·수정합니다(형식은 도움말 참고)';
  const bulkInput = document.createElement('input');
  bulkInput.type = 'file';
  bulkInput.accept = '.xlsx,.xls';
  bulkInput.style.display = 'none';
  bulkBtn.onclick = ()=> bulkInput.click();
  bulkInput.addEventListener('change', ()=>{
    if(bulkInput.files && bulkInput.files[0]){
      handleBranchRoomBulkUpdateFile(bulkInput.files[0]);
      bulkInput.value = '';
    }
  });
  btnRow.appendChild(bulkBtn); btnRow.appendChild(bulkInput);
  btnRow.appendChild(toggleBtn('managingRoom', '호실 삭제', '호실 삭제 취소', 'danger'));
  box.appendChild(btnRow);

  if(UI.addingBranch) box.appendChild(renderAdminAddBranchForm());
  else if(UI.addingRoom) box.appendChild(renderAdminAddRoomForm());
  else if(UI.managingTypePrice) box.appendChild(renderTypePriceManageForm());
  else if(UI.matchingRoomType) box.appendChild(renderRoomTypeMatchForm());
  else if(UI.managingRoom) box.appendChild(renderAdminRoomManageForm());
  else if(UI.editingBranchId) box.appendChild(renderAdminEditBranchForm(DB.branches.find(b=>b.id===UI.editingBranchId)));
  else {
    // 지점 수가 많아지면 목록이 길어져 화면을 다 차지하므로, 기본은 접어두고 필요할 때만
    // 펼쳐서 순서 변경·정보 수정을 하도록 한다.
    const toggleHead = document.createElement('div');
    toggleHead.className = 'branch-title-toggle';
    toggleHead.style.cssText = 'font-weight:700; font-size:13px; margin-bottom:4px;';
    toggleHead.innerHTML = `<span>지점 순서·정보 수정 (${DB.branches.length}개 지점)</span><span class="branch-title-chevron">${UI.branchOrderOpen ? '▾' : '▸'}</span>`;
    toggleHead.title = UI.branchOrderOpen ? '클릭하여 접기' : '클릭하여 펼치기';
    toggleHead.onclick = ()=>{ UI.branchOrderOpen = !UI.branchOrderOpen; render(); };
    box.appendChild(toggleHead);
    if(UI.branchOrderOpen) box.appendChild(renderBranchOrderBody());
  }

  return box;
}

function renderBranchOrderBody(){
  const box = document.createElement('div');

  const list = document.createElement('div');
  list.className = 'branch-order-list';
  let dragRow = null;

  DB.branches.forEach(b=>{
    const row = document.createElement('div');

    row.draggable = true;
    row.dataset.id = b.id;

    row.querySelector('.branch-order-name').addEventListener('click', ()=>{
      UI.view = 'branch'; UI.branchId = b.id; UI.branchTab = 'rooms'; UI.roomStatusFilter = '전체'; render();
    });
    const editBtn = document.createElement('button');
    editBtn.className = 'btn small';
    editBtn.textContent = '수정';
    editBtn.draggable = false;
    editBtn.onclick = ()=>{ UI.editingBranchId = b.id; UI.addingBranch=false; UI.addingRoom=false; UI.managingRoom=false; render(); };
    row.appendChild(editBtn);

    row.addEventListener('dragstart', ()=>{
      dragRow = row;
      row.classList.add('dragging');
    });
    row.addEventListener('dragend', ()=>{
      row.classList.remove('dragging');
      dragRow = null;
    });
    row.addEventListener('dragover', (e)=>{
      e.preventDefault();
      if(!dragRow || dragRow===row) return;
      const rect = row.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height/2;
      list.insertBefore(dragRow, before ? row : row.nextSibling);
    });
    row.addEventListener('drop', (e)=>{
      e.preventDefault();
      const newOrder = [...list.children].map(el=>el.dataset.id);
      DB.branches.sort((a,b2)=> newOrder.indexOf(a.id) - newOrder.indexOf(b2.id));
      logChange('지점 노출 순서 변경');
      scheduleSave(); render();
    });

    list.appendChild(row);
  });

  box.appendChild(list);
  return box;
}

function renderOverdueStatsCard(){
  const items = [];
  DB.rooms.filter(room=> hasBranchAccess(room.branchId)).forEach(room=>{
    const branch = DB.branches.find(b=>b.id===room.branchId);
    DB.residents.filter(p=>p.roomId===room.id && isOverdue(p)).forEach(p=>{
      items.push({ room, branch, resident:p });
    });
  });

  const card = document.createElement('div');
  card.className = 'stat-section cleaning-card overdue-stats-card';

  if(items.length===0){
    card.innerHTML = `<h3>연체 중인 호실 <span class="cnt-badge overdue-cnt-badge">${items.length}</span></h3>`;
    card.appendChild(el('div','cleaning-empty','전체 지점에 연체 중인 호실이 없습니다.'));
    return card;
  }

  const groupMap = new Map();
  items.forEach(item=>{
    const key = item.branch ? item.branch.id : '__none__';
    if(!groupMap.has(key)) groupMap.set(key, { key, branch: item.branch, entries: [] });
    groupMap.get(key).entries.push(item);
  });
  const groups = [...groupMap.values()];
  groups.forEach(g=> g.entries.sort((a,b)=> a.room.number.localeCompare(b.room.number,'ko',{numeric:true})));
  groups.sort((a,b)=> (a.branch?branchLabel(a.branch):'').localeCompare(b.branch?branchLabel(b.branch):''));

  if(!groups.some(g=> g.key===UI.overdueTabKey)) UI.overdueTabKey = groups[0].key;
  const activeGroup = groups.find(g=> g.key===UI.overdueTabKey);

  card.innerHTML = `<h3>연체 중인 호실 <span class="cnt-badge overdue-cnt-badge">${items.length}</span></h3>`;

  const tabs = document.createElement('div');
  tabs.className = 'subnav';
  tabs.style.margin = '0 0 12px';
  groups.forEach(group=>{
    const tab = document.createElement('button');
    tab.type = 'button';
    tab.className = group.key===UI.overdueTabKey ? 'active' : '';
    tab.textContent = `${group.branch ? branchLabel(group.branch) : '(지점 정보 없음)'} (${group.entries.length})`;
